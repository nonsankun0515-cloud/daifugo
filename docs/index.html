  // ─────────────────────────────────────────────

  function makeSingle(id) {
    const c = CARDS[id];
    if (c.joker) return { type: 'single', cards: [id], n: 1, rank: JOKER, nat: [], jokers: 1, wild: true };
    return { type: 'single', cards: [id], n: 1, rank: c.rank, nat: [c.suit], jokers: 0 };
  }

  function playKey(p) {
    const range = p.type === 'seq' ? p.low + '-' + p.high : String(p.rank);
    return p.type + '|' + p.cards.slice().sort().join(',') + '|' + range + (p.declared ? '|d' : '');
  }

  function combinations(arr, m) {
    const out = [];
    const acc = [];
    (function rec(start) {
      if (acc.length === m) { out.push(acc.slice()); return; }
      for (let i = start; i < arr.length; i++) { acc.push(arr[i]); rec(i + 1); acc.pop(); }
    })(0);
    return out;
  }

  function indexHand(hand) {
    const byRank = {};
    const jokers = [];
    const bySuit = { S: {}, H: {}, D: {}, C: {} };
    for (const id of hand) {
      const c = CARDS[id];
      if (c.joker) { jokers.push(id); continue; }
      (byRank[c.rank] || (byRank[c.rank] = [])).push(id);
      bySuit[c.suit][c.rank] = id;
    }
    return { byRank, jokers, bySuit };
  }

  /** 手札から作れる出し方をすべて列挙（AI用。本物のカードがある所にジョーカーを使う出し方は省く） */
  function enumerate(hand, R, requireRank) {
    const { byRank, jokers, bySuit } = indexHand(hand);
    const J = jokers.length;
    const out = [];
    for (const id of hand) out.push(makeSingle(id));
    if (requireRank && J) out.push({ type: 'single', cards: [jokers[0]], n: 1, rank: requireRank, nat: [], jokers: 1, declared: true });
    for (const r in byRank) {
      const nats = byRank[r];
      const rank = +r;
      for (let m = 1; m <= nats.length; m++) {
        for (const sub of combinations(nats, m)) {
          for (let j = 0; j <= J; j++) {
            if (m + j < 2) continue;
            out.push({ type: 'set', cards: sub.concat(jokers.slice(0, j)), n: m + j, rank, nat: sub.map(C.suitOf), jokers: j });
          }
        }
      }
    }
    if (J === 2) out.push({ type: 'set', cards: jokers.slice(), n: 2, rank: JOKER, nat: [], jokers: 2, wild: true });
    if (R.sequence) {
      for (const s of C.SUITS) {
        const have = bySuit[s];
        for (let a = 3; a <= 13; a++) {
          let missing = 0;
          const ids = [];
          for (let b = a; b <= 15; b++) {
            if (have[b]) ids.push(have[b]); else missing++;
            if (missing > J) break;
            if (b - a + 1 >= 3 && ids.length >= 1) {
              out.push({ type: 'seq', cards: ids.concat(jokers.slice(0, missing)), n: b - a + 1, low: a, high: b, suit: s, nat: [], jokers: missing });
            }
          }
        }
      }
    }
    return out;
  }

  /** 選んだカードの組み合わせとして成り立つ出し方（人間の操作用） */
  function interpret(cards, R, requireRank) {
    const out = [];
    const n = cards.length;
    if (!n || new Set(cards).size !== n) return out;
    const nats = cards.filter((id) => !C.isJoker(id));
    const jk = cards.filter(C.isJoker);
    const J = jk.length;
    if (n === 1) {
      out.push(makeSingle(cards[0]));
      if (J === 1 && requireRank) out.push({ type: 'single', cards: cards.slice(), n: 1, rank: requireRank, nat: [], jokers: 1, declared: true });
      return out;
    }
    if (!nats.length) {
      if (n === 2) out.push({ type: 'set', cards: cards.slice(), n: 2, rank: JOKER, nat: [], jokers: 2, wild: true });
    } else {
      const r0 = C.rankOf(nats[0]);
      if (nats.every((id) => C.rankOf(id) === r0)) {
        out.push({ type: 'set', cards: nats.concat(jk), n, rank: r0, nat: nats.map(C.suitOf), jokers: J });
      }
    }
    if (R.sequence && n >= 3 && nats.length >= 1) {
      const s0 = C.suitOf(nats[0]);
      if (nats.every((id) => C.suitOf(id) === s0)) {
        const rs = nats.map(C.rankOf).sort((a, b) => a - b);
        let distinct = true;
        for (let i = 1; i < rs.length; i++) if (rs[i] === rs[i - 1]) distinct = false;
        if (distinct) {
          const gaps = rs[rs.length - 1] - rs[0] + 1 - rs.length;
          if (gaps <= J) {
            const extra = J - gaps;
            const ordered = nats.slice().sort((a, b) => C.rankOf(a) - C.rankOf(b));
            for (let e1 = extra; e1 >= 0; e1--) {
              const low = rs[0] - e1, high = rs[rs.length - 1] + (extra - e1);
              if (low < 3 || high > 15) continue;
              out.push({ type: 'seq', cards: ordered.concat(jk), n, low, high, suit: s0, nat: [], jokers: J });
            }
          }
        }
      }
    }
    return out;
  }

  // ─────────────────────────────────────────────
  // 強さ・合法手
  // ─────────────────────────────────────────────

  const effRev = (S) => S.revolution !== S.jback;
  const topEntry = (S) => (S.pile.length ? S.pile[S.pile.length - 1] : null);
  const topPlay = (S) => (S.pile.length ? S.pile[S.pile.length - 1].play : null);
  const nextRank = (r, rev) => (rev ? r - 1 : r + 1);
  const suitsOf = (p) => (p.type === 'seq' ? [p.suit] : p.nat);
  const isSand = (p, R) => R.sandstorm && p.type === 'set' && p.rank === 3 && p.n === 3;

  function seqMinSt(p, rev) { return Math.min(strength(p.low, rev), strength(p.high, rev)); }
  function seqMaxSt(p, rev) { return Math.max(strength(p.low, rev), strength(p.high, rev)); }

  function beats(p, top, rev, R) {
    if (p.type === 'seq') {
      if (R.seqCompare === 'all') return seqMinSt(p, rev) > seqMaxSt(top, rev);
      return seqMinSt(p, rev) > seqMinSt(top, rev);
    }
    if (top.wild) return false;
    if (p.wild) return true;
    return strength(p.rank, rev) > strength(top.rank, rev);
  }

  function downNumberOK(p, top, rev, R) {
    return R.downNumber && p.type === 'single' && top.type === 'single' && !p.wild && !top.wild &&
      p.jokers === 0 && top.jokers === 0 && p.nat[0] === top.nat[0] &&
      strength(p.rank, rev) === strength(top.rank, rev) - 1;
  }

  /** 次の出し方に必要な数字（6→9 や 階段縛り）。ジョーカー1枚をその数字として出せる */
  function requiredRank(S) {
    if (S.constraint) return S.constraint.rank;
    const top = topPlay(S);
    if (S.lock.number && top && top.type === 'single' && !top.wild) {
      const r = nextRank(top.rank, effRev(S));
      if (r >= 3 && r <= 15) return r;
    }
    return null;
  }

  function locksOK(S, p, top, rev) {
    const L = S.lock, R = S.rules;
    if (L.number) {
      if (p.wild || top.wild) return false;
      if (p.type === 'seq') {
        if (top.type !== 'seq') return false;
        const want = R.seqCompare === 'all' ? (rev ? top.low - p.n : top.high + 1) : (rev ? top.low - 1 : top.low + 1);
        if (p.low !== want) return false;
      } else if (p.rank !== nextRank(top.rank, rev)) return false;
    }
    if (!p.wild && L.suits) {
      if (p.type === 'seq') { if (L.suits.length !== 1 || L.suits[0] !== p.suit) return false; }
      else for (const s of p.nat) if (!L.suits.includes(s)) return false;
    }
    if (!p.wild && L.partial) {
      if (p.type === 'seq') { if (L.partial.length !== 1 || L.partial[0] !== p.suit) return false; }
      else {
        let missing = 0;
        for (const s of L.partial) if (!p.nat.includes(s)) missing++;
        if (missing > p.jokers) return false;
      }
    }
    return true;
  }

  function isSpade3Return(S, p) {
    const top = topPlay(S);
    return S.rules.spade3 && top && top.type === 'single' && top.wild &&
      p.type === 'single' && p.jokers === 0 && p.cards[0] === 'S3';
  }

  /** この出し方を今出せるか */
  function canPlay(S, seat, p) {
    const R = S.rules;
    const top = topPlay(S);
    if (!top) return !p.declared;
    if (R.passLock && S.passed[seat]) return false;
    if (isSand(p, R)) return true;
    if (isSpade3Return(S, p)) return true;
    const rev = effRev(S);
    if (S.constraint) {
      if (p.type !== 'single' || p.wild || p.rank !== S.constraint.rank) return false;
    } else {
      if (p.type !== top.type || p.n !== top.n) return false;
      if (p.declared && !(S.lock.number && p.rank === requiredRank(S))) return false;
      if (!beats(p, top, rev, R) && !downNumberOK(p, top, rev, R)) return false;
    }
    return locksOK(S, p, top, rev);
  }

  function legalPlays(S, seat) {
    const hand = S.players[seat].hand;
    return enumerate(hand, S.rules, requiredRank(S)).filter((p) => canPlay(S, seat, p));
  }

  function playsForCards(S, seat, cards) {
    return interpret(cards, S.rules, requiredRank(S)).filter((p) => canPlay(S, seat, p));
  }

  /** 出せない理由（人間向けの説明） */
  function explainIllegal(S, seat, cards) {
    const R = S.rules;
    if (!cards.length) return '';
    const cands = interpret(cards, R, requiredRank(S));
    if (!cands.length) return 'その組み合わせでは出せません';
    const top = topPlay(S);
    if (!top) return '';
    if (R.passLock && S.passed[seat]) return 'パスしたので、場が流れるまで出せません';
    const p = cands[0];
    const rev = effRev(S);
    if (S.constraint) return '次は ' + C.rankLabel(S.constraint.rank) + ' を1枚しか出せません（' + C.rankLabel(S.constraint.from) + '→' + C.rankLabel(S.constraint.rank) + '）';
    if (!cands.some((c) => c.type === top.type && c.n === top.n)) return '場と同じ形・枚数で出してください（場：' + shapeLabel(top) + '）';
    const same = cands.filter((c) => c.type === top.type && c.n === top.n);
    if (!same.some((c) => beats(c, top, rev, R) || downNumberOK(c, top, rev, R))) {
      if (top.wild) return R.spade3 && top.type === 'single' ? 'ジョーカーに勝てるのは♠3だけです' : 'ジョーカーには勝てません';
      return '場より強いカードを出してください' + (rev ? '（強さ逆転中）' : '');
    }
    if (S.lock.number) {
      const need = top.type === 'seq' ? '続きの階段' : C.rankLabel(nextRank(top.rank, rev));
      if (!same.some((c) => locksOK(S, Object.assign({}, c, { nat: c.nat }), top, rev))) {
        if (S.lock.suits) return '激縛り中：' + S.lock.suits.map((s) => C.SUIT_SYM[s]).join('') + ' の ' + need + ' だけ出せます';
        return '階段縛り中：' + need + ' だけ出せます';
      }
    }
    if (S.lock.suits) return S.lock.suits.map((s) => C.SUIT_SYM[s]).join('') + ' 縛り中です';
    if (S.lock.partial) return S.lock.partial.map((s) => C.SUIT_SYM[s]).join('') + ' を含めてください（片縛り）';
    return '今は出せません';
  }

  // ─────────────────────────────────────────────
  // カードの効果
  // ─────────────────────────────────────────────

  function effectsOf(p, S) {
    const R = S.rules;
    const fx = { sand: false, revolution: false, omen: false, greatRev: false, revKind: null, jToggles: 0, flow: null,
      skip: 0, give: 0, back: 0, discard: 0, bomb: 0, take: false, reverse: false, lucky: false };
    if (p.wild) return fx;
    const isSeq = p.type === 'seq';
    const cnt = (rank) => (isSeq ? (p.low <= rank && rank <= p.high ? 1 : 0) : (p.rank === rank ? p.n : 0));
    const seqAll = !isSeq || R.seqEffects === 'all';
    const seqEight = !isSeq || R.seqEffects !== 'none';
    if (isSand(p, R)) { fx.sand = true; return fx; }
    if (p.type === 'set') {
      if (p.n >= 4 && R.revolution) { fx.revolution = true; fx.revKind = 'normal'; }
      if (p.n === 3 && p.rank === 9 && R.coup) { fx.revolution = true; fx.revKind = 'coup'; }
      if (p.n === 3 && p.rank === 6 && R.omen) { fx.revolution = true; fx.omen = true; fx.revKind = 'omen'; }
      if (p.n >= 4 && p.rank === 15 && R.greatRevolution) { fx.revolution = true; fx.greatRev = true; fx.revKind = 'great'; }
    } else if (isSeq && R.seqRevolution !== 'off' && p.n >= +R.seqRevolution) { fx.revolution = true; fx.revKind = 'seq'; }
    if (S.revoLocked) { fx.revolution = false; fx.omen = false; }
    if (seqAll) {
      if (R.jBack && cnt(11)) fx.jToggles++;
      if (R.twoBack && cnt(15)) fx.jToggles++;
    }
    if (seqEight && R.eightCut && cnt(8)) fx.flow = '8';
    else if (!isSeq && R.rokurokubi && p.rank === 6 && p.n === 2) fx.flow = '66';
    else if (!isSeq && R.kyukyusha && p.rank === 9 && p.n === 2) fx.flow = '99';
    if (seqAll) {
      if (R.fiveSkip) fx.skip += cnt(5);
      if (R.kingSkip) fx.skip += cnt(13);
      if (R.sevenPass) fx.give = cnt(7);
      if (R.nineBack) fx.back = cnt(9);
      if (R.tenDiscard) fx.discard = cnt(10);
      if (R.queenBomber) fx.bomb = cnt(12);
      if (R.aceTake && cnt(14)) fx.take = true;
      if (R.nineReverse && cnt(9)) fx.reverse = true;
    }
    if (R.luckySeven && p.type === 'set' && p.rank === 7 && p.n === 3) fx.lucky = true;
    return fx;
  }

  function playHasRank(p, r) {
    if (p.wild) return false;
    if (p.type === 'seq') return p.low <= r && r <= p.high;
    return p.rank === r;
  }

  /** 反則上がりか（rev は出したときの強さの向き） */
  function isForbiddenFinish(p, R, rev) {
    if (R.forbidJoker && p.jokers > 0) return true;
    if (R.forbidTwo && playHasRank(p, rev ? 3 : 15)) return true;
    if (R.forbidEight && playHasRank(p, 8)) return true;
    if (R.forbidSpade3 && p.cards.includes('S3')) return true;
    return false;
  }

  function suitMatch(a, b) {
    if (a.wild || b.wild) return false;
    if (a.type === 'seq' && b.type === 'seq') return a.suit === b.suit;
    if (a.type === 'seq' || b.type === 'seq') return false;
    if (a.jokers || b.jokers) return false;
    if (a.nat.length !== b.nat.length) return false;
    return a.nat.every((s) => b.nat.includes(s));
  }

  function consecutive(prev, cur, rev, R) {
    if (prev.wild || cur.wild) return false;
    if (cur.type === 'seq') {
      if (R.seqCompare === 'all') return rev ? cur.high === prev.low - 1 : cur.low === prev.high + 1;
      return rev ? cur.low === prev.low - 1 : cur.low === prev.low + 1;
    }
    return cur.rank === nextRank(prev.rank, rev);
  }

  /** 縛り・6→9 の更新。発生した縛りの種類を返す */
  function updateLocks(S, prev, cur, revBefore) {
    const R = S.rules;
    const evs = [];
    S.constraint = null;
    if (cur.type === 'single' && !cur.wild) {
      if (R.sixNine && cur.rank === 6) S.constraint = { rank: 9, from: 6 };
      else if (R.nineSix && cur.rank === 9) S.constraint = { rank: 6, from: 9 };
    }
    if (!prev || prev.type !== cur.type || prev.n !== cur.n) return evs;
    const same = suitMatch(prev, cur);
    const consec = consecutive(prev, cur, revBefore, R);
    const geki = R.gekiLock && same && consec;
    const wantSuit = (R.suitLock && same) || geki;
    const wantNum = (R.numberLock && consec) || geki;
    if (wantSuit && !S.lock.suits) {
      S.lock.suits = suitsOf(cur).slice();
      S.lock.partial = null;
      evs.push(geki && !S.lock.number ? 'geki' : 'suit');
    } else if (!S.lock.suits && R.partialLock && cur.type === 'set' && cur.n >= 2) {
      const inter = cur.nat.filter((s) => prev.nat.includes(s));
      const before = S.lock.partial || [];
      const merged = before.concat(inter.filter((s) => !before.includes(s)));
      if (merged.length > before.length) { S.lock.partial = merged; evs.push('partial'); }
    }
    if (wantNum && !S.lock.number) {
      S.lock.number = true;
      if (!evs.includes('geki')) evs.push('number');
    }
    return evs;
  }

  // ─────────────────────────────────────────────
  // 状態（試合・ゲーム）
  // ─────────────────────────────────────────────

  const TITLES = {
    3: ['大富豪', '平民', '大貧民'],
    4: ['大富豪', '富豪', '貧民', '大貧民'],
    5: ['大富豪', '富豪', '平民', '貧民', '大貧民'],
    6: ['大富豪', '富豪', '平民', '平民', '貧民', '大貧民'],
  };
  const titleOf = (n, i) => (TITLES[n] || TITLES[4])[i];
  // 1ゲームの得点（身分ごと。全員の合計は0）
  const POINTS = { 大富豪: 3, 富豪: 1, 平民: 0, 貧民: -1, 大貧民: -3 };
  const pointsFor = (n, place) => POINTS[titleOf(n, place)];

  /** opt.games：1試合のゲーム数（0か省略で終わりなし）。opt.rated：レート戦の情報（エンジンは使わず保存するだけ） */
  function createMatch(opt) {
    const rules = D.Rules.normalize(opt.rules);
    const S = {
      rules,
      n: opt.players.length,
      players: opt.players.map((p, i) => ({
        seat: i, name: p.name, human: !!p.human, level: p.level || 'normal',
        hand: [], out: false, foul: false, score: 0, lastPlace: null,
      })),
      gameNo: 0,
      maxGames: opt.games > 0 ? Math.floor(opt.games) : 0,
      matchOver: false,
      history: [], // ゲームごとの結果 { ranking, pts: 席ごとの得点 }
      rated: opt.rated || null,
      prevRanking: null,
      phase: 'idle',
      rng: opt.seed != null ? C.mulberry32(opt.seed) : Math.random,
      events: [],
      silent: !!opt.silent,
    };
    resetGame(S);
    return S;
  }

  /** 試合の順位（総得点の高い順。同点は同じ順位） */
  function standings(S) {
    const rows = S.players.map((p) => ({ seat: p.seat, score: p.score, place: 0 }));
    rows.sort((a, b) => b.score - a.score || a.seat - b.seat);
    rows.forEach((r, i) => { r.place = i && r.score === rows[i - 1].score ? rows[i - 1].place : i + 1; });
    return rows;
  }

  function resetGame(S) {
    S.pile = [];
    S.discard = [];
    S.revolution = false;
    S.jback = false;
    S.revoLocked = false;
    S.lock = { suits: null, partial: null, number: false };
    S.constraint = null;
    S.finished = [];
    S.bottom = [];
    S.passCount = 0;
    S.lastSeat = null;
    S.passed = new Array(S.n).fill(false);
    S.dir = 1;
    S.turn = 0;
    S.pending = null;
    S.queue = [];
    S.resolving = null;
    S.exch = null;
    S.moves = 0;
  }

  function emit(S, ev) { if (!S.silent) S.events.push(ev); }

  function removeCards(P, cards) {
    for (const id of cards) {
      const i = P.hand.indexOf(id);
      if (i < 0) throw new Error('手札にないカード: ' + id);
      P.hand.splice(i, 1);
    }
  }
  function addCards(S, P, cards) { P.hand = C.sortHand(P.hand.concat(cards), false); }

  function nextActive(S, s, dir) {
    const d = dir || S.dir;
    for (let i = 1; i <= S.n; i++) {
      const t = (((s + d * i) % S.n) + S.n) % S.n;
      if (!S.players[t].out) return t;
    }
    return null;
  }
  const prevActive = (S, s) => nextActive(S, s, -S.dir);
  const activeCount = (S) => S.players.reduce((k, p) => k + (p.out ? 0 : 1), 0);

  /** 新しいゲームを配る。presetHands（テスト・オンライン同期用）を渡すとその手札で始める */
  function startGame(S, presetHands) {
    if (S.matchOver) throw new Error('この試合は終わりました');
    S.gameNo++;
    resetGame(S);
    for (const p of S.players) { p.hand = []; p.out = false; p.foul = false; }
    if (presetHands) {
      presetHands.forEach((h, i) => { S.players[i].hand = h.slice(); });
    } else {
      const deck = C.shuffle(C.makeDeck(S.rules.jokers), S.rng);
      let seat = Math.floor(S.rng() * S.n);
      for (const id of deck) { S.players[seat].hand.push(id); seat = (seat + 1) % S.n; }
    }
    for (const p of S.players) p.hand = C.sortHand(p.hand, false);
    emit(S, { t: 'deal', game: S.gameNo });
    if (S.gameNo > 1 && S.prevRanking && S.rules.exchange) setupExchange(S);
    else beginPlay(S);
  }

  function strongestCards(hand, k) {
    return C.sortHand(hand, false).slice(-k);
  }

  function setupExchange(S) {
    const rk = S.prevRanking, n = S.n;
    const pairs = [{ rich: rk[0], poor: rk[n - 1], count: 2 }];
    if (n >= 4) pairs.push({ rich: rk[1], poor: rk[n - 2], count: 1 });
    S.phase = 'exchange';
    S.exch = { pairs };
    if (S.rules.tenpen) {
      const poor = rk[n - 1];
      if (S.players[poor].hand.every((id) => !C.isJoker(id) && C.rankOf(id) <= 10)) {
        S.pending = { kind: 'tenpen', seat: poor, rich: rk[0] };
        return;
      }
    }
    exchangeGive(S);
  }

  function exchangeGive(S) {
    S.queue = [];
    for (const pr of S.exch.pairs) {
      if (pr.skip) continue;
      const give = strongestCards(S.players[pr.poor].hand, pr.count);
      removeCards(S.players[pr.poor], give);
      addCards(S, S.players[pr.rich], give);
      emit(S, { t: 'exchange', from: pr.poor, to: pr.rich, cards: give, auto: true });
      S.queue.push({ kind: 'exchange', seat: pr.rich, to: pr.poor, count: pr.count, got: give.slice() });
    }
    nextExchange(S);
  }

  function nextExchange(S) {
    S.pending = S.queue.length ? S.queue.shift() : null;
    if (!S.pending) beginPlay(S);
  }

  function beginPlay(S) {
    const R = S.rules;
    S.phase = 'play';
    S.pending = null;
    let leader;
    if (S.gameNo > 1 && S.prevRanking && R.nextLead === 'poorest') leader = S.prevRanking[S.n - 1];
    else if (R.firstLead === 'random') leader = Math.floor(S.rng() * S.n);
    else {
      const card = R.firstLead === 'S3' ? 'S3' : 'D3';
      leader = S.players.findIndex((p) => p.hand.includes(card));
      if (leader < 0) leader = 0;
    }
    S.turn = leader;
    emit(S, { t: 'start', leader });
  }

  /** 次に誰が何をする必要があるか */
  function getRequest(S) {
    if (S.phase !== 'play' && S.phase !== 'exchange') return null;
    if (S.pending) return S.pending;
    if (S.phase === 'play') return { kind: 'turn', seat: S.turn };
    return null;
  }

  function validatePlay(S, seat, play) {
    const P = S.players[seat];
    if (!play || !Array.isArray(play.cards) || !play.cards.length) throw new Error('カードが選ばれていません');
    for (const id of play.cards) if (!P.hand.includes(id)) throw new Error('手札にないカード: ' + id);
    const key = playKey(play);
    const cand = interpret(play.cards, S.rules, requiredRank(S)).find((p) => playKey(p) === key);
    if (!cand) throw new Error('出し方が正しくありません');
    if (!canPlay(S, seat, cand)) throw new Error('今は出せません');
    return cand;
  }

  function doPlay(S, seat, play) {
    const R = S.rules;
    const P = S.players[seat];
    const p = validatePlay(S, seat, play);
    const revBefore = effRev(S);
    const prevIdx = S.pile.length - 1;
    const spade3 = isSpade3Return(S, p);
    removeCards(P, p.cards);
    S.pile.push({ seat, play: p, shown: p.cards.slice() });
    S.moves++;
    const fx = effectsOf(p, S);
    emit(S, { t: 'play', seat, play: p, rev: revBefore });
    if (P.hand.length === 0) {
      finishPlayer(S, seat, p, revBefore);
      if (S.phase === 'over') return;
    }
    if (fx.sand) { emit(S, { t: 'sand', seat }); flowPile(S, seat, 'sand'); return; }
    if (spade3) { emit(S, { t: 'spade3', seat }); flowPile(S, seat, 'spade3'); return; }
    if (fx.revolution) {
      S.revolution = !S.revolution;
      if (fx.omen) S.revoLocked = true;
      emit(S, { t: 'revolution', seat, on: S.revolution, kind: fx.revKind });
    }
    if (fx.greatRev && !P.out) {
      const rest = P.hand.slice();
      S.discard.push(...rest);
      P.hand = [];
      emit(S, { t: 'greatRevolution', seat, cards: rest });
      finishPlayer(S, seat, null, revBefore);
      if (S.phase === 'over') return;
    }
    if (fx.jToggles % 2 === 1) {
      S.jback = !S.jback;
      emit(S, { t: 'jback', seat, on: S.jback, by: playHasRank(p, 11) && R.jBack ? 'J' : '2' });
    }
    S.lastSeat = seat;
    S.passCount = 0;
    S.resolving = { seat, play: p, fx, prevIdx, revBefore, step: 0 };
    if ((fx.flow || fx.skip > 0) && openStopWindow(S)) return;
    continueResolve(S);
  }

  function pickSet(hand, rank, n) {
    const nats = hand.filter((id) => !C.isJoker(id) && C.rankOf(id) === rank);
    const jk = hand.filter(C.isJoker);
    if (nats.length === 0 || nats.length + jk.length < n) return null;
    const use = nats.slice(0, n);
    const cards = use.concat(jk.slice(0, n - use.length));
    return { type: 'set', cards, n, rank, nat: use.map(C.suitOf), jokers: cards.length - use.length };
  }

  /** スキップで飛ばされる人（advanceAfterPlay と同じ数え方） */
  function skipTargets(S, seat, n, dir) {
    const out = [];
    const need = activeCount(S) - (S.players[seat].out ? 0 : 1);
    let cur = seat;
    for (let i = 0; i < n && out.length < need; i++) {
      const nx = nextActive(S, cur, dir);
      if (nx === null || nx === seat) break;
      out.push(nx);
      cur = nx;
    }
    return out;
  }

  /** 止め札の選択肢（4止め・3止め・砂嵐）。スキップを止められるのは飛ばされる本人だけ */
  function stopOptions(S, seat) {
    const R = S.rules, r = S.resolving;
    if (!r) return [];
    const fx = r.fx;
    const hand = S.players[seat].hand;
    const scopeOK = R.stopScope === 'any' || r.play.n === 1;
    const skipped = !fx.flow && fx.skip > 0 && skipTargets(S, r.seat, fx.skip, fx.reverse ? -S.dir : S.dir).includes(seat);
    const opts = [];
    if (fx.flow === '8' && R.fourStop && scopeOK) { const p = pickSet(hand, 4, 2); if (p) opts.push({ kind: 'four', play: p }); }
    if (skipped && R.threeStop && scopeOK) { const p = pickSet(hand, 3, 2); if (p) opts.push({ kind: 'three', play: p }); }
    if ((fx.flow || skipped) && R.sandstorm) { const p = pickSet(hand, 3, 3); if (p) opts.push({ kind: 'sand', play: p }); }
    return opts;
  }

  function openStopWindow(S) {
    const r = S.resolving;
    const cands = [];
    let s = r.seat;
    for (let i = 0; i < S.n - 1; i++) {
      s = (((s + S.dir) % S.n) + S.n) % S.n;
      if (!S.players[s].out && stopOptions(S, s).length) cands.push(s);
    }
    if (!cands.length) return false;
    S.pending = { kind: 'stop', seat: cands[0], rest: cands.slice(1), trigger: { seat: r.seat, flow: r.fx.flow, skip: r.fx.skip, play: r.play } };
    return true;
  }

  function doStop(S, seat, kind) {
    const opt = stopOptions(S, seat).find((o) => o.kind === kind);
    if (!opt) throw new Error('止められません');
    const P = S.players[seat];
    const against = S.resolving.seat;
    removeCards(P, opt.play.cards);
    S.pile.push({ seat, play: opt.play, shown: opt.play.cards.slice(), stop: kind });
    emit(S, { t: 'stop', seat, kind, play: opt.play, against });
    const rev = effRev(S);
    S.pending = null;
    S.resolving = null;
    if (P.hand.length === 0) {
      finishPlayer(S, seat, opt.play, rev);
      if (S.phase === 'over') return;
    }
    flowPile(S, seat, 'stop');
  }

  function doNoStop(S) {
    const pd = S.pending;
    if (pd.rest.length) {
      S.pending = Object.assign({}, pd, { seat: pd.rest[0], rest: pd.rest.slice(1) });
      return;
    }
    S.pending = null;
    continueResolve(S);
  }

  function continueResolve(S) {
    const r = S.resolving;
    const P = S.players[r.seat];
    const fx = r.fx;
    while (r.step < 5) {
      const step = r.step++;
      if (step === 0 && fx.take && !P.out && r.prevIdx >= 0 && S.pile[r.prevIdx] && S.pile[r.prevIdx].shown.length) {
        S.pending = { kind: 'pickup', seat: r.seat, cards: S.pile[r.prevIdx].shown.slice() };
        return;
      }
      if (step === 1 && fx.give > 0 && !P.out && P.hand.length) {
        const to = nextActive(S, r.seat);
        if (to !== null && to !== r.seat) {
          S.pending = { kind: 'give', seat: r.seat, to, count: Math.min(fx.give, P.hand.length), label: '7渡し' };
          return;
        }
      }
      if (step === 2 && fx.back > 0 && !P.out && P.hand.length) {
        const to = prevActive(S, r.seat);
        if (to !== null && to !== r.seat) {
          S.pending = { kind: 'give', seat: r.seat, to, count: Math.min(fx.back, P.hand.length), label: '9戻し' };
          return;
        }
      }
      if (step === 3 && fx.discard > 0 && !P.out && P.hand.length) {
        S.pending = { kind: 'discard', seat: r.seat, count: Math.min(fx.discard, P.hand.length) };
        return;
      }
      if (step === 4 && fx.bomb > 0) {
        // 指名できるのは自分の手札にある数字だけ
        const ranks = bombableRanks(P.hand);
        if (!ranks.length) { emit(S, { t: 'bomb', seat: r.seat, ranks: [], removed: {}, none: true }); continue; }
        S.pending = { kind: 'bomb', seat: r.seat, count: Math.min(fx.bomb, ranks.length), ranks };
        return;
      }
    }
    finalizePlay(S);
  }

  function finalizePlay(S) {
    const r = S.resolving;
    S.resolving = null;
    S.pending = null;
    const P = S.players[r.seat];
    if (!P.out && P.hand.length === 0) {
      finishPlayer(S, r.seat, r.play, r.revBefore);
      if (S.phase === 'over') return;
    }
    if (r.fx.reverse) {
      S.dir = -S.dir;
      emit(S, { t: 'reverse', seat: r.seat, dir: S.dir });
    }
    if (r.fx.flow) {
      emit(S, { t: 'cut', seat: r.seat, kind: r.fx.flow });
      flowPile(S, r.seat, 'cut');
      return;
    }
    const prev = r.prevIdx >= 0 && S.pile[r.prevIdx] ? S.pile[r.prevIdx].play : null;
    const lockEvs = updateLocks(S, prev, r.play, r.revBefore);
    for (const k of lockEvs) emit(S, { t: 'lock', kind: k, lock: copyLock(S.lock) });
    if (S.constraint) emit(S, { t: 'constraint', rank: S.constraint.rank, from: S.constraint.from });
    if (r.fx.lucky) S.pile[S.pile.length - 1].lucky = true;
    advanceAfterPlay(S, r.seat, r.fx.skip);
  }

  const copyLock = (L) => ({ suits: L.suits && L.suits.slice(), partial: L.partial && L.partial.slice(), number: L.number });

  function neededPasses(S) {
    const n = activeCount(S);
    return S.lastSeat !== null && !S.players[S.lastSeat].out ? n - 1 : n;
  }
  function flowLeader(S) {
    return S.players[S.lastSeat].out ? nextActive(S, S.lastSeat) : S.lastSeat;
  }

  function advanceAfterPlay(S, seat, skipN) {
    let cur = seat;
    const skipped = [];
    for (let i = 0; i < skipN; i++) {
      if (S.passCount >= neededPasses(S)) break;
      const nx = nextActive(S, cur);
      if (nx === null || nx === S.lastSeat) break;
      skipped.push(nx);
      cur = nx;
      S.passCount++;
    }
    if (skipped.length) emit(S, { t: 'skip', seat, seats: skipped });
    if (S.passCount >= neededPasses(S)) { flowPile(S, flowLeader(S), 'pass'); return; }
    S.turn = nextActive(S, cur);
    settleTurn(S);
  }

  function settleTurn(S) {
    if (!S.rules.passLock) return;
    let guard = 0;
    while (S.phase === 'play' && S.pile.length && S.passed[S.turn] && guard++ < 20) {
      emit(S, { t: 'pass', seat: S.turn, auto: true });
      S.passCount++;
      if (S.passCount >= neededPasses(S)) { passFlow(S); return; }
      S.turn = nextActive(S, S.turn);
    }
  }

  function doPass(S, seat) {
    if (!S.pile.length) throw new Error('親はパスできません');
    S.passCount++;
    if (S.rules.passLock) S.passed[seat] = true;
    emit(S, { t: 'pass', seat });
    if (S.passCount >= neededPasses(S)) { passFlow(S); return; }
    S.turn = nextActive(S, seat);
    settleTurn(S);
  }

  function passFlow(S) {
    const top = topEntry(S);
    if (top && top.lucky && top.seat === S.lastSeat && !S.players[top.seat].out) {
      const L = S.players[top.seat];
      const rest = L.hand.slice();
      S.discard.push(...rest);
      L.hand = [];
      emit(S, { t: 'lucky', seat: top.seat, cards: rest });
      finishPlayer(S, top.seat, null, effRev(S));
      if (S.phase === 'over') return;
    }
    flowPile(S, flowLeader(S), 'pass');
  }

  function flowPile(S, s, reason) {
    for (const e of S.pile) S.discard.push(...e.shown);
    S.pile = [];
    const wasJ = S.jback;
    S.jback = false;
    S.lock = { suits: null, partial: null, number: false };
    S.constraint = null;
    S.passCount = 0;
    S.lastSeat = null;
    S.passed.fill(false);
    const leader = S.players[s].out ? nextActive(S, s) : s;
    emit(S, { t: 'flow', reason, leader, jbackEnded: wasJ });
    if (leader !== null) S.turn = leader;
  }

  function finishPlayer(S, seat, play, rev) {
    const R = S.rules, P = S.players[seat];
    if (P.out) return;
    P.out = true;
    const foul = play ? isForbiddenFinish(play, R, rev) : false;
    if (foul) {
      P.foul = true;
      S.bottom.push(seat);
      emit(S, { t: 'foul', seat, play });
    } else {
      S.finished.push(seat);
      emit(S, { t: 'finish', seat, place: S.finished.length });
      if (S.finished.length === 1 && S.prevRanking) {
        const top = S.prevRanking[0], low = S.prevRanking[S.n - 1];
        if (R.gekokujo && seat === low && seat !== top) { gekokujo(S, seat); return; }
        if (R.miyakoOchi && seat !== top && !S.players[top].out) {
          const T = S.players[top];
          const cards = T.hand.slice();
          S.discard.push(...cards);
          T.hand = [];
          T.out = true;
          S.bottom.push(top);
          emit(S, { t: 'miyako', seat: top, cards });
        }
      }
    }
    checkGameEnd(S);
  }

  function gekokujo(S, seat) {
    emit(S, { t: 'gekokujo', seat });
    for (const p of S.players) {
      if (!p.out) { S.discard.push(...p.hand); p.hand = []; p.out = true; }
    }
    endGame(S, S.prevRanking.slice().reverse());
  }

  function checkGameEnd(S) {
    if (S.phase === 'over') return;
    const active = S.players.filter((p) => !p.out);
    if (active.length > 1) return;
    if (active.length === 1) {
      const L = active[0];
      L.out = true;
      S.finished.push(L.seat);
      emit(S, { t: 'last', seat: L.seat, cards: L.hand.slice() });
    }
    endGame(S, S.finished.concat(S.bottom.slice().reverse()));
  }

  function endGame(S, ranking) {
    S.phase = 'over';
    S.pending = null;
    S.resolving = null;
    S.queue = [];
    S.prevRanking = ranking.slice();
    const pts = new Array(S.n).fill(0);
    ranking.forEach((seat, i) => {
      pts[seat] = pointsFor(S.n, i);
      S.players[seat].score += pts[seat];
      S.players[seat].lastPlace = i;
    });
    S.history.push({ ranking: ranking.slice(), pts });
    S.matchOver = S.maxGames > 0 && S.gameNo >= S.maxGames;
    emit(S, { t: 'over', ranking: ranking.slice(), titles: ranking.map((_, i) => titleOf(S.n, i)), pts: pts.slice(), matchOver: S.matchOver });
  }

  function subsetOf(hand, cards, max) {
    if (!Array.isArray(cards)) throw new Error('カードの指定が不正です');
    if (cards.length > max) throw new Error(max + '枚までです');
    if (new Set(cards).size !== cards.length) throw new Error('同じカードが重複しています');
    for (const id of cards) if (!hand.includes(id)) throw new Error('そのカードは選べません: ' + id);
    return cards.slice();
  }

  function doGive(S, cards) {
    const pd = S.pending;
    const P = S.players[pd.seat];
    cards = subsetOf(P.hand, cards, pd.count);
    if (cards.length) { removeCards(P, cards); addCards(S, S.players[pd.to], cards); }
    emit(S, { t: 'give', from: pd.seat, to: pd.to, cards, label: pd.label });
    S.pending = null;
    continueResolve(S);
  }

  function doDiscard(S, cards) {
    const pd = S.pending;
    const P = S.players[pd.seat];
    cards = subsetOf(P.hand, cards, pd.count);
    if (cards.length) { removeCards(P, cards); S.discard.push(...cards); }
    emit(S, { t: 'discard', seat: pd.seat, cards });
    S.pending = null;
    continueResolve(S);
  }

  function doPickup(S, cards) {
    const pd = S.pending;
    const r = S.resolving;
    const entry = S.pile[r.prevIdx];
    cards = subsetOf(entry.shown, cards, entry.shown.length);
    if (cards.length) {
      entry.shown = entry.shown.filter((id) => !cards.includes(id));
      addCards(S, S.players[pd.seat], cards);
    }
    emit(S, { t: 'pickup', seat: pd.seat, cards, from: entry.seat });
    S.pending = null;
    continueResolve(S);
  }

  /** 12ボンバーで指名できる数字（手札にある本物のカードの数字） */
  function bombableRanks(hand) {
    const set = new Set();
    for (const id of hand) if (!C.isJoker(id)) set.add(C.rankOf(id));
    return Array.from(set).sort((a, b) => a - b);
  }

  function doBomb(S, ranks) {
    const pd = S.pending;
    if (!Array.isArray(ranks)) throw new Error('数字の指定が不正です');
    ranks = Array.from(new Set(ranks.map(Number)));
    if (ranks.length > pd.count) throw new Error(pd.count + 'つまでです');
    for (const r of ranks) if (!pd.ranks.includes(r)) throw new Error('手札にある数字しか指名できません');
    const order = [];
    for (let i = 0, s = pd.seat; i < S.n; i++, s = (((s + S.dir) % S.n) + S.n) % S.n) order.push(s);
    const removed = {};
    for (const seat of order) {
      const P = S.players[seat];
      if (P.out) continue;
      const rm = P.hand.filter((id) => !C.isJoker(id) && ranks.includes(C.rankOf(id)));
      if (rm.length) { removeCards(P, rm); S.discard.push(...rm); removed[seat] = rm; }
    }
    emit(S, { t: 'bomb', seat: pd.seat, ranks, removed });
    S.pending = null;
    const r = S.resolving;
    for (const seat of order) {
      const P = S.players[seat];
      if (P.out || P.hand.length) continue;
      finishPlayer(S, seat, seat === r.seat ? r.play : null, r.revBefore);
      if (S.phase === 'over') return;
    }
    continueResolve(S);
  }

  function doExchange(S, cards) {
    const pd = S.pending;
    const P = S.players[pd.seat];
    cards = subsetOf(P.hand, cards, pd.count);
    if (cards.length !== Math.min(pd.count, P.hand.length)) throw new Error(pd.count + '枚えらんでください');
    removeCards(P, cards);
    addCards(S, S.players[pd.to], cards);
    emit(S, { t: 'exchange', from: pd.seat, to: pd.to, cards });
    nextExchange(S);
  }

  function doTenpen(S, accept) {
    const pd = S.pending;
    if (accept) {
      const a = S.players[pd.seat], b = S.players[pd.rich];
      const t = a.hand;
      a.hand = b.hand;
      b.hand = t;
      S.exch.pairs[0].skip = true;
      emit(S, { t: 'tenpen', seat: pd.seat, with: pd.rich });
    }
    S.pending = null;
    exchangeGive(S);
  }

  /** 行動を適用し、発生したイベント列を返す */
  function apply(S, a) {
    S.events = [];
    const req = getRequest(S);
    if (!req) throw new Error('今は操作できません');
    if (a.seat !== req.seat) throw new Error('あなたの番ではありません');
    const need = { play: 'turn', pass: 'turn', stop: 'stop', nostop: 'stop', give: 'give', discard: 'discard',
      pickup: 'pickup', bomb: 'bomb', exchange: 'exchange', tenpen: 'tenpen' }[a.type];
    if (need !== req.kind) throw new Error('今はその操作はできません');
    switch (a.type) {
      case 'play': doPlay(S, a.seat, a.play); break;
      case 'pass': doPass(S, a.seat); break;
      case 'stop': doStop(S, a.seat, a.kind); break;
      case 'nostop': doNoStop(S); break;
      case 'give': doGive(S, a.cards || []); break;
      case 'discard': doDiscard(S, a.cards || []); break;
      case 'pickup': doPickup(S, a.cards || []); break;
      case 'bomb': doBomb(S, a.ranks || []); break;
      case 'exchange': doExchange(S, a.cards || []); break;
      case 'tenpen': doTenpen(S, !!a.accept); break;
    }
    return S.events;
  }

  /** シミュレーション用の複製（イベントは記録しない） */
  function clone(S) {
    const T = Object.assign({}, S);
    T.players = S.players.map((p) => Object.assign({}, p, { hand: p.hand.slice() }));
    T.pile = S.pile.map((e) => Object.assign({}, e, { shown: e.shown.slice() }));
    T.discard = S.discard.slice();
    T.lock = copyLock(S.lock);
    T.constraint = S.constraint && Object.assign({}, S.constraint);
    T.finished = S.finished.slice();
    T.bottom = S.bottom.slice();
    T.passed = S.passed.slice();
    T.pending = S.pending && Object.assign({}, S.pending, S.pending.rest ? { rest: S.pending.rest.slice() } : {});
    T.queue = S.queue.map((q) => Object.assign({}, q));
    T.resolving = S.resolving && Object.assign({}, S.resolving);
    T.exch = S.exch && { pairs: S.exch.pairs.map((p) => Object.assign({}, p)) };
    T.prevRanking = S.prevRanking && S.prevRanking.slice();
    T.history = S.history.slice();
    T.events = [];
    T.silent = true;
    return T;
  }

  /** 保存用（関数を除いたJSON） */
  function serialize(S) {
    const o = Object.assign({}, S);
    delete o.rng;
    o.events = [];
    return JSON.parse(JSON.stringify(o));
  }
  function deserialize(o) {
    const S = Object.assign({}, o);
    S.rules = D.Rules.normalize(o.rules);
    S.rng = Math.random;
    S.events = [];
    if (!Array.isArray(S.history)) {
      // 得点表が変わる前に保存された対局：得点は0からやり直す
      S.history = [];
      S.players = S.players.map((p) => Object.assign({}, p, { score: 0 }));
    }
    if (!(S.maxGames > 0)) S.maxGames = 0;
    S.matchOver = !!S.matchOver;
    if (S.rated === undefined) S.rated = null;

  const SET_NAMES = { 2: 'ペア', 3: 'スリーカード', 4: '4枚' };

<script>
/* レート戦のレーティング（ブラウザ・サーバー・テストで共通）
 * 得点のゲーム（大富豪・七並べ）：試合の総得点を「相手のレートから予想される総得点」と比べて増減する。
 * 勝ち負けのゲーム（スピード）：試合（3本勝負）の勝ち負けを、勝つ確率と比べて増減する（イロレーティング）。 */
(function () {
  'use strict';
  const D = (globalThis.DFG = globalThis.DFG || {});
  const E = D.Engine;

  const START = 1500; // はじめのレート
  const SCALE = 400; // レート差400で、1対1の勝率が約91%
  const K = 40; // 得点のゲーム：1試合で動く大きさ（全ゲーム1位なら同じ強さの相手に +40）
  const K_NEW = 80; // はじめの数試合は大きく動かして、早く実力に近づける
  const K_WIN = 32; // 勝ち負けのゲーム：同じ強さの相手に勝つと +16
  const K_WIN_NEW = 64;
  const NEW_MATCHES = 5;

  /**
   * ゲームごとのレート戦の決まり。AIのレートは強さごとに固定（ふつう=1500 を基準に実測）
   *   大富豪 2026-09-26：やさしい vs ふつう×3 を4000ゲーム → −191、つよい（420ms）vs ふつう×3 を400ゲーム → +130
   *   七並べ 2026-09-26：やさしい vs ふつう×3 を6000ゲーム → −71、つよい（候補を同じ配り方で比べる・300回）vs ふつう×3 を560ゲーム → +91
   *     （以前の、時間で試すつよいは +48。運の要素が大きいゲームなので差は小さめ）
   *   スピード 2026-09-26：AI同士1000試合ずつ。やさしい→ふつう +254、ふつう→つよい +345
   */
  const CFG = {
    daifugo: { label: '大富豪', kind: 'points', games: 10, players: 4, ai: { easy: 1310, normal: 1500, hard: 1630 },
      rules: () => Object.assign({}, D.Rules.MINE), rulesLabel: 'マイルール' },
    sevens: { label: '七並べ', kind: 'points', games: 10, players: 4, ai: { easy: 1430, normal: 1500, hard: 1590 },
      rules: () => Object.assign({}, D.SevensRules.STANDARD), rulesLabel: '標準ルール（パス3回・ジョーカー・トンネル）' },
    speed: { label: 'スピード', kind: 'winloss', games: 3, players: 2, ai: { easy: 1250, normal: 1500, hard: 1850 },
      rules: () => Object.assign({}, D.SpeedRules.STANDARD), rulesLabel: '標準ルール（AとKがつながる・同じ数字も出せる）' },
  };
  const cfg = (game) => CFG[game || 'daifugo'];

  // 大富豪の値（以前からの呼び方）
  const GAMES = CFG.daifugo.games;
  const PLAYERS = CFG.daifugo.players;
  const AI = CFG.daifugo.ai;
  function rules() { return CFG.daifugo.rules(); }

  /** 相手1人より上の順位になる（勝つ）確率 */
  function winProb(me, opp) { return 1 / (1 + Math.pow(10, (opp - me) / SCALE)); }

  /** 1ゲームで予想される得点。相手それぞれに勝つ確率から、何人に勝つか（＝順位）の分布を出す */
  function expectedPoints(me, opps) {
    const n = opps.length + 1;
    let dist = [1];
    for (const o of opps) {
      const p = winProb(me, o);
      const nd = new Array(dist.length + 1).fill(0);
      dist.forEach((v, k) => { nd[k] += v * (1 - p); nd[k + 1] += v * p; });
      dist = nd;
    }
    let e = 0;
    dist.forEach((v, k) => { e += v * E.pointsFor(n, n - 1 - k); });
    return e;
  }

  const kFactor = (matches) => ((matches || 0) < NEW_MATCHES ? K_NEW : K);
  const kWin = (matches) => ((matches || 0) < NEW_MATCHES ? K_WIN_NEW : K_WIN);

  /**
   * 得点のゲームの試合のレート変動。
   * me：自分のレート、opps：相手のレート、total：総得点、games：ゲーム数、matches：これまでのレート戦の数
   */
  function change(me, opps, total, games, matches) {
    const n = opps.length + 1;
    const g = games || GAMES;
    const expected = expectedPoints(me, opps) * g;
    const max = E.pointsFor(n, 0) * g;
    const delta = Math.round((kFactor(matches) * (total - expected)) / max);
    return { expected, delta, after: me + delta };
  }

  /** 勝ち負けのゲームの試合のレート変動。result は勝ち=1・負け=0 */
  function changeWin(me, opp, result, matches) {
    const expected = winProb(me, opp);
    const delta = Math.round(kWin(matches) * (result - expected));
    return { expected, delta, after: me + delta };
  }

  /** 途中でやめたとき：残りのゲームは全部 最下位 として数える（得点のゲーム） */
  function abandonTotal(scoreSoFar, played, games, n) {
    return scoreSoFar + Math.max(0, (games || GAMES) - played) * E.pointsFor(n || PLAYERS, (n || PLAYERS) - 1);
  }

  /** 試合の結果から、席ごとのレート変動を出す（base：試合開始時の各席のレート） */
  function matchResult(S, base, matchesBySeat) {
    if (cfg(S.game).kind === 'winloss') {
      const w = S.players.map((p) => p.wins || 0);
      return S.players.map((p, i) => {
        const result = w[i] > w[1 - i] ? 1 : w[i] < w[1 - i] ? 0 : 0.5;
        const c = changeWin(base[i], base[1 - i], result, matchesBySeat ? matchesBySeat[i] : 0);
        return { seat: i, before: base[i], after: c.after, delta: c.delta, expected: c.expected, total: w[i], result };
      });
    }
    return S.players.map((p, i) => {
      const opps = base.filter((_, j) => j !== i);
      const c = change(base[i], opps, p.score, S.maxGames || GAMES, matchesBySeat ? matchesBySeat[i] : 0);
      return { seat: i, before: base[i], after: c.after, delta: c.delta, expected: c.expected, total: p.score };
    });
  }

  /** 途中でやめた席のレート変動（得点のゲームは残りを最下位、勝ち負けのゲームは負け） */
  function abandonResult(S, seat, base, matches) {
    if (cfg(S.game).kind === 'winloss') {
      const c = changeWin(base[seat], base[1 - seat], 0, matches);
      return { before: base[seat], after: c.after, delta: c.delta, expected: c.expected, total: S.players[seat].wins || 0 };
    }
    const total = abandonTotal(S.players[seat].score, S.history.length, S.maxGames, S.n);
    const c = change(base[seat], base.filter((_, j) => j !== seat), total, S.maxGames, matches);
    return { before: base[seat], after: c.after, delta: c.delta, expected: c.expected, total };
  }

  function fmtDelta(d) { return d > 0 ? '+' + d : d < 0 ? '−' + Math.abs(d) : '±0'; }

  D.Rating = {
    START, GAMES, PLAYERS, AI, SCALE, K, K_NEW, K_WIN, K_WIN_NEW, NEW_MATCHES, CFG, cfg,
    rules, winProb, expectedPoints, change, changeWin, abandonTotal, abandonResult, matchResult, fmtDelta, kFactor, kWin,
  };
})();

<script>
/* 大富豪 — AIロボット（やさしい / ふつう / つよい） */
(function () {
  'use strict';
  const D = (globalThis.DFG = globalThis.DFG || {});
  const E = D.Engine, C = D.Cards;
  const { CARDS, strength } = C;

  // ─────────────────────────────────────────────
  // 見えている情報：自分以外の誰かが持っている（まだ出ていない）カード
  // ─────────────────────────────────────────────
  function unknownInfo(S, seat) {
    const seen = new Set(S.players[seat].hand);
    for (const id of S.discard) seen.add(id);
    for (const e of S.pile) for (const id of e.shown) seen.add(id);
    const cards = C.makeDeck(S.rules.jokers).filter((id) => !seen.has(id));
    const byRank = new Array(17).fill(0);
    let jokers = 0;
    for (const id of cards) { if (C.isJoker(id)) jokers++; else byRank[C.rankOf(id)]++; }
    return { cards, byRank, jokers };
  }

  function makeCtx(S, seat) {
    let oppMin = 99;
    for (const p of S.players) if (p.seat !== seat && !p.out) oppMin = Math.min(oppMin, p.hand.length);
    return { R: S.rules, rev: S.revolution, unk: unknownInfo(S, seat), oppMin, seat };
  }

  // ─────────────────────────────────────────────
  // 手札の評価（大きいほど良い）
  //   ・コントロール札（流せる/勝てる組）は「親を取り返せる」ので価値が高い
  //   ・それ以外の組の数と弱さが少ないほど良い
  // ─────────────────────────────────────────────
  function isControlSet(r, k, ctx) {
    const R = ctx.R;
    if (R.eightCut && r === 8) return true;
    if (R.sandstorm && r === 3 && k === 3) return true;
    if (R.rokurokubi && r === 6 && k === 2) return true;
    if (R.kyukyusha && r === 9 && k === 2) return true;
    if (k >= 4) return true;
    const unk = ctx.unk;
    const s = strength(r, ctx.rev);
    for (let r2 = 3; r2 <= 15; r2++) {
      if (strength(r2, ctx.rev) > s && unk.byRank[r2] >= 1 && unk.byRank[r2] + unk.jokers >= k) return false;
    }
    if (k === 1 && unk.jokers > 0) return false;
    if (k === 2 && unk.jokers >= 2) return false;
    return true;
  }

  function forbiddenRank(r, ctx) {
    const R = ctx.R;
    return (R.forbidTwo && r === (ctx.rev ? 3 : 15)) || (R.forbidEight && r === 8);
  }

  function findRuns(hand) {
    const bySuit = { S: [], H: [], D: [], C: [] };
    for (const id of hand) { const c = CARDS[id]; if (!c.joker) bySuit[c.suit].push(c.rank); }
    const runs = [];
    for (const s of C.SUITS) {
      const rs = bySuit[s].sort((a, b) => a - b);
      let i = 0;
      while (i < rs.length) {
        let j = i;
        while (j + 1 < rs.length && rs[j + 1] === rs[j] + 1) j++;
        const L = j - i + 1;
        if (L >= 3) {
          const lo = rs[i], hi = rs[j];
          if (L <= 6) {
            for (let a = lo; a <= hi - 2; a++) for (let b = a + 2; b <= hi; b++) runs.push({ suit: s, low: a, high: b });
          } else runs.push({ suit: s, low: lo, high: hi });
        }
        i = j + 1;
      }
    }
    return runs;
  }

  function scoreGroups(cnt, runs, J, handSize, ctx) {
    let nonControl = 0, controls = 0, weak = 0, allForbidden = true;
    for (let r = 3; r <= 15; r++) {
      const k = cnt[r];
      if (!k) continue;
      const st = (strength(r, ctx.rev) - 3) / 12;
      if (isControlSet(r, k, ctx)) controls++;
      else { nonControl++; weak += 1 - st; }
      if (!forbiddenRank(r, ctx)) allForbidden = false;
    }
    for (const run of runs) {
      const L = run.high - run.low + 1;
      const st = Math.min(1, (Math.min(strength(run.low, ctx.rev), strength(run.high, ctx.rev)) - 3) / 12 + 0.25);
      if (L >= 4 || st > 0.8) controls++;
      else { nonControl++; weak += 1 - st; }
      const R = ctx.R;
      const bad = (R.forbidTwo && run.low <= (ctx.rev ? 3 : 15) && (ctx.rev ? 3 : 15) <= run.high) || (R.forbidEight && run.low <= 8 && 8 <= run.high);
      if (!bad) allForbidden = false;
    }
    if (J) { controls += J; if (!ctx.R.forbidJoker) allForbidden = false; }
    const cw = 0.8 + 0.03 * handSize;
    let v = -1.0 * nonControl - 0.45 * weak + cw * controls - 0.05 * handSize;
    if (nonControl === 0) v += 1.0;
    else if (nonControl === 1) v += 0.6;
    if (allForbidden && handSize > 0) v -= 2.2;
    return { v, nonControl, controls };
  }

  function analyze(hand, ctx) {
    if (!hand.length) return { v: 100, nonControl: 0, controls: 0 };
    const cnt = new Array(16).fill(0);
    let J = 0;
    for (const id of hand) { const c = CARDS[id]; if (c.joker) J++; else cnt[c.rank]++; }
    let best = scoreGroups(cnt, [], J, hand.length, ctx);
    if (ctx.R.sequence) {
      const runs = findRuns(hand).slice(0, 12);
      const bySuitRank = new Set(hand.filter((id) => !C.isJoker(id)));
      const tryRuns = (list) => {
        const c2 = cnt.slice();
        const used = new Set();
        for (const run of list) {
          for (let r = run.low; r <= run.high; r++) {
            const id = run.suit + r;
            if (used.has(id) || !bySuitRank.has(id)) return;
            used.add(id);
            c2[r]--;
          }
        }
        const sc = scoreGroups(c2, list, J, hand.length, ctx);
        if (sc.v > best.v) best = sc;
      };
      for (let i = 0; i < runs.length; i++) {
        tryRuns([runs[i]]);
        for (let j = i + 1; j < runs.length; j++) tryRuns([runs[i], runs[j]]);
      }
    }
    return best;
  }
  const evaluate = (hand, ctx) => analyze(hand, ctx).v;

  function minus(hand, cards) {
    const out = hand.slice();
    for (const id of cards) { const i = out.indexOf(id); if (i >= 0) out.splice(i, 1); }
    return out;
  }

  /** 価値の低いカードを k 枚選ぶ（渡す・捨てる用） */
  function worstCards(hand, k, ctx) {
    let cur = hand.slice();
    const picked = [];
    for (let t = 0; t < k && cur.length; t++) {
      let best = null, bestV = -Infinity;
      for (const id of cur) {
        const v = evaluate(minus(cur, [id]), ctx) - (C.isJoker(id) ? 3 : 0);
        if (v > bestV) { bestV = v; best = id; }
      }
      picked.push(best);
      cur = minus(cur, [best]);
    }
    return picked;
  }

  // 12ボンバー：自分の手札にある数字から、自分に得で相手に損なものを選ぶ（得がなければ指名しない）
  function chooseBomb(S, seat, count, hand, ctx) {
    const base = evaluate(hand, ctx);
    const scored = [];
    for (const r of E.bombableRanks(hand)) {
      const mine = hand.filter((id) => !C.isJoker(id) && C.rankOf(id) === r);
      const myDelta = evaluate(minus(hand, mine), ctx) - base;
      const st = (strength(r, ctx.rev) - 3) / 12;
      const opp = ctx.unk.byRank[r];
      const oppGain = opp * (0.35 - 0.6 * st);
      scored.push({ r, s: myDelta - 0.7 * oppGain });
    }
    scored.sort((a, b) => b.s - a.s);
    return scored.filter((x) => x.s > 0).slice(0, count).map((x) => x.r);
  }

  // ─────────────────────────────────────────────
  // 自分の番：出す／パス
  // ─────────────────────────────────────────────
  function beatableAfter(S, p, ctx, revAfterTrick) {
    const unk = ctx.unk;
    if (p.type === 'seq') return p.n < 5;
    if (p.wild) return ctx.R.spade3 && unk.cards.includes('S3') && p.n === 1;
    const s = strength(p.rank, revAfterTrick);
    for (let r = 3; r <= 15; r++) {
      if (strength(r, revAfterTrick) > s && unk.byRank[r] >= 1 && unk.byRank[r] + unk.jokers >= p.n) return true;
    }
    if (p.n === 1 && unk.jokers > 0) return true;
    return false;
  }

  function scorePlay(S, seat, p, ctx) {
    const R = S.rules;
    const P = S.players[seat];
    const fx = E.effectsOf(p, S);
    const revNow = E.effRev(S);
    let after = minus(P.hand, p.cards);
    const ctx2 = Object.assign({}, ctx, { rev: fx.revolution ? !S.revolution : S.revolution });
    if (!after.length) return E.isForbiddenFinish(p, R, revNow) ? -40 : 1000;
    let bonus = 0;
    if (fx.give) after = minus(after, worstCards(after, Math.min(fx.give, after.length), ctx2));
    if (fx.back) after = minus(after, worstCards(after, Math.min(fx.back, after.length), ctx2));
    if (fx.discard) after = minus(after, worstCards(after, Math.min(fx.discard, after.length), ctx2));
    if (fx.bomb) {
      const ranks = chooseBomb(S, seat, fx.bomb, after, ctx2);
      after = after.filter((id) => C.isJoker(id) || !ranks.includes(C.rankOf(id)));
      for (const r of ranks) bonus += ctx.unk.byRank[r] * (0.6 * (strength(r, ctx2.rev) - 3) / 12 - 0.2);
    }
    if (!after.length) return E.isForbiddenFinish(p, R, revNow) ? -40 : 900;
    const an = analyze(after, ctx2);
    let v = an.v + bonus;
    const jAfter = fx.jToggles % 2 === 1 ? !S.jback : S.jback;
    const trickRev = ctx2.rev !== jAfter;
    const top = E.topPlay(S);
    const takesLead = fx.sand || !!fx.flow || fx.greatRev ||
      (top && top.wild && p.cards[0] === 'S3' && R.spade3) || !beatableAfter(S, p, ctx, trickRev);
    if (takesLead) v += 0.8 + (an.nonControl <= 1 ? 1.2 : 0);
    v += 0.12 * fx.skip;
    // 相手が上がりそうなとき
    if (!top && ctx.oppMin === 1 && p.n === 1 && !takesLead) v -= 1.6;
    if (!top && ctx.oppMin === 2 && p.n === 2 && !takesLead) v -= 0.6;
    // 革命：自分の手が強い時は起こしたくない（評価に反映済み）が、相手の枚数が少ない時は慎重に
    return v;
  }

  function passScore(S, seat, ctx) {
    const P = S.players[seat];
    let v = evaluate(P.hand, ctx);
    const winner = S.lastSeat;
    if (winner !== null && winner !== seat) {
      const wl = S.players[winner].hand.length;
      if (!S.players[winner].out && wl <= 2) v -= 1.6;
      else if (ctx.oppMin <= 2) v -= 0.5;
    }
    return v;
  }

  /** 終盤の定石：コントロール札を先に出し、最後の1組で上がる */
  function endgamePlay(S, seat, plays, ctx) {
    const P = S.players[seat];
    if (E.topPlay(S)) return null;
    const an = analyze(P.hand, ctx);
    if (an.nonControl > 1 || an.controls < 1) return null;
    let best = null, bestKey = -Infinity;
    for (const p of plays) {
      const after = minus(P.hand, p.cards);
      if (!after.length) continue;
      const a2 = analyze(after, ctx);
      if (a2.nonControl > 1) continue;
      if (beatableAfter(S, p, ctx, E.effRev(S)) && !E.effectsOf(p, S).flow) continue;
      const forbiddenLast = E.isForbiddenFinish(p, S.rules, E.effRev(S)) ? 1 : 0;
      const key = forbiddenLast * 10 + p.n - a2.nonControl;
      if (key > bestKey) { bestKey = key; best = p; }
    }
    return best;
  }

  function chooseTurnHeuristic(S, seat, noise) {
    const ctx = makeCtx(S, seat);
    const plays = E.legalPlays(S, seat);
    const canPass = !!E.topPlay(S);
    const scored = [];
    for (const p of plays) {
      const after = S.players[seat].hand.length - p.cards.length;
      if (after === 0 && !E.isForbiddenFinish(p, S.rules, E.effRev(S))) return { action: { type: 'play', seat, play: p }, scored: [] };
    }
    const eg = endgamePlay(S, seat, plays, ctx);
    if (eg) return { action: { type: 'play', seat, play: eg }, scored: [] };
    if (canPass) scored.push({ a: { type: 'pass', seat }, s: passScore(S, seat, ctx) });
    for (const p of plays) scored.push({ a: { type: 'play', seat, play: p }, s: scorePlay(S, seat, p, ctx) + (noise ? (Math.random() - 0.5) * noise : 0) });
    scored.sort((a, b) => b.s - a.s);
    return { action: scored[0].a, scored };
  }

  // ─────────────────────────────────────────────
  // ロールアウト用の速い方針（つよいAIのシミュレーション）
  // ─────────────────────────────────────────────
  function fastTurn(S, seat) {
    const P = S.players[seat];
    const plays = E.legalPlays(S, seat);
    const top = E.topPlay(S);
    const rev = E.effRev(S);
    if (!plays.length) return { type: 'pass', seat };
    const cnt = {};
    for (const id of P.hand) { const c = CARDS[id]; if (!c.joker) cnt[c.rank] = (cnt[c.rank] || 0) + 1; }
    let best = null, bestS = -Infinity;
    for (const p of plays) {
      if (p.cards.length === P.hand.length && !E.isForbiddenFinish(p, S.rules, rev)) return { type: 'play', seat, play: p };
      let s;
      if (p.wild) s = -8;
      else if (p.type === 'seq') s = -(Math.min(strength(p.low, rev), strength(p.high, rev))) + p.n * 0.8;
      else {
        s = -strength(p.rank, rev) + p.n * 0.6;
        if (cnt[p.rank] && cnt[p.rank] > p.n) s -= 3;
        if (p.jokers) s -= 4;
      }
      if (s > bestS) { bestS = s; best = p; }
    }
    if (top) {
      let near = false;
      for (const q of S.players) if (q.seat !== seat && !q.out && q.hand.length <= 2) near = true;
      const strong = best.wild || (best.type !== 'seq' && strength(best.rank, rev) >= 14);
      if (!near && strong && P.hand.length > 4 && Math.random() < 0.7) return { type: 'pass', seat };
      if (!near && Math.random() < 0.12) return { type: 'pass', seat };
    }
    return { type: 'play', seat, play: best };
  }

  function weakest(hand, k, rev) {
    return C.sortHand(hand.filter((id) => !C.isJoker(id)), rev).slice(0, k);
  }

  function fastAction(S, q) {
    const seat = q.seat;
    const hand = S.players[seat].hand;
    const rev = S.revolution;
    switch (q.kind) {
      case 'turn': return fastTurn(S, seat);
      case 'stop': return { type: 'stop', seat, kind: E.stopOptions(S, seat)[0].kind };
      case 'give': case 'discard': return { type: q.kind, seat, cards: weakest(hand, q.count, rev) };
      case 'pickup': return { type: 'pickup', seat, cards: [] };
      case 'bomb': {
        // 手札で一番弱い数字を捨てる
        let best = null, bs = Infinity;
        for (const r of q.ranks) { const s = strength(r, rev); if (s < bs) { bs = s; best = r; } }
        return { type: 'bomb', seat, ranks: best === null ? [] : [best] };
      }
      case 'exchange': return { type: 'exchange', seat, cards: weakest(hand, q.count, false).concat(hand.filter(C.isJoker)).slice(0, q.count) };
      case 'tenpen': return { type: 'tenpen', seat, accept: true };
    }
    throw new Error('unknown request');
  }

  let ROLLOUT = 'normal';
  function rolloutPlace(T, seat) {
    let guard = 0;
    let q;
    const smart = ROLLOUT === 'normal';
    while ((q = E.getRequest(T)) && guard++ < 800) E.apply(T, smart ? decideSync(T, q, 'normal') : fastAction(T, q));
    if (T.phase !== 'over') return 0.5;
    const place = T.prevRanking.indexOf(seat);
    return 1 - place / (T.n - 1);
  }

  function determinize(T, seat, unk) {
    const pool = C.shuffle(unk.cards.slice());
    for (const p of T.players) {
      if (p.seat === seat || p.out) continue;
      const k = p.hand.length;
      p.hand = C.sortHand(pool.splice(0, k), false);
    }
  }

  const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
  // 考えている間も画面が止まらないように、ときどき処理を譲る（タイマーより間引かれにくい MessageChannel を使う）
  // 読み込み時には何も作らない（サーバーでは読み込み時の非同期処理が禁止されているため）
  let yieldImpl = null;
  function yieldUI() {
    if (!yieldImpl) {
      if (typeof MessageChannel === 'undefined') yieldImpl = () => new Promise((r) => setTimeout(r, 0));
      else {
        const ch = new MessageChannel();
        const waiting = [];
        ch.port1.onmessage = () => { const r = waiting.shift(); if (r) r(); };
        yieldImpl = () => new Promise((r) => { waiting.push(r); ch.port2.postMessage(0); });
      }
    }
    return yieldImpl();
  }

  async function chooseTurnMC(S, seat, budgetMs) {
    const h = chooseTurnHeuristic(S, seat, 0);
    if (!h.scored.length) return h.action;
    const seen = new Set();
    const cands = [];
    for (const x of h.scored) {
      const key = x.a.type === 'pass' ? 'pass' : x.a.play.type + x.a.play.n + ':' + (x.a.play.rank || x.a.play.low) + ':' + x.a.play.jokers;
      if (seen.has(key)) continue;
      seen.add(key);
      cands.push(x);
      if (cands.length >= 5) break;
    }
    if (cands.length === 1) return cands[0].a;
    const unk = unknownInfo(S, seat);
    const stats = cands.map(() => ({ sum: 0, n: 0 }));
    const t0 = now();
    let it = 0;
    while (now() - t0 < budgetMs && it < 1500) {
      const ci = it % cands.length;
      const T = E.clone(S);
      determinize(T, seat, unk);
      try {
        E.apply(T, cands[ci].a);
        stats[ci].sum += rolloutPlace(T, seat);
        stats[ci].n++;
      } catch (e) { stats[ci].n++; }
      it++;
      if (it % 8 === 0) await yieldUI();
    }
    let best = 0, bestV = -Infinity;
    cands.forEach((c, i) => {
      const mean = stats[i].n ? stats[i].sum / stats[i].n : 0;
      const v = mean + (i === 0 ? 0.02 : 0);
      if (v > bestV) { bestV = v; best = i; }
    });
    return cands[best].a;
  }

  // ─────────────────────────────────────────────
  // 公開API
  // ─────────────────────────────────────────────
  function decideSync(S, q, level) {
    const seat = q.seat;
    const P = S.players[seat];
    const ctx = makeCtx(S, seat);
    const easy = level === 'easy';
    const rnd = Math.random;
    switch (q.kind) {
      case 'turn': {
        if (easy && rnd() < 0.35) {
          const plays = E.legalPlays(S, seat);
          if (E.topPlay(S) && (!plays.length || rnd() < 0.3)) return { type: 'pass', seat };
          if (plays.length) return { type: 'play', seat, play: plays[Math.floor(rnd() * plays.length)] };
        }
        return chooseTurnHeuristic(S, seat, easy ? 1.2 : 0.08).action;
      }
      case 'stop': {
        const opts = E.stopOptions(S, seat);
        if (easy) return rnd() < 0.55 ? { type: 'stop', seat, kind: opts[0].kind } : { type: 'nostop', seat };
        // 止めた後の手札＋親を取れる価値 と 止めない場合（相手が親のまま）を比べる
        const trig = q.trigger;
        const trigLeft = S.players[trig.seat].hand.length;
        let bestV = evaluate(P.hand, ctx) - (trig.flow ? (trigLeft <= 3 ? 1.4 : 0.35) : 0.15);
        let best = null;
        for (const o of opts) {
          const after = minus(P.hand, o.play.cards);
          let v;
          if (!after.length) v = E.isForbiddenFinish(o.play, S.rules, E.effRev(S)) ? -40 : 1000;
          else {
            const an = analyze(after, ctx);
            v = an.v + 0.8 + (an.nonControl <= 1 ? 1.2 : 0);
          }
          if (v > bestV) { bestV = v; best = o; }
        }
        return best ? { type: 'stop', seat, kind: best.kind } : { type: 'nostop', seat };
      }
      case 'give': case 'discard': {
        if (easy) return { type: q.kind, seat, cards: C.shuffle(P.hand.slice()).slice(0, q.count) };
        return { type: q.kind, seat, cards: worstCards(P.hand, q.count, ctx) };
      }
      case 'pickup': {
        if (easy) return { type: 'pickup', seat, cards: [] };
        let take = [];
        let base = evaluate(P.hand, ctx);
        for (const id of q.cards) {
          const v = evaluate(P.hand.concat(take, [id]), ctx);
          if (v > base + 0.15) { take.push(id); base = v; }
        }
        return { type: 'pickup', seat, cards: take };
      }
      case 'bomb': {
        if (easy) return { type: 'bomb', seat, ranks: [q.ranks[Math.floor(rnd() * q.ranks.length)]] };
        return { type: 'bomb', seat, ranks: chooseBomb(S, seat, q.count, P.hand, ctx) };
      }
      case 'exchange': {
        const ctxN = Object.assign({}, ctx, { rev: false });
        return { type: 'exchange', seat, cards: worstCards(P.hand, q.count, ctxN) };
      }
      case 'tenpen': return { type: 'tenpen', seat, accept: true };
    }
    throw new Error('unknown request ' + q.kind);
  }

  async function decide(S, q, level, budgetMs) {
    if (q.kind === 'turn' && level === 'hard') return chooseTurnMC(S, q.seat, budgetMs || 450);
    return decideSync(S, q, level);
  }

  /** 人間向けヒント（ふつうのAIの考え） */
  function suggest(S, seat) {
    return chooseTurnHeuristic(S, seat, 0).action;
  }

  D.AI = {
    decide, decideSync, suggest, evaluate, analyze, unknownInfo, makeCtx, worstCards, chooseBomb, fastAction,
    setRollout(p) { ROLLOUT = p; },
  };
})();

<script>
/* 七並べ — ルールの定義と判定（画面から独立した状態機械。サーバーでも同じものを使う） */
(function () {
  'use strict';
  const D = (globalThis.DFG = globalThis.DFG || {});
  const C = D.Cards;

  // ─────────────────────────────────────────────
  // ルール（どれも「ルールと設定」で切り替えられる）
  // ─────────────────────────────────────────────
  const RULES = [
    { key: 'passLimit', type: 'choice', label: 'パスの回数', def: 3,
      options: [{ v: 3, label: '3回まで' }, { v: 5, label: '5回まで' }, { v: 0, label: '無制限' }],
      desc: 'この回数をこえてパスすると失格。失格した人の手札はすべて場に並べられ、順位は最下位。' },
    { key: 'joker', type: 'bool', label: 'ジョーカー', def: true,
      desc: 'ジョーカー1枚入り。出せる場所に置くと、そのカードを持っている人は次の番で必ずそのカードを出し、代わりにジョーカーを受け取る。' },
    { key: 'tunnel', type: 'bool', label: 'トンネル', def: true,
      desc: 'AとKがつながる。Aまで並んだらKから、Kまで並んだらAからも出せる。' },
    { key: 'mustPlay', type: 'bool', label: '出せるときはパス禁止', def: false,
      desc: '出せるカードがあるときはパスできない（わざと止める作戦が使えなくなる）。' },
  ];
  const BY_KEY = {};
  for (const r of RULES) BY_KEY[r.key] = r;

  function defaults() {
    const o = {};
    for (const r of RULES) o[r.key] = r.def;
    return o;
  }
  function normalize(saved) {
    const o = defaults();
    if (saved && typeof saved === 'object') {
      for (const r of RULES) {
        if (!(r.key in saved)) continue;
        const v = saved[r.key];
        if (r.type === 'bool') o[r.key] = !!v;
        else if (r.options.some((op) => op.v === v)) o[r.key] = v;
      }
    }
    return o;
  }
  D.SevensRules = { RULES, BY_KEY, defaults, normalize, STANDARD: defaults() };

  // ─────────────────────────────────────────────
  // カード：数字は A=1 … K=13 で扱う（cards.js では A=14, 2=15）
  // ─────────────────────────────────────────────
  const SUITS = ['S', 'H', 'D', 'C'];
  const numOf = (id) => { const r = C.rankOf(id); return r === 14 ? 1 : r === 15 ? 2 : r; };
  const idOf = (suit, n) => suit + (n === 1 ? 14 : n === 2 ? 15 : n);
  const isJoker = C.isJoker;
  const numLabel = (n) => ({ 1: 'A', 11: 'J', 12: 'Q', 13: 'K' }[n] || String(n));
  const cardName = (id) => (isJoker(id) ? 'ジョーカー' : C.SUIT_SYM[C.suitOf(id)] + numLabel(numOf(id)));

  function makeDeck(joker) {
    const d = [];
    for (const s of SUITS) for (let n = 1; n <= 13; n++) d.push(idOf(s, n));
    if (joker) d.push('X1');
    return d;
  }

  function emptyBoard() {
    const b = {};
    for (const s of SUITS) b[s] = new Array(14).fill(null); // 1〜13 を使う
    return b;
  }

  // ─────────────────────────────────────────────
  // 状態
  // ─────────────────────────────────────────────
  /** opt: { rules, players: [{name, human, level}], games, rated, seed } */
  function createMatch(opt) {
    const S = {
      game: 'sevens',
      rules: normalize(opt.rules),
      n: opt.players.length,
      players: opt.players.map((p, i) => ({
        seat: i, name: p.name, human: !!p.human, level: p.level || 'normal',
        hand: [], out: false, elim: false, passes: 0, score: 0,
      })),
      gameNo: 0,
      maxGames: opt.games > 0 ? Math.floor(opt.games) : 0,
      matchOver: false,
      history: [],
      rated: opt.rated || null,
      prevRanking: null,
      phase: 'idle',
      rng: opt.seed != null ? C.mulberry32(opt.seed) : Math.random,
      events: [],
      silent: !!opt.silent,
    };
    resetGame(S);
    return S;
  }

  function resetGame(S) {
    S.board = emptyBoard();
    S.joker = null; // 場に置かれたジョーカー { suit, n, by }
    S.forced = null; // ジョーカーの場所のカードを持つ人 { seat, card }
    S.jokerGone = false; // 失格した人が持っていたジョーカーは取り除かれる
    S.passRun = 0; // 続けてパスした回数（だれかが出したら0）
    S.finished = [];
    S.elims = [];
    S.turn = 0;
    S.moves = 0;
  }

  function emit(S, ev) { if (!S.silent) S.events.push(ev); }

  const activeSeats = (S) => S.players.filter((p) => !p.out).map((p) => p.seat);
  function nextActive(S, s) {
    for (let i = 1; i <= S.n; i++) {
      const t = (s + i) % S.n;
      if (!S.players[t].out) return t;
    }
    return null;
  }

  /** 新しいゲームを配る。7は全部自動で場に置き、♦7を持っていた人から始める */
  function startGame(S, presetHands) {
    if (S.matchOver) throw new Error('この試合は終わりました');
    S.gameNo++;
    resetGame(S);
    for (const p of S.players) { p.hand = []; p.out = false; p.elim = false; p.passes = 0; }
    if (presetHands) presetHands.forEach((h, i) => { S.players[i].hand = h.slice(); });
    else {
      const deck = C.shuffle(makeDeck(S.rules.joker), S.rng);
      let seat = Math.floor(S.rng() * S.n);
      for (const id of deck) { S.players[seat].hand.push(id); seat = (seat + 1) % S.n; }
    }
    let leader = 0;
    const sevens = [];
    for (const p of S.players) {
      for (const id of p.hand.slice()) {
        if (!isJoker(id) && numOf(id) === 7) {
          if (id === 'D7') leader = p.seat;
          S.board[C.suitOf(id)][7] = { id };
          p.hand.splice(p.hand.indexOf(id), 1);
          sevens.push({ seat: p.seat, card: id });
        }
      }
      p.hand = sortHand(p.hand);
    }
    S.phase = 'play';
    S.turn = leader;
    emit(S, { t: 'deal', game: S.gameNo });
    emit(S, { t: 'sevens', placed: sevens });
    emit(S, { t: 'start', leader });
    // 7 だけで手札がなくなる人はいないが、念のため
    for (const p of S.players) if (!p.hand.length && !p.out) finishPlayer(S, p.seat);
  }

  /** 手札の並び：マーク順（♠♥♦♣）、同じマークは数字順、ジョーカーは右端 */
  const SUIT_IDX = { S: 0, H: 1, D: 2, C: 3 };
  function sortHand(hand) {
    return hand.slice().sort((a, b) => {
      if (isJoker(a) !== isJoker(b)) return isJoker(a) ? 1 : -1;
      if (isJoker(a)) return 0;
      return SUIT_IDX[C.suitOf(a)] - SUIT_IDX[C.suitOf(b)] || numOf(a) - numOf(b);
    });
  }

  // ─────────────────────────────────────────────
  // 出せる場所
  // ─────────────────────────────────────────────
  const filled = (S, s, n) => !!S.board[s][n];
  function neighbors(S, n) {
    const out = [];
    if (n > 1) out.push(n - 1); else if (S.rules.tunnel) out.push(13);
    if (n < 13) out.push(n + 1); else if (S.rules.tunnel) out.push(1);
    return out;
  }
  /** (s, n) が空いていて、となり（トンネルならAとKもとなり）にカードがあれば出せる */
  function openSpot(S, s, n) {
    if (filled(S, s, n)) return false;
    return neighbors(S, n).some((m) => filled(S, s, m));
  }
  function openSpots(S) {
    const out = [];
    for (const s of SUITS) for (let n = 1; n <= 13; n++) if (openSpot(S, s, n)) out.push({ suit: s, n });
    return out;
  }
  function canPlayCard(S, id) {
    if (isJoker(id)) return false;
    return openSpot(S, C.suitOf(id), numOf(id));
  }

  /**
   * ジョーカーを置ける場所：出せる場所のうち、そのカードをほかの人が持っている所。
   * 場にないカードは必ずだれかの手札にあるので「自分が持っていない」で判定できる（相手の手札が見えないオンラインでも同じ）
   */
  function jokerSpots(S, seat) {
    const own = new Set(S.players[seat].hand);
    return openSpots(S).filter((sp) => !own.has(idOf(sp.suit, sp.n)));
  }
  function holderOf(S, id) {
    for (const p of S.players) if (!p.out && p.hand.includes(id)) return p.seat;
    return -1;
  }

  /** パスが無制限でも、全員が2周続けてパスしたら、出せる人は出さなければならない（止まり続けないように） */
  const stalled = (S) => S.rules.passLimit === 0 && S.passRun >= activeSeats(S).length * 2;
  function canPass(S, seat) {
    if (S.forced && S.forced.seat === seat) return false;
    if ((S.rules.mustPlay || stalled(S)) && legalMoves(S, seat, true).length) return false;
    return true;
  }

  /** 出せる手（type: play / joker）。noPass=true ならパスを含めない */
  function legalMoves(S, seat, noPass) {
    const P = S.players[seat];
    if (S.forced && S.forced.seat === seat) return [{ type: 'play', seat, card: S.forced.card }];
    const out = [];
    for (const id of P.hand) {
      if (isJoker(id)) { for (const sp of jokerSpots(S, seat)) out.push({ type: 'joker', seat, suit: sp.suit, n: sp.n }); }
      else if (canPlayCard(S, id)) out.push({ type: 'play', seat, card: id });
    }
    if (!noPass && canPass(S, seat)) out.push({ type: 'pass', seat });
    return out;
  }

  /** 次に誰が何をする必要があるか */
  function getRequest(S) {
    if (S.phase !== 'play') return null;
    const q = { kind: 'turn', seat: S.turn };
    if (S.forced && S.forced.seat === S.turn) q.forced = S.forced.card;
    return q;
  }

  // ─────────────────────────────────────────────
  // 行動
  // ─────────────────────────────────────────────
  function removeCard(P, id) {
    const i = P.hand.indexOf(id);
    if (i < 0) throw new Error('手札にないカードです');
    P.hand.splice(i, 1);
  }

  function doPlay(S, seat, id) {
    const P = S.players[seat];
    if (!P.hand.includes(id)) throw new Error('手札にないカードです');
    if (S.forced && S.forced.seat === seat && id !== S.forced.card) throw new Error(cardName(S.forced.card) + ' を出してください（ジョーカーの場所）');
    const s = C.suitOf(id), n = numOf(id);
    const onJoker = S.joker && S.joker.suit === s && S.joker.n === n;
    if (!onJoker && !canPlayCard(S, id)) throw new Error('そのカードはまだ出せません');
    removeCard(P, id);
    S.board[s][n] = { id };
    S.moves++;
    if (onJoker) {
      // ジョーカーの場所に本物のカードを出したら、ジョーカーを受け取る
      S.joker = null;
      S.forced = null;
      P.hand.push('X1');
      P.hand = sortHand(P.hand);
      emit(S, { t: 'jokerBack', seat, card: id });
    } else emit(S, { t: 'play', seat, card: id });
    afterMove(S, seat);
  }

  function doJoker(S, seat, suit, n) {
    const P = S.players[seat];
    if (!P.hand.includes('X1')) throw new Error('ジョーカーを持っていません');
    if (S.forced && S.forced.seat === seat) throw new Error(cardName(S.forced.card) + ' を出してください（ジョーカーの場所）');
    n = Number(n);
    if (!SUITS.includes(suit) || !(n >= 1 && n <= 13)) throw new Error('場所が正しくありません');
    if (!jokerSpots(S, seat).some((sp) => sp.suit === suit && sp.n === n)) throw new Error('そこにはジョーカーを置けません');
    const card = idOf(suit, n);
    const holder = holderOf(S, card);
    if (holder < 0) throw new Error('そこにはジョーカーを置けません');
    removeCard(P, 'X1');
    S.board[suit][n] = { id: 'X1', joker: true };
    S.joker = { suit, n, by: seat };
    S.forced = { seat: holder, card };
    S.moves++;
    emit(S, { t: 'joker', seat, suit, n });
    afterMove(S, seat);
  }

  function doPass(S, seat) {
    if (!canPass(S, seat)) throw new Error(S.forced && S.forced.seat === seat ? 'ジョーカーの場所のカードを出してください' : '出せるカードがあるのでパスできません');
    const P = S.players[seat];
    P.passes++;
    S.passRun++;
    const limit = S.rules.passLimit;
    if (limit > 0 && P.passes > limit) { eliminate(S, seat); return; }
    emit(S, { t: 'pass', seat, passes: P.passes, limit });
    S.turn = nextActive(S, seat);
  }

  /** 失格：手札を全部場に並べる（ジョーカーは取り除く） */
  function eliminate(S, seat) {
    const P = S.players[seat];
    const placed = [];
    for (const id of P.hand) {
      if (isJoker(id)) { S.jokerGone = true; continue; }
      const s = C.suitOf(id), n = numOf(id);
      S.board[s][n] = { id, elim: true };
      placed.push(id);
    }
    P.hand = [];
    P.out = true;
    P.elim = true;
    S.elims.push(seat);
    emit(S, { t: 'elim', seat, cards: placed });
    if (!checkEnd(S)) S.turn = nextActive(S, seat);
  }

  function finishPlayer(S, seat) {
    const P = S.players[seat];
    if (P.out) return;
    P.out = true;
    S.finished.push(seat);
    emit(S, { t: 'finish', seat, place: S.finished.length });
  }

  function afterMove(S, seat) {
    S.passRun = 0;
    const P = S.players[seat];
    if (!P.hand.length) finishPlayer(S, seat);
    if (checkEnd(S)) return;
    S.turn = nextActive(S, seat);
  }

  /** 残りが1人以下になったら終わり。順位：上がった順 → 最後の1人 → 失格（後に失格した人ほど上） */
  function checkEnd(S) {
    const left = activeSeats(S);
    if (left.length > 1) return false;
    if (left.length === 1) {
      const L = S.players[left[0]];
      L.out = true;
      S.finished.push(L.seat);
      emit(S, { t: 'last', seat: L.seat });
    }
    endGame(S, S.finished.concat(S.elims.slice().reverse()));
    return true;
  }

  function endGame(S, ranking) {
    S.phase = 'over';
    S.forced = null;
    S.prevRanking = ranking.slice();
    const pts = new Array(S.n).fill(0);
    ranking.forEach((seat, i) => {
      pts[seat] = D.Engine.pointsFor(S.n, i);
      S.players[seat].score += pts[seat];
    });
    S.history.push({ ranking: ranking.slice(), pts });
    S.matchOver = S.maxGames > 0 && S.gameNo >= S.maxGames;
    emit(S, { t: 'over', ranking: ranking.slice(), pts: pts.slice(), matchOver: S.matchOver });
  }

  function apply(S, a) {
    S.events = [];
    const q = getRequest(S);
    if (!q) throw new Error('今は操作できません');
    if (!a || a.seat !== q.seat) throw new Error('あなたの番ではありません');
    switch (a.type) {
      case 'play': doPlay(S, a.seat, a.card); break;
      case 'joker': doJoker(S, a.seat, a.suit, a.n); break;
      case 'pass': doPass(S, a.seat); break;
      default: throw new Error('今はその操作はできません');
    }
    return S.events;
  }

  // ─────────────────────────────────────────────
  // 複製・保存
  // ─────────────────────────────────────────────
  function cloneBoard(b) {
    const o = {};
    for (const s of SUITS) o[s] = b[s].slice();
    return o;
  }
  function clone(S) {
    const T = Object.assign({}, S);
    T.players = S.players.map((p) => Object.assign({}, p, { hand: p.hand.slice() }));
    T.board = cloneBoard(S.board);
    T.joker = S.joker && Object.assign({}, S.joker);
    T.forced = S.forced && Object.assign({}, S.forced);
    T.finished = S.finished.slice();
    T.elims = S.elims.slice();
    T.history = S.history.slice();
    T.prevRanking = S.prevRanking && S.prevRanking.slice();
    T.events = [];
    T.silent = true;
    return T;
  }
  function serialize(S) {
    const o = Object.assign({}, S);
    delete o.rng;
    o.events = [];
    return JSON.parse(JSON.stringify(o));
  }
  function deserialize(o) {
    const S = Object.assign({}, o);
    S.rules = normalize(o.rules);
    S.rng = Math.random;
    S.events = [];
    if (!Array.isArray(S.history)) S.history = [];
    if (!(S.maxGames > 0)) S.maxGames = 0;
    S.matchOver = !!S.matchOver;
    if (S.rated === undefined) S.rated = null;
    return S;
  }

  function standings(S) { return D.Engine.standings(S); }

  function describe(a) {
    if (a.type === 'pass') return 'パス';
    if (a.type === 'joker') return 'ジョーカーを ' + C.SUIT_SYM[a.suit] + numLabel(a.n) + ' の場所へ';
    return cardName(a.card);
  }

  D.Sevens = {
    SUITS, numOf, idOf, numLabel, cardName, makeDeck, sortHand,
    createMatch, startGame, getRequest, apply, legalMoves, canPass, canPlayCard, openSpot, openSpots, jokerSpots, holderOf,
    clone, serialize, deserialize, standings, describe, nextActive,
  };
})();
