<script>
/* 七並べ — AIロボット（やさしい / ふつう / つよい） */
(function () {
  'use strict';
  const D = globalThis.DFG;
  const C = D.Cards, SV = D.Sevens;

  // マスのカード名（毎回文字列を作らないように先に作っておく）
  const IDS = {};
  for (const s of SV.SUITS) { IDS[s] = []; for (let n = 1; n <= 13; n++) IDS[s][n] = SV.idOf(s, n); }

  /**
   * (s, n) を埋めたときに開く方向の価値。となりから空きマスをたどり（トンネルなら一周）、
   * 自分のカードが先にあるほど良い。ほかの人のカードが開くのは悪いが、
   * 自分の次のカードより先は、まだ自分が止めているので数えない。
   * （つよいAIが何百回も呼ぶので、配列を作らずに数える）
   */
  function openValue(S, s, n, own) {
    const row = S.board[s], ids = IDS[s], tunnel = S.rules.tunnel;
    let v = 0;
    for (let dir = -1; dir <= 1; dir += 2) {
      let blocked = false, m = n;
      for (let k = 1; k <= 12; k++) {
        m += dir;
        if (m < 1 || m > 13) {
          if (!tunnel) break;
          m = m < 1 ? 13 : 1;
        }
        if (row[m]) break;
        if (own.has(ids[m])) { v += W.own / Math.pow(k, W.ownPow); blocked = true; }
        else if (!blocked) v -= W.other / Math.pow(k, W.otherPow);
      }
    }
    return v;
  }
  // 重み（tools で自己対戦させて調整）
  const W = { own: 1.0, ownPow: 0.6, other: 0.8, otherPow: 0.35, passBase: 0.75, passLeft: 1.0, jokerKeep: 0.8 };

  /** own：自分の手札の Set（同じ番の手を何通りも比べるときは使い回す。出すカード自身はたどるマスに出てこない） */
  function scoreMove(S, seat, a, own) {
    const P = S.players[seat];
    if (a.type === 'pass') {
      const limit = S.rules.passLimit;
      if (limit > 0 && P.passes >= limit) return -1000; // 次のパスで失格
      const left = limit > 0 ? limit - P.passes : 3;
      return -W.passBase - W.passLeft / Math.max(1, left) - 0.08 * P.hand.length;
    }
    if (P.hand.length === 1) return 1000;
    own = own || new Set(P.hand);
    if (a.type === 'joker') {
      // ジョーカーは手元にあるほど強いので、使うのは自分の札がたくさん開くときだけ
      return openValue(S, a.suit, a.n, own) + 0.4 - W.jokerKeep + (P.hand.length <= 3 ? 0.8 : 0);
    }
    return openValue(S, C.suitOf(a.card), SV.numOf(a.card), own) + 0.15;
  }

  function chooseHeuristic(S, seat, noise, rng) {
    const moves = SV.legalMoves(S, seat);
    const own = new Set(S.players[seat].hand);
    const r = rng || Math.random;
    let best = null, bestV = -Infinity;
    for (const a of moves) {
      const v = scoreMove(S, seat, a, own) + (noise ? (r() - 0.5) * noise : 0);
      if (v > bestV) { bestV = v; best = a; }
    }
    return best;
  }

  // ─────────────────────────────────────────────
  // つよい：見えないカードをランダムに配り直して、何百回も最後まで試す
  // ─────────────────────────────────────────────
  function unknownPool(S, seat) {
    const seen = new Set(S.players[seat].hand);
    // 場のカード（ジョーカーが置かれた場所の本物のカードは、まだだれかの手札にある）
    for (const s of SV.SUITS) for (let n = 1; n <= 13; n++) { const c = S.board[s][n]; if (c && !c.joker) seen.add(c.id); }
    const pool = [];
    for (const id of SV.makeDeck(false)) if (!seen.has(id)) pool.push(id);
    const jokerSeen = seen.has('X1') || !!S.joker || S.jokerGone;
    if (S.rules.joker && !jokerSeen) pool.push('X1');
    return pool;
  }

  function determinize(T, seat) {
    const pool = C.shuffle(unknownPool(T, seat));
    const forced = T.forced && T.forced.seat !== seat ? T.forced : null;
    if (forced) { const i = pool.indexOf(forced.card); if (i >= 0) pool.splice(i, 1); }
    for (const p of T.players) {
      if (p.seat === seat || p.out) continue;
      const k = p.hand.length;
      let h = [];
      if (forced && forced.seat === p.seat) h.push(forced.card);
      h = h.concat(pool.splice(0, k - h.length));
      p.hand = SV.sortHand(h);
    }
  }

  function rollout(T, seat, rng) {
    let q, guard = 0;
    while ((q = SV.getRequest(T)) && guard++ < 400) SV.apply(T, chooseHeuristic(T, q.seat, 0.6, rng));
    if (T.phase !== 'over') return 0;
    return D.Engine.pointsFor(T.n, T.prevRanking.indexOf(seat));
  }

  const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
  let yieldImpl = null;
  function yieldUI() {
    if (!yieldImpl) {
      if (typeof MessageChannel === 'undefined') yieldImpl = () => new Promise((r) => setTimeout(r, 0));
      else {
        const ch = new MessageChannel();
        const waiting = [];
        ch.port1.onmessage = () => { const r = waiting.shift(); if (r) r(); };
        yieldImpl = () => new Promise((r) => { waiting.push(r); ch.port2.postMessage(0); });
      }
    }
    return yieldImpl();
  }

  /**
   * 候補の手を、同じ「見えないカードの配り方」と同じ乱数で比べる（手ごとに別の配り方で試すと、
   * 配り方の運の差が手の差より大きくなり、良い手を見分けられない）。パスは作戦なので必ず候補に入れる。
   * 試す回数は ITERS で決まっている（時間で決めると、遅い端末ほど弱くなりレートが合わなくなる）。
   * maxMs はとても遅い端末で待たせすぎないための上限。
   */
  const ITERS = 300;
  async function chooseMC(S, seat, maxMs) {
    const moves = SV.legalMoves(S, seat);
    if (moves.length <= 1) return moves[0];
    const ranked = moves.map((a) => ({ a, s: scoreMove(S, seat, a) })).sort((x, y) => y.s - x.s);
    if (ranked[0].s >= 1000) return ranked[0].a;
    const cands = ranked.slice(0, 6);
    const pass = ranked.find((x) => x.a.type === 'pass');
    if (pass && !cands.includes(pass)) cands[cands.length - 1] = pass;
    const sum = cands.map(() => 0);
    const t0 = now();
    let it = 0;
    while (it < ITERS && now() - t0 < maxMs) {
      const base = SV.clone(S);
      determinize(base, seat);
      const seed = (Math.random() * 4294967296) >>> 0;
      cands.forEach((c, i) => {
        const T = SV.clone(base);
        try { SV.apply(T, c.a); sum[i] += rollout(T, seat, C.mulberry32(seed)); } catch (e) { sum[i] -= 3; }
      });
      it++;
      if (it % 2 === 0) await yieldUI();
    }
    let best = 0;
    cands.forEach((c, i) => { if (sum[i] > sum[best]) best = i; }); // 同点なら評価関数の順
    return cands[best].a;
  }

  function decideSync(S, q, level) {
    const seat = q.seat;
    if (level === 'easy') {
      const moves = SV.legalMoves(S, seat, true);
      if (moves.length && Math.random() < 0.4) return moves[Math.floor(Math.random() * moves.length)];
      return chooseHeuristic(S, seat, 2.2);
    }
    return chooseHeuristic(S, seat, 0.15);
  }

  async function decide(S, q, level, maxMs) {
    if (level === 'hard') return chooseMC(S, q.seat, maxMs || 3000);
    return decideSync(S, q, level);
  }

  /** 人間向けヒント（ふつうのAIの考え） */
  function suggest(S, seat) { return chooseHeuristic(S, seat, 0); }

  D.SevensAI = { decide, decideSync, suggest, scoreMove, W, ITERS };
})();

<script>
/* スピード — ルール判定（リアルタイムのゲーム。時間の管理は外側：画面のループかサーバー） */
(function () {
  'use strict';
  const D = (globalThis.DFG = globalThis.DFG || {});
  const C = D.Cards;

  const RULES = [
    { key: 'wrap', type: 'bool', label: 'AとKがつながる', def: true,
      desc: 'Kの上にA、Aの上にKも出せる。' },
    { key: 'same', type: 'bool', label: '同じ数字も重ねられる', def: true,
      desc: '台札と同じ数字も出せる（7の上に7など）。' },
  ];
  function defaults() { const o = {}; for (const r of RULES) o[r.key] = r.def; return o; }
  function normalize(saved) {
    const o = defaults();
    if (saved && typeof saved === 'object') for (const r of RULES) if (r.key in saved) o[r.key] = !!saved[r.key];
    return o;
  }
  const BY_KEY = {};
  for (const r of RULES) BY_KEY[r.key] = r;
  D.SpeedRules = { RULES, BY_KEY, defaults, normalize, STANDARD: defaults() };

  const FIELD = 4; // 場札の枚数
  const COLORS = [['H', 'D'], ['S', 'C']]; // 席0は赤、席1は黒
  const numOf = (id) => { const r = C.rankOf(id); return r === 14 ? 1 : r === 15 ? 2 : r; };
  const numLabel = (n) => ({ 1: 'A', 11: 'J', 12: 'Q', 13: 'K' }[n] || String(n));
  const cardName = (id) => C.SUIT_SYM[C.suitOf(id)] + numLabel(numOf(id));

  /** 台札 top の上に card を出せるか */
  function canStack(R, card, top) {
    if (!top) return false;
    const a = numOf(card), b = numOf(top);
    if (R.same && a === b) return true;
    if (Math.abs(a - b) === 1) return true;
    return !!R.wrap && ((a === 1 && b === 13) || (a === 13 && b === 1));
  }

  const topOf = (S, i) => { const p = S.piles[i]; return p.length ? p[p.length - 1] : null; };

  /** opt: { rules, players: [{name, human, level}] ×2, games（何本勝負か。0なら終わりなし）, rated, seed } */
  function createMatch(opt) {
    const S = {
      game: 'speed',
      rules: normalize(opt.rules),
      n: 2,
      players: opt.players.slice(0, 2).map((p, i) => ({
        seat: i, name: p.name, human: !!p.human, level: p.level || 'normal',
        deck: [], field: new Array(FIELD).fill(null), wins: 0, score: 0,
      })),
      gameNo: 0,
      maxGames: opt.games > 0 ? Math.floor(opt.games) : 0,
      matchOver: false,
      history: [],
      rated: opt.rated || null,
      piles: [[], []],
      phase: 'idle',
      stuckReason: null,
      winner: null,
      endReason: null,
      moves: 0,
      rng: opt.seed != null ? C.mulberry32(opt.seed) : Math.random,
      events: [],
      silent: !!opt.silent,
    };
    return S;
  }
  const winsNeeded = (S) => (S.maxGames > 0 ? Math.floor(S.maxGames / 2) + 1 : Infinity);

  function emit(S, ev) { if (!S.silent) S.events.push(ev); }

  /** 配る：自分の色の26枚を山札にし、4枚を場札に並べる。台札は「せーの」で出す（phase=stuck） */
  function startGame(S, presetDecks) {
    if (S.matchOver) throw new Error('この試合は終わりました');
    S.events = [];
    S.gameNo++;
    S.piles = [[], []];
    S.winner = null;
    S.endReason = null;
    S.moves = 0;
    S.players.forEach((P, i) => {
      let deck;
      if (presetDecks) deck = presetDecks[i].slice();
      else {
        deck = [];
        for (const s of COLORS[i]) for (const r of C.RANKS) deck.push(s + r);
        C.shuffle(deck, S.rng);
      }
      P.deck = deck; // 末尾が山札のいちばん上
      P.field = new Array(FIELD).fill(null);
      for (let k = 0; k < FIELD && P.deck.length; k++) P.field[k] = P.deck.pop();
    });
    S.phase = 'stuck';
    S.stuckReason = 'start';
    emit(S, { t: 'deal', game: S.gameNo });
    return S.events;
  }

  function playable(S, seat) {
    const P = S.players[seat];
    const out = [];
    P.field.forEach((card, slot) => {
      if (!card) return;
      for (let pile = 0; pile < 2; pile++) if (canStack(S.rules, card, topOf(S, pile))) out.push({ slot, pile });
    });
    return out;
  }
  const anyPlayable = (S) => playable(S, 0).length > 0 || playable(S, 1).length > 0;
  const cardsLeft = (P) => P.deck.length + P.field.filter(Boolean).length;

  function checkWin(S) {
    const empty = S.players.filter((P) => cardsLeft(P) === 0);
    if (!empty.length) return false;
    endGame(S, empty.length === 1 ? empty[0].seat : null, null); // 同時になくなったら引き分け
    return true;
  }

  /** ゲームを終える。reason：'away'（相手の通信切れ）など。ふつうに出しきったときは null */
  function endGame(S, winner, reason) {
    S.phase = 'over';
    S.winner = winner;
    S.endReason = reason;
    const pts = [0, 0];
    if (winner !== null) { S.players[winner].wins++; S.players[winner].score = S.players[winner].wins; pts[winner] = 1; }
    S.history.push({ winner, pts });
    const need = winsNeeded(S);
    S.matchOver = S.players.some((P) => P.wins >= need);
    emit(S, { t: 'over', winner, wins: S.players.map((P) => P.wins), matchOver: S.matchOver, reason });
  }

  /** 通信が切れたまま戻らない人（seat）の負けにする（オンライン） */
  function forfeit(S, seat) {
    S.events = [];
    if (S.phase !== 'play' && S.phase !== 'stuck') throw new Error('今はできません');
    endGame(S, 1 - seat, 'away');
    return S.events;
  }

  function afterChange(S) {
    if (checkWin(S)) return;
    if (!anyPlayable(S)) {
      S.phase = 'stuck';
      S.stuckReason = 'stuck';
      emit(S, { t: 'stuck' });
    } else S.phase = 'play';
  }

  /** 場札（slot）を台札（pile）に出す。どちらの席もいつでも出せる */
  function play(S, seat, slot, pile) {
    S.events = [];
    if (S.phase !== 'play') throw new Error(S.phase === 'stuck' ? '「せーの」を待っています' : '今は出せません');
    const P = S.players[seat];
    if (!P) throw new Error('席がありません');
    slot = Number(slot); pile = Number(pile);
    const card = P.field[slot];
    if (!card) throw new Error('そこにカードがありません');
    if (!(pile === 0 || pile === 1)) throw new Error('台札が正しくありません');
    if (!canStack(S.rules, card, topOf(S, pile))) throw new Error('そのカードはそこに出せません');
    S.piles[pile].push(card);
    P.field[slot] = P.deck.length ? P.deck.pop() : null;
    S.moves++;
    emit(S, { t: 'play', seat, slot, pile, card, refill: P.field[slot] });
    afterChange(S);
    return S.events;
  }

  /** せーの：両方が山札の上から1枚ずつ自分の台札に出す（山札がなければ場札から） */
  function flip(S) {
    S.events = [];
    if (S.phase !== 'stuck') throw new Error('今は「せーの」ではありません');
    const cards = [];
    S.players.forEach((P, i) => {
      let card = null, from = 'deck', slot = -1;
      if (P.deck.length) card = P.deck.pop();
      else {
        slot = P.field.findIndex(Boolean);
        if (slot >= 0) { card = P.field[slot]; P.field[slot] = null; from = 'field'; }
      }
      if (card) { S.piles[i].push(card); cards.push({ seat: i, card, from, slot }); }
    });
    S.moves++;
    const reason = S.stuckReason;
    S.stuckReason = null;
    emit(S, { t: 'flip', cards, reason });
    afterChange(S);
    return S.events;
  }

  // ─────────────────────────────────────────────
  // 複製・保存・表示用
  // ─────────────────────────────────────────────
  function clone(S) {
    const T = Object.assign({}, S);
    T.players = S.players.map((P) => Object.assign({}, P, { deck: P.deck.slice(), field: P.field.slice() }));
    T.piles = S.piles.map((p) => p.slice());
    T.history = S.history.slice();
    T.events = [];
    T.silent = true;
    return T;
  }
  function serialize(S) {
    const o = Object.assign({}, S);
    delete o.rng;
    o.events = [];
    return JSON.parse(JSON.stringify(o));
  }
  function deserialize(o) {
    const S = Object.assign({}, o);
    S.rules = normalize(o.rules);
    S.rng = Math.random;
    S.events = [];
    if (!Array.isArray(S.history)) S.history = [];
    return S;
  }
  /** 他の人に見せる形（山札の中身は伏せる。場札と台札は表向き） */
  function publicView(S) {
    const T = serialize(S);
    T.players.forEach((P) => { P.deckCount = P.deck.length; P.deck = []; });
    T.piles = T.piles.map((p) => p.slice(-6));
    return T;
  }
  const deckCount = (P) => (P.deckCount != null ? P.deckCount : P.deck.length);

  function standings(S) {
    const rows = S.players.map((P) => ({ seat: P.seat, score: P.wins, place: 0 }));
    rows.sort((a, b) => b.score - a.score || a.seat - b.seat);
    rows.forEach((r, i) => { r.place = i && r.score === rows[i - 1].score ? rows[i - 1].place : i + 1; });
    return rows;
  }

  D.Speed = {
    FIELD, COLORS, numOf, numLabel, cardName, canStack, topOf, winsNeeded, cardsLeft, deckCount,
    createMatch, startGame, play, flip, forfeit, playable, anyPlayable, clone, serialize, deserialize, publicView, standings,
  };
})();

<script>
/* スピード — AIロボット。強さは「反応の速さ」と「次の一手を考えるか」で変わる */
(function () {
  'use strict';
  const D = globalThis.DFG;
  const SP = D.Speed;

  // 1枚出すまでの時間（ミリ秒）。はじめの1枚（せーのの直後）は少し長め
  const REACTION = {
    easy: [1500, 2300],
    normal: [950, 1400],
    hard: [560, 850],
  };

  function reaction(level, rng, afterFlip) {
    const [a, b] = REACTION[level] || REACTION.normal;
    const r = rng || Math.random;
    return Math.round(a + (b - a) * r() + (afterFlip ? 260 : 0));
  }

  /** 出したあとに自分の場札がまだ出せるか（連続で出せるか）を数える */
  function followUps(S, seat, mv) {
    const T = SP.clone(S);
    const P = T.players[seat];
    const card = P.field[mv.slot];
    T.piles[mv.pile].push(card);
    P.field[mv.slot] = null; // 補充されるカードは見えないものとして扱う
    return SP.playable(T, seat).length;
  }

  /** 相手が出せる手の数（つよいAIは相手を止める手を選ぶ） */
  function oppAfter(S, seat, mv) {

    return SP.playable(T, 1 - seat).length;

    const moves = SP.playable(S, seat);
    if (!moves.length) return null;
    if (level === 'easy') return moves[Math.floor(Math.random() * moves.length)];
    let best = null, bestV = -Infinity;
    for (const mv of moves) {
      let v = followUps(S, seat, mv) + Math.random() * 0.3;
      if (level === 'hard') v -= 0.45 * oppAfter(S, seat, mv);
      if (v > bestV) { bestV = v; best = mv; }
    }

<script>
/* スピード — 時間の進行（AIが出すタイミングと「せーの」）。画面とサーバーで共通
 * 予定は S.clock に入れる（保存・復元できるように、ただの数字だけ） */
(function () {
  'use strict';
  const D = globalThis.DFG;
  const SP = D.Speed, AI = D.SpeedAI;

  const FLIP_DELAY = { start: 1700, stuck: 1300 }; // 「せーの」までの間

  function clock(S) {
    if (!S.clock) S.clock = { aiAt: [null, null], flipAt: null, afterFlip: false };
    return S.clock;
  }

  /**
   * 状態が変わったら呼ぶ。levelOf(seat) はAIの強さ（人なら null）
   * AIは出せる手があるときだけ「出す時刻」を予約する（すでに予約があればそのまま＝反応の途中）
   */
  function schedule(S, now, levelOf, rng) {
    const k = clock(S);
    if (S.phase === 'over' || S.phase === 'idle') { k.aiAt = [null, null]; k.flipAt = null; return; }
    if (S.phase === 'stuck') {
      k.aiAt = [null, null];
      if (k.flipAt == null) k.flipAt = now + FLIP_DELAY[S.stuckReason === 'start' ? 'start' : 'stuck'];
      return;
    }
    k.flipAt = null;
    for (let seat = 0; seat < 2; seat++) {
      const lv = levelOf(seat);
      if (!lv || !SP.playable(S, seat).length) { k.aiAt[seat] = null; continue; }
      if (k.aiAt[seat] == null) k.aiAt[seat] = now + AI.reaction(lv, rng, k.afterFlip);
    }
    k.afterFlip = false;
  }

  /** 次に何かが起きるまでの時間（なければ null） */
  function nextDelay(S, now) {
    const k = clock(S);
    const ts = [k.flipAt].concat(k.aiAt).filter((t) => t != null);
    if (!ts.length) return null;
    return Math.max(0, Math.min.apply(null, ts) - now);
  }

  /** 時刻 now までに予定されていたことを1つ行う。行ったら { events } を返す */
  function tick(S, now, levelOf, rng) {
    const k = clock(S);
    if (k.flipAt != null && k.flipAt <= now && S.phase === 'stuck') {
      k.flipAt = null;
      k.afterFlip = true;
      const events = SP.flip(S);
      schedule(S, now, levelOf, rng);
      return { events };
    }
    let due = -1;
    for (let seat = 0; seat < 2; seat++) {
      const t = k.aiAt[seat];
      if (t != null && t <= now && (due < 0 || t < k.aiAt[due])) due = seat;
    }
    if (due < 0) return null;
    k.aiAt[due] = null;
    if (S.phase !== 'play') { schedule(S, now, levelOf, rng); return null; }
    const mv = AI.choose(S, due, levelOf(due));
    if (!mv) { schedule(S, now, levelOf, rng); return null; }
    const events = SP.play(S, due, mv.slot, mv.pile);
    schedule(S, now, levelOf, rng);
    return { events, seat: due };
  }

  D.SpeedHost = { schedule, nextDelay, tick, FLIP_DELAY, clock };
})();

</script>

<script>
/* 大富豪 — テーブルの素材（フェルト・木・革）をキャンバスで作る */
(function () {
  'use strict';
  const D = (globalThis.DFG = globalThis.DFG || {});

  function canvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return c;
  }

  // 同じ乱数列にして、毎回同じ見た目にする
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /** フェルトの毛羽（透明の上に明暗の点と短い繊維）。どの色のフェルトにも重ねられる */
  function felt() {
    const S = 256;
    const c = canvas(S, S);
    const g = c.getContext('2d');
    const r = rng(11);
    const img = g.createImageData(S, S);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = r();
      if (v < 0.5) { img.data[i] = img.data[i + 1] = img.data[i + 2] = 0; img.data[i + 3] = Math.floor((0.5 - v) * 70); }
      else { img.data[i] = img.data[i + 1] = img.data[i + 2] = 255; img.data[i + 3] = Math.floor((v - 0.5) * 34); }
    }
    g.putImageData(img, 0, 0);
    g.lineCap = 'round';
    for (let i = 0; i < 2600; i++) {
      const x = r() * S, y = r() * S, len = 1.5 + r() * 5, a = r() * Math.PI;
      const light = r() < 0.45;
      g.strokeStyle = light ? 'rgba(255,255,255,' + (0.05 + r() * 0.08) + ')' : 'rgba(0,0,0,' + (0.06 + r() * 0.1) + ')';
      g.lineWidth = 0.5 + r() * 0.7;
      for (const [ox, oy] of [[0, 0], [-S, 0], [S, 0], [0, -S], [0, S]]) {
        g.beginPath();
        g.moveTo(x + ox, y + oy);
        g.lineTo(x + ox + Math.cos(a) * len, y + oy + Math.sin(a) * len);
        g.stroke();
      }
    }
    return c.toDataURL('image/png');
  }

  /** くるみ材の木目（横にも縦にもつながる） */
  function wood() {
    const W = 512, H = 128;
    const c = canvas(W, H);
    const g = c.getContext('2d');
    const r = rng(29);
    const grd = g.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, '#5b331b');
    grd.addColorStop(0.5, '#4b2914');
    grd.addColorStop(1, '#5a311a');
    g.fillStyle = grd;
    g.fillRect(0, 0, W, H);
    for (let i = 0; i < 110; i++) {
      const y0 = r() * H;
      const k1 = 1 + Math.floor(r() * 3), k2 = 3 + Math.floor(r() * 5);
      const a1 = 1 + r() * 5, a2 = r() * 1.6;
      const p1 = r() * 6.283, p2 = r() * 6.283;
      const dark = r() < 0.6;
      g.strokeStyle = dark ? 'rgba(24,9,2,' + (0.12 + r() * 0.3) + ')' : 'rgba(160,96,50,' + (0.05 + r() * 0.12) + ')';
      g.lineWidth = 0.5 + r() * 2.2;
      for (const oy of [0, -H, H]) {
        g.beginPath();
        for (let x = 0; x <= W; x += 4) {
          const t = (x / W) * 6.283;
          const y = y0 + oy + Math.sin(t * k1 + p1) * a1 + Math.sin(t * k2 + p2) * a2;
          if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
        }
        g.stroke();
      }
    }
    const img = g.getImageData(0, 0, W, H);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = (r() - 0.5) * 16;
      img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n;
    }
    g.putImageData(img, 0, 0);
    return c.toDataURL('image/jpeg', 0.9);
  }

  /** 革のしぼ（細かいシワ） */
  function leather() {
    const S = 192;
    const c = canvas(S, S);
    const g = c.getContext('2d');
    const r = rng(47);
    for (let i = 0; i < 900; i++) {
      const x = r() * S, y = r() * S, rad = 1 + r() * 3.5;
      g.fillStyle = r() < 0.5 ? 'rgba(0,0,0,' + (0.1 + r() * 0.16) + ')' : 'rgba(255,230,200,' + (0.025 + r() * 0.04) + ')';
      for (const [ox, oy] of [[0, 0], [-S, 0], [S, 0], [0, -S], [0, S]]) {
        g.beginPath();
        g.ellipse(x + ox, y + oy, rad, rad * (0.5 + r() * 0.6), r() * Math.PI, 0, 6.283);
        g.fill();
      }
    }
    return c.toDataURL('image/png');
  }

  function apply() {
    try {
      const root = document.documentElement.style;
      root.setProperty('--tex-felt', 'url(' + felt() + ')');
      root.setProperty('--tex-wood', 'url(' + wood() + ')');
      root.setProperty('--tex-leather', 'url(' + leather() + ')');
    } catch (e) { /* 素材が作れなくても単色で表示できる */ }
  }

  D.Textures = { apply };
})();

/* 大富豪 — 効果音（Web Audio で合成。音源ファイルなし） */
(function () {
  'use strict';
  const D = (globalThis.DFG = globalThis.DFG || {});

  let ctx = null, master = null, enabled = true, noiseBuf = null;

  function ensure() {

      if (!AC) return null;

        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.55;
        master.connect(ctx.destination);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.6, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { ctx = null; return null; }
    }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }

  function noise(t, dur, freq, q, gain, sweepTo) {
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(freq, t);
    if (sweepTo) bp.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    bp.Q.value = q;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t, Math.random() * 0.3);
    src.stop(t + dur + 0.02);
  }

  function tone(t, freq, dur, type, gain, glideTo) {
    const o = ctx.createOscillator();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t);
    o.stop(t + dur + 0.05);
  }

  const SOUNDS = {
    card(n) {
      const t = ctx.currentTime;
      const k = Math.min(n || 1, 4);
      for (let i = 0; i < k; i++) noise(t + i * 0.035, 0.09, 2600 + Math.random() * 600, 1.4, 0.55);
      noise(t + 0.01, 0.05, 900, 0.8, 0.25);

    pass() { const t = ctx.currentTime; tone(t, 330, 0.12, 'triangle', 0.08, 260); },
    flow() { const t = ctx.currentTime; noise(t, 0.45, 800, 0.9, 0.35, 5200); },

    special() {

      const t = ctx.currentTime;

      noise(t, 0.6, 300, 0.7, 0.4, 120);
      [392, 494, 587, 784].forEach((f, i) => tone(t + 0.25 + i * 0.08, f, 0.7, 'sawtooth', 0.035));
    },
    bomb() {
      const t = ctx.currentTime;
      tone(t, 110, 0.6, 'sine', 0.45, 35);
      noise(t, 0.7, 500, 0.6, 0.6, 90);
    },
    finish() {
      const t = ctx.currentTime;
      [523, 659, 784, 1047].forEach((f, i) => tone(t + i * 0.09, f, 0.45, 'triangle', 0.09));
    },
    foul() {
      const t = ctx.currentTime;
      tone(t, 196, 0.35, 'square', 0.05, 150);
      tone(t + 0.18, 147, 0.45, 'square', 0.05, 110);
    },
    fanfare() {
      const t = ctx.currentTime;
      [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(t + i * 0.12, f, 0.35, 'triangle', 0.1));
    },
    select() { const t = ctx.currentTime; noise(t, 0.03, 4200, 2, 0.12); },
    chat() { const t = ctx.currentTime; tone(t, 988, 0.12, 'sine', 0.06); tone(t + 0.08, 1480, 0.16, 'sine', 0.05); },
    error() { const t = ctx.currentTime; tone(t, 220, 0.14, 'triangle', 0.08, 180); },

    if (!enabled) return;
    if (!ensure()) return;

    play,
    unlock() { ensure(); },
    setEnabled(v) { enabled = !!v; if (enabled) ensure(); },
    get enabled() { return enabled; },
  };

(function () {

  // ─────────────────────────────────────────────
  // 席の配置
  // ─────────────────────────────────────────────
  /** 相手の席の位置（テーブル内のpx）。上のボタン列と重ならず、場のカードとも重ならないようにする */
  function seatPositions(n, w, h, half, ph) {
    const k = n - 1;

    const ry = Math.min(Math.max(ph * 0.95, Math.min(h * 0.27, 190)), Math.max(ph * 0.62, h - cy - 6));
    const rx = Math.min(w * (narrow ? 0.44 : 0.34), Math.max(ry * 1.9, pw * 2.6));
    const f = (v) => v.toFixed(1);
    let s = '<svg width="' + f(w) + '" height="' + f(h) + '" viewBox="0 0 ' + f(w) + ' ' + f(h) + '" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">' +
      '<defs><linearGradient id="dfg-foil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7e4a6"/><stop offset="1" stop-color="#b78a30"/></linearGradient></defs>';
    // 二重の楕円
    s += '<ellipse cx="' + f(cx) + '" cy="' + f(cy) + '" rx="' + f(rx) + '" ry="' + f(ry) + '" fill="none" stroke="rgba(228,188,98,.34)" stroke-width="1.6"/>';
    s += '<ellipse cx="' + f(cx) + '" cy="' + f(cy) + '" rx="' + f(Math.max(0, rx - 7)) + '" ry="' + f(Math.max(0, ry - 7)) + '" fill="none" stroke="rgba(228,188,98,.17)" stroke-width="1"/>';
    // カード置き場
    const sw = pw * 1.14, sh = ph * 1.1;
    s += '<rect x="' + f(cx - sw / 2) + '" y="' + f(cy - sh / 2) + '" width="' + f(sw) + '" height="' + f(sh) + '" rx="' + f(pw * 0.1) + '" fill="rgba(0,0,0,.1)" stroke="rgba(228,188,98,.38)" stroke-width="1.3"/>';
    s += '<rect x="' + f(cx - sw / 2 + 4) + '" y="' + f(cy - sh / 2 + 4) + '" width="' + f(sw - 8) + '" height="' + f(sh - 8) + '" rx="' + f(pw * 0.08) + '" fill="none" stroke="rgba(228,188,98,.2)" stroke-width="1"/>';
    // 楕円の左右にマーク
    const mk = fs * 1.05;
    s += '<g fill="url(#dfg-foil)" opacity=".5">' +
      A.pip('S', cx - rx, cy - mk * 0.62, mk) + A.pip('H', cx - rx, cy + mk * 0.62, mk) +
      A.pip('D', cx + rx, cy - mk * 0.62, mk) + A.pip('C', cx + rx, cy + mk * 0.62, mk) + '</g>';
    // 有効なローカルルール名を金文字で印刷（席の下に隠れない場所に）
    const names = PRINT_RULES.filter((k) => S.rules[k]).map((k) => D.Rules.BY_KEY[k].label);
    const font = 'font-family="\'Shippori Mincho B1\',\'Hiragino Mincho ProN\',\'Yu Mincho\',serif" font-weight="700"';
    const charW = fs * 1.08;
    const lobeW = rx - sw / 2 - fs * 2.2;
    let bottomUsed = cy + ry;
    if (names.length && lobeW >= 110) {
      // 楕円の左右のふくらみに、中央ぞろえの数行
      const perLine = Math.max(3, Math.floor(lobeW / charW));
      const lines = [];
      let cur = '';
      for (const nm of names) {
        const next = cur ? cur + '・' + nm : nm;
        if (next.length > perLine && cur) { lines.push(cur); cur = nm; } else cur = next;
        if (lines.length >= 6) break;
      }
      if (cur && lines.length < 6) lines.push(cur);
      const half = Math.ceil(lines.length / 2);
      const maxLines = Math.max(1, Math.floor(ry / (fs * 1.6)));
      [lines.slice(0, Math.min(half, maxLines)), lines.slice(half, half + maxLines)].forEach((group, side) => {
        if (!group.length) return;
        const lx = cx + (side ? 1 : -1) * (sw / 2 + fs * 1.1 + lobeW / 2);
        const y0 = cy - ((group.length - 1) * fs * 1.6) / 2 + fs * 0.35;
        group.forEach((ln, i) => {
          s += '<text x="' + f(lx) + '" y="' + f(y0 + i * fs * 1.6) + '" text-anchor="middle" ' + font + ' font-size="' + f(fs) + '" letter-spacing="' + f(fs * 0.08) +
            '" fill="url(#dfg-foil)" opacity=".5">' + esc(ln) + '</text>';
        });
      });
    } else if (names.length) {
      // 狭い画面：楕円の下の弧に沿って
      const ax = rx + fs * 0.9, ay = ry + fs * 1.3;
      if (cy + ay + fs * 0.4 < h - 2) {
        const t1 = (208 * Math.PI) / 180, t2 = (332 * Math.PI) / 180;
        const arcLen = ellipsePerimeter(ax, ay) * (124 / 360);
        let text = '';
        for (const nm of names) {
          const next = text ? text + ' ◆ ' + nm : nm;
          if (next.length * charW > arcLen * 0.95) break;
          text = next;
        }
        s += '<path id="dfg-arc" d="M' + f(cx + ax * Math.cos(t1)) + ' ' + f(cy - ay * Math.sin(t1)) + ' A' + f(ax) + ' ' + f(ay) + ' 0 0 0 ' +
          f(cx + ax * Math.cos(t2)) + ' ' + f(cy - ay * Math.sin(t2)) + '" fill="none"/>' +
          '<text ' + font + ' font-size="' + f(fs) + '" letter-spacing="' + f(fs * 0.08) + '" fill="url(#dfg-foil)" opacity=".5">' +
          '<textPath href="#dfg-arc" xlink:href="#dfg-arc" startOffset="50%" text-anchor="middle">' + esc(text) + '</textPath></text>';
        bottomUsed = cy + ay + fs * 0.4;
      }
    }
    // 下にロゴ
    const lf = fs * 1.9;
    const ly = bottomUsed + lf * 1.3;
    if (ly + 4 < h) {
      s += '<text x="' + f(cx + lf * 0.45) + '" y="' + f(ly) + '" text-anchor="middle" font-family="\'Shippori Mincho B1\',\'Hiragino Mincho ProN\',\'Yu Mincho\',serif" font-weight="800" font-size="' +
        f(lf) + '" letter-spacing="' + f(lf * 0.9) + '" fill="url(#dfg-foil)" opacity=".36">大富豪</text>';
    }
    host.innerHTML = s + '</svg>';
  }
  const RULE_KEYS = D.Rules.RULES.map((r) => r.key);

  function renderSeats() {
    const S = UI.S, vm = UI.vm;
    if (!S || !vm) return;
    const box = $('seats');
    const rect = $('table').getBoundingClientRect();
    const w = rect.width || 1, h = rect.height || 1;
    const alive = new Set();
    const order = [];
    for (let i = 1; i < S.n; i++) {
      const seat = (UI.human + i) % S.n;
      alive.add(String(seat));
      let el = UI.seatEls[seat];
      if (!el) {
        el = document.createElement('div');
        el.className = 'seat';
        el.dataset.seat = seat;
        el.innerHTML = '<div class="ava"><span class="face"></span><div class="think"><i></i><i></i><i></i></div></div>' +
          '<div class="info"><div class="plate"><span class="nmrow"><span class="name"></span><span class="scw"></span></span><span class="cnt"></span></div><div class="fan"></div></div>';
        box.appendChild(el);
        UI.seatEls[seat] = el;
      }
      // オンライン対戦では人の席は人のアイコン、AIはロボット
      const info = UI.seatInfo && UI.seatInfo[seat];
      const kind = info && info.type === 'human' ? 'human' : 'ai:' + (info ? info.robot : seat - 1);
      if (el.dataset.kind !== kind) {
        el.dataset.kind = kind;
        el.querySelector('.face').innerHTML = kind === 'human' ? A.personSVG(seat) : A.robotSVG(info ? info.robot : seat - 1);
      }
      el.classList.toggle('away', !!(info && info.type === 'human' && !info.connected));
      order.push(el);
      const P = S.players[seat];
      const count = vm.hands[seat].length;
      el.querySelector('.name').textContent = P.name;
      el.querySelector('.scw').innerHTML = scoreTag(seat);
      const cnt = el.querySelector('.cnt');
      const tc = titleChip(seat);
      cnt.innerHTML = (vm.out[seat] ? '' : '<span class="mini" style="background-image:' + UI.backURI + '"></span>' + count) + (tc ? ' ' + tc : '');
      const fan = el.querySelector('.fan');
      const show = vm.out[seat] ? 0 : Math.min(count, 9);
      if (fan.childElementCount !== show || fan.dataset.back !== UI.backURI.length + '') {
        fan.dataset.back = UI.backURI.length + '';
        let html = '';
        for (let j = 0; j < show; j++) {
          const t = j - (show - 1) / 2;
          html += '<i style="background-image:' + UI.backURI + ';transform:translateX(calc(-50% + ' + (t * 5) + 'px)) rotate(' + (t * 8) + 'deg)"></i>';
        }
        fan.innerHTML = html;
      }
      el.classList.toggle('turn', vm.turn === seat);
      el.classList.toggle('out', !!vm.out[seat]);
      let medal = el.querySelector('.medal');
      const place = vm.places[seat];
      if (vm.out[seat]) {
        if (!medal) { medal = document.createElement('div'); el.querySelector('.ava').appendChild(medal); }
        medal.className = 'medal' + (vm.foul[seat] ? ' foul' : '');
        medal.textContent = vm.foul[seat] ? '反則' : place ? place : '落';
      } else if (medal) medal.remove();
    }
    for (const k of Object.keys(UI.seatEls)) {
      if (!alive.has(k)) { UI.seatEls[k].remove(); delete UI.seatEls[k]; }
    }
    // 席の大きさを測ってから配置する
    const half = order.length ? order[0].offsetHeight / 2 : 45;
    const { w: pw, h: ph } = cardSize('pile');
    const { pos, narrow, pileY } = seatPositions(S.n, w, h, half, ph);
    const spacing = narrow && order.length > 1 ? (0.74 * w) / (order.length - 1) : Infinity;
    order.forEach((el, i) => {
      el.style.left = Math.round(pos[i][0]) + 'px';
      el.style.top = Math.round(pos[i][1]) + 'px';
      el.style.width = spacing < 80 ? Math.floor(spacing - 2) + 'px' : '';
    });
    $('table').style.setProperty('--pile-y', Math.round(pileY) + 'px');
    renderFeltPrint(w, h, pileY, pw, ph, narrow);
  }

  function seatAnchor(seat) {
    if (seat === UI.human) {
      const r = $('hand').getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }
    const el = UI.seatEls[seat];
    if (!el) return { x: innerWidth / 2, y: 60 };
    const r = el.querySelector('.ava').getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }
  function rectAt(pt, w, h) { return { left: pt.x - w / 2, top: pt.y - h / 2, width: w, height: h }; }

  function renderMe() {
    const S = UI.S, vm = UI.vm;
    const me = $('me');
    const myTurn = vm.turn === UI.human;
    me.classList.toggle('turn', myTurn);
    const tc = titleChip(UI.human);
    const status = vm.out[UI.human]
      ? (vm.foul[UI.human] ? '<span class="yourturn">反則上がり</span>'
        : '<span class="yourturn">' + (vm.places[UI.human] || '') + (vm.places[UI.human] === S.n ? '位' : '位で上がり') + '</span>')
      : '';
    $('me-id').innerHTML = '<span class="ava">' + A.humanSVG() + '</span><span class="nm">' + esc(S.players[UI.human].name) + '</span>' + scoreTag(UI.human) + tc + status;
  }

  function renderHand() {
    if (!UI.vm) return;
    const box = $('hand');
    const hand = UI.vm.hands[UI.human];
    const sorted = C.sortHand(hand, UI.vm.rev);
    for (const [id, el] of UI.handEls) {
      if (!hand.includes(id)) { el.remove(); UI.handEls.delete(id); UI.sel.delete(id); }
    }
    const W = box.clientWidth || 320;
    const { w: cw, h: ch } = cardSize('hand');
    const n = sorted.length;
    let rows = 1;
    let step = n > 1 ? Math.min(cw * 0.64, (W - cw) / (n - 1)) : 0;
    if (n > 1 && step < Math.max(20, cw * 0.34)) rows = 2;
    box.classList.toggle('two', rows === 2);
    const perRow = rows === 2 ? Math.ceil(n / 2) : n;
    if (rows === 2) step = perRow > 1 ? Math.min(cw * 0.64, (W - cw) / (perRow - 1)) : 0;
    const fan = rows === 1 && W >= 640;
    box.classList.toggle('locked', !UI.selectable);
    sorted.forEach((id, i) => {
      let el = UI.handEls.get(id);
      if (!el) {
        el = makeCardEl(id);
        el.setAttribute('role', 'button');
        el.tabIndex = 0;
        el.addEventListener('click', onCardTap);
        el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onCardTap(e); } });
        box.appendChild(el);
        UI.handEls.set(id, el);
      }
      const row = rows === 2 && i >= perRow ? 1 : 0;
      const j = row ? i - perRow : i;
      const cnt = row ? n - perRow : perRow;
      const rowW = cw + (cnt - 1) * step;
      const x = (W - rowW) / 2 + j * step;
      let y = row * ch * 0.55;
      let rot = 0;
      if (fan) {
        const t = j - (cnt - 1) / 2;
        rot = t * 1.15;
        y += t * t * 0.32;
      }
      const selected = UI.sel.has(id);
      if (selected) y -= 22;
      el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(' + rot.toFixed(2) + 'deg)';
      el.style.zIndex = String(i + 1);
      el.classList.toggle('sel', selected);
      el.setAttribute('aria-pressed', selected ? 'true' : 'false');
      el.classList.toggle('dim', !!(UI.dimSet && !UI.dimSet.has(id)));
      el.classList.toggle('hint', !!(UI.hintSet && UI.hintSet.has(id)));
    });
  }

  function onCardTap(e) {
    const id = e.currentTarget.dataset.id;
    if (!UI.selectable) return;
    UI.hintSet = null;
    if (UI.sel.has(id)) UI.sel.delete(id);
    else {
      if (UI.selMax && UI.sel.size >= UI.selMax) {
        if (UI.selMax === 1) UI.sel.clear();
        else { toast(UI.selMax + '枚までえらべます'); SND.play('error'); return; }
      }
      UI.sel.add(id);
    }
    SND.play('select');
    renderHand();
    if (UI.onSelChange) UI.onSelChange();
  }

  // ─────────────────────────────────────────────
  // 場
  // ─────────────────────────────────────────────
  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  function renderPile(hideTop) {
    const box = $('pile');
    box.innerHTML = '';
    const entries = UI.vm.pile.slice(-3);
    if (!entries.length) { box.innerHTML = '<div class="pile-empty"></div>'; return; }
    const { w: pw, h: ph } = cardSize('pile');
    entries.forEach((e, idx) => {
      const depth = entries.length - 1 - idx;
      const g = document.createElement('div');
      g.className = 'pile-entry' + (depth ? ' old' : ' top');
      const n = e.cards.length;
      const step = pw * (n > 5 ? 0.3 : n > 3 ? 0.38 : 0.46);
      const width = pw + Math.max(0, n - 1) * step;
      const hsh = hashStr(e.key || e.cards.join(''));
      const rot = depth ? ((hsh % 9) - 4) * 2.2 : 0;
      const dx = depth ? (((hsh >> 4) % 13) - 6) * 3 : 0;
      g.style.width = width + 'px';
      g.style.height = ph + 'px';
      g.style.transform = 'translate(calc(-50% + ' + (dx - depth * 10) + 'px), calc(-50% - ' + depth * 9 + 'px)) rotate(' + rot + 'deg) scale(' + (1 - depth * 0.06) + ')';
      g.style.zIndex = String(idx + 1);
      e.cards.forEach((id, j) => {
        const c = makeCardEl(id);
        c.style.left = j * step + 'px';
        g.appendChild(c);
      });
      if (hideTop && depth === 0) g.style.visibility = 'hidden';
      box.appendChild(g);
    });
  }

  function chip(html, cls) { return '<span class="chip ' + (cls || '') + '">' + html + '</span>'; }
  function suitsHTML(suits) { return suits.map((s) => A.suitIcon(s, 12)).join(''); }

  function renderStatus() {
    const vm = UI.vm, S = UI.S;
    const out = [];
    if (vm.rev) out.push(chip(A.icon('crown', 13) + '革命中', 'revo'));
    if (vm.jback) out.push(chip('Jバック中', 'jback'));
    if (vm.lock.suits && vm.lock.number) out.push(chip(A.icon('lock', 12) + suitsHTML(vm.lock.suits) + ' 激縛り', 'lock'));
    else {
      if (vm.lock.suits) out.push(chip(A.icon('lock', 12) + suitsHTML(vm.lock.suits) + ' 縛り', 'lock'));
      if (vm.lock.number) out.push(chip(A.icon('lock', 12) + '階段縛り', 'lock'));
    }
    if (vm.lock.partial) out.push(chip(A.icon('lock', 12) + suitsHTML(vm.lock.partial) + ' 片縛り', 'lock'));
    if (vm.constraint) out.push(chip('次は ' + C.rankLabel(vm.constraint.rank) + ' だけ', 'lock'));
    if (S.rules.nineReverse || vm.dir !== 1) out.push(chip(A.icon(vm.dir === 1 ? 'cw' : 'ccw', 14), 'dir'));
    if (vm.turn !== null && vm.turn !== undefined && S.phase === 'play') {
      out.push(chip(vm.turn === UI.human ? 'あなたの番' : esc(S.players[vm.turn].name) + 'の番', 'turnchip'));
    }
    $('status').innerHTML = out.join('');
    document.querySelector('.game').classList.toggle('is-revo', !!vm.rev);
  }

  function renderHud() {
    const S = UI.S;
    const sub = [];
    if (S.rated) sub.push('<span class="rated-tag">レート戦</span>');
    if (UI.roomCode) sub.push('部屋 ' + esc(UI.roomCode));
    $('g-gameno').innerHTML = '第' + S.gameNo + (S.maxGames ? '<span class="of">/' + S.maxGames + '</span>' : '') + 'ゲーム' +
      (sub.length ? '<small>' + sub.join(' ') + '</small>' : '');
  }

  /** 画面の広さに合わせて、手札と場のカードをできるだけ大きくする */
  function fitCards() {
    const g = $('scr-game');
    if (!g || g.hidden) return;
    const cs = getComputedStyle(g);
    const W = g.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const H = g.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    if (W <= 0 || H <= 0) return;
    const wideSeats = matchMedia('(min-width: 900px) and (min-height: 560px)').matches;
    const narrow = W / H < 1.05;
    const handW = W - 16;
    let cw;
    if (narrow) {
      // 縦長：手札は2段。自分の欄 ≒ 2.17cw+122、テーブル ≒ 1.4cw+260
      cw = Math.min(handW / 4.1, (H - 382) / 3.57);
    } else {
      // 横長：手札は1段。席の高さ（横並びなら低い）＋場のカード＋状態表示
      const seatH = wideSeats ? 76 : 96;
      const fixed = 126 + 8 + seatH + 10 + 30 + 36 + 26;
      cw = Math.min(handW / 6.4, (H - fixed) / (1.4 + 1.4 * 0.9));
    }
    cw = Math.max(52, Math.min(150, Math.floor(cw)));
    const pw = Math.max(48, narrow ? cw : Math.floor(cw * 0.9));
    const root = document.documentElement.style;
    if (root.getPropertyValue('--cw') !== cw + 'px') root.setProperty('--cw', cw + 'px');
    if (root.getPropertyValue('--pw') !== pw + 'px') root.setProperty('--pw', pw + 'px');
  }

  function renderAll() {
    if (!UI.S || !UI.vm) return;
    fitCards();
    renderHud();
    renderSeats();
    renderPile(false);
    renderStatus();
    renderMe();
    renderHand();
  }

  // ─────────────────────────────────────────────
  // 演出
