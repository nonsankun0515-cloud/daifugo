  function fly(items, dur) {
    const fx = $('fx');
    const d = Math.max(60, dur * UI.speed);
    return Promise.all(items.map((it) => {
      const el = document.createElement('div');
      el.className = it.back ? 'fly back' : 'fly';
      if (it.back) el.style.backgroundImage = UI.backURI;
      else el.innerHTML = A.faceSVG(it.id);
      el.style.width = it.to.width + 'px';
      el.style.height = it.to.height + 'px';
      el.style.transformOrigin = '50% 50%';
      fx.appendChild(el);
      const s0 = it.from.width / it.to.width;
      const c0x = it.from.left + it.from.width / 2 - it.to.width / 2, c0y = it.from.top + it.from.height / 2 - it.to.height / 2;
      const k0 = 'translate(' + c0x + 'px,' + c0y + 'px) rotate(' + (it.r0 || 0) + 'deg) scale(' + s0 + ')';
      const k1 = 'translate(' + it.to.left + 'px,' + it.to.top + 'px) rotate(' + (it.r1 || 0) + 'deg) scale(' + (it.s1 || 1) + ')';
      const a = el.animate([{ transform: k0, opacity: it.o0 == null ? 1 : it.o0 }, { transform: k1, opacity: it.o1 == null ? 1 : it.o1 }],
        { duration: d, delay: (it.delay || 0) * UI.speed, easing: 'cubic-bezier(.2,.75,.25,1)', fill: 'both' });
      return a.finished.catch(() => {}).then(() => el.remove());
    }));
  }

  function banner(text, variant, sub, hold) {
    const b = document.createElement('div');
    b.className = 'banner ' + (variant || '');
    b.innerHTML = '<div class="big">' + esc(text) + '</div>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '');
    $('fx').appendChild(b);
    const a = b.animate([
      { opacity: 0, transform: 'translate(-50%,-50%) scale(1.45)' },
      { opacity: 1, transform: 'translate(-50%,-50%) scale(1)', offset: 0.16 },
      { opacity: 1, transform: 'translate(-50%,-50%) scale(1)', offset: 0.82 },
      { opacity: 0, transform: 'translate(-50%,-50%) scale(0.97)' },
    ], { duration: (hold || 1150) * UI.speed, easing: 'ease-out', fill: 'both' });
    return a.finished.catch(() => {}).then(() => b.remove());
  }

  function flash(color, dur) {
    const f = document.createElement('div');
    f.className = 'flash';
    f.style.background = color;
    $('fx').appendChild(f);
    return f.animate([{ opacity: 0.85 }, { opacity: 0 }], { duration: (dur || 600) * UI.speed, easing: 'ease-out', fill: 'both' })
      .finished.catch(() => {}).then(() => f.remove());
  }

  function shake() {
    const g = $('scr-game');
    g.classList.remove('shake');
    void g.offsetWidth;
    g.classList.add('shake');
    setTimeout(() => g.classList.remove('shake'), 600);
  }

  function sandstorm() {
    const fx = $('fx');
    const n = 46;
    const jobs = [];
    for (let i = 0; i < n; i++) {
      const g = document.createElement('div');
      g.className = 'sand-grain';
      const y = Math.random() * innerHeight;
      const s = 2 + Math.random() * 4;
      g.style.width = g.style.height = s + 'px';
      fx.appendChild(g);
      const a = g.animate([
        { transform: 'translate(-20px,' + y + 'px)', opacity: 0 },
        { opacity: 0.9, offset: 0.2 },
        { transform: 'translate(' + (innerWidth + 20) + 'px,' + (y + (Math.random() - 0.5) * 120) + 'px)', opacity: 0 },
      ], { duration: (700 + Math.random() * 600) * UI.speed, delay: Math.random() * 350 * UI.speed, easing: 'ease-in', fill: 'both' });
      jobs.push(a.finished.catch(() => {}).then(() => g.remove()));
    }
    return Promise.all(jobs);
  }

  function bubble(seat, text, alert, kind) {
    const host = seat === UI.human ? $('me-id') : UI.seatEls[seat];
    if (!host) return;
    // チャットの吹き出しは 'talk'（チャット欄の .chat と名前がぶつからないように）
    if (kind === 'chat') { const old = host.querySelector(':scope > .bubble.talk'); if (old) old.remove(); }
    const b = document.createElement('div');
    b.className = 'bubble' + (alert ? ' alert' : '') + (kind === 'chat' ? ' talk' : '');
    b.textContent = text;
    if (seat === UI.human) { b.style.left = '40px'; b.style.top = '-6px'; }
    host.appendChild(b);
    setTimeout(() => b.remove(), (kind === 'chat' ? 3500 : 1400) * UI.speed + 100);
  }

  /** 任意の要素の上に吹き出しを出す（七並べ・スピードの席でも使う） */
  function bubbleAt(host, text, alert, kind) {
    if (!host) return;
    if (kind === 'chat') { const old = host.querySelector(':scope > .bubble.talk'); if (old) old.remove(); }
    const b = document.createElement('div');
    b.className = 'bubble' + (alert ? ' alert' : '') + (kind === 'chat' ? ' talk' : '');
    b.textContent = text;
    host.appendChild(b);
    setTimeout(() => b.remove(), (kind === 'chat' ? 3500 : 1400) * UI.speed + 100);
  }

  let toastTimer = 0;
  function toast(text, ms) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms || 2200);
  }

  function setThinking(seat, on) {
    const el = UI.seatEls[seat];
    if (el) el.classList.toggle('thinking', !!on);
  }

  // ─────────────────────────────────────────────
  // イベントの再生
  // ─────────────────────────────────────────────
  function removeFrom(arr, cards) {
    for (const id of cards) {
      let i = arr.indexOf(id);
      if (i < 0) i = arr.indexOf('?'); // オンラインで伏せられた他人の手札
      if (i >= 0) arr.splice(i, 1);
    }
  }

  function handRects(cards) {
    return cards.map((id) => { const el = UI.handEls.get(id); return el ? el.getBoundingClientRect() : null; });
  }

  function seatRects(seat, k, w, h) {
    const p = seatAnchor(seat);
    return Array.from({ length: k }, () => rectAt(p, w * 0.45, h * 0.45));
  }

  async function animPlay(seat, cards, extra) {
    const vm = UI.vm;
    const { w: pw, h: ph } = cardSize('pile');
    const from = seat === UI.human ? handRects(cards) : seatRects(seat, cards.length, pw, ph);
    removeFrom(vm.hands[seat], cards);
    vm.pile.push(Object.assign({ seat, cards: cards.slice(), key: seat + ':' + cards.join('') + ':' + vm.pile.length }, extra || {}));
    renderHand();
    renderSeats();
    renderPile(true);
    const tops = Array.from(document.querySelectorAll('#pile .pile-entry.top .card')).map((e) => e.getBoundingClientRect());
    SND.play('card', cards.length);
    const fallback = rectAt(seatAnchor(seat), pw * 0.45, ph * 0.45);
    await fly(cards.map((id, i) => ({ id, from: from[i] || fallback, to: tops[i], delay: i * 45, r0: seat === UI.human ? 0 : -14 })), 400);
    renderPile(false);
  }

  async function animFlow() {
    const els = Array.from(document.querySelectorAll('#pile .pile-entry'));
    if (els.length) {
      SND.play('flow');
      await Promise.all(els.map((el) => el.animate(
        [{ opacity: 1, transform: el.style.transform }, { opacity: 0, transform: el.style.transform + ' translateX(34vw) rotate(24deg)' }],
        { duration: 420 * UI.speed, easing: 'cubic-bezier(.5,0,.8,.4)', fill: 'forwards' }).finished.catch(() => {})));
    }
    const vm = UI.vm;
    vm.pile = [];
    vm.lock = { suits: null, partial: null, number: false };
    vm.constraint = null;
    vm.jback = false;
    renderPile(false);
    renderStatus();
  }

  async function animTransfer(from, to, cards, faceUp) {
    const { w, h } = cardSize('pile');
    const vm = UI.vm;
    const src = from === UI.human ? handRects(cards) : seatRects(from, cards.length, w, h);
    removeFrom(vm.hands[from], cards);
    renderHand(); renderSeats();
    const dst = rectAt(seatAnchor(to), w * 0.6, h * 0.6);
    if (cards.length) {
      await fly(cards.map((id, i) => ({ id, back: !faceUp, from: src[i] || rectAt(seatAnchor(from), w * 0.45, h * 0.45), to: dst, delay: i * 70, o1: 0.9 })), 520);
    }
    vm.hands[to] = vm.hands[to].concat(cards);
    renderHand(); renderSeats();
  }

  async function animDiscard(seat, cards) {
    const { w, h } = cardSize('pile');
    const vm = UI.vm;
    const src = seat === UI.human ? handRects(cards) : seatRects(seat, cards.length, w, h);
    removeFrom(vm.hands[seat], cards);
    renderHand(); renderSeats();
    const c = $('pile').getBoundingClientRect();
    const dst = { left: c.right - w * 0.4, top: c.top + c.height / 2 - h / 2, width: w, height: h };
    await fly(cards.map((id, i) => ({ id, from: src[i] || rectAt(seatAnchor(seat), w * 0.45, h * 0.45), to: dst, delay: i * 60, o1: 0, r1: 20 })), 560);
  }

  const FLOW_NAMES = { '8': '8切り', '66': 'ろくろ首', '99': '救急車' };
  const STOP_NAMES = { four: '4止め', three: '3止め', sand: '砂嵐' };
  const LOCK_NAMES = { suit: '縛り', partial: '片縛り', number: '階段縛り', geki: '激縛り' };
  const REVO_NAMES = { normal: '革命', seq: '階段革命', coup: 'クーデター', omen: 'オーメン', great: '大革命' };

  function logLine(text, cls) {
    UI.logLines.push({ text, cls: cls || '' });
    if (UI.logLines.length > 400) UI.logLines.splice(0, UI.logLines.length - 400);
    const ol = $('log-list');
    if (ol && !$('log').hidden) {
      const li = document.createElement('li');
      li.className = cls || '';
      li.textContent = text;
      ol.appendChild(li);
      ol.scrollTop = ol.scrollHeight;
    }
  }
  function renderLog() {
    const ol = $('log-list');
    ol.innerHTML = UI.logLines.map((l) => '<li class="' + l.cls + '">' + esc(l.text) + '</li>').join('');
    ol.scrollTop = ol.scrollHeight;
  }

  /** 状態に合わせたうえで、同じ束の後ろにあるカード交換を巻き戻す（交換アニメーションで二重に動かさないため） */
  function syncBefore(evs, i) {
    syncVM();
    const vm = UI.vm;
    for (let j = evs.length - 1; j > i; j--) {
      const e = evs[j];
      if (e.t === 'exchange') {
        removeFrom(vm.hands[e.to], e.cards);
        vm.hands[e.from] = vm.hands[e.from].concat(e.cards);
      }
    }
    vm.turn = null;
  }

  async function playEvents(evs) {
    const S = UI.S;
    let vm = UI.vm;
    for (let i = 0; i < evs.length; i++) {
      const ev = evs[i];
      switch (ev.t) {
        case 'deal': {
          syncBefore(evs, i);
          vm = UI.vm;
          logLine('第' + S.gameNo + 'ゲーム', 'game');
          renderAll();
          await animDeal();
          break;
        }
        case 'start': {
          vm.turn = ev.leader;
          logLine(nameOf(ev.leader) + ' から始めます', 'sys');
          renderAll();
          break;
        }
        case 'play': {
          vm.constraint = null;
          vm.turn = null;
          renderStatus();
          await animPlay(ev.seat, ev.play.cards);
          logLine(nameOf(ev.seat) + '：' + E.describePlay(ev.play));
          break;
        }
        case 'pass': {
          SND.play('pass');
          bubble(ev.seat, 'パス');
          logLine(nameOf(ev.seat) + '：パス');
          await sleep(260 * UI.speed);
          break;
        }
        case 'flow': {
          await animFlow();
          logLine('— 場が流れた —', 'flow');
          vm.turn = ev.leader;
          renderStatus();
          renderSeats();
          renderMe();
          break;
        }
        case 'revolution': {
          vm.rev = ev.on;
          SND.play('revolution');
          shake();
          flash('radial-gradient(circle, rgba(255,120,140,.75), rgba(120,0,20,0) 70%)', 900);
          renderStatus();
          const nm = REVO_NAMES[ev.kind] || '革命';
          await banner(ev.on ? nm : nm === '革命' ? '革命返し' : nm, 'revo', ev.on ? '強さが逆転！' : '強さが元に戻った', 1400);
          logLine('★ ' + nameOf(ev.seat) + ' の' + (ev.on ? nm : '革命返し'), 'sys');
          renderHand();
          break;
        }
        case 'jback': {
          vm.jback = ev.on;
          SND.play('special');
          renderStatus();
          await banner(ev.by === 'J' ? 'Jバック' : '2バック', 'cool', ev.on ? '場が流れるまで強さが逆転' : '強さが元に戻った');
          logLine('★ ' + (ev.by === 'J' ? 'Jバック' : '2バック'), 'sys');
          break;
        }
        case 'cut': {
          SND.play('cut');
          await banner(FLOW_NAMES[ev.kind], '', '場が流れる', 950);
          logLine('★ ' + FLOW_NAMES[ev.kind], 'sys');
          break;
        }
        case 'sand': {
          SND.play('cut');
          sandstorm();
          await banner('砂嵐', '', '最強の役！場が流れる', 1200);
          logLine('★ 砂嵐', 'sys');
          break;
        }
        case 'spade3': {
          SND.play('cut');
          await banner('スペ3返し', '', 'ジョーカーを破った！', 1100);
          logLine('★ スペ3返し', 'sys');
          break;
        }
        case 'stop': {
          SND.play('special');
          await animPlay(ev.seat, ev.play.cards, { stop: ev.kind });
          if (ev.kind === 'sand') sandstorm();
          await banner(STOP_NAMES[ev.kind], ev.kind === 'sand' ? '' : 'cool', nameOf(ev.seat) + 'が止めた！', 1150);
          logLine('★ ' + nameOf(ev.seat) + ' の' + STOP_NAMES[ev.kind] + '（' + nameOf(ev.against) + 'の効果を止めた）', 'sys');
          break;
        }
        case 'skip': {
          SND.play('special');
          for (const s of ev.seats) bubble(s, 'スキップ', true);
          await banner('スキップ', 'cool', ev.seats.map(nameOf).join('・') + ' を飛ばす', 950);
          logLine('★ スキップ：' + ev.seats.map(nameOf).join('・'), 'sys');
          break;
        }
        case 'give': {
          const involved = ev.from === UI.human || ev.to === UI.human;
          if (ev.cards.length) {
            banner(ev.label, 'cool', nameOf(ev.from) + ' → ' + nameOf(ev.to) + '（' + ev.cards.length + '枚）', 1000);
            await animTransfer(ev.from, ev.to, ev.cards, involved);
            if (ev.to === UI.human) toast(ev.label + 'で受け取った：' + ev.cards.map(C.cardLabel).join(' '));
          }
          logLine(nameOf(ev.from) + '：' + ev.label + ' ' + ev.cards.length + '枚' + (involved && ev.cards.length ? '（' + ev.cards.map(C.cardLabel).join(' ') + '）' : ''), 'sys');
          break;
        }
        case 'discard': {
          if (ev.cards.length) {
            banner('10捨て', 'cool', nameOf(ev.seat) + 'が' + ev.cards.length + '枚捨てた', 1000);
            await animDiscard(ev.seat, ev.cards);
          }
          logLine(nameOf(ev.seat) + '：10捨て ' + ev.cards.map(C.cardLabel).join(' '), 'sys');
          break;
        }
        case 'bomb': {
          if (!ev.ranks.length) {
            logLine('★ 12ボンバー：' + nameOf(ev.seat) + (ev.none ? 'の手札に指名できる数字がない' : 'は指名しなかった'), 'sys');
            break;
          }
          SND.play('bomb');
          flash('radial-gradient(circle, rgba(255,240,200,.9), rgba(255,160,60,0) 70%)', 700);
          shake();
          await banner('12ボンバー', '', ev.ranks.map((r) => C.rankLabel(r)).join('・') + ' を全員捨てる', 1200);
          const jobs = [];
          for (const s of Object.keys(ev.removed)) jobs.push(animDiscard(+s, ev.removed[s]));
          await Promise.all(jobs);
          logLine('★ 12ボンバー：' + ev.ranks.map((r) => C.rankLabel(r)).join('・') + '（' +
            (Object.keys(ev.removed).map((s) => nameOf(+s) + ev.removed[s].length + '枚').join('、') || 'だれも持っていなかった') + '）', 'sys');
          break;
        }
        case 'pickup': {
          if (ev.cards.length) {
            const idx = vm.pile.length - 2;
            const { w, h } = cardSize('pile');
            const entryEl = document.querySelectorAll('#pile .pile-entry')[Math.max(0, document.querySelectorAll('#pile .pile-entry').length - 2)];
            const src = entryEl ? entryEl.getBoundingClientRect() : $('pile').getBoundingClientRect();
            if (idx >= 0) vm.pile[idx].cards = vm.pile[idx].cards.filter((id) => !ev.cards.includes(id));
            renderPile(false);
            banner('A拾い', 'cool', nameOf(ev.seat) + 'が' + ev.cards.length + '枚拾った', 1000);
            await fly(ev.cards.map((id, i) => ({ id, from: { left: src.left, top: src.top, width: w, height: h }, to: rectAt(seatAnchor(ev.seat), w * 0.6, h * 0.6), delay: i * 70, o1: 0.8 })), 520);
            vm.hands[ev.seat] = vm.hands[ev.seat].concat(ev.cards);
            renderHand(); renderSeats();
          }
          logLine(nameOf(ev.seat) + '：A拾い ' + (ev.cards.length ? ev.cards.map(C.cardLabel).join(' ') : 'なし'), 'sys');
          break;
        }
        case 'reverse': {
          vm.dir = ev.dir;
          SND.play('special');
          renderStatus();
          await banner('リバース', 'cool', '順番が逆回りに', 900);
          logLine('★ 9リバース', 'sys');
          break;
        }
        case 'lock': {
          vm.lock = ev.lock;
          SND.play('special');
          renderStatus();
          const suits = ev.lock.suits || ev.lock.partial || [];
          const sym = suits.map((s) => C.SUIT_SYM[s]).join('');
          const sub = ev.kind === 'number' ? '次も1つ上の数字だけ' : ev.kind === 'geki' ? sym + ' の1つ上の数字だけ' : ev.kind === 'partial' ? sym + ' を含めて出す' : sym + ' しか出せない';
          await banner(LOCK_NAMES[ev.kind], 'small', sub, 900);
          logLine('★ ' + LOCK_NAMES[ev.kind] + '（' + sub + '）', 'sys');
          break;
        }
        case 'constraint': {
          vm.constraint = { rank: ev.rank, from: ev.from };
          renderStatus();
          bubble(S.lastSeat == null ? UI.human : S.lastSeat, '次は' + C.rankLabel(ev.rank) + 'だけ', true);
          logLine('★ ' + C.rankLabel(ev.from) + '→' + C.rankLabel(ev.rank) + '：次は ' + C.rankLabel(ev.rank) + ' だけ', 'sys');
          break;
        }
        case 'finish': {
          vm.out[ev.seat] = true;
          vm.places[ev.seat] = ev.place;
          vm.hands[ev.seat] = [];
          renderSeats(); renderMe();
          SND.play(ev.seat === UI.human && ev.place === 1 ? 'fanfare' : 'finish');
          await banner(ev.seat === UI.human ? (ev.place === 1 ? '一番上がり！' : ev.place + '位で上がり') : '上がり',
            ev.seat === UI.human ? '' : 'small', nameOf(ev.seat) + '（' + ev.place + '位）', 1100);
          logLine('◆ ' + nameOf(ev.seat) + ' 上がり（' + ev.place + '位）', 'sys');
          break;
        }
        case 'foul': {
          vm.out[ev.seat] = true;
          vm.foul[ev.seat] = true;
          vm.hands[ev.seat] = [];
          renderSeats(); renderMe();
          SND.play('foul');
          await banner('反則上がり', 'foul', nameOf(ev.seat) + 'は最下位', 1300);
          logLine('◆ ' + nameOf(ev.seat) + ' 反則上がり（最下位）', 'sys');
          break;
        }
        case 'miyako': {
          vm.out[ev.seat] = true;
          vm.hands[ev.seat] = [];
          renderSeats(); renderMe();
          SND.play('foul');
          await banner('都落ち', 'foul', nameOf(ev.seat) + 'は大貧民に', 1400);
          logLine('◆ 都落ち：' + nameOf(ev.seat) + ' は大貧民', 'sys');
          break;
        }
        case 'gekokujo': {
          SND.play('revolution');
          shake();
          await banner('下剋上', 'revo', nameOf(ev.seat) + 'が一番上がり！身分が全部ひっくり返る', 1700);
          logLine('◆ 下剋上！', 'sys');
          break;
        }
        case 'tenpen': {
          SND.play('revolution');
          await banner('天変地異', 'revo', nameOf(ev.seat) + 'と' + nameOf(ev.with) + 'の手札が入れ替わる', 1600);
          syncBefore(evs, i);
          vm = UI.vm;
          renderAll();
          logLine('◆ 天変地異：' + nameOf(ev.seat) + ' ⇔ ' + nameOf(ev.with), 'sys');
          break;
        }
        case 'greatRevolution': {
          vm.hands[ev.seat] = [];
          SND.play('fanfare');
          await banner('大革命', 'revo', nameOf(ev.seat) + 'はそのまま上がり', 1500);
          logLine('◆ 大革命：' + nameOf(ev.seat), 'sys');
          break;
        }
        case 'lucky': {
          vm.hands[ev.seat] = [];
          SND.play('fanfare');
          await banner('ラッキーセブン', '', nameOf(ev.seat) + 'はそのまま上がり', 1400);
          logLine('◆ ラッキーセブン：' + nameOf(ev.seat), 'sys');
          break;
        }
        case 'exchange': {
          const faceUp = ev.from === UI.human || ev.to === UI.human;
          await animTransfer(ev.from, ev.to, ev.cards, faceUp);
          const what = faceUp ? '（' + ev.cards.map(C.cardLabel).join(' ') + '）' : '';
          logLine('交換：' + nameOf(ev.from) + ' → ' + nameOf(ev.to) + ' ' + ev.cards.length + '枚' + what);
          break;
        }
        case 'last': {
          vm.out[ev.seat] = true;
          vm.places[ev.seat] = S.finished.indexOf(ev.seat) + 1;
          renderSeats(); renderMe();
          logLine('◆ ' + nameOf(ev.seat) + ' が最後', 'sys');
          break;
        }
        case 'over': {
          logLine('— 第' + S.gameNo + 'ゲーム終了 —', 'flow');
          break;
        }
        default:
          break;
      }
    }
    syncVM();
    renderAll();
  }

  async function animDeal() {
    SND.play('deal');
    const { w, h } = cardSize('pile');
    const c = $('pile').getBoundingClientRect();
    const center = { x: c.left + c.width / 2, y: c.top + c.height / 2 };
    const items = [];
    const S = UI.S;
    for (let r = 0; r < 4; r++) {
      for (let i = 0; i < S.n; i++) {
        const seat = (UI.human + i) % S.n;
        items.push({ back: true, from: rectAt(center, w, h), to: rectAt(seatAnchor(seat), w * 0.5, h * 0.5), delay: (r * S.n + i) * 38, o1: 0.2 });
      }
    }
    const hand = $('hand');
    hand.style.opacity = '0';
    await fly(items, 320);
    hand.style.transition = 'opacity .3s';
    hand.style.opacity = '1';
    setTimeout(() => { hand.style.transition = ''; }, 350);
  }

  // ─────────────────────────────────────────────
  // 操作
  // ─────────────────────────────────────────────
  function setSelectable(on, max) {
    UI.selectable = !!on;
    UI.selMax = max || 0;
    if (!on) UI.sel.clear();
    renderHand();
  }
  function clearSelection() { UI.sel.clear(); UI.hintSet = null; renderHand(); }
  function setDim(set) { UI.dimSet = set; renderHand(); }
  function setHint(ids) { UI.sel = new Set(ids); UI.hintSet = new Set(ids); renderHand(); }

  function showPrompt(html, buttons) {
    $('prompt-text').innerHTML = html;
    const box = $('prompt-btns');
    box.innerHTML = '';
    for (const b of buttons) {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'btn ' + (b.primary ? 'btn-gold' : 'btn-ghost') + ' btn-sm';
      el.textContent = b.label;
      if (b.id) el.id = b.id;
      el.addEventListener('click', b.onClick);
      box.appendChild(el);
    }
    $('prompt').hidden = false;
    requestAnimationFrame(renderHand);
  }
  function hidePrompt() { $('prompt').hidden = true; requestAnimationFrame(renderHand); }

  function openDialog(html, opts) {
    const ov = $('overlay');
    ov.innerHTML = '<div class="dialog" role="dialog" aria-modal="true">' + html + '</div>';
    ov.hidden = false;
    ov.onclick = (e) => { if (e.target === ov && opts && opts.onBackdrop) opts.onBackdrop(); };
    const first = ov.querySelector('button');
    if (first) setTimeout(() => first.focus({ preventScroll: true }), 30);
    return ov.firstChild;
  }
  function closeDialog() { const ov = $('overlay'); ov.hidden = true; ov.innerHTML = ''; ov.onclick = null; }

  function miniCards(ids) {
    return '<span class="mini-cards">' + ids.map((id) => '<span class="mc">' + A.faceSVG(id) + '</span>').join('') + '</span>';
  }

  function resetTable() {
    for (const el of UI.handEls.values()) el.remove();
    UI.handEls.clear();
    for (const k of Object.keys(UI.seatEls)) UI.seatEls[k].remove();
    UI.seatEls = {};
    UI.sel.clear();
    UI.dimSet = null;
    UI.hintSet = null;
    $('fx').innerHTML = '';
  }

  Object.assign(UI, {
    syncVM, renderAll, renderHand, renderSeats, renderPile, renderStatus, renderMe, renderLog,
    playEvents, banner, toast, bubble, flash, shake, setThinking, setSelectable, clearSelection, setDim, setHint,
    showPrompt, hidePrompt, openDialog, closeDialog, miniCards, makeCardEl, makeBackEl, resetTable, logLine,
    nameOf, titleOfSeat, TITLE_CLASS, esc, sleep, fmtPts, ptsClass, fly, rectAt, bubbleAt,
  });
  D.UI = UI;
})();

</script>
<script>
/* 大富豪 — ルールブック（はじめての人向け。対局中でも開ける） */
(function () {
  'use strict';
  const D = globalThis.DFG;
  const A = D.Art, RU = D.Rules, E = D.Engine, RT = D.Rating;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const TABS = [
    { key: 'basics', label: '遊び方' },
    { key: 'rules', label: 'ルール' },
    { key: 'score', label: '得点・レート' },
    { key: 'words', label: '用語' },
  ];

  function cards(ids, cls) {
    return '<span class="bk-cards' + (cls ? ' ' + cls : '') + '">' + ids.map((id) => '<span class="bk-card">' + A.faceSVG(id) + '</span>').join('') + '</span>';
  }
  const sect = (title, body) => '<section class="bk-sect"><h4>' + esc(title) + '</h4>' + body + '</section>';

  function isOn(R, key) {
    const d = RU.BY_KEY[key];
    if (!d) return false;
    if (d.type === 'bool') return !!R[key];
    if (key === 'jokers') return R[key] > 0;
    if (key === 'seqRevolution') return R[key] !== 'off';
    return true;
  }
  function optLabel(R, key) {
    const d = RU.BY_KEY[key];
    const op = d.options && d.options.find((o) => o.v === R[key]);
    return op ? op.label : '';
  }

  // ─────────────── 遊び方 ───────────────
  function basics(R) {
    const order = ['S3', 'H4', 'D5', 'C6', 'S7', 'H8', 'D9', 'C10', 'S11', 'H12', 'D13', 'C14', 'S15'];
    if (R.jokers > 0) order.push('X1');
    let h = '';
    h += sect('ゲームのねらい',
      '<p>手札を<b>いちばん早くなくした人の勝ち</b>です。上がった順に<b>大富豪・富豪・平民・貧民・大貧民</b>という身分がつきます（4人なら平民はいません）。</p>');
    h += sect('カードの強さ',
      '<div class="bk-strength">' + cards(order, 'row') + '<div class="bk-axis"><span>弱い</span><span>強い</span></div></div>' +
      '<p>3がいちばん弱く、<b>2がいちばん強い</b>数字です。マーク（♠♥♦♣）は強さに関係ありません。' +
      (R.jokers > 0 ? 'ジョーカーは好きなカードの代わりになり、<b>1枚で出すと2より強い</b>最強のカードです。' : '') + '</p>' +
      (R.revolution ? '<p class="bk-tip"><b>革命</b>が起きると強さが逆になり、3がいちばん強くなります。</p>' : ''));
    h += sect('出し方',
      '<div class="bk-ways">' +
      '<div class="bk-way">' + cards(['H9']) + '<b>1枚</b></div>' +
      '<div class="bk-way">' + cards(['S6', 'D6']) + '<b>同じ数字を2〜4枚</b></div>' +
      (R.sequence ? '<div class="bk-way">' + cards(['H4', 'H5', 'H6']) + '<b>階段</b><small>同じマークの連番を3枚以上</small></div>' : '') +
      (R.jokers > 0 ? '<div class="bk-way">' + cards(['C7', 'X1']) + '<b>ジョーカー入り</b><small>7のペアとして出せる</small></div>' : '') +
      '</div>' +
      '<p>場にカードがあるときは、<b>場と同じ出し方・同じ枚数で、もっと強いカード</b>しか出せません。1枚には1枚、ペアにはペアです。</p>' +
      '<div class="bk-example">' + cards(['D5', 'C5']) + '<span class="bk-arrow">→</span>' + cards(['S9', 'H9']) + '<span class="bk-ok">出せる</span></div>' +
      '<div class="bk-example">' + cards(['D5', 'C5']) + '<span class="bk-arrow">→</span>' + cards(['S12']) + '<span class="bk-ng">出せない（枚数が違う）</span></div>');
    h += sect('順番の進み方',
      '<ol class="bk-steps">' +
      '<li><b>親</b>（最初に出す人）は、好きな出し方で出します。' + (R.firstLead === 'D3' ? '1ゲーム目の親は♦3を持っている人です。' : R.firstLead === 'S3' ? '1ゲーム目の親は♠3を持っている人です。' : '') + '</li>' +
      '<li>次の人からは、場より強いカードを出すか、<b>パス</b>します。出せるカードがあってもパスしてかまいません。</li>' +
      '<li>自分以外の全員がパスすると<b>場が流れ</b>ます。最後に出した人が次の親になって、また好きな出し方で出せます。</li>' +
      '<li>手札がなくなったら<b>上がり</b>。最後の1人が決まるまで続けます。</li>' +
      '</ol>');
    if (R.exchange) {
      h += sect('身分とカード交換',
        '<p>2ゲーム目からは、ゲームの前にカードを交換します。</p>' +
        '<ul class="bk-list"><li><b>大貧民 → 大富豪</b>：いちばん強いカードを2枚渡し、大富豪は好きなカードを2枚返します。</li>' +
        '<li><b>貧民 → 富豪</b>：いちばん強いカードを1枚渡し、富豪は好きなカードを1枚返します。</li></ul>' +
        (R.nextLead === 'poorest' ? '<p>2ゲーム目からの親は、前のゲームの大貧民です。</p>' : ''));
    }
    h += sect('画面の使い方',
      '<ul class="bk-list">' +
      '<li>カードをタップして選び、<b>「出す」</b>。もう一度タップすると選ぶのをやめます。</li>' +
      '<li>明るく見えるのが今出せるカードです（「ルールと設定」で切り替え）。</li>' +
      '<li>迷ったら<b>「ヒント」</b>でおすすめの出し方がわかります。</li>' +
      '<li>止め札・カードを渡す・捨てるなど、選べる場面では画面がたずねてくれます。</li>' +
      '<li>上の' + A.icon('log', 14) + 'で今までの流れ、' + A.icon('book', 14) + 'でこのルールブックが見られます。</li>' +
      '</ul>');
    return h;
  }

  // ─────────────── ルール（そのゲームで使うもの） ───────────────
  // 数字ごとの効果：[ルール, 見本のカード, 出し方]
  const CARD_RULES = [
    ['spade3', ['S3'], '♠3を1枚'],
    ['threeStop', ['H3', 'D3'], '3を2枚'],
    ['sandstorm', ['S3', 'H3', 'D3'], '3を3枚'],
    ['fourStop', ['S4', 'H4'], '4を2枚'],
    ['fiveSkip', ['D5'], '5'],
    ['sixNine', ['C6'], '6を1枚'],
    ['rokurokubi', ['S6', 'H6'], '6を2枚'],
    ['omen', ['S6', 'H6', 'D6'], '6を3枚'],
    ['sevenPass', ['H7'], '7'],
    ['luckySeven', ['S7', 'H7', 'D7'], '7を3枚'],
    ['eightCut', ['S8'], '8'],
    ['nineSix', ['D9'], '9を1枚'],
    ['kyukyusha', ['S9', 'H9'], '9を2枚'],
    ['coup', ['S9', 'H9', 'D9'], '9を3枚'],
    ['nineReverse', ['C9'], '9'],
    ['nineBack', ['C9'], '9'],
    ['tenDiscard', ['C10'], '10'],
    ['jBack', ['H11'], 'J'],
    ['queenBomber', ['S12'], 'Q'],
    ['kingSkip', ['D13'], 'K'],
    ['aceTake', ['C14'], 'A'],
    ['twoBack', ['H15'], '2'],
    ['greatRevolution', ['S15', 'H15', 'D15', 'C15'], '2を4枚'],
  ];
  // 例を足すと分かりやすいもの
  const EXTRA = {
    suitLock: '例：♥5 → ♥8 と続いたら、場が流れるまで♥しか出せません。',
    numberLock: '例：5 → 6 と続いたら、次は7しか出せません。',
    eightCut: '8切りのあとは、出した人がそのまま親になります。',
    sevenPass: '渡さなくてもかまいません。',
    tenDiscard: '捨てなくてもかまいません。',
    fiveSkip: '例：5を2枚出すと、次の2人を飛ばします。',
  };
  const FIELD_RULES = ['jokers', 'sequence', 'seqCompare', 'revolution', 'seqRevolution', 'suitLock', 'partialLock', 'numberLock', 'gekiLock',
    'downNumber', 'passLock', 'stopScope', 'seqEffects'];
  const FINISH_RULES = ['forbidJoker', 'forbidTwo', 'forbidEight', 'forbidSpade3', 'miyakoOchi', 'gekokujo', 'tenpen', 'exchange', 'firstLead', 'nextLead'];

  function ruleItem(R, key, extraHead) {
    const d = RU.BY_KEY[key];
    const choice = d.type === 'choice' ? '<span class="bk-opt">' + esc(optLabel(R, key)) + '</span>' : '';
    return '<div class="bk-rule"><div class="bk-rule-head"><b>' + esc(d.label) + '</b>' + choice + (extraHead || '') + '</div>' +
      '<p>' + esc(d.desc) + (EXTRA[key] ? ' ' + esc(EXTRA[key]) : '') + '</p></div>';
  }

  function relevant(R, key) {
    // 親のルールがないと意味がない選択肢は出さない
    if (key === 'seqCompare' || key === 'seqEffects' || key === 'seqRevolution') return R.sequence;
    if (key === 'stopScope') return R.fourStop || R.threeStop;
    return true;
  }

  function rulesTab(R) {
    let h = '';
    const cardOn = CARD_RULES.filter(([k]) => isOn(R, k));
    if (cardOn.length) {
      h += sect('数字ごとの効果',
        '<div class="bk-cardrules">' + cardOn.map(([k, ids, how]) => {
          const d = RU.BY_KEY[k];
          return '<div class="bk-cr">' + cards(ids, 'fan') + '<div class="bk-cr-text"><div class="bk-rule-head"><b>' + esc(d.label) + '</b><span class="bk-opt">' + esc(how) + '</span></div>' +
            '<p>' + esc(d.desc) + (EXTRA[k] ? ' ' + esc(EXTRA[k]) : '') + '</p></div></div>';
        }).join('') + '</div>' +
        (R.fourStop || R.threeStop || R.sandstorm
          ? '<p class="bk-tip">止め札（' + [R.threeStop && '3止め', R.fourStop && '4止め', R.sandstorm && '砂嵐'].filter(Boolean).join('・') +
            '）で止めると、場が流れて<b>止めた人が親</b>になります。止められる場面では画面がたずねます。</p>' : '') +
        (R.sequence && R.seqEffects === 'eight' ? '<p class="bk-tip">階段の中に8が入っていると8切りになります（ほかの数字の効果は1枚・同じ数字で出したときだけ）。</p>' : ''));
    }
    const field = FIELD_RULES.filter((k) => isOn(R, k) && relevant(R, k));
    if (field.length) {
      h += sect('場のルール', field.map((k) => ruleItem(R, k)).join('') +
        (R.jokers > 0 && (R.suitLock || R.numberLock) ? '<p class="bk-tip">ジョーカーを含む出し方では、新しい縛りは起きません。</p>' : ''));
    }
    const fin = FINISH_RULES.filter((k) => isOn(R, k));
    if (fin.length) h += sect('上がり・身分', fin.map((k) => ruleItem(R, k)).join(''));
    // 使わないルール
    const off = RU.RULES.filter((d) => d.type === 'bool' && !R[d.key]);
    if (off.length) {
      h += '<details class="bk-off"><summary>このルールで使わないローカルルール（' + off.length + '個）</summary>' +
        off.map((d) => '<div class="bk-rule off"><div class="bk-rule-head"><b>' + esc(d.label) + '</b></div><p>' + esc(d.desc) + '</p></div>').join('') + '</details>';
    }
    return h;
  }

  // ─────────────── 得点・レート ───────────────
  function score(n) {
    const rows = [];
    for (let i = 0; i < n; i++) {
      const t = E.titleOf(n, i), p = E.pointsFor(n, i);
      rows.push('<tr><td>' + (i + 1) + '位</td><td><span class="title-chip ' + D.UI.TITLE_CLASS[t] + '">' + t + '</span></td><td class="' + (p > 0 ? 'pos' : p < 0 ? 'neg' : 'zero') + '">' +
        (p > 0 ? '+' : p < 0 ? '−' : '') + Math.abs(p) + '点</td></tr>');
    }
    const ai = RT.AI;
    let h = '';
    h += sect('1ゲームの得点（' + n + '人）',
      '<table class="bk-table">' + rows.join('') + '</table>' +
      '<p>全員の得点を足すと、いつも0点になります。反則上がりは最下位の得点です。</p>');
    h += sect('1試合',
      '<p><b>レート戦は10ゲームで1試合</b>です。10ゲームの総得点がいちばん多い人が優勝です。' +
      'フリー対戦は「ルールと設定」でゲーム数（5・10・無制限）を選べます。</p>');
    h += sect('レート戦',
      '<ul class="bk-list">' +
      '<li><b>4人・マイルール・10ゲーム</b>で固定です（ルールの中身は「ルール」タブ）。</li>' +
      '<li>レートは<b>1500</b>から始まります。</li>' +
      '<li>相手のレートから<b>「予想の総得点」</b>を出します。強い相手ほど予想は低く、弱い相手ほど高くなります。</li>' +
      '<li>10ゲームの総得点が予想より<b>多ければ上がり、少なければ下がり</b>ます。</li>' +
      '<li>増減 ＝ ' + RT.K + ' ×（総得点 − 予想）÷ 30。はじめの' + RT.NEW_MATCHES + '試合は ' + RT.K + ' のかわりに ' + RT.K_NEW +
      ' で計算するので、早く実力に近いレートになります。</li>' +
      '</ul>' +
      '<div class="bk-example-box">例：レート1500のあなたが、レート1500の相手3人と対戦（' + (RT.NEW_MATCHES + 1) + '試合目から）。予想は0点。<br>' +
      '総得点 <b class="pos">+9点</b> なら レート <b class="pos">+12</b>、<b class="neg">−6点</b> なら <b class="neg">−8</b>。</div>');
    h += sect('AIのレート',
      '<table class="bk-table"><tr><td>やさしい</td><td>' + ai.easy + '</td></tr><tr><td>ふつう</td><td>' + ai.normal + '</td></tr><tr><td>つよい</td><td>' + ai.hard + '</td></tr></table>' +
      '<p>マイルールでAIどうしを何百〜何千ゲームも対戦させて測った強さです。</p>');
    h += sect('棄権',
      '<p>レート戦を途中でやめる（棄権する）と、<b>残りのゲームは大貧民（−3点）</b>として計算します。' +
      'タイトルに戻るだけなら棄権にはならず、「つづきから」で再開できます。</p>');
    h += sect('オンラインのレート',
      '<ul class="bk-list">' +
      '<li>AI戦のレートとは別に、サーバーに記録されます（端末ごと。サインインは不要）。</li>' +
      '<li>部屋のホストが「レート戦」を選ぶと、4人・マイルール・10ゲームになります。空いた席にはAIが入ります。</li>' +
      '<li>途中で部屋を出ると棄権になります。途中から入った人のレートは変わりません。</li>' +
      '</ul>');
    return h;
  }

  // ─────────────── 用語 ───────────────
  const WORDS = [
    ['親', '場にカードがないときに最初に出す人。好きな出し方で出せます。'],
    ['場', 'テーブルの真ん中。いちばん上のカードより強いカードを出していきます。'],
    ['パス', '出さずに順番をとばすこと。出せるカードがあってもパスできます。'],
    ['場が流れる', '場のカードが片づけられること。全員がパスしたときや8切りのときなど。'],
    ['上がり', '手札が全部なくなること。'],
    ['反則上がり', '禁止されている出し方（ジョーカー・2など）で上がること。最下位になります。'],
    ['階段', '同じマークの連番を3枚以上まとめて出す出し方。'],
    ['革命', '同じ数字を4枚出すと強さが逆になること。3が最強、2が最弱になります。'],
    ['縛り', '同じマークや連番が続くと、場が流れるまで出せるカードが限られること。'],
    ['止め札', '8切りやスキップを止められる出し方（3止め・4止め・砂嵐）。'],
    ['身分', '上がった順番で決まる肩書き。大富豪・富豪・平民・貧民・大貧民。'],
    ['カード交換', '2ゲーム目から、身分に応じて強いカードと好きなカードを交換すること。'],
    ['総得点', '1試合（10ゲームなど）の得点の合計。レートはこれで決まります。'],
    ['レート', '強さの目安の数字。1500から始まり、レート戦の結果で上下します。'],
  ];
  function words() {
    return '<dl class="bk-words">' + WORDS.map(([w, d]) => '<dt>' + esc(w) + '</dt><dd>' + esc(d) + '</dd>').join('') + '</dl>';
  }

  /** tab：TABS の key、R：説明するルール、n：人数（得点表用） */
  function render(tab, R, n) {
    if (tab === 'rules') return rulesTab(R);
    if (tab === 'score') return score(n || RT.PLAYERS);
    if (tab === 'words') return words();
    return basics(R);
  }

  D.Book = { TABS, render };
  D.Books = D.Books || {};
  D.Books.daifugo = D.Book;
})();

</script>
<script>
/* 七並べ — ルールブック */
(function () {
  'use strict';
  const D = globalThis.DFG;
  const A = D.Art, RT = D.Rating, E = D.Engine, SR = D.SevensRules;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const TABS = [
    { key: 'basics', label: '遊び方' },
    { key: 'rules', label: 'ルール' },
    { key: 'score', label: '得点・レート' },
  ];
  const cards = (ids, cls) => '<span class="bk-cards' + (cls ? ' ' + cls : '') + '">' + ids.map((id) => '<span class="bk-card">' + A.faceSVG(id) + '</span>').join('') + '</span>';
  const sect = (title, body) => '<section class="bk-sect"><h4>' + esc(title) + '</h4>' + body + '</section>';
  const R0 = () => SR.defaults();

  function basics(R) {
    R = R || R0();
    let h = '';
    h += sect('ゲームのねらい', '<p>手札を<b>いちばん早くなくした人の勝ち</b>です。上がった順に順位が決まります。</p>');
    h += sect('はじめ', '<p>カードを全部配ったら、<b>7を4枚とも場に並べて</b>スタートします（アプリが自動で並べます）。<b>♦7を持っていた人</b>から順番に出していきます。</p>' +
      '<div class="bk-ways"><div class="bk-way">' + cards(['S7', 'H7', 'D7', 'C7']) + '<b>最初の場</b><small>マークごとに1列</small></div></div>');
    h += sect('出し方',
      '<p>場に並んでいるカードの<b>となり（同じマークで1つ大きいか小さい数字）</b>に、1枚だけ出せます。</p>' +
      '<div class="bk-example">' + cards(['S6', 'S7', 'S8']) + '<span class="bk-arrow">→</span>' + cards(['S5']) + '<span class="bk-ok">出せる</span></div>' +
      '<div class="bk-example">' + cards(['S6', 'S7', 'S8']) + '<span class="bk-arrow">→</span>' + cards(['S4']) + '<span class="bk-ng">まだ出せない（5がない）</span></div>' +
      '<p>出せないとき・出したくないときは<b>パス</b>します。' +
      (R.passLimit > 0 ? 'パスは<b>' + R.passLimit + '回まで</b>。' + (R.passLimit + 1) + '回目のパスで<b>失格</b>になり、手札はすべて場に並べられます（順位は最下位）。' : 'パスは何回でもできます（ただし全員が2周続けてパスしたら、出せる人は出さなければなりません）。') + '</p>' +
      '<p class="bk-tip">作戦：自分が止めているカードがあると、その先のカードを持つ人は出せません。わざとパスして相手を困らせることもできます。</p>');
    if (R.tunnel) {
      h += sect('トンネル', '<p><b>AとKがつながります</b>。Aまで並んだらKから、Kまで並んだらAからも出せます。</p>' +
        '<div class="bk-example">' + cards(['H14', 'H15', 'H3']) + '<span class="bk-arrow">→</span>' + cards(['H13']) + '<span class="bk-ok">Aのとなりに出せる</span></div>');
    }
    if (R.joker) {
      h += sect('ジョーカー', '<p>ジョーカーは<b>出せる場所ならどこにでも置けます</b>。置いた場所のカードを持っている人は、<b>次の自分の番で必ずそのカードを出し</b>、代わりにジョーカーを受け取ります（その番はパスできません）。</p>' +
        '<p>ジョーカーを置くと、その先のカードも出せるようになります。</p>');
    }
    h += sect('画面の使い方', '<ul class="bk-list">' +
      '<li>明るく見えるのが今出せるカードです。タップして選び、<b>「出す」</b>。</li>' +
      '<li>ジョーカーを選ぶと、置ける場所が場で光ります。置く場所をタップしてください。</li>' +
      '<li>パスのボタンに、残りのパスの回数が出ます。各プレイヤーの名札の点がパスした回数です。</li>' +
      '<li>迷ったら<b>「ヒント」</b>でおすすめがわかります。</li></ul>');
    return h;
  }

  function rulesTab(R) {
    R = R || R0();
    const items = SR.RULES.map((d) => {
      const val = d.type === 'bool' ? (R[d.key] ? 'あり' : 'なし') : (d.options.find((o) => o.v === R[d.key]) || {}).label;
      const on = d.type === 'bool' ? R[d.key] : true;
      return '<div class="bk-rule' + (on ? '' : ' off') + '"><div class="bk-rule-head"><b>' + esc(d.label) + '</b><span class="bk-opt">' + esc(val) + '</span></div><p>' + esc(d.desc) + '</p></div>';
    }).join('');
    return sect('このルール', items) +

        '<li>途中で棄権すると、残りのゲームは最下位として計算します。</li></ul>') +
      sect('AIのレート', '<table class="bk-table"><tr><td>やさしい</td><td>' + c.ai.easy + '</td></tr><tr><td>ふつう</td><td>' + c.ai.normal + '</td></tr><tr><td>つよい</td><td>' + c.ai.hard + '</td></tr></table>' +
        '<p>七並べは配られたカードの運の要素が大きいので、AIの強さの差は小さめです。</p>');
  }

  function render(tab, R, n) {
    if (tab === 'rules') return rulesTab(R);
    if (tab === 'score') return score(n);

  }

  D.Books = D.Books || {};
  D.Books.sevens = { TABS, render };
})();

<script>
/* 大富豪 — オンライン対戦の通信（切れたら自動でつなぎ直す） */
(function () {
  'use strict';
  const D = (globalThis.DFG = globalThis.DFG || {});

  const PROD_SERVER = 'wss://daifugo-nonsankun0515.daifugo-nonsankun0515.workers.dev';

  /** 接続先：開発中（localhost）は手元のサーバー、それ以外は Cloudflare */
  function serverURL() {
    const h = location.hostname;
    if (h === 'localhost' || h === '127.0.0.1') return 'ws://127.0.0.1:8787';
    return PROD_SERVER;
  }

  /** この端末のID（部屋に戻るときに同じ席に座るため） */
  function clientId() {
    let id = null;
    try { id = localStorage.getItem('daifugo.cid'); } catch (e) { /* 保存できない環境 */ }
    if (!id || !/^[A-Za-z0-9_-]{8,40}$/.test(id)) {
      const a = new Uint8Array(12);
      crypto.getRandomValues(a);
      id = Array.from(a, (b) => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join('');
      try { localStorage.setItem('daifugo.cid', id); } catch (e) { /* 保存できない環境 */ }
    }
    return id;
  }

  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function newRoomCode() {
    const a = new Uint8Array(5);
    crypto.getRandomValues(a);
    return Array.from(a, (b) => CODE_CHARS[b % CODE_CHARS.length]).join('');
  }

  /**
   * 部屋につなぐ。handlers: onMessage(msg), onStatus('connecting'|'open'|'retry'|'closed'), onOpen()
   * 戻り値: { send(obj), close() }
   */
  function connect(code, handlers) {
    let ws = null;
    let closedByUser = false;
    let retry = 0;
    let timer = 0;
    let ping = 0;
    const url = serverURL() + '/room/' + code;

    function status(s) { if (handlers.onStatus) handlers.onStatus(s); }

    function open() {
      clearTimeout(timer);
      status(retry ? 'retry' : 'connecting');
      try { ws = new WebSocket(url); } catch (e) { schedule(); return; }
      ws.onopen = () => {
        retry = 0;
        status('open');
        if (handlers.onOpen) handlers.onOpen();
        clearInterval(ping);
        ping = setInterval(() => send({ t: 'ping' }), 25000);
      };
      ws.onmessage = (e) => {
        let msg;
        try { msg = JSON.parse(e.data); } catch (err) { return; }
        if (msg.t === 'pong') return;
        handlers.onMessage(msg);
      };
      ws.onclose = (e) => {
        clearInterval(ping);
        ws = null;
        if (closedByUser || e.code === 4001 || e.code === 4000) { status('closed'); if (handlers.onClosed) handlers.onClosed(e.code); return; }
        schedule();
      };
      ws.onerror = () => { /* onclose で扱う */ };
    }

    function schedule() {
      if (closedByUser) return;
      retry++;
      status('retry');
      timer = setTimeout(open, Math.min(8000, 600 * Math.pow(1.7, retry)));
    }

    function send(obj) {
      if (ws && ws.readyState === 1) { ws.send(JSON.stringify(obj)); return true; }
      return false;
    }

    // スマホでアプリに戻ってきたら、すぐつなぎ直す
    function onVisible() {
      if (document.visibilityState === 'visible' && !closedByUser && (!ws || ws.readyState > 1)) { retry = 0; open(); }
    }
    document.addEventListener('visibilitychange', onVisible);

    open();
    return {
      send,
      close() {
        closedByUser = true;
        clearTimeout(timer);
        clearInterval(ping);
        document.removeEventListener('visibilitychange', onVisible);
        if (ws) { try { ws.close(1000, 'bye'); } catch (e) { /* 無視 */ } }
      },
      get open() { return !!ws && ws.readyState === 1; },
    };
  }

  /** オンライン対戦が使える環境か（Claude のページ内では外部と通信できない） */
  function available() {
    const inArtifact = !!(globalThis.claude && globalThis.claude.hot) || /claude(usercontent)?\.(ai|com)$/i.test(location.hostname);
    return !inArtifact && typeof WebSocket !== 'undefined';
  }

  D.Net = { connect, clientId, newRoomCode, serverURL, available, APP_URL: 'https://nonsankun0515-cloud.github.io/daifugo/' };
})();

</script>
<script>
/* 共通：保存・個人設定・画面の切り替え・画面の部品・レート戦・試合結果・ルールブックの枠
 * どのゲーム（大富豪・七並べ・スピード）からも使う */
(function () {
  'use strict';
  const D = globalThis.DFG;
  const A = D.Art, SND = D.Sound, UI = D.UI, RT = D.Rating, RU = D.Rules;
  const $ = (id) => document.getElementById(id);
  const esc = UI.esc;

  // ─────────────────────────────────────────────
  // 保存（この端末のブラウザだけ）。キーは大富豪だけだった頃のまま
  // ─────────────────────────────────────────────
  const STORE_KEY = 'daifugo.v1';
  const DEFAULT_SETTINGS = { players: 4, level: 'normal', games: 10, speed: 'normal', back: 'red', sound: true, autoPass: true, showPlayable: true, name: 'あなた' };
  const newRating = () => ({ r: RT.START, matches: 0, best: RT.START, hist: [] });
  let store = {};
  try { store = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { store = {}; }
  // 大富豪（以前からの形のまま）
  store.settings = Object.assign({}, DEFAULT_SETTINGS, store.settings || {});
  store.rules = store.rules ? RU.migrate(store.rules) : Object.assign({}, RU.MINE);
  store.rating = Object.assign(newRating(), store.rating || {});
  // 七並べ・スピード
  store.sevens = Object.assign({}, store.sevens);
  store.sevens.settings = Object.assign({ players: 4, level: 'normal', games: 10 }, store.sevens.settings);
  store.sevens.rules = D.SevensRules.normalize(store.sevens.rules);
  store.sevens.rating = Object.assign(newRating(), store.sevens.rating || {});
  store.speed = Object.assign({}, store.speed);
  store.speed.settings = Object.assign({ level: 'normal', games: 3 }, store.speed.settings);
  store.speed.rules = D.SpeedRules.normalize(store.speed.rules);
  store.speed.rating = Object.assign(newRating(), store.speed.rating || {});
  // オンラインのレート（サーバーから届いた値の控え）
  store.onlineRatings = store.onlineRatings || {};
  if (store.onlineRating && !store.onlineRatings.daifugo) store.onlineRatings.daifugo = store.onlineRating;
  const settings = store.settings;

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* 保存できなくても続行 */ }
  }

  // ─────────────────────────────────────────────
  // 個人設定（全ゲーム共通）
  // ─────────────────────────────────────────────
  const SPEEDS = { slow: 1.35, normal: 1, fast: 0.6 };
  const reduceMotion = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const LEVEL_LABEL = { easy: 'やさしい', normal: 'ふつう', hard: 'つよい' };

  function applySettings() {
    UI.speed = SPEEDS[settings.speed] || 1;
    if (reduceMotion) UI.speed = Math.min(UI.speed, 0.6);
    document.documentElement.style.setProperty('--speed', String(UI.speed));
    UI.backURI = A.backDataURI(settings.back);
    UI.showPlayable = settings.showPlayable;
    SND.setEnabled(settings.sound);
    document.querySelectorAll('[data-sound-btn]').forEach((b) => {
      b.innerHTML = A.icon(settings.sound ? 'soundOn' : 'soundOff');
      b.setAttribute('aria-label', settings.sound ? '効果音をオフ' : '効果音をオン');
    });
  }
  function toggleSound() {
    settings.sound = !settings.sound;
    save();
    applySettings();
    if (settings.sound) SND.play('select');
  }
  /** オンラインで表示する名前（「あなた」のままなら未設定） */
  function playerName() {
    const n = (settings.name || '').trim();
    return n && n !== 'あなた' ? n : '';
  }

  // ─────────────────────────────────────────────
  // 画面の切り替え（#app 直下の .screen を1つだけ表示）
  // ─────────────────────────────────────────────
  const showHooks = [];
  function showScreen(id) {
    document.querySelectorAll('#app > .screen').forEach((el) => { el.hidden = el.id !== id; });
    closeBook();
    for (const f of showHooks) f(id);
  }
  const onShow = (f) => showHooks.push(f);
  const visible = (id) => { const el = $(id); return !!el && !el.hidden; };

  // ─────────────────────────────────────────────
  // 設定画面の部品
  // ─────────────────────────────────────────────
  function seg(options, value, onPick, disabled) {
    const wrap = document.createElement('div');
    wrap.className = 'seg';
    for (const op of options) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = op.label;
      b.setAttribute('aria-pressed', String(op.v === value));
      b.disabled = !!disabled;
      b.addEventListener('click', () => { onPick(op.v); });
      wrap.appendChild(b);
    }
    return wrap;
  }
  function toggle(id, checked, onChange, disabled, label) {
    const w = document.createElement('label');
    w.className = 'switch';
    w.innerHTML = '<input type="checkbox" id="' + id + '"' + (checked ? ' checked' : '') + (disabled ? ' disabled' : '') + ' aria-label="' + esc(label) + '"><span class="track"></span><span class="knob"></span>';
    w.querySelector('input').addEventListener('change', (e) => onChange(e.target.checked));
    return w;
  }
  function row(name, desc, control, extraCls) {
    const r = document.createElement('div');
    r.className = 'row' + (extraCls ? ' ' + extraCls : '');
    r.innerHTML = '<div class="row-text"><div class="row-name">' + esc(name) + '</div>' + (desc ? '<div class="row-desc">' + esc(desc) + '</div>' : '') + '</div>';
    if (control) r.appendChild(control);
    return r;
  }
  function section(title, note) {
    const s = document.createElement('section');
    s.innerHTML = '<h3 class="sect-title">' + esc(title) + (note ? '<small>' + esc(note) + '</small>' : '') + '</h3>';
    const panel = document.createElement('div');
    panel.className = 'card-panel';
    s.appendChild(panel);
    return { s, panel };
  }

  // ─────────────────────────────────────────────
  // レート戦（AI戦のレートはこの端末に、ゲームごとに保存）
  // ─────────────────────────────────────────────
  const ratingOf = (game) => (game === 'daifugo' ? store.rating : store[game].rating);
  const fmtExp = (v) => (Math.abs(v) < 0.05 ? '±0' : (v > 0 ? '+' : '−') + Math.abs(v).toFixed(1));
  const pct = (p) => Math.round(p * 100) + '%';

  function recordRating(game, delta, entry) {
    const rt = ratingOf(game);
    const before = rt.r;
    rt.r = before + delta;
    rt.matches++;
    rt.best = Math.max(rt.best, rt.r);
    rt.hist.push(Object.assign({ at: Date.now(), before, after: rt.r, d: delta }, entry));
    if (rt.hist.length > 50) rt.hist.splice(0, rt.hist.length - 50);
    save();
    return { before, after: rt.r };
  }

  /** ローカルのレート戦が終わったらレートを更新する（S.rated.result で1回だけ） */
  function applyRatedLocal(S) {
    const info = S && S.rated;
    if (!info || info.result || info.online || !S.matchOver) return null;
    const r = RT.matchResult(S, info.base, info.base.map((_, i) => (i === 0 ? info.matches : 0)))[0];
    const rec = recordRating(S.game || 'daifugo', r.delta, { total: r.total, level: info.level });
    info.result = { before: rec.before, after: rec.after, delta: r.delta, expected: r.expected, total: r.total, result: r.result };
    return info.result;
  }

  /** 途中のレート戦を棄権（保存された試合 m を使う。得点のゲームは残りを最下位、勝ち負けのゲームは負け） */
  function abandonRatedLocal(m) {
    if (!m || !m.rated || m.matchOver || m.rated.result) return null;
    const game = m.game || 'daifugo';
    const r = RT.abandonResult(m, 0, m.rated.base, m.rated.matches);
    const rec = recordRating(game, r.delta, { total: r.total, level: m.rated.level, abandoned: true });
    return { before: rec.before, after: rec.after, delta: r.delta };
  }

  function abandonNote(m) {
    if (RT.cfg(m.game).kind === 'winloss') return '棄権すると <b>負け</b> になり、レートが下がります。';
    const left = m.maxGames - (m.history || []).length;
    return '残りの' + left + 'ゲームは <b>最下位（−3点）</b> として計算され、レートが下がります。';
  }

  /** レートの説明（結果の下の1行） */
  function rateNote(game, r) {
    if (RT.cfg(game).kind === 'winloss') return '勝つ確率 ' + pct(r.expected) + ' の相手に' + (r.result === 1 ? '勝ちました' : r.result === 0 ? '負けました' : '引き分け');
    return '予想の総得点 ' + fmtExp(r.expected) + ' に対して、' + UI.fmtPts(r.total) + '点';
  }

  function rateBoxHTML(label, r, note) {
    return '<div class="rate-box"><div class="rate-lbl">' + esc(label) + '</div><div class="rate-nums"><span class="old">' + r.before + '</span><span class="arrow">→</span>' +
      '<b class="new" data-from="' + r.before + '" data-to="' + r.after + '">' + r.before + '</b><span class="delta ' + UI.ptsClass(r.delta) + '">' + RT.fmtDelta(r.delta) + '</span></div>' +
      (note ? '<div class="rate-note">' + note + '</div>' : '') + '</div>';
  }

  /** レートの数字を数え上げる */
  function animateRate(root) {
    const el = root && root.querySelector('.rate-box .new');
    if (!el) return;
    const from = +el.dataset.from, to = +el.dataset.to;
    const dur = 900 * UI.speed;
    setTimeout(() => {
      if (to > from) SND.play('special');
      const t0 = performance.now();
      const step = (t) => {
        const k = Math.min(1, (t - t0) / dur);
        el.textContent = String(Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))));
        if (k < 1 && el.isConnected) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }, 450);
  }

  /** レート戦を始める画面（AIの強さを選ぶ）。onPick(level) で開始 */
  function openRatedDialog(game, opts) {
    const c = RT.cfg(game);
    const my = ratingOf(game).r;
    const winloss = c.kind === 'winloss';
    const levels = (opts && opts.levels) || ['easy', 'normal', 'hard'];
    const items = levels.map((lv) => {
      const ai = c.ai[lv];
      const exp = winloss ? pct(RT.winProb(my, ai)) : fmtExp(RT.expectedPoints(my, new Array(c.players - 1).fill(ai)) * c.games);
      return '<button class="opt lvl" type="button" data-lv="' + lv + '"><span class="lvl-name"><b>' + LEVEL_LABEL[lv] + '</b><small>AIのレート ' + ai +
        (opts && opts.slowLevel === lv ? '・考える時間が長め' : '') + '</small></span><span class="lvl-exp"><small>' + (winloss ? 'あなたが勝つ確率' : '予想の総得点') + '</small><b>' + exp + '</b></span></button>';
    }).join('');
    const how = winloss ? c.players + '人・' + c.rulesLabel + '・' + c.games + '本勝負（' + (Math.floor(c.games / 2) + 1) + '勝で勝ち）。<br>勝つ確率が低い相手に勝つほど、レートが大きく上がります。'
      : c.players + '人・<b>' + esc(c.rulesLabel) + '</b>・全' + c.games + 'ゲーム。<br>' + c.games + 'ゲームの総得点が「予想の総得点」より多ければレートが上がります。';
    const dlg = UI.openDialog('<h3>レート戦</h3><p>' + how + '</p>' +
      '<div class="rate-now">あなたのレート <b>' + my + '</b>' + (ratingOf(game).matches < RT.NEW_MATCHES ? '<small>はじめの' + RT.NEW_MATCHES + '試合は大きく動きます</small>' : '') + '</div>' +
      '<div class="opt-list">' + items + '</div>' +
      '<div class="btns"><button class="btn btn-ghost" type="button" id="rt-book">ルールを見る</button><button class="btn btn-ghost" type="button" id="rt-cancel">やめる</button></div>',
    { onBackdrop: UI.closeDialog });
    dlg.querySelectorAll('.lvl').forEach((b) => b.addEventListener('click', () => { UI.closeDialog(); SND.unlock(); opts.onPick(b.dataset.lv); }));
    $('rt-book').addEventListener('click', () => { UI.closeDialog(); openBook(game, 'rules', 'rated'); });
    $('rt-cancel').addEventListener('click', UI.closeDialog);
  }

  /** 途中のレート戦がある状態で新しく始めるとき：「つづきから／棄権」をたずねる */
  function askAbandon(m, opts) {
    const c = RT.cfg(m.game);
    UI.openDialog('<h3>途中のレート戦があります</h3><p>' + c.label + ' 第' + m.gameNo + '/' + m.maxGames + 'ゲームの途中です。新しく始めると棄権になり、' + abandonNote(m) + '</p>' +
      '<div class="btns"><button class="btn btn-ghost" type="button" id="ab-no">やめる</button>' +
      '<button class="btn btn-ghost" type="button" id="ab-yes">棄権する</button>' +
      '<button class="btn btn-gold" type="button" id="ab-resume">つづきから</button></div>', { onBackdrop: UI.closeDialog });
    $('ab-no').addEventListener('click', UI.closeDialog);
    $('ab-resume').addEventListener('click', () => { UI.closeDialog(); opts.onResume(); });
    $('ab-yes').addEventListener('click', () => {
      const r = abandonRatedLocal(m);
      UI.closeDialog();
      opts.onAbandoned(r);
      if (r) UI.toast('棄権しました。レート ' + r.before + ' → ' + r.after + '（' + RT.fmtDelta(r.delta) + '）', 3500);
    });
  }

  // ─────────────────────────────────────────────
  // 試合の最終結果（順位・ゲームごとの得点表）
  // ─────────────────────────────────────────────
  const ptsHTML = (v, unit) => '<span class="' + UI.ptsClass(v) + '">' + UI.fmtPts(v) + (unit || '') + '</span>';

  /** S の試合結果。human：あなたの席、rateHTML：レート欄、deltas：席ごとのレート変動（オンライン） */
  function finalHTML(S, human, rateHTML, deltas) {
    const winloss = RT.cfg(S.game).kind === 'winloss';
    const st = (winloss ? D.Speed : D.Engine).standings(S);
    const me = st.find((r) => r.seat === human);
    const name = (seat) => S.players[seat].name;
    const rows = st.map((r) => {
      const d = deltas && deltas[r.seat];
      return '<div class="res-row fin' + (r.seat === human ? ' me' : '') + '"><span class="pl">' + r.place + '</span>' +
        '<span class="nm">' + esc(name(r.seat)) + (r.seat === human ? '<em>あなた</em>' : '') +
        (d ? '<small class="rt">レート ' + d.after + '（' + RT.fmtDelta(d.delta) + '）</small>' : '') + '</span>' +
        '<span class="pt big">' + (winloss ? '<span class="zero">' + r.score + '<small>勝</small></span>' : ptsHTML(r.score, '<small>点</small>')) + '</span></div>';
    }).join('');
    const cell = (v) => (winloss ? '<td class="' + (v > 0 ? 'pos' : 'zero') + '">' + (v > 0 ? '○' : '×') + '</td>' : '<td class="' + UI.ptsClass(v) + '">' + UI.fmtPts(v) + '</td>');
    const body = st.map((r) => {
      const cells = S.history.map((h) => (winloss && h.winner === null ? '<td class="zero">△</td>' : cell(h.pts[r.seat]))).join('');
      const tot = winloss ? r.score + '勝' : UI.fmtPts(S.players[r.seat].score);
      return '<tr' + (r.seat === human ? ' class="mine"' : '') + '><th>' + esc(r.seat === human ? 'あなた' : name(r.seat)) + '</th>' + cells +
        '<td class="tot ' + (winloss ? '' : UI.ptsClass(S.players[r.seat].score)) + '">' + tot + '</td></tr>';
    }).join('');
    const cols = S.history.map((_, i) => '<th>' + (i + 1) + '</th>').join('');
    const msg = !me ? '' : me.place === 1 && !(winloss && st[1] && st[1].place === 1) ? 'あなたの勝ち！' : 'あなたは ' + me.place + '位';
    if (me && me.place === 1) SND.play('fanfare');
    const how = winloss ? S.history.length + 'ゲームの勝ち数で決まりました。' : '全' + S.history.length + 'ゲームの総得点で順位を決めました。';
    return '<h3>試合終了</h3><p>' + esc(msg) + '　' + how + '</p>' +
      '<div class="results">' + rows + '</div>' + (rateHTML || '') +
      '<details class="score-details"><summary>ゲームごとの結果</summary><div class="score-wrap"><table class="score-table"><thead><tr><th></th>' + cols +
      '<th>計</th></tr></thead><tbody>' + body + '</tbody></table></div></details>';
  }

  // ─────────────────────────────────────────────
  // ルールブック（対局中でも開ける。開いている間も対局はそのまま進む）
  // ─────────────────────────────────────────────
  const book = { game: 'daifugo', tab: 'basics', src: '' };

  function renderBook() {
    const B = D.Books[book.game];
    const mod = D.Games[book.game];
    const srcs = (mod && mod.bookSources && mod.bookSources()) || [{ key: 'std', label: '', rules: null, n: 4 }];
    const src = srcs.find((x) => x.key === book.src) || srcs[0];
    book.src = src.key;
    if (!B.TABS.some((t) => t.key === book.tab)) book.tab = B.TABS[0].key;
    $('book-title').textContent = 'ルールブック' + (D.Games[book.game] ? '・' + D.Games[book.game].label : '');
    $('book-tabs').innerHTML = B.TABS.map((t) => '<button type="button" role="tab" data-tab="' + t.key + '" aria-selected="' + (t.key === book.tab) + '">' + esc(t.label) + '</button>').join('');
    $('book-tabs').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { book.tab = b.dataset.tab; renderBook(); $('book-body').scrollTop = 0; }));
    const pick = srcs.length > 1 && (book.tab === 'basics' || book.tab === 'rules') ? '<div class="book-src"><span>説明するルール</span>' +
      '<div class="seg">' + srcs.map((x) => '<button type="button" data-src="' + x.key + '" aria-pressed="' + (x.key === src.key) + '">' + esc(x.label) + '</button>').join('') + '</div></div>' : '';
    $('book-body').innerHTML = pick + B.render(book.tab, src.rules, src.n);
    $('book-body').querySelectorAll('.book-src button').forEach((b) => b.addEventListener('click', () => { book.src = b.dataset.src; renderBook(); }));
  }

  /** game のルールブックを開く。tab：章、src：どのルールを説明するか（bookSources の key） */
  function openBook(game, tab, src) {
    book.game = game || book.game;
    if (tab) book.tab = tab;
    book.src = src || '';
    const lg = $('log');
    if (lg) lg.hidden = true;
    if (D.OnlineClient) D.OnlineClient.closeChat();
    $('book').hidden = false;
    renderBook();
    $('book-body').scrollTop = 0;
    setTimeout(() => $('book-close').focus({ preventScroll: true }), 30);
  }
  function closeBook() { const b = $('book'); if (b) b.hidden = true; }
  const bookOpen = () => !$('book').hidden;

  function init() {
    $('book-close').innerHTML = A.icon('close');
    $('book-close').addEventListener('click', closeBook);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && bookOpen() && $('overlay').hidden) closeBook(); });
    document.querySelectorAll('[data-sound-btn]').forEach((b) => b.addEventListener('click', toggleSound));
    applySettings();
  }

  D.Games = D.Games || {};
  D.Books = D.Books || {};
  D.Common = {
    store, settings, save, applySettings, toggleSound, playerName, LEVEL_LABEL, SPEEDS,
    showScreen, onShow, visible, seg, toggle, row, section,
    ratingOf, recordRating, applyRatedLocal, abandonRatedLocal, abandonNote, rateNote, rateBoxHTML, animateRate, fmtExp, pct,
    openRatedDialog, askAbandon, finalHTML, ptsHTML,
    openBook, closeBook, bookOpen, init,
  };
})();

</script>
<script>
/* ホーム画面に追加（アプリとして使う）の案内。
 * Android・PCの Chrome / Edge は「追加する」でそのままインストール画面を出す（beforeinstallprompt）。
 * iPhone は Safari でも Chrome でも共有ボタンから追加できるので、開いているブラウザに合わせた手順を見せる。
 * LINE などアプリの中のブラウザでは追加できないので、ふつうのブラウザで開き直す案内をする。 */
(function () {
  'use strict';
  const D = globalThis.DFG;
  const A = D.Art, UI = D.UI, CM = D.Common, SND = D.Sound;
  const esc = UI.esc;

  const ua = typeof navigator !== 'undefined' ? navigator.userAgent : '';
  const isIPadOS = /Macintosh/.test(ua) && typeof navigator !== 'undefined' && navigator.maxTouchPoints > 1;
  const platform = /iPhone|iPad|iPod/.test(ua) || isIPadOS ? 'ios' : /Android/.test(ua) ? 'android' : 'desktop';
  function browserName() {
    if (/ Line\//i.test(ua)) return 'line';
    if (/Instagram|FBAN|FBAV|Twitter|; wv\)/.test(ua)) return 'inapp';
    if (platform === 'ios') return /CriOS/.test(ua) ? 'chrome' : /EdgiOS/.test(ua) ? 'edge' : /FxiOS/.test(ua) ? 'firefox' : 'safari';
    if (/SamsungBrowser/.test(ua)) return 'samsung';
    if (/Edg(A)?\//.test(ua)) return 'edge';
    if (/Firefox\//.test(ua)) return 'firefox';
    if (/Chrome\//.test(ua)) return 'chrome';
    if (/Safari\//.test(ua)) return 'safari';
    return 'other';
  }
  const browser = browserName();

  // Chrome / Edge がくれる「インストールしてよいか」を聞く画面（出せるときだけ届く）
  let deferred = null;
  let installed = false;
  addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; refresh(); });
  addEventListener('appinstalled', () => { installed = true; deferred = null; refresh(); UI.toast('ホーム画面に追加しました', 2500); });
  let onChange = null;
  function refresh() { if (onChange) onChange(); }

  const standalone = () => installed ||
    (typeof matchMedia === 'function' && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches)) ||
    (typeof navigator !== 'undefined' && navigator.standalone === true);
  const inArtifact = () => !!(globalThis.claude && globalThis.claude.hot) || /claude(usercontent)?\.(ai|com)$/i.test(location.hostname);

  /** 案内を出してよい環境か（Claude のページの中やアプリとして開いているときは出さない） */
  const available = () => !inArtifact() && !standalone();

  // ── ホームの上の小さな案内（スマホだけ。閉じたら30日は出さない） ──
  const TIP_OFF_DAYS = 30;
  function showTip() {
    if (!available() || platform === 'desktop') return false;
    const off = CM.store.installTipOff || 0;
    return Date.now() - off > TIP_OFF_DAYS * 86400000;
  }
  function hideTip() { CM.store.installTipOff = Date.now(); CM.save(); refresh(); }

  // ── 手順 ──
  const ic = (name) => '<span class="step-ic">' + A.icon(name, 18) + '</span>';
  function steps() {
    if (browser === 'line' || browser === 'inapp') {
      const app = browser === 'line' ? 'LINE' : 'このアプリ';
      return {
        lead: app + 'の中のブラウザでは、ホーム画面に追加できません。いつものブラウザ（' + (platform === 'ios' ? 'Safari や Chrome' : 'Chrome') + '）で開き直してから追加してください。',
        list: ['下の「ブラウザで開く」をタップ（開かないときは、画面の ' + ic('dots') + ' や「…」メニューから「ブラウザで開く」／「Safariで開く」）',
          '開いたブラウザで、もう一度「ホーム画面に追加」を押す'],
        external: true,
      };
    }
    if (platform === 'ios') {
      if (browser === 'chrome' || browser === 'edge' || browser === 'firefox') {
        const name = { chrome: 'Chrome', edge: 'Edge', firefox: 'Firefox' }[browser];
        return {
          lead: name + ' でもホーム画面に追加できます。',
          list: ['アドレスバーの右にある 共有ボタン ' + ic('share') + ' をタップ（見つからないときは、右下の「…」メニュー →「共有」）',
            '下にスクロールして「<b>ホーム画面に追加</b>」' + ic('addHome'),
            '「Webアプリとして開く」がオンなのを確かめて、右上の「<b>追加</b>」'],
        };
      }
      return {
        lead: 'Safari の共有ボタンから追加できます。',
        list: ['画面の下（または上）の 共有ボタン ' + ic('share') + ' をタップ',
          '下にスクロールして「<b>ホーム画面に追加</b>」' + ic('addHome'),
          '「Webアプリとして開く」がオンなのを確かめて、右上の「<b>追加</b>」'],
      };
    }
    if (platform === 'android') {
      const menu = browser === 'samsung' ? '下の「≡」メニュー' : browser === 'firefox' ? '右上（または右下）の ' + ic('dots') + ' メニュー' : '右上の ' + ic('dots') + ' メニュー';
      return {
        lead: 'ブラウザのメニューから追加できます。',
        list: [menu + ' を開く', '「<b>ホーム画面に追加</b>」または「<b>アプリをインストール</b>」', '確認の画面で「<b>インストール</b>」／「<b>追加</b>」'],
      };
    }
    if (browser === 'safari') {
      return { lead: 'Mac の Safari では Dock に追加できます。', list: ['メニューバーの「ファイル」→「<b>Dockに追加</b>」', '「<b>追加</b>」'] };
    }
    return {
      lead: 'Chrome / Edge ではアプリとしてインストールできます。',
      list: ['アドレスバーの右端のインストールボタン、または ' + ic('dots') + ' メニューを開く', '「<b>インストール</b>」（Chrome は「キャスト、保存、共有」の中）を選ぶ'],
    };
  }

  /** 開いているページを、アプリの中のブラウザの外（ふつうのブラウザ）で開き直す URL（LINE の openExternalBrowser） */
  function externalURL() {
    return location.origin + location.pathname + '?openExternalBrowser=1' + location.hash;
  }

  function showGuide() {
    const s = steps();
    const dlg = UI.openDialog('<h3>ホーム画面に追加</h3><p>アイコンから、アプリのように全画面で遊べます。' + esc(s.lead) + '</p>' +
      '<ol class="install-steps">' + s.list.map((t) => '<li>' + t + '</li>').join('') + '</ol>' +
      '<p class="menu-note">追加したアプリの記録（レート・途中の対局）は、ブラウザで遊んだ記録とは別になります。</p>' +
      '<div class="btns">' + (s.external ? '<a class="btn btn-gold" id="ins-ext" href="' + esc(externalURL()) + '">ブラウザで開く</a>' : '') +
      '<button class="btn ' + (s.external ? 'btn-ghost' : 'btn-gold') + '" type="button" id="ins-ok">わかった</button></div>', { onBackdrop: UI.closeDialog });
    dlg.querySelector('#ins-ok').addEventListener('click', UI.closeDialog);
  }

  /** 「追加する」：Chrome / Edge ならインストール画面、ほかは手順 */
  async function start() {
    SND.play('select');
    if (deferred) {
      const ev = deferred;
      deferred = null;
      try {
        ev.prompt();
        const r = await ev.userChoice;
        if (r && r.outcome === 'accepted') { installed = true; refresh(); }
      } catch (e) { showGuide(); }
      refresh();
      return;
    }
    showGuide();
  }

  // ── 画面の部品 ──
  /** ホームの上に出す案内の中身（出さないときは空） */
  function tipHTML() {
    if (!showTip()) return '';
    return '<span class="it-ic">' + A.icon('addHome', 22) + '</span>' +
      '<span class="it-text"><b>ホーム画面に追加</b>すると、アプリのように全画面で遊べます</span>' +
      '<button class="btn btn-gold btn-sm" type="button" data-ins="go">' + (deferred ? '追加する' : '追加のしかた') + '</button>' +
      '<button class="icon-btn it-close" type="button" data-ins="off" aria-label="案内を閉じる">' + A.icon('close', 16) + '</button>';
  }
  function bindTip(el) {
    const go = el.querySelector('[data-ins="go"]');
    const off = el.querySelector('[data-ins="off"]');
    if (go) go.addEventListener('click', start);
    if (off) off.addEventListener('click', hideTip);
  }

  /** マイページの1行（アプリとして開いているときは「追加済み」） */
  function mySection() {
    if (inArtifact()) return null;
    const sec = CM.section('アプリとして使う', standalone() ? '' : 'アイコンから全画面で遊べます');
    if (standalone()) {
      sec.panel.appendChild(CM.row('ホーム画面のアプリで遊んでいます', 'ブラウザで開いたときとは別に、記録が保存されます', null));
    } else {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn btn-gold btn-sm';
      b.textContent = deferred ? '追加する' : '追加のしかた';
      b.addEventListener('click', start);
      sec.panel.appendChild(CM.row(platform === 'desktop' ? 'アプリとしてインストール' : 'ホーム画面に追加', guideLabel(), b));
    }
    return sec.s;
  }
  function guideLabel() {
    if (browser === 'line' || browser === 'inapp') return 'いまはアプリの中のブラウザです。ふつうのブラウザで開き直してください';
    if (platform === 'ios') return ({ chrome: 'Chrome', edge: 'Edge', firefox: 'Firefox' }[browser] || 'Safari') + ' の共有ボタンから追加できます';
    return deferred ? 'ボタンを押すと、すぐに追加できます' : 'ブラウザのメニューから追加できます';
  }

  /** 開いたときに付いてきた LINE 用のしるし（?openExternalBrowser=1）は、アドレスから消しておく */
  function cleanURL() {
    if (!/[?&]openExternalBrowser=/.test(location.search)) return;
    const q = location.search.replace(/[?&]openExternalBrowser=[^&]*/g, '').replace(/^&/, '?');
    try { history.replaceState(null, '', location.pathname + (q === '?' ? '' : q) + location.hash); } catch (e) { /* 無視 */ }
  }

  D.Install = {
    platform, browser, available, standalone, showTip, tipHTML, bindTip, mySection, start, showGuide, cleanURL,
    set onChange(f) { onChange = f; },
    get canPrompt() { return !!deferred; },
  };
})();

</script>
<script>
/* オンライン対戦（画面側・共通）：部屋への接続・待合室・チャット・招待。
 * 対局中の表示と操作は各ゲームの online（D.Games[game].online）が受け持つ */
(function () {
  'use strict';
  const D = globalThis.DFG;
  const A = D.Art, SND = D.Sound, UI = D.UI, RT = D.Rating, CM = D.Common;
  const $ = (id) => document.getElementById(id);
  const esc = UI.esc;
  const store = CM.store;

  // 待合室で選べる設定（サーバーの online-room.js と同じ）
  const LOBBY = {
    daifugo: { players: [3, 4, 5, 6], games: [{ v: 5, label: '5' }, { v: 10, label: '10' }, { v: 0, label: '無制限' }], ai: ['easy', 'normal'] },
    sevens: { players: [3, 4, 5, 6], games: [{ v: 5, label: '5' }, { v: 10, label: '10' }, { v: 0, label: '無制限' }], ai: ['easy', 'normal'] },
    speed: { players: [2], games: [{ v: 1, label: '1ゲーム' }, { v: 3, label: '3本勝負' }, { v: 5, label: '5本勝負' }], ai: ['easy', 'normal', 'hard'] },
  };

  const OC = { cur: null, draftCode: '', entryGame: 'daifugo' };
  const mod = (o) => D.Games[(o && o.game) || OC.entryGame];

  /** 招待リンク。LINE で送っても LINE の中ではなく、いつものブラウザ（Safari・Chrome）で開くように openExternalBrowser を付ける
   * （いつものブラウザならホーム画面にも追加できる。開いたあとアドレスからは消す：Install.cleanURL） */
  function inviteURL(code) {
    const h = location.hostname;
    const here = h === 'localhost' || h === '127.0.0.1' || /github\.io$/.test(h);
    return (here ? location.origin + location.pathname : D.Net.APP_URL) + '?openExternalBrowser=1#r-' + code;
  }

  function showOnlineScreen() {
    CM.showScreen('scr-online');
    renderOnline();
  }

  /** オンライン対戦の入口（game のタブから）。code があればその部屋へ */
  function openOnline(game, code) {
    if (game) OC.entryGame = game;
    for (const g of Object.keys(D.Games)) if (D.Games[g].stopLocal) D.Games[g].stopLocal();
    if (!D.Net.available()) { UI.toast('オンライン対戦はアプリ版（GitHubのページ）で遊べます', 4000); return; }
    if (code && !OC.cur) {
      OC.draftCode = code;
      if (CM.playerName()) { joinRoom(code); return; }
    }
    showOnlineScreen();
  }

  function setConn(s) {
    const o = OC.cur;
    if (!o) return;
    o.status = s;
    $('online-conn').textContent = { connecting: '接続中…', retry: '再接続中…', closed: '切断' }[s] || '';
    if (s === 'retry' && o.gameShown) UI.toast('通信が切れました。つなぎ直しています…', 2500);
    if (CM.visible('scr-online') && !o.view) renderOnline();
  }

  function joinRoom(code) {
    const name = CM.playerName();
    if (!name) { UI.toast('名前を入れてください'); return; }
    leaveRoom(true);
    const o = { code, game: null, conn: null, view: null, queue: [], busy: false, waiting: false, sig: '', waitingSig: '', sentSig: '',
      seat: -1, gameShown: false, resultsOpen: false, status: 'connecting', chat: [], unread: 0 };
    OC.cur = o;
    UI.roomCode = code;
    updateChatButtons();
    o.conn = D.Net.connect(code, {
      onOpen: () => { if (OC.cur === o) o.conn.send({ t: 'hello', cid: D.Net.clientId(), name, game: OC.entryGame }); },
      onMessage: (m) => { if (OC.cur === o) onMessage(o, m); },
      onStatus: (s) => { if (OC.cur === o) setConn(s); },
      onClosed: (c) => {
        if (OC.cur !== o) return;
        OC.cur = null;
        UI.roomCode = null;
        closeChat();
        updateChatButtons();
        if (c === 4000) UI.toast('ほかの画面でこの部屋に入ったので、こちらは切断しました', 4000);
        showOnlineScreen();
      },
    });
    try { history.replaceState(null, '', location.pathname + location.search + '#r-' + code); } catch (e) { /* 無視 */ }
    showOnlineScreen();
  }

  /** 部屋を出る（対局中ならその席はAIが引き継ぐ） */
  function leaveRoom(silent) {
    const o = OC.cur;
    if (!o) return;
    OC.cur = null;
    UI.roomCode = null;
    UI.seatInfo = null;
    closeChat();
    updateChatButtons();
    const m = D.Games[o.game];
    if (m && m.online && m.online.cancelInput) m.online.cancelInput();
    o.conn.send({ t: 'leave' });
    setTimeout(() => o.conn.close(), 200);
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* 無視 */ }
    if (!silent) { UI.closeDialog(); UI.hidePrompt(); D.Shell.showHome(o.game || OC.entryGame); }
  }

  function onMessage(o, m) {
    if (m.t === 'error') {
      const gm = o.game && D.Games[o.game];
      if (gm && gm.online.onError && gm.online.onError(m.error)) return;
      UI.toast(m.error, 3000);
      SND.play('error');
      return;
    }
    if (m.t === 'chat') { onChatItem(o, m.item, false); return; }
    if (m.t === 'chatlog') { o.chat = Array.isArray(m.items) ? m.items.slice(-60) : []; renderChat(); updateChatButtons(); return; }
    if (m.t !== 'room') return;
    if (!o.game) o.game = m.game || 'daifugo';
    const gm = D.Games[o.game];
    if (gm.online.quickUpdate && gm.online.quickUpdate(o, m)) return;
    o.queue.push(m);
    pump(o);
  }

  async function pump(o) {
    if (o.busy) return;
    o.busy = true;
    try {
      while (OC.cur === o && o.queue.length) await handleView(o, o.queue.shift());
    } catch (e) {
      console.error(e);
    }
    o.busy = false;
  }

  function rememberRating(o, v) {
    const me = v.members && v.members.find((m) => m.you);
    if (!me || me.rating == null) return;
    const g = o.game || 'daifugo';
    const cur = store.onlineRatings[g] || {};
    if (cur.r === me.rating && cur.matches === me.matches) return;
    store.onlineRatings[g] = { r: me.rating, matches: me.matches || 0 };
    CM.save();
  }

  async function handleView(o, v) {
    o.view = v;
    rememberRating(o, v);
    if (v.phase === 'lobby') {
      if (o.gameShown) { o.gameShown = false; o.resultsOpen = false; UI.closeDialog(); UI.hidePrompt(); }
      if (!CM.visible('scr-online')) showOnlineScreen(); else renderOnline();
      return;
    }
    if (!(v.seat >= 0)) return;
    await mod(o).online.handleView(o, v);
  }

  function reask() {
    const o = OC.cur;
    if (o && o.game) mod(o).online.reask(o);
  }

  function confirmLeave(fromResults) {
    const o = OC.cur;
    const playing = o && o.gameShown;
    const S = playing && mod(o).state();
    const ratedLive = playing && S && S.rated && !S.matchOver && o.view && o.view.youRated;
    const winloss = RT.cfg(o && o.game).kind === 'winloss';
    UI.openDialog('<h3>部屋を出ますか？</h3><p>' + (playing ? '対局中のあなたの席は、AIロボットが引き継ぎます。' : 'もう一度入るには、招待リンクか部屋コードが必要です。') +
      (ratedLive ? '<br><b>レート戦の途中なので棄権になり、</b>' + (winloss ? '負けとして計算されます。' : '残りのゲームは最下位（−3点）として計算されます。') : '') + '</p>' +
      '<div class="btns"><button class="btn btn-ghost" type="button" id="lv-no">やめる</button><button class="btn btn-gold" type="button" id="lv-yes">部屋を出る</button></div>',
    { onBackdrop: () => back() });
    function back() {
      UI.closeDialog();
      if (fromResults && OC.cur) mod(OC.cur).online.showResults(OC.cur);
      else reask();
    }
    $('lv-no').addEventListener('click', back);
    $('lv-yes').addEventListener('click', () => leaveRoom(false));
  }

  function openMenu(onClose) {
    const o = OC.cur;
    UI.openDialog('<h3>メニュー</h3><div class="menu-list">' +
      '<button class="btn btn-gold" type="button" id="m-close">対局に戻る</button>' +
      '<button class="btn btn-ghost" type="button" id="m-invite">友だちを招待</button>' +
      '<button class="btn btn-ghost" type="button" id="m-book">ルールブック</button>' +
      '<button class="btn btn-ghost" type="button" id="m-leave">部屋を出る</button></div>', { onBackdrop: close });
    function close() { UI.closeDialog(); if (onClose) onClose(); reask(); }
    $('m-close').addEventListener('click', close);
    $('m-invite').addEventListener('click', () => { if (OC.cur) invite(OC.cur.code); });
    $('m-book').addEventListener('click', () => { close(); CM.openBook(o.game, 'rules', 'game'); });
    $('m-leave').addEventListener('click', () => confirmLeave(false));
  }

  async function invite(code) {
    const url = inviteURL(code);
    const g = RT.cfg((OC.cur && OC.cur.game) || OC.entryGame).label;
    const text = g + 'で遊ぼう！ 部屋コード ' + code;
    if (navigator.share) {
      try { await navigator.share({ title: g, text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try {
      await navigator.clipboard.writeText(text + '\n' + url);
      UI.toast('招待リンクをコピーしました。LINEなどに貼り付けて送ってください', 3500);
    } catch (e) {
      UI.toast('このリンクを送ってください：' + url, 6000);
    }
  }

  // ── チャット（部屋の人だけに届く。サーバーは直近30件だけ持つ） ──
  const CHAT_PRESETS = ['よろしく！', 'ナイス！', 'やられた〜', 'すごい！', 'ありがとう', 'もう1回！', 'ちょっと待って', '強すぎ😂'];
  const CHAT_COLORS = ['#f3dd9b', '#8ecae6', '#f4a3b5', '#a7d98b', '#c9b3ff', '#f6bd7c'];

  function chatColor(pid) {
    let h = 0;
    for (const ch of String(pid || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return CHAT_COLORS[h % CHAT_COLORS.length];
  }
  function myPid() {
    const v = OC.cur && OC.cur.view;
    const me = v && v.members && v.members.find((m) => m.you);
    return me ? me.pid : null;
  }
  function hhmm(t) {
    const d = new Date(t);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function updateChatButtons() {
    const o = OC.cur;
    const n = o ? o.unread : 0;
    document.querySelectorAll('[data-chat-btn]').forEach((b) => {
      b.hidden = !o;
      b.setAttribute('aria-label', n ? 'チャット（未読' + n + '件）' : 'チャット');
      const badge = b.querySelector('.badge');
      if (badge) { badge.hidden = !n; badge.textContent = n > 9 ? '9+' : String(n); }
    });
    const lb = $('on-chat');
    if (lb) lb.textContent = n ? 'チャット（未読 ' + n + '）' : 'チャット';
  }

  function openChat() {
    const o = OC.cur;
    if (!o) return;
    document.querySelectorAll('.log').forEach((l) => { l.hidden = true; });
    CM.closeBook();
    $('chat').hidden = false;
    o.unread = 0;
    updateChatButtons();
    renderChat();
    if (matchMedia('(pointer: fine)').matches) setTimeout(() => $('chat-input').focus(), 30);
  }
  function closeChat() { const c = $('chat'); if (c) c.hidden = true; }

  function renderChat() {
    const o = OC.cur;
    if (!o || $('chat').hidden) return;
    const list = $('chat-list');
    const me = myPid();
    if (!o.chat.length) {
      list.innerHTML = '<li class="empty">まだメッセージはありません。<br>下のボタンからひとこと送れます。</li>';
      return;
    }
    list.innerHTML = o.chat.map((it) => {
      const mine = it.pid === me;
      return '<li class="' + (mine ? 'me' : '') + '"><span class="who" style="color:' + chatColor(it.pid) + '">' + esc(mine ? 'あなた' : it.name) +
        '<time>' + hhmm(it.at) + '</time></span><span class="msg">' + esc(it.text) + '</span></li>';
    }).join('');
    list.scrollTop = list.scrollHeight;
  }

  function onChatItem(o, item, fromLog) {
    if (!item || typeof item.text !== 'string') return;
    o.chat.push(item);
    if (o.chat.length > 60) o.chat.splice(0, o.chat.length - 60);
    const mine = item.pid === myPid();
    if (!mine && $('chat').hidden) o.unread++;
    updateChatButtons();
    renderChat();
    if (fromLog) return;
    if (!mine) SND.play('chat');
    // 対局中は、送った人の席の上に吹き出しで出す
    const gm = o.game && D.Games[o.game];
    if (o.gameShown && gm && gm.online.bubble) {
      const short = Array.from(item.text).length > 22 ? Array.from(item.text).slice(0, 21).join('') + '…' : item.text;
      gm.online.bubble(mine ? -1 : item.seat, item.name, short, mine);
    }
  }

  function sendChat(text) {
    const o = OC.cur;
    if (!o) return false;
    text = String(text || '').trim();
    if (!text) return false;
    if (!o.conn.send({ t: 'chat', text })) { UI.toast('通信が切れています。つながり直してから送ってください'); return false; }
    return true;
  }

  function init() {
    $('chat-close').innerHTML = A.icon('close');
    document.querySelectorAll('[data-chat-btn]').forEach((b) => {
      b.querySelector('.ic-slot').innerHTML = A.icon('chat');
      b.addEventListener('click', () => ($('chat').hidden ? openChat() : closeChat()));
    });
    $('chat-close').addEventListener('click', closeChat);
    $('chat-presets').innerHTML = CHAT_PRESETS.map((p) => '<button type="button">' + esc(p) + '</button>').join('');
    $('chat-presets').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => sendChat(b.textContent)));
    $('chat-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = $('chat-input');
      if (sendChat(input.value)) input.value = '';
    });
    // スマホのキーボードでチャット欄が隠れないように、キーボードの高さだけ持ち上げる
