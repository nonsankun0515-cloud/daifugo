    const vv = globalThis.visualViewport;
    if (vv) {
      const fit = () => {
        const kb = Math.max(0, innerHeight - vv.height - vv.offsetTop);
        document.documentElement.style.setProperty('--kb', Math.round(kb) + 'px');
      };
      vv.addEventListener('resize', fit);
      vv.addEventListener('scroll', fit);
    }
    $('online-back').innerHTML = A.icon('back');
    $('online-back').addEventListener('click', () => { if (OC.cur) confirmLeave(false); else D.Shell.showHome(OC.entryGame); });
    updateChatButtons();
  }

  // ── 画面：入口・待合室 ──
  function renderOnline() {
    const wrap = $('online-wrap');
    const o = OC.cur;
    const g = (o && o.game) || OC.entryGame;
    $('online-title').textContent = 'オンライン・' + RT.cfg(g).label;
    if (!o) { renderEntry(wrap); return; }
    const v = o.view;
    if (!v) {
      wrap.innerHTML = '<section class="online-wait"><p class="wait-big">' + (o.status === 'retry' ? 'サーバーにつなぎ直しています…' : '部屋に入っています…') +
        '</p><p class="row-desc">部屋コード <b class="code-inline">' + esc(o.code) + '</b></p><button class="btn btn-ghost" type="button" id="on-cancel">やめる</button></section>';
      $('on-cancel').addEventListener('click', () => leaveRoom(false));
      return;
    }
    if (v.phase === 'lobby') { renderLobby(wrap, o, v); return; }
    wrap.innerHTML = '<section class="online-wait"><p class="wait-big">対局中です</p><button class="btn btn-gold" type="button" id="on-return">対局に戻る</button></section>';
    $('on-return').addEventListener('click', () => { mod(o).online.showTable(o); reask(); });
  }

  function renderEntry(wrap) {
    const g = OC.entryGame;
    const orr = store.onlineRatings[g];
    wrap.innerHTML =
      '<section class="online-rate"><span class="lbl">' + esc(RT.cfg(g).label) + '・オンラインレート</span><b>' + (orr ? orr.r : RT.START) + '</b><span class="sub">' +
      (orr && orr.matches ? orr.matches + '試合' : 'レート戦の部屋で遊ぶと変わります') + '</span></section>' +
      '<section><h3 class="sect-title">あなたの名前<small>ほかの人に表示されます</small></h3><div class="card-panel"><div class="row">' +
      '<input class="name-input wide" id="on-name" maxlength="8" placeholder="名前（8文字まで）" autocomplete="nickname" value="' + esc(CM.playerName()) + '"></div></div></section>' +
      '<section><h3 class="sect-title">部屋を作る<small>' + esc(RT.cfg(g).label) + 'の部屋</small></h3><div class="card-panel"><div class="row col"><div class="row-desc">部屋を作ると招待リンクができます。LINEなどで友だちに送ってください。人数が足りない席にはAIロボットが入ります。</div>' +
      '<button class="btn btn-gold" type="button" id="on-create">部屋を作る</button></div></div></section>' +
      '<section><h3 class="sect-title">部屋に入る<small>招待された5文字のコード（どのゲームの部屋でも入れます）</small></h3><div class="card-panel"><div class="row join-row">' +
      '<input class="code-input" id="on-code" maxlength="5" placeholder="ABCDE" autocomplete="off" autocapitalize="characters" spellcheck="false" value="' + esc(OC.draftCode) + '">' +
      '<button class="btn btn-ghost" type="button" id="on-join">入る</button></div></div></section>';
    const nameIn = $('on-name');
    const saveName = () => { CM.settings.name = nameIn.value.replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 8) || 'あなた'; CM.save(); };
    nameIn.addEventListener('change', saveName);
    $('on-create').addEventListener('click', () => { saveName(); SND.unlock(); joinRoom(D.Net.newRoomCode()); });
    const doJoin = () => {
      saveName();
      SND.unlock();
      const code = $('on-code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!/^[A-Z0-9]{5}$/.test(code)) { UI.toast('部屋コードは英数字5文字です'); return; }
      OC.draftCode = code;
      joinRoom(code);
    };
    $('on-join').addEventListener('click', doJoin);
    $('on-code').addEventListener('keydown', (e) => { if (e.key === 'Enter') doJoin(); });
    if (OC.draftCode && !CM.playerName()) setTimeout(() => nameIn.focus(), 50);
  }

  function renderLobby(wrap, o, v) {
    const g = o.game;
    const L = LOBBY[g], c = RT.cfg(g), gm = D.Games[g];
    const n = v.settings.players;
    const rated = v.settings.mode === 'rated';
    const gamesLabel = (x) => (L.games.find((y) => y.v === x) || { label: String(x) }).label;
    const rows = v.members.map((m) => '<div class="member"><span class="dot ' + (m.connected ? 'on' : 'off') + '"></span>' +
      '<span class="mname">' + esc(m.name) + (m.you ? '<small>（あなた）</small>' : '') + '</span>' + (m.host ? '<span class="host-chip">ホスト</span>' : '') +
      '<span class="rt-chip" title="オンラインレート">' + (m.rating == null ? RT.START : m.rating) + '</span></div>').join('');
    let ai = '';
    for (let i = v.members.length; i < n; i++) {
      ai += '<div class="member ai"><span class="dot ai"></span><span class="mname">AIロボット</span>' +
        (rated ? '<span class="rt-chip">' + (c.ai[v.settings.aiLevel] || c.ai.normal) + '</span>' : '') + '</div>';
    }
    const fixed = c.kind === 'winloss' ? c.players + '人・' + c.games + '本勝負' : c.players + '人・' + c.games + 'ゲーム';
    wrap.innerHTML =
      '<section class="room-head"><div class="room-game">' + esc(c.label) + '</div><div class="room-label">部屋コード</div><div class="room-code">' + esc(v.code) + '</div>' +
      '<button class="btn btn-gold" type="button" id="on-invite">友だちを招待</button>' +
      '<p class="row-desc invite-url">' + esc(inviteURL(v.code)) + '</p></section>' +
      '<section><h3 class="sect-title">参加者<small>' + v.members.length + '人 ＋ AIロボット' + Math.max(0, n - v.members.length) + '体</small></h3>' +
      '<div class="card-panel member-list">' + rows + ai + '</div></section>' +
      '<section id="on-settings"></section>' +
      '<section class="lobby-actions" id="on-actions"></section>';
    $('on-invite').addEventListener('click', () => invite(v.code));
    const box = $('on-settings');
    const { row, seg } = CM;
    if (v.host) {
      box.innerHTML = '<h3 class="sect-title">設定<small>ホストだけが変えられます</small></h3>';
      const panel = document.createElement('div');
      panel.className = 'card-panel';
      panel.appendChild(row('遊び方', rated ? fixed + '・' + c.rulesLabel + 'で固定。結果でオンラインレートが上下します' : 'レートは変わりません',
        seg([{ v: 'free', label: 'フリー対戦' }, { v: 'rated', label: 'レート戦' }], v.settings.mode, (x) => {
          if (x === 'rated' && v.members.length > c.players) { UI.toast('レート戦は' + c.players + '人までです'); return; }
          o.conn.send({ t: 'config', mode: x });
        })));
      if (rated) {
        panel.appendChild(row('人数・ゲーム数', fixed + '（固定）。足りない席はAIロボット', null));
      } else {
        if (L.players.length > 1) {
          const min = Math.max(L.players[0], v.members.length);
          panel.appendChild(row('人数', '足りない席はAIロボット', seg(L.players.map((x) => ({ v: x, label: x + '人' })), n,
            (x) => { if (x >= min) o.conn.send({ t: 'config', players: x }); else UI.toast('部屋にいる人数より少なくはできません'); })));
        }
        panel.appendChild(row(c.kind === 'winloss' ? '試合の長さ' : '1試合のゲーム数', '', seg(L.games, v.settings.games, (x) => o.conn.send({ t: 'config', games: x }))));
      }
      panel.appendChild(row('AIの強さ', rated ? 'AIのレート：' + L.ai.map((lv) => CM.LEVEL_LABEL[lv] + ' ' + c.ai[lv]).join('・') : '',
        seg(L.ai.map((lv) => ({ v: lv, label: CM.LEVEL_LABEL[lv] })), v.settings.aiLevel, (x) => o.conn.send({ t: 'config', aiLevel: x }))));
      panel.appendChild(row('ルール', rated ? c.rulesLabel + '（固定）' : gm.online.rulesDesc(), null));
      box.appendChild(panel);
      $('on-actions').innerHTML = '<button class="btn btn-gold btn-lg" type="button" id="on-start">この部屋で始める</button>' +
        '<button class="btn btn-ghost" type="button" id="on-chat">チャット</button>' +
        '<button class="btn btn-ghost" type="button" id="on-leave">部屋を出る</button>';
      $('on-start').addEventListener('click', () => { SND.unlock(); o.conn.send({ t: 'start', rules: gm.online.startRules() }); $('on-start').disabled = true; });
    } else {
      const what = rated ? 'レート戦（' + fixed + '）' : 'フリー対戦・' + n + '人・' + (c.kind === 'winloss' ? gamesLabel(v.settings.games) : v.settings.games ? v.settings.games + 'ゲーム' : 'ゲーム数は無制限');
      box.innerHTML = '<h3 class="sect-title">設定</h3><div class="card-panel"><div class="row"><div class="row-text"><div class="row-name">' + esc(what) + '</div>' +
        '<div class="row-desc">' + (rated ? '結果でオンラインレートが上下します。' : '') + 'ルールと人数はホストが決めます。AIの強さ：' + CM.LEVEL_LABEL[v.settings.aiLevel] + '</div></div></div></div>';
      $('on-actions').innerHTML = '<p class="wait-big">ホストが始めるのを待っています…</p>' +
        '<button class="btn btn-ghost" type="button" id="on-chat">チャット</button>' +
        '<button class="btn btn-ghost" type="button" id="on-leave">部屋を出る</button>';
    }
    $('on-chat').addEventListener('click', openChat);
    updateChatButtons();
    $('on-leave').addEventListener('click', () => confirmLeave(false));
  }

  Object.assign(OC, {
    init, openOnline, joinRoom, leaveRoom, reask, confirmLeave, openMenu, invite, openChat, closeChat, updateChatButtons,
    renderOnline, showOnlineScreen, inviteURL,
  });
  D.OnlineClient = OC;
})();

</script>
<script>
/* アプリの外枠：下のナビ（ゲームの切り替え）・各ゲームのホーム・マイページ */
(function () {
  'use strict';
  const D = globalThis.DFG;
  const A = D.Art, UI = D.UI, RT = D.Rating, CM = D.Common, SND = D.Sound;
  const $ = (id) => document.getElementById(id);
  const esc = UI.esc;
  const store = CM.store;

  const TABS = [
    { key: 'daifugo', label: '大富豪', icon: 'crown' },
    { key: 'sevens', label: '七並べ', icon: 'seven' },
    { key: 'speed', label: 'スピード', icon: 'bolt' },
    { key: 'me', label: 'マイページ', icon: 'user' },
  ];
  let current = 'daifugo';

  /** AI戦レートの帯（ホームの上部） */
  function rateStripHTML(game) {
    const rt = CM.ratingOf(game);
    return '<span class="lbl">AI戦レート</span><b>' + rt.r + '</b><span class="sub">' +
      (rt.matches ? rt.matches + '試合 · 最高 ' + rt.best : 'まだレート戦をしていません') + '</span>';
  }

  /** ホームの見出し部分（フェルトの上にカードの絵とゲーム名） */
  function heroHTML(o) {
    return '<header class="hero"><div class="hero-art">' + (o.art || '') + '</div>' +
      '<h1 class="hero-title"><span class="kanji">' + esc(o.title) + '</span><span class="en">' + esc(o.en) + '</span></h1>' +
      '<p class="hero-tag">' + esc(o.tag) + '</p></header>';
  }

  /** 七並べ・スピードのホーム（大富豪は index.html に同じ形で書いてある） */
  function homeHTML(o) {
    const p = o.prefix;
    return heroHTML(o) +
      '<p class="rate-strip" id="' + p + '-rating"></p>' +
      '<div class="home-cta">' +
      '<button class="btn btn-gold btn-lg" id="' + p + '-rated" type="button">レート戦</button>' +
      '<button class="btn btn-ghost btn-lg" id="' + p + '-free" type="button">フリー対戦</button>' +
      '<button class="btn btn-ghost btn-lg" id="' + p + '-resume" type="button" hidden>つづきから</button></div>' +
      '<div class="home-tiles">' +
      tileHTML(p + '-online', 'globe', 'オンライン') + tileHTML(p + '-book', 'book', 'ルールブック') + tileHTML(p + '-settings', 'sliders', 'ルールと設定') +
      '</div><p class="home-note" id="' + p + '-note"></p>';
  }
  function tileHTML(id, icon, label) {
    return '<button class="tile" id="' + id + '" type="button"><span class="ti">' + A.icon(icon, 22) + '</span><span>' + esc(label) + '</span></button>';
  }

  /** ホームに飾るカード（扇形に開く） */
  function fanHTML(ids, spread, tilt) {
    const k = ids.length;
    return '<div class="hero-fan">' + ids.map((id, i) => {
      const t = i - (k - 1) / 2;
      return '<div class="card" style="transform:translateX(calc(-50% + ' + (t * (spread || 30)) + 'px)) rotate(' + (t * (tilt == null ? 12 : tilt)) + 'deg);z-index:' + (i + 1) + '">' + A.faceSVG(id) + '</div>';
    }).join('') + '</div>';
  }

  function showHome(tab) {
    if (!TABS.some((t) => t.key === tab)) tab = 'daifugo';
    current = tab;
    CM.showScreen('scr-home');
    document.querySelectorAll('#tabbar button').forEach((b) => {
      const on = b.dataset.tab === tab;
      b.classList.toggle('on', on);
      b.setAttribute('aria-current', on ? 'page' : 'false');
    });
    document.querySelectorAll('.home-view').forEach((v) => { v.hidden = v.dataset.tab !== tab; });
    if (tab === 'me') renderMe();
    else if (D.Games[tab]) D.Games[tab].renderHome();
    renderInstallTip();
    $('home-scroll').scrollTop = 0;
    if (store.tab !== tab) { store.tab = tab; CM.save(); }
  }

  // ─────────────────────────────────────────────
  // マイページ：名前・全ゲームのレート・共通の設定
  // ─────────────────────────────────────────────
  function renderMe() {
    const wrap = $('home-me');
    const s = CM.settings;
    wrap.innerHTML = '';
    const head = document.createElement('section');
    head.className = 'me-card';
    head.innerHTML = '<span class="me-ava">' + A.humanSVG() + '</span><div class="me-name-box"><label for="me-name">あなたの名前</label>' +
      '<input class="name-input wide" id="me-name" maxlength="8" placeholder="名前（8文字まで）" autocomplete="nickname" value="' + esc(s.name === 'あなた' ? '' : s.name) + '">' +
      '<small>オンライン対戦でほかの人に表示されます</small></div>';
    wrap.appendChild(head);
    const nameIn = head.querySelector('#me-name');
    nameIn.addEventListener('change', () => { s.name = nameIn.value.replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 8) || 'あなた'; CM.save(); });

    // レート一覧
    const rs = document.createElement('section');
    rs.innerHTML = '<h3 class="sect-title">レート<small>AI戦はこの端末、オンラインはサーバーに記録</small></h3>';
    const tbl = document.createElement('div');
    tbl.className = 'card-panel rate-table';
    tbl.innerHTML = '<div class="rt-row rt-head"><span></span><span>AI戦</span><span>オンライン</span></div>' +
      ['daifugo', 'sevens', 'speed'].map((g) => {
        const a = CM.ratingOf(g), o = store.onlineRatings[g];
        return '<button class="rt-row" type="button" data-g="' + g + '"><span class="rt-game"><span class="ti">' + A.icon(TABS.find((t) => t.key === g).icon, 18) + '</span>' + esc(RT.cfg(g).label) + '</span>' +
          '<span><b>' + a.r + '</b><small>' + a.matches + '試合</small></span><span><b>' + (o ? o.r : '—') + '</b><small>' + (o ? o.matches + '試合' : '未') + '</small></span></button>';
      }).join('');
    tbl.querySelectorAll('.rt-row[data-g]').forEach((b) => b.addEventListener('click', () => showHome(b.dataset.g)));
    rs.appendChild(tbl);
    wrap.appendChild(rs);

    // 共通の設定
    const set = (k, v) => { s[k] = v; CM.save(); CM.applySettings(); renderMe(); };
    const st = CM.section('設定', 'すべてのゲームで共通');
    st.panel.appendChild(CM.row('スピード', '演出とAIの速さ', CM.seg([{ v: 'slow', label: 'ゆっくり' }, { v: 'normal', label: 'ふつう' }, { v: 'fast', label: 'はやい' }], s.speed, (v) => set('speed', v))));
    const sw = document.createElement('div');
    sw.className = 'swatches';
    for (const key of Object.keys(A.BACKS)) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'swatch';
      b.style.backgroundImage = A.backDataURI(key);
      b.setAttribute('aria-label', 'カードの裏：' + A.BACKS[key].label);
      b.setAttribute('aria-pressed', String(s.back === key));
      b.addEventListener('click', () => set('back', key));
      sw.appendChild(b);
    }
    st.panel.appendChild(CM.row('カードの裏', '', sw));
    st.panel.appendChild(CM.row('効果音', '', CM.toggle('opt-sound', s.sound, (v) => set('sound', v), false, '効果音')));
    st.panel.appendChild(CM.row('出せないときは自動でパス', '大富豪・七並べ', CM.toggle('opt-autopass', s.autoPass, (v) => set('autoPass', v), false, '自動パス')));
    st.panel.appendChild(CM.row('出せるカードを明るく表示', '', CM.toggle('opt-playable', s.showPlayable, (v) => set('showPlayable', v), false, '出せるカードを表示')));
    wrap.appendChild(st.s);

    const ins = D.Install.mySection();
    if (ins) wrap.appendChild(ins);

    const about = document.createElement('section');
    about.className = 'me-about';
    about.innerHTML = '<p class="muted">Cards Table — 大富豪・七並べ・スピード</p>';
    wrap.appendChild(about);
  }

  /** ホームの上の「ホーム画面に追加」の案内（スマホのブラウザで開いているときだけ） */
  function renderInstallTip() {
    const el = $('install-tip');
    const html = current === 'me' ? '' : D.Install.tipHTML();
    el.hidden = !html;
    el.innerHTML = html;
    if (html) D.Install.bindTip(el);
  }

  function init() {
    const bar = $('tabbar');
    bar.innerHTML = TABS.map((t) => '<button type="button" data-tab="' + t.key + '"><span class="tb-ic">' + A.icon(t.icon, 24) + '</span><span class="tb-lb">' + esc(t.label) + '</span></button>').join('');
    bar.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      if (b.dataset.tab === current && CM.visible('scr-home')) { $('home-scroll').scrollTo({ top: 0, behavior: 'smooth' }); return; }
      SND.play('select');
      showHome(b.dataset.tab);
    }));
    // 「追加する」ボタンが使えるようになった・追加し終わったら、案内を書き直す
    D.Install.onChange = () => {
      if (!CM.visible('scr-home')) return;
      renderInstallTip();
      if (current === 'me') renderMe();
    };
    // 大富豪のホームのボタン（index.html に書いてあるもの）
    $('btn-online').querySelector('.ti').innerHTML = A.icon('globe', 22);
    $('btn-book').querySelector('.ti').innerHTML = A.icon('book', 22);
    $('btn-rules').querySelector('.ti').innerHTML = A.icon('sliders', 22);
  }

  D.Shell = { init, showHome, rateStripHTML, homeHTML, heroHTML, fanHTML, tileHTML, TABS, get current() { return current; } };
})();

</script>
<script>
/* 大富豪 — 対局の進行と画面（アプリの中のゲームの1つ） */
(function () {
  'use strict';
  const D = globalThis.DFG;
  const E = D.Engine, C = D.Cards, RU = D.Rules, AI = D.AI, A = D.Art, SND = D.Sound, UI = D.UI, RT = D.Rating;
  const CM = D.Common, OC = D.OnlineClient;
  const $ = (id) => document.getElementById(id);
  const esc = UI.esc;
  const sleep = UI.sleep;
  const { seg, toggle, row, section } = CM;

  const store = CM.store;
  const settings = store.settings;
  const save = CM.save;

  let S = null;
  let loopToken = 0;
  let humanCancel = null;
  let fastForward = false;
  /** オンライン対戦中の大富豪の部屋（なければ null） */
  const onlineRoom = () => (OC.cur && OC.cur.game === 'daifugo' ? OC.cur : null);

  // ─────────────────────────────────────────────
  // 画面
  // ─────────────────────────────────────────────
  function showScreen(name) {
    if (name === 'title') { D.Shell.showHome('daifugo'); return; }
    if (name === 'online') { OC.showOnlineScreen(); return; }
    CM.showScreen('scr-' + name);
    if (name === 'rules') renderRules();
    saveHot();
  }

  const LEVEL_LABEL = CM.LEVEL_LABEL;

  function localRuleCount(r) {
    let k = 0;
    for (const def of RU.RULES) {
      if (def.cat === 'basic') continue;
      if (def.type === 'bool' && r[def.key]) k++;
      if (def.key === 'seqRevolution' && r[def.key] !== 'off') k++;
    }
    return k;
  }

  function presetLabel() {
    const key = RU.presetMatching(store.rules);
    const p = RU.PRESETS.find((x) => x.key === key);
    return p ? p.label : 'カスタム';
  }

  function renderHome() {
    const fan = $('title-fan');
    if (!fan.childElementCount) {
      const ids = ['C11', 'D12', 'X1', 'H13', 'S14'];
      ids.forEach((id, i) => {
        const el = UI.makeCardEl(id);
        const t = i - 2;
        el.style.transform = 'translateX(calc(-50% + ' + t * 30 + 'px)) rotate(' + t * 13 + 'deg)';
        el.style.zIndex = String(i + 1);
        fan.appendChild(el);
      });
    }
    const rt = store.rating;
    $('title-rating').innerHTML = D.Shell.rateStripHTML('daifugo');
    $('title-rule').innerHTML = 'フリー対戦のルール：<b>' + esc(presetLabel()) + '</b>（ローカルルール ' + localRuleCount(store.rules) + '個）';
    $('title-foot').textContent = 'フリー対戦：AIロボット' + (settings.players - 1) + '体（' + LEVEL_LABEL[settings.level] + '）· ' + settings.players + '人 · ' +
      (settings.games ? settings.games + 'ゲーム' : 'ゲーム数は無制限');
    const m = savedMatch();
    $('btn-resume').hidden = !m;
    if (m) $('btn-resume').textContent = 'つづきから（' + (m.rated ? 'レート戦 ' : '') + '第' + m.gameNo + (m.maxGames ? '/' + m.maxGames : '') + 'ゲーム）';
    // オンライン対戦はアプリ版（GitHub Pages）だけ。Claude のページ内では外と通信できない
    $('btn-online').hidden = !D.Net.available();
    if (!D.Net.available()) $('title-foot').textContent += ' · オンライン対戦はアプリ版で';
  }

  // ─────────────────────────────────────────────
  // ルールと設定
  // ─────────────────────────────────────────────
  function renderRules() {
    const wrap = $('rules-wrap');
    const keepScroll = $('rules-scroll').scrollTop;
    wrap.innerHTML = '';
    const set = (k, v) => { settings[k] = v; save(); renderRules(); };

    // 対戦設定（効果音・スピード・カードの裏・名前はマイページ）
    const m = section('対戦設定', 'フリー対戦の設定。レート戦は4人・マイルール・10ゲームで固定');
    m.panel.appendChild(row('人数', 'あなた＋AIロボット', seg([3, 4, 5, 6].map((v) => ({ v, label: v + '人' })), settings.players, (v) => set('players', v))));
    m.panel.appendChild(row('AIの強さ', settings.level === 'hard' ? '手札を読んで先の展開を試算します（考える時間が少し長め）' : '',
      seg([{ v: 'easy', label: 'やさしい' }, { v: 'normal', label: 'ふつう' }, { v: 'hard', label: 'つよい' }], settings.level, (v) => set('level', v))));
    m.panel.appendChild(row('1試合のゲーム数', settings.games ? settings.games + 'ゲームの総得点で順位を決めます' : '終わりなし。好きなところでやめられます',
      seg([{ v: 5, label: '5' }, { v: 10, label: '10' }, { v: 0, label: '無制限' }], settings.games, (v) => set('games', v))));
    wrap.appendChild(m.s);

    // プリセット
    const cur = RU.presetMatching(store.rules);
    const ps = document.createElement('section');
    ps.innerHTML = '<h3 class="sect-title">ルールのセット<small>選んでから下で1つずつ変えられます</small></h3>';
    const pl = document.createElement('div');
    pl.className = 'presets';
    for (const p of RU.PRESETS) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'preset';
      b.setAttribute('aria-pressed', String(cur === p.key));
      b.innerHTML = '<b>' + esc(p.label) + '</b><span>' + esc(p.desc) + '</span>';
      b.addEventListener('click', () => { store.rules = Object.assign({}, p.rules); save(); renderRules(); });
      pl.appendChild(b);
    }
    ps.appendChild(pl);
    if (!cur) {
      const note = document.createElement('p');
      note.className = 'custom-note';
      note.textContent = 'いまはカスタム（どのセットとも違う組み合わせ）です。';
      ps.appendChild(note);
    }
    wrap.appendChild(ps);

    // ルール一覧
    const R = store.rules;
    for (const cat of RU.CATEGORIES) {
      const sct = section(cat.label);
      for (const def of RU.RULES.filter((d) => d.cat === cat.key)) {
        const disabled = def.needs && !R[def.needs];
        const setRule = (v) => { store.rules[def.key] = v; save(); renderRules(); };
        const ctl = def.type === 'bool'
          ? toggle('rule-' + def.key, R[def.key], setRule, disabled, def.label)
          : seg(def.options, R[def.key], setRule, disabled);
        const wideChoice = def.type === 'choice' && (def.options.length > 2 || def.options.reduce((k, o) => k + o.label.length, 0) > 8);
        const r = row(def.label, def.desc, ctl, (disabled ? 'disabled ' : '') + (wideChoice ? 'col' : ''));
        sct.panel.appendChild(r);
      }
      wrap.appendChild(sct.s);
    }
    $('rules-scroll').scrollTop = keepScroll;
  }

  // ─────────────────────────────────────────────
  // 対局の開始・再開
  // ─────────────────────────────────────────────
  /** つづきから遊べる対局（終わった試合は含めない） */
  function savedMatch() {
    const m = store.match;
    if (!m || !(m.phase === 'play' || m.phase === 'exchange' || m.phase === 'over') || m.matchOver) return null;
    return m;
  }

  /** 新しい試合。opts.rated ならレート戦（4人・マイルール・10ゲーム、AIの強さは opts.level） */
  function newMatch(opts) {
    const rated = !!(opts && opts.rated);
    // 途中のレート戦を捨てて始めるときは、先に棄権の確認
    const m = savedMatch();
    if (m && m.rated && !(opts && opts.abandoned)) { askAbandon(() => newMatch(Object.assign({}, opts, { abandoned: true }))); return; }
    cancelLoop();
    OC.leaveRoom(true);
    const n = rated ? RT.PLAYERS : settings.players;
    const level = rated ? opts.level : settings.level;
    const players = [{ name: settings.name || 'あなた', human: true }];
    for (let i = 1; i < n; i++) players.push({ name: A.ROBOTS[i - 1].name, level });
    const info = rated ? { level, base: [store.rating.r].concat(players.slice(1).map(() => RT.AI[level])), matches: store.rating.matches, result: null } : null;
    S = E.createMatch({ rules: rated ? RT.rules() : store.rules, players, games: rated ? RT.GAMES : settings.games, rated: info });
    UI.S = S;
    UI.human = 0;
    UI.seatInfo = null;
    UI.logLines = [];
    UI.resetTable();
    fastForward = false;
    showScreen('game');
    startNextGame();
  }

  async function startNextGame() {
    if (S.matchOver) return;
    const token = ++loopToken;
    fastForward = false;
    UI.hidePrompt();
    S.events = [];
    E.startGame(S);
    const evs = S.events.slice();
    S.events = [];
    UI.syncVM();
    UI.renderAll();
    persist();
    await UI.playEvents(evs);
    if (token === loopToken) runLoop();
  }

  function resumeMatch() {
    if (!store.match) return;
    cancelLoop();
    OC.leaveRoom(true);
    UI.seatInfo = null;
    try {
      S = E.deserialize(store.match);
      S.rules = RU.migrate(S.rules);
    } catch (e) {
      UI.toast('保存された対局を読み込めませんでした');
      return;
    }
    UI.S = S;
    UI.human = 0;
    UI.logLines = Array.isArray(store.log) ? store.log.slice(-200) : [];
    UI.resetTable();
    fastForward = false;
    showScreen('game');
    UI.syncVM();
    UI.renderAll();
    if (S.phase === 'over') showResults(++loopToken);
    else runLoop();
  }

  function persist() {
    if (!S || onlineRoom()) return; // オンライン対戦の状態はサーバーが持つ
    try {
      store.match = E.serialize(S);
      store.log = UI.logLines.slice(-120);
      save();
    } catch (e) { /* 保存できなくても続行 */ }
    saveHot();
  }

  function cancelHuman() {
    if (humanCancel) { const c = humanCancel; humanCancel = null; c(); }
  }

  function cancelLoop() {
    loopToken++;
    cancelHuman();
    UI.closeDialog();
    UI.hidePrompt();
  }

  // ─────────────────────────────────────────────
  // 進行ループ
  // ─────────────────────────────────────────────
  function thinkTime(q) {
    const base = q.kind === 'turn' ? 620 : 420;
    const f = fastForward ? 0 : S.players[UI.human].out ? 0.55 : 1;
    return (base + Math.random() * 260) * UI.speed * f;
  }

  async function runLoop() {
    const token = ++loopToken;
    while (token === loopToken) {
      const q = E.getRequest(S);
      if (!q) {
        if (S.phase === 'over') await showResults(token);
        return;
      }
      const P = S.players[q.seat];
      let action = null;
      if (P.human) {
        action = await humanAction(q);
        if (token !== loopToken || !action) return;
      } else {
        if (!fastForward) UI.setThinking(q.seat, true);
        const t0 = performance.now();
        try {
          // レート戦はAIのレートを測ったときと同じ考える時間（スピード設定で弱くならないように）
          action = await AI.decide(S, q, P.level, Math.round(420 * (S.rated ? 1 : UI.speed)));
        } catch (err) {
          console.error(err);
          action = fallbackAction(q);
        }
        const wait = thinkTime(q) - (performance.now() - t0);
        if (wait > 0) await sleep(wait);
        UI.setThinking(q.seat, false);
        if (token !== loopToken) return;
      }
      let evs;
      try {
        evs = E.apply(S, action);
      } catch (err) {
        if (P.human) { UI.toast(err.message); SND.play('error'); continue; }
        console.error(err);
        try { evs = E.apply(S, fallbackAction(q)); } catch (e2) { console.error(e2); return; }
      }
      if (S.matchOver) applyRated(); // 演出の途中で閉じてもレートが反映されるように先に
      if (fastForward) { UI.syncVM(); UI.renderAll(); for (const ev of evs) if (ev.t !== 'deal') logEventQuick(ev); }
      else await UI.playEvents(evs);
      persist();
      if (token !== loopToken) return;
      maybeOfferFastForward();
    }
  }

  function logEventQuick(ev) {
    if (ev.t === 'finish') UI.logLine('◆ ' + UI.nameOf(ev.seat) + ' 上がり（' + ev.place + '位）', 'sys');
    else if (ev.t === 'foul') UI.logLine('◆ ' + UI.nameOf(ev.seat) + ' 反則上がり', 'sys');
    else if (ev.t === 'play') UI.logLine(UI.nameOf(ev.seat) + '：' + E.describePlay(ev.play));
  }

  function fallbackAction(q) {
    try { return AI.decideSync(S, q, 'normal'); } catch (e) { /* 下へ */ }
    if (q.kind === 'turn') {
      if (E.topPlay(S)) return { type: 'pass', seat: q.seat };
      return { type: 'play', seat: q.seat, play: E.legalPlays(S, q.seat)[0] };
    }
    if (q.kind === 'stop') return { type: 'nostop', seat: q.seat };
    if (q.kind === 'bomb') return { type: 'bomb', seat: q.seat, ranks: [] };
    if (q.kind === 'tenpen') return { type: 'tenpen', seat: q.seat, accept: false };
    if (q.kind === 'exchange') return { type: 'exchange', seat: q.seat, cards: S.players[q.seat].hand.slice(0, q.count) };
    return { type: q.kind, seat: q.seat, cards: [] };
  }

  function maybeOfferFastForward() {
    if (fastForward || S.phase !== 'play' || !S.players[UI.human].out) return;
    if (!$('prompt').hidden) return;
    const place = S.finished.indexOf(UI.human);
    const msg = S.players[UI.human].foul ? 'あなたは反則上がりでした。' : 'あなたは <b>' + (place + 1) + '位</b> で上がりました。';
    UI.showPrompt(msg + '残りの対局を見ています。', [
      { label: '結果まで早送り', primary: true, onClick: () => { fastForward = true; UI.hidePrompt(); } },
    ]);
  }

  // ─────────────────────────────────────────────
  // 人間の操作
  // ─────────────────────────────────────────────
  function humanAction(q) {
    return new Promise((resolve) => {
      let settled = false;
      const cleanups = [];
      const finish = (action) => {
        if (settled) return;
        settled = true;
        humanCancel = null;
        for (const f of cleanups) f();
        resolve(action);
      };
      humanCancel = () => finish(null);
      const ctx = { q, finish, onCleanup: (f) => cleanups.push(f) };
      switch (q.kind) {
        case 'turn': return humanTurn(ctx);
        case 'stop': return humanStop(ctx);
        case 'give': return humanSelectCards(ctx, q.label, UI.nameOf(q.to) + ' に渡すカードを <b>' + q.count + '枚まで</b> えらんでください', '渡す', '渡さない');
        case 'discard': return humanSelectCards(ctx, '10捨て', '捨てるカードを <b>' + q.count + '枚まで</b> えらんでください', '捨てる', '捨てない');
        case 'exchange': return humanExchange(ctx);
        case 'pickup': return humanPickup(ctx);
        case 'bomb': return humanBomb(ctx);
        case 'tenpen': return humanTenpen(ctx);
      }
      finish(fallbackAction(q));
    });
  }

  function setActionButtons(state) {
    $('b-play').disabled = !state.play;
    $('b-pass').disabled = !state.pass;
    $('b-hint').disabled = !state.hint;
  }

  function humanTurn(ctx) {
    const { q, finish, onCleanup } = ctx;
    const seat = q.seat;
    const legal = E.legalPlays(S, seat);
    const canPass = !!E.topPlay(S);
    UI.vm.turn = seat;
    UI.renderStatus(); UI.renderMe(); UI.renderSeats();
    SND.play('turn');
    if (!legal.length && canPass && settings.autoPass) {
      UI.toast('出せるカードがないのでパスします', 1500);
      const t = setTimeout(() => finish({ type: 'pass', seat }), 1000 * UI.speed);
      onCleanup(() => clearTimeout(t));
      return;
    }
    if (settings.showPlayable) {
      const set = new Set();
      for (const p of legal) for (const id of p.cards) set.add(id);
      UI.dimSet = set;
    }
    UI.setSelectable(true, 0);
    const info = $('sel-info');
    const update = () => {
      const sel = Array.from(UI.sel);
      info.className = 'sel-info';
      if (!sel.length) {
        info.textContent = canPass ? (legal.length ? 'カードをえらぶか、パス' : '出せるカードがありません') : 'あなたが親。好きなカードをどうぞ';
        $('b-play').disabled = true;
        return;
      }
      const plays = E.playsForCards(S, seat, sel);
      if (plays.length) {
        info.className = 'sel-info ok';
        info.textContent = E.describePlay(plays[0]) + (plays.length > 1 ? ' ほか' : '') + effectNote(plays[0]);
        $('b-play').disabled = false;
      } else {
        info.className = 'sel-info ng';
        info.textContent = E.explainIllegal(S, seat, sel);
        $('b-play').disabled = true;
      }
    };
    UI.onSelChange = update;
    setActionButtons({ play: false, pass: canPass, hint: true });
    update();
    $('b-play').onclick = async () => {
      const sel = Array.from(UI.sel);
      const plays = E.playsForCards(S, seat, sel);
      if (!plays.length) { SND.play('error'); return; }
      let p = plays[0];
      if (plays.length > 1) {
        p = await chooseInterpretation(plays);
        if (!p) return;
      }
      finish({ type: 'play', seat, play: p });
    };
    $('b-pass').onclick = () => { if (canPass) finish({ type: 'pass', seat }); };
    $('b-hint').onclick = () => {
      const a = AI.suggest(S, seat);
      if (a.type === 'pass') { UI.clearSelection(); UI.toast('おすすめ：パス'); }
      else { UI.setHint(a.play.cards); UI.toast('おすすめ：' + E.describePlay(a.play)); }
      update();
    };
    onCleanup(() => {
      UI.onSelChange = null;
      UI.dimSet = null;
      UI.hintSet = null;
      UI.setSelectable(false);
      $('b-play').onclick = $('b-pass').onclick = $('b-hint').onclick = null;
      setActionButtons({});
      info.textContent = '';
      info.className = 'sel-info';
    });
  }

  function effectNote(p) {
    const fx = E.effectsOf(p, S);
    const notes = [];
    if (fx.sand) notes.push('砂嵐');
    if (fx.revolution) notes.push('革命');
    if (fx.flow) notes.push({ '8': '8切り', '66': 'ろくろ首', '99': '救急車' }[fx.flow]);
    if (fx.jToggles % 2) notes.push('Jバック');
    if (fx.skip) notes.push(fx.skip + '人スキップ');
    if (fx.give) notes.push('7渡し');
    if (fx.back) notes.push('9戻し');
    if (fx.discard) notes.push('10捨て');
    if (fx.bomb) notes.push('12ボンバー');
    if (fx.take) notes.push('A拾い');
    const top = E.topPlay(S);
    if (top && top.wild && p.cards[0] === 'S3' && S.rules.spade3) notes.push('スペ3返し');
    return notes.length ? '（' + notes.join('・') + '）' : '';
  }

  function chooseInterpretation(plays) {
    return new Promise((resolve) => {
      const opts = plays.map((p, i) => '<button class="opt" type="button" data-i="' + i + '">' + UI.miniCards(p.cards) +
        '<span><b>' + esc(E.describePlay(p)) + '</b><small>' + esc(effectNote(p).replace(/[（）]/g, '') || 'ふつうに出す') + '</small></span></button>').join('');
      const dlg = UI.openDialog('<h3>どの出し方にしますか？</h3><p>ジョーカーの使い方が何通りかあります。</p><div class="opt-list">' + opts +
        '</div><div class="btns"><button class="btn btn-ghost" type="button" id="dlg-cancel">やめる</button></div>', { onBackdrop: () => { UI.closeDialog(); resolve(null); } });
      dlg.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => { UI.closeDialog(); resolve(plays[+b.dataset.i]); }));
      $('dlg-cancel').addEventListener('click', () => { UI.closeDialog(); resolve(null); });
    });
  }

  const FLOW_NAMES = { '8': '8切り', '66': 'ろくろ首', '99': '救急車' };
  const STOP_INFO = {
    four: { name: '4止め', desc: '4を2枚出して8切りを止めます' },
    three: { name: '3止め', desc: '3を2枚出してスキップを止めます' },
    sand: { name: '砂嵐', desc: '3を3枚出して止めます' },
  };

  function humanStop(ctx) {
    const { q, finish, onCleanup } = ctx;
    const opts = E.stopOptions(S, q.seat);
    const trig = q.trigger;
    let what;
    if (trig.flow) what = FLOW_NAMES[trig.flow];
    else {
      const p = trig.play;
      const kind = p.type !== 'seq' && p.rank === 13 ? '13スキップ' : p.type !== 'seq' && p.rank === 5 ? '5スキップ' : 'スキップ';
      const skipped = E.skipTargets(S, trig.seat, trig.skip).map((s) => (s === UI.human ? 'あなた' : S.players[s].name));
      what = kind + '（' + skipped.join('・') + ' が飛ばされる）';
    }
    SND.play('turn');
    const html = '<h3>止めますか？</h3><p>' + esc(UI.nameOf(trig.seat)) + ' の <b>' + esc(what) + '</b><br>止めると場が流れて、あなたが親になります。</p><div class="opt-list">' +
      opts.map((o, i) => '<button class="opt" type="button" data-i="' + i + '">' + UI.miniCards(o.play.cards) + '<span><b>' + STOP_INFO[o.kind].name +
        '</b><small>' + STOP_INFO[o.kind].desc + '</small></span></button>').join('') +
      '</div><div class="btns"><button class="btn btn-ghost" type="button" id="dlg-no">止めない</button></div>';
    const dlg = UI.openDialog(html);
    dlg.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => finish({ type: 'stop', seat: q.seat, kind: opts[+b.dataset.i].kind })));
    $('dlg-no').addEventListener('click', () => finish({ type: 'nostop', seat: q.seat }));
    onCleanup(() => UI.closeDialog());
  }

  function humanSelectCards(ctx, title, text, okLabel, noLabel) {
    const { q, finish, onCleanup } = ctx;
    UI.setSelectable(true, q.count);
    SND.play('turn');
    const refresh = () => {
      const n = UI.sel.size;
      const ok = $('pr-ok');
      if (ok) { ok.disabled = n === 0; ok.textContent = n ? okLabel + '（' + n + '枚）' : okLabel; }
    };
    UI.showPrompt('<b>' + esc(title) + '</b>：' + text, [
      { label: noLabel, onClick: () => finish({ type: q.kind, seat: q.seat, cards: [] }) },
      { label: okLabel, primary: true, id: 'pr-ok', onClick: () => finish({ type: q.kind, seat: q.seat, cards: Array.from(UI.sel) }) },
    ]);
    UI.onSelChange = refresh;
    refresh();
    onCleanup(() => { UI.onSelChange = null; UI.setSelectable(false); UI.hidePrompt(); });
  }

  function humanExchange(ctx) {
    const { q, finish, onCleanup } = ctx;
    UI.setSelectable(true, q.count);
    SND.play('turn');
    const got = q.got && q.got.length ? UI.nameOf(q.to) + ' から <b>' + q.got.map(C.cardLabel).join(' ') + '</b> を受け取りました。' : '';
    const refresh = () => {
      const ok = $('pr-ok');
      if (ok) ok.disabled = UI.sel.size !== q.count;
    };
    UI.showPrompt('<b>カード交換</b>：' + got + 'お返しに渡すカードを <b>' + q.count + '枚</b> えらんでください', [
      { label: '渡す', primary: true, id: 'pr-ok', onClick: () => { if (UI.sel.size === q.count) finish({ type: 'exchange', seat: q.seat, cards: Array.from(UI.sel) }); } },
    ]);
    UI.onSelChange = refresh;
    refresh();
    onCleanup(() => { UI.onSelChange = null; UI.setSelectable(false); UI.hidePrompt(); });
  }

  function humanPickup(ctx) {
    const { q, finish, onCleanup } = ctx;
    const chosen = new Set();
    const cards = q.cards.map((id) => '<div class="card" role="button" tabindex="0" data-id="' + id + '" aria-label="' + esc(C.cardLabel(id)) + '">' + A.faceSVG(id) + '</div>').join('');
    const dlg = UI.openDialog('<h3>A拾い</h3><p>1つ前に出されたカードを手札にできます。拾うカードをえらんでください。</p><div class="pick-cards">' + cards +
      '</div><div class="btns"><button class="btn btn-ghost" type="button" id="dlg-no">拾わない</button><button class="btn btn-gold" type="button" id="dlg-ok" disabled>拾う</button></div>');
    const ok = $('dlg-ok');
    dlg.querySelectorAll('.pick-cards .card').forEach((el) => {
      const tap = () => {
        const id = el.dataset.id;
        if (chosen.has(id)) chosen.delete(id); else chosen.add(id);
        el.classList.toggle('sel', chosen.has(id));
        ok.disabled = !chosen.size;
        ok.textContent = chosen.size ? '拾う（' + chosen.size + '枚）' : '拾う';
        SND.play('select');
      };
      el.addEventListener('click', tap);
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(); } });
    });
    $('dlg-no').addEventListener('click', () => finish({ type: 'pickup', seat: q.seat, cards: [] }));
    ok.addEventListener('click', () => finish({ type: 'pickup', seat: q.seat, cards: Array.from(chosen) }));
    onCleanup(() => UI.closeDialog());
  }

  function humanBomb(ctx) {
    const { q, finish, onCleanup } = ctx;
    const chosen = new Set();
    const hand = S.players[q.seat].hand;
    const grid = q.ranks.map((r) => {
      const mine = hand.filter((id) => !C.isJoker(id) && C.rankOf(id) === r).length;
      return '<button class="rank-btn" type="button" data-r="' + r + '" aria-pressed="false"><b>' + C.rankLabel(r) + '</b><small>手札 ' + mine + '枚</small></button>';
    }).join('');
    const dlg = UI.openDialog('<h3>12ボンバー</h3><p>あなたの手札にある数字から <b>' + q.count + 'つまで</b> 指名できます。全員（あなたも）その数字のカードを全部捨てます。</p><div class="rank-grid">' + grid +
      '</div><div class="btns"><button class="btn btn-ghost" type="button" id="dlg-no">指名しない</button><button class="btn btn-gold" type="button" id="dlg-ok" disabled>指名する</button></div>');
    $('dlg-no').addEventListener('click', () => finish({ type: 'bomb', seat: q.seat, ranks: [] }));
    const ok = $('dlg-ok');
    dlg.querySelectorAll('.rank-btn').forEach((b) => b.addEventListener('click', () => {
      const r = +b.dataset.r;
      if (chosen.has(r)) chosen.delete(r);
      else {
        if (chosen.size >= q.count) {
          if (q.count === 1) { chosen.clear(); dlg.querySelectorAll('.rank-btn').forEach((x) => x.setAttribute('aria-pressed', 'false')); }
          else { UI.toast(q.count + 'つまでです'); return; }
        }
        chosen.add(r);
      }
      b.setAttribute('aria-pressed', String(chosen.has(r)));
      ok.disabled = !chosen.size;
      SND.play('select');
    }));
    ok.addEventListener('click', () => finish({ type: 'bomb', seat: q.seat, ranks: Array.from(chosen) }));
    onCleanup(() => UI.closeDialog());
  }

  function humanTenpen(ctx) {
    const { q, finish, onCleanup } = ctx;
    SND.play('special');
    UI.openDialog('<h3>天変地異</h3><p>あなたの手札は10以下のカードだけです。<br>' + esc(UI.nameOf(q.rich)) + '（大富豪）と手札を全部交換しますか？</p>' +
      '<div class="btns"><button class="btn btn-ghost" type="button" id="dlg-no">しない</button><button class="btn btn-gold" type="button" id="dlg-ok">交換する</button></div>');
    $('dlg-ok').addEventListener('click', () => finish({ type: 'tenpen', seat: q.seat, accept: true }));
    $('dlg-no').addEventListener('click', () => finish({ type: 'tenpen', seat: q.seat, accept: false }));
    onCleanup(() => UI.closeDialog());
  }

  // ─────────────────────────────────────────────
  // レート戦（AI戦のレートはこの端末だけに保存）
  // ─────────────────────────────────────────────
  function applyRated() {
    if (onlineRoom() || !S) return;
    if (CM.applyRatedLocal(S)) persist();
  }

  /** 途中のレート戦を棄権する（残りのゲームは最下位として計算） */
  function abandonRated() {
    const r = CM.abandonRatedLocal(store.match);
    if (r) { store.match = null; store.log = []; save(); }
    return r;
  }
  const abandonNote = CM.abandonNote;

  /** タイトルから新しく始めるとき、途中のレート戦があれば「つづきから／棄権」をたずねる */
  function askAbandon(onAbandoned) {
    CM.askAbandon(savedMatch(), {
      onResume: resumeMatch,
      onAbandoned: () => { store.match = null; store.log = []; save(); renderHome(); onAbandoned(); },
    });
  }

  /** レート戦を始める画面（AIの強さを選ぶ） */
  function openRated() {
    const m = savedMatch();
    if (m && m.rated) { askAbandon(openRated); return; }
    CM.openRatedDialog('daifugo', { slowLevel: 'hard', onPick: (lv) => newMatch({ rated: true, level: lv }) });
  }

  // ─────────────────────────────────────────────
  // 結果・メニュー
  // ─────────────────────────────────────────────
  const ptsHTML = (v, unit) => '<span class="' + UI.ptsClass(v) + '">' + UI.fmtPts(v) + (unit || '') + '</span>';

  function resultsHTML() {
    const ranking = S.prevRanking;
    const last = S.history[S.history.length - 1];
    const rows = ranking.map((seat, i) => {
      const P = S.players[seat];
      const t = E.titleOf(S.n, i);
      const note = P.foul ? '反則上がり' : '';
      const pts = last ? last.pts[seat] : E.pointsFor(S.n, i);
      return '<div class="res-row' + (seat === UI.human ? ' me' : '') + '"><span class="pl">' + (i + 1) + '</span>' +
        '<span><span class="title-chip ' + UI.TITLE_CLASS[t] + '">' + t + '</span></span>' +
        '<span class="nm">' + esc(P.name) + (note ? '<small>' + note + '</small>' : '') + '</span>' +
        '<span class="pt">' + ptsHTML(pts) + '<small>計 ' + UI.fmtPts(P.score) + '</small></span></div>';
    }).join('');
    const myPlace = ranking.indexOf(UI.human);
    const head = myPlace < 0 ? '' : myPlace === 0 ? 'あなたが大富豪！' : 'あなたは ' + E.titleOf(S.n, myPlace);
    if (myPlace === 0) SND.play('fanfare');
    const left = S.maxGames ? S.maxGames - S.gameNo : 0;
    return '<h3>第' + S.gameNo + 'ゲーム 結果</h3><p>' + esc(head) + (S.rules.exchange ? '　次のゲームは身分に応じてカード交換から。' : '') +
      (S.maxGames ? '<br>' + (S.rated ? 'レート戦 ' : '') + '残り ' + left + 'ゲーム' : '') + '</p>' +
      '<div class="results">' + rows + '</div>';
  }

  function nextLabel() {
    return '次のゲームへ' + (S.maxGames ? '（' + (S.gameNo + 1) + '/' + S.maxGames + '）' : '');
  }

  function showResults(token) {
    if (S.matchOver) return showFinal();
    return new Promise((resolve) => {
      UI.hidePrompt();
      UI.openDialog(resultsHTML() +
        '<div class="btns"><button class="btn btn-ghost" type="button" id="res-title">タイトルへ</button><button class="btn btn-gold" type="button" id="res-next">' + nextLabel() + '</button></div>');
      $('res-next').addEventListener('click', () => { UI.closeDialog(); resolve(); if (token === loopToken) startNextGame(); });
      $('res-title').addEventListener('click', () => { UI.closeDialog(); resolve(); cancelLoop(); showScreen('title'); });
    });
  }

  const finalHTML = (rateHTML, deltas) => CM.finalHTML(S, UI.human, rateHTML, deltas);
  const rateBoxHTML = CM.rateBoxHTML;
  const animateRate = CM.animateRate;

  function showFinal() {
    return new Promise((resolve) => {
      applyRated();
      UI.hidePrompt();
      const res = S.rated && S.rated.result;
      const box = res ? rateBoxHTML('AI戦レート', res, CM.rateNote('daifugo', res)) : '';
      const dlg = UI.openDialog(finalHTML(box) +
        '<div class="btns"><button class="btn btn-ghost" type="button" id="fin-title">タイトルへ</button><button class="btn btn-gold" type="button" id="fin-again">' +
        (S.rated ? 'もう一度レート戦' : 'もう一度') + '</button></div>');
      animateRate(dlg);
      $('fin-again').addEventListener('click', () => { UI.closeDialog(); resolve(); newMatch(S.rated ? { rated: true, level: S.rated.level } : undefined); });
      $('fin-title').addEventListener('click', () => { UI.closeDialog(); resolve(); cancelLoop(); showScreen('title'); });
    });
  }

  function openMenu() {
    if (onlineRoom()) { OC.openMenu(); return; }
    const ratedLive = S && S.rated && !S.matchOver;
    UI.openDialog('<h3>メニュー</h3><div class="menu-list">' +
      '<button class="btn btn-gold" type="button" id="m-close">対局に戻る</button>' +
      '<button class="btn btn-ghost" type="button" id="m-book">ルールブック</button>' +
      (ratedLive ? '<button class="btn btn-ghost" type="button" id="m-abandon">棄権する</button>'
        : '<button class="btn btn-ghost" type="button" id="m-restart">最初からやり直す</button>') +
      '<button class="btn btn-ghost" type="button" id="m-title">タイトルに戻る</button></div>' +
      (ratedLive ? '<p class="menu-note">タイトルに戻っても、レート戦は「つづきから」で再開できます。</p>' : ''), { onBackdrop: closeMenu });
    $('m-close').addEventListener('click', closeMenu);
    $('m-book').addEventListener('click', () => { closeMenu(); openBook('rules'); });
    if (ratedLive) {
      $('m-abandon').addEventListener('click', () => {
        persist();
        UI.openDialog('<h3>棄権しますか？</h3><p>' + abandonNote(store.match) + '</p><div class="btns">' +
          '<button class="btn btn-ghost" type="button" id="m-no">やめる</button><button class="btn btn-gold" type="button" id="m-yes">棄権する</button></div>', { onBackdrop: closeMenu });
        $('m-no').addEventListener('click', closeMenu);
        $('m-yes').addEventListener('click', () => {
          cancelLoop();
          const r = abandonRated();
          const dlg = UI.openDialog('<h3>棄権しました</h3>' + (r ? rateBoxHTML('AI戦レート', r) : '') +
            '<div class="btns"><button class="btn btn-gold" type="button" id="m-done">タイトルへ</button></div>');
          animateRate(dlg);
          $('m-done').addEventListener('click', () => { UI.closeDialog(); showScreen('title'); });
        });
      });
    } else {
      $('m-restart').addEventListener('click', () => {
        UI.openDialog('<h3>最初からやり直しますか？</h3><p>いまの対局と得点は消えます。</p><div class="btns">' +
          '<button class="btn btn-ghost" type="button" id="m-no">やめる</button><button class="btn btn-gold" type="button" id="m-yes">やり直す</button></div>', { onBackdrop: closeMenu });
        $('m-no').addEventListener('click', closeMenu);
        $('m-yes').addEventListener('click', () => { UI.closeDialog(); newMatch(); });
      });
    }
    $('m-title').addEventListener('click', () => { UI.closeDialog(); cancelLoop(); persist(); showScreen('title'); });
  }
  // メニューを閉じたら、開く前の問い合わせ（止め札など）をやり直す
  function closeMenu() {
    UI.closeDialog();
    if (onlineRoom()) { OC.reask(); return; }
    if (S && $('scr-game').hidden === false) {
      const q = E.getRequest(S);
      if (q && S.players[q.seat].human && q.kind !== 'turn' && q.kind !== 'give' && q.kind !== 'discard' && q.kind !== 'exchange') {
        cancelLoop();
        runLoop();
      }
    }
  }

  // ─────────────────────────────────────────────
  // オンライン対戦（部屋・待合室・チャットは online-client.js。ここは大富豪の対局の表示と自分の操作）
  // ─────────────────────────────────────────────
  function viewSig(v) {
    if (!v.state) return 'lobby';
    const s = v.state;
    return [s.gameNo, s.moves, s.phase, s.turn, s.pile.length, JSON.stringify(s.pending || null), v.seat].join('|');
  }

  /** 自分の入力待ちの間に来た「接続状態だけ」の更新は、入力を邪魔せずに反映する */
  function quickUpdate(o, m) {
    if (o.waiting && m.phase === 'playing' && viewSig(m) === o.waitingSig && !(m.events && m.events.length)) {
      o.view = m;
      UI.seatInfo = m.seats;
      UI.renderSeats();
      return true;
    }
    if (o.waiting) cancelHuman();
    return false;
  }

  async function handleView(o, v) {
    const st = E.deserialize(v.state);
    const sig = viewSig(v);
    const evs = v.events || [];
    const first = !o.gameShown || o.seat !== v.seat;
    if (!first && sig === o.sig && !evs.length) {
      // 参加者の接続状態・名前だけの更新
      UI.seatInfo = v.seats;
      st.players.forEach((p, i) => { if (S && S.players[i]) S.players[i].name = p.name; });
      UI.renderSeats();
    } else {
      o.sig = sig;
      S = st;
      UI.S = S;
      UI.human = v.seat;
      UI.seatInfo = v.seats;
      o.seat = v.seat;
      if (o.resultsOpen && S.phase !== 'over') { UI.closeDialog(); o.resultsOpen = false; }
      if (first) {
        o.gameShown = true;
        UI.logLines = [];
        showScreen('game');
        UI.resetTable();
        UI.syncVM();
        UI.renderAll();
        if (evs.some((e) => e.t === 'deal')) await UI.playEvents(evs);
      } else if (evs.length) {
        const saved = UI.speed;
        if (o.queue.length > 1) UI.speed = Math.min(saved, 0.35); // 遅れているときは早送り
        await UI.playEvents(evs);
        UI.speed = saved;
      } else {
        UI.syncVM();
        UI.renderAll();
      }
    }
    if (OC.cur !== o) return;
    if (S.phase === 'over') { if (!o.resultsOpen) showOnlineResults(o); return; }
    if (v.request && !o.queue.length && sig !== o.sentSig) await askOnline(o, v);
  }

  async function askOnline(o, v) {
    if (o.waiting) return;
    o.waiting = true;
    o.waitingSig = viewSig(v);
    const action = await humanAction(v.request);
    o.waiting = false;
    if (!action || OC.cur !== o) return;
    const a = Object.assign({}, action);
    delete a.seat;
    if (o.conn.send({ t: 'action', action: a })) o.sentSig = o.waitingSig;
    else UI.toast('通信が切れています。つながり直したら、もう一度操作してください', 3500);
  }

  function reaskOnline(o) {
    if (!o) return;
    if (o.waiting) cancelHuman();
    setTimeout(() => {
      if (OC.cur !== o || o.waiting || o.busy || !o.view || !S) return;
      if (S.phase === 'over') { if (!o.resultsOpen) showOnlineResults(o); return; }
      if (o.view.request) { o.sentSig = ''; askOnline(o, o.view); }
    }, 0);
  }

  function showOnlineResults(o) {
    o.resultsOpen = true;
    UI.hidePrompt();
    if (S.matchOver) { showOnlineFinal(o); return; }
    UI.openDialog(resultsHTML() + '<p>だれかが「次のゲームへ」を押すと、全員の次のゲームが始まります。</p>' +
      '<div class="btns"><button class="btn btn-ghost" type="button" id="res-leave">部屋を出る</button>' +
      (S.rated ? '' : '<button class="btn btn-ghost" type="button" id="res-lobby">ここで終わる</button>') +
      '<button class="btn btn-gold" type="button" id="res-next">' + nextLabel() + '</button></div>');
    $('res-next').addEventListener('click', () => {
      if (!OC.cur) return;
      OC.cur.conn.send({ t: 'next' });
      $('res-next').disabled = true;
      $('res-next').textContent = '始めています…';
    });
    if ($('res-lobby')) $('res-lobby').addEventListener('click', () => { if (OC.cur) OC.cur.conn.send({ t: 'lobby' }); });
    $('res-leave').addEventListener('click', () => OC.confirmLeave(true));
  }

  /** オンラインの試合終了（レート戦なら各自のレートの増減も） */
  function showOnlineFinal(o) {
    const info = S.rated;
    const res = info && info.results ? info.results : [];
    const mine = res[UI.human];
    const box = mine ? rateBoxHTML('オンラインレート', mine, CM.rateNote('daifugo', mine)) : '';
    const left = res.filter((r) => r && r.abandoned).map((r) => esc(r.name) + ' さんは途中で抜けたため棄権（' + RT.fmtDelta(r.delta) + '）').join('<br>');
    const deltas = res.map((r) => (r && !r.abandoned ? r : null));
    const dlg = UI.openDialog(finalHTML(box, deltas) + (left ? '<p class="menu-note">' + left + '</p>' : '') +
      (info && !mine ? '<p class="menu-note">途中から参加したので、あなたのレートは変わりません。</p>' : '') +
      '<div class="btns"><button class="btn btn-ghost" type="button" id="res-leave">部屋を出る</button><button class="btn btn-gold" type="button" id="res-lobby">部屋に戻る</button></div>');
    animateRate(dlg);
    $('res-lobby').addEventListener('click', () => {
      if (!OC.cur) return;
      OC.cur.conn.send({ t: 'lobby' });
      $('res-lobby').disabled = true;
    });
    $('res-leave').addEventListener('click', () => OC.confirmLeave(true));
  }

  /** チャットを送った人の席の上に吹き出し（seat=-1 は自分） */
  function chatBubble(seat, name, text, mine) {
    if (!S || !CM.visible('scr-game')) return;
    if (mine) seat = UI.human;
    if (!(seat >= 0) || !S.players[seat] || S.players[seat].name !== name && !mine) seat = S.players.findIndex((p) => p.name === name);
    if (seat >= 0) UI.bubble(seat, text, false, 'chat');
  }

  const online = {
    quickUpdate, handleView, reask: reaskOnline, cancelInput: () => cancelHuman(), bubble: chatBubble,
    showResults: showOnlineResults,
    showTable() { showScreen('game'); UI.renderAll(); },
    rulesDesc: () => presetLabel() + '（ローカルルール ' + localRuleCount(store.rules) + '個）。あなたの「ルールと設定」のルールで遊びます。',
    startRules: () => store.rules,
  };

  // ─────────────────────────────────────────────
  // ルールブック（枠は共通。ここはどのルールを説明するかだけ）
  // ─────────────────────────────────────────────
  /** 対局中は「このゲーム」とレート戦、ホームではレート戦とフリー対戦 */
  function bookSources() {
    const inGame = S && CM.visible('scr-game');
    const list = [];
    if (inGame) list.push({ key: 'game', label: 'このゲーム', rules: S.rules, n: S.n });
    if (!(inGame && S.rated && !onlineRoom())) list.push({ key: 'rated', label: 'レート戦', rules: RT.rules(), n: RT.PLAYERS });
    if (!inGame) list.push({ key: 'free', label: 'フリー対戦', rules: store.rules, n: settings.players });
    return list;
  }
  const openBook = (tab, src) => CM.openBook('daifugo', tab, src);
  const closeBook = CM.closeBook;

  // ─────────────────────────────────────────────
  // アーティファクトの再公開時に対局を引き継ぐ
  // ─────────────────────────────────────────────
  let hotRegistered = false;
  function saveHot() {
    const hot = globalThis.claude && globalThis.claude.hot;
    if (hotRegistered || !hot || !hot.snapshot) return;
    hotRegistered = true;
    try { hot.snapshot(() => ({ match: S ? E.serialize(S) : null, screen: $('scr-game').hidden ? 'title' : 'game', log: UI.logLines.slice(-120) })); } catch (e) { /* 無視 */ }
  }

  // ─────────────────────────────────────────────
  // 起動（main.js から呼ばれる）
  // ─────────────────────────────────────────────
  function init() {
    $('g-menu').innerHTML = A.icon('menu');
    $('g-log').innerHTML = A.icon('log');
    $('g-book').innerHTML = A.icon('book');
    $('rules-back').innerHTML = A.icon('back');
    $('log-close').innerHTML = A.icon('close');
    setActionButtons({});

    $('btn-rated').addEventListener('click', () => { SND.unlock(); openRated(); });
    $('btn-start').addEventListener('click', () => { SND.unlock(); newMatch(); });
    $('btn-book').addEventListener('click', () => openBook('basics'));
    $('g-book').addEventListener('click', () => (CM.bookOpen() ? closeBook() : openBook('rules')));
    $('btn-resume').addEventListener('click', () => { SND.unlock(); resumeMatch(); });
    $('btn-rules').addEventListener('click', () => showScreen('rules'));
    $('btn-online').addEventListener('click', () => { SND.unlock(); OC.openOnline('daifugo'); });
    $('rules-back').addEventListener('click', () => showScreen('title'));
    $('rules-start').addEventListener('click', () => { SND.unlock(); newMatch(); });
    $('g-menu').addEventListener('click', openMenu);
    $('g-log').addEventListener('click', () => { const lg = $('log'); lg.hidden = !lg.hidden; if (!lg.hidden) { OC.closeChat(); CM.closeBook(); UI.renderLog(); } });
    $('log-close').addEventListener('click', () => { $('log').hidden = true; });

    document.addEventListener('keydown', (e) => {
      if ($('scr-game').hidden || !$('overlay').hidden) return;
      if (e.target && e.target.tagName === 'INPUT') return;
      if (e.key === 'Enter' && !$('b-play').disabled && document.activeElement && !document.activeElement.classList.contains('card')) $('b-play').click();
      if ((e.key === 'p' || e.key === 'P') && !$('b-pass').disabled) $('b-pass').click();
    });

    let rz = 0;
    addEventListener('resize', () => {
      cancelAnimationFrame(rz);
      rz = requestAnimationFrame(() => { if (S && !$('scr-game').hidden) UI.renderAll(); });
    });
  }

  /** Claude のページを再公開したとき、対局中だったら続きから */
  function restore(data) {
    if (!data || !data.match) return false;
    store.match = data.match;
    if (Array.isArray(data.log)) store.log = data.log;
    if (data.screen === 'game') { resumeMatch(); return true; }
    return false;
  }

  D.Games.daifugo = {
    id: 'daifugo', label: '大富豪', init, renderHome, restore, bookSources, online,
    state: () => S,
    stopLocal() { if (S && !onlineRoom() && CM.visible('scr-game')) persist(); cancelLoop(); },
  };
  // 動作確認用
  D.App = { get state() { return S; }, get online() { return OC.cur; }, newMatch, resumeMatch, settings, store };
})();

</script>
<script>
/* 七並べ — ホーム・設定・対局の画面と進行（ローカルのAI戦とオンライン） */
(function () {
  'use strict';
  const D = globalThis.DFG;
  const C = D.Cards, A = D.Art, SND = D.Sound, UI = D.UI, RT = D.Rating, CM = D.Common, OC = D.OnlineClient;
  const SV = D.Sevens, AI = D.SevensAI, SR = D.SevensRules;
  const $ = (id) => document.getElementById(id);
  const esc = UI.esc;
  const sleep = UI.sleep;
  const store = CM.store;
  const ss = store.sevens; // { settings, rules, rating, match }
  const SUIT_COLOR = { S: 'black', C: 'black', H: 'red', D: 'red' };

  let S = null; // 表示している対局（オンラインではサーバーから届いた自分用の状態）
  let human = 0; // 自分の席
  let seatInfo = null; // オンライン：[{ name, type, robot, connected }]
  let loopToken = 0;
  let humanCancel = null;
  let sel = null; // 選んでいるカード
  let jokerTargets = null; // ジョーカーを置ける場所（選んでいる間だけ）
  const handEls = new Map();
  const seatEls = {};
  const onlineRoom = () => (OC.cur && OC.cur.game === 'sevens' ? OC.cur : null);
  const nameOf = (seat) => (seat === human ? 'あなた' : S.players[seat].name);
  const numLabel = SV.numLabel;

  // ─────────────────────────────────────────────
  // ホーム
  // ─────────────────────────────────────────────
  function savedMatch() {
    const m = ss.match;
    if (!m || m.game !== 'sevens' || !(m.phase === 'play' || m.phase === 'over') || m.matchOver) return null;
    return m;
  }
  function rulesSummary(R) {
    const on = [];
    on.push(R.passLimit ? 'パス' + R.passLimit + '回' : 'パス無制限');
    if (R.joker) on.push('ジョーカー');
    if (R.tunnel) on.push('トンネル');
    if (R.mustPlay) on.push('パス禁止');
    return on.join('・');
  }

  function renderHome() {
    const el = $('home-sevens');
    if (!el.dataset.built) {
      el.innerHTML = D.Shell.homeHTML({
        prefix: 'svh', title: '七並べ', en: 'SEVENS', tag: 'パス・ジョーカー・トンネル。止めて、読んで、駆け引きの七並べ',
        art: D.Shell.fanHTML(['S7', 'H7', 'D7', 'C7'], 34, 9),
      });
      $('svh-rated').addEventListener('click', () => { SND.unlock(); openRated(); });
      $('svh-free').addEventListener('click', () => { SND.unlock(); newMatch(); });
      $('svh-resume').addEventListener('click', () => { SND.unlock(); resumeMatch(); });
      $('svh-online').addEventListener('click', () => { SND.unlock(); OC.openOnline('sevens'); });
      $('svh-book').addEventListener('click', () => CM.openBook('sevens', 'basics'));
      $('svh-settings').addEventListener('click', openSettings);
      el.dataset.built = '1';
    }
    $('svh-rating').innerHTML = D.Shell.rateStripHTML('sevens');
    const m = savedMatch();
    $('svh-resume').hidden = !m;
    if (m) $('svh-resume').textContent = 'つづきから（' + (m.rated ? 'レート戦 ' : '') + '第' + m.gameNo + (m.maxGames ? '/' + m.maxGames : '') + 'ゲーム）';
    $('svh-online').hidden = !D.Net.available();
    const st = ss.settings;
    $('svh-note').innerHTML = 'フリー対戦：' + st.players + '人・AI（' + CM.LEVEL_LABEL[st.level] + '）・' + (st.games ? st.games + 'ゲーム' : '無制限') +
      '<br>ルール：<b>' + esc(rulesSummary(ss.rules)) + '</b>';
  }

  // ─────────────────────────────────────────────
  // ルールと設定
  // ─────────────────────────────────────────────
  function openSettings() {
    CM.showScreen('scr-gset');
    $('gset-title').textContent = '七並べ・ルールと設定';
    $('gset-back').onclick = () => D.Shell.showHome('sevens');
    $('gset-start').onclick = () => { SND.unlock(); newMatch(); };
    renderSettings();
  }
  function renderSettings() {
    const wrap = $('gset-wrap');
    const keep = $('gset-scroll').scrollTop;
    wrap.innerHTML = '';
    const st = ss.settings;
    const set = (k, v) => { st[k] = v; CM.save(); renderSettings(); };
    const m = CM.section('対戦設定', 'フリー対戦の設定。レート戦は4人・標準ルール・10ゲームで固定');
    m.panel.appendChild(CM.row('人数', 'あなた＋AIロボット', CM.seg([3, 4, 5, 6].map((v) => ({ v, label: v + '人' })), st.players, (v) => set('players', v))));
    m.panel.appendChild(CM.row('AIの強さ', st.level === 'hard' ? '見えないカードを何通りも試して考えます' : '',
      CM.seg([{ v: 'easy', label: 'やさしい' }, { v: 'normal', label: 'ふつう' }, { v: 'hard', label: 'つよい' }], st.level, (v) => set('level', v))));
    m.panel.appendChild(CM.row('1試合のゲーム数', st.games ? st.games + 'ゲームの総得点で順位を決めます' : '終わりなし',
      CM.seg([{ v: 5, label: '5' }, { v: 10, label: '10' }, { v: 0, label: '無制限' }], st.games, (v) => set('games', v))));
    wrap.appendChild(m.s);
    const R = ss.rules;
    const r = CM.section('ルール', 'どれも1つずつ切り替えられます');
    for (const def of SR.RULES) {
      const setRule = (v) => { R[def.key] = v; CM.save(); renderSettings(); };
      const ctl = def.type === 'bool' ? CM.toggle('svr-' + def.key, R[def.key], setRule, false, def.label) : CM.seg(def.options, R[def.key], setRule);
      r.panel.appendChild(CM.row(def.label, def.desc, ctl));
    }
    const reset = document.createElement('div');
    reset.className = 'row';
    reset.innerHTML = '<div class="row-text"><div class="row-desc">標準ルール：パス3回・ジョーカー・トンネル</div></div>';
    const rb = document.createElement('button');
    rb.className = 'btn btn-ghost btn-sm';
    rb.type = 'button';
    rb.textContent = '標準に戻す';
    rb.addEventListener('click', () => { ss.rules = Object.assign({}, SR.STANDARD); CM.save(); renderSettings(); });
    reset.appendChild(rb);
    r.panel.appendChild(reset);
    wrap.appendChild(r.s);
    $('gset-scroll').scrollTop = keep;
  }

  // ─────────────────────────────────────────────
  // 対局の開始・再開・保存
  // ─────────────────────────────────────────────
  function openRated() {
    const m = savedMatch();
    if (m && m.rated) { askAbandon(openRated); return; }
    CM.openRatedDialog('sevens', { slowLevel: 'hard', onPick: (lv) => newMatch({ rated: true, level: lv }) });
  }
  function askAbandon(then) {
    CM.askAbandon(savedMatch(), { onResume: resumeMatch, onAbandoned: () => { ss.match = null; CM.save(); renderHome(); then(); } });
  }

  function newMatch(opts) {
    const rated = !!(opts && opts.rated);
    const m = savedMatch();
    if (m && m.rated && !(opts && opts.abandoned)) { askAbandon(() => newMatch(Object.assign({}, opts, { abandoned: true }))); return; }
    stopLoop();
    OC.leaveRoom(true);
    const c = RT.cfg('sevens');
    const n = rated ? c.players : ss.settings.players;
    const level = rated ? opts.level : ss.settings.level;
    const players = [{ name: CM.settings.name || 'あなた', human: true }];
    for (let i = 1; i < n; i++) players.push({ name: A.ROBOTS[i - 1].name, level });
    const info = rated ? { level, base: [ss.rating.r].concat(players.slice(1).map(() => c.ai[level])), matches: ss.rating.matches, result: null } : null;
    S = SV.createMatch({ rules: rated ? c.rules() : ss.rules, players, games: rated ? c.games : ss.settings.games, rated: info });
    human = 0;
    seatInfo = null;
    showTable(true);
    startNextGame();
  }

  async function startNextGame() {
    if (S.matchOver) return;
    const token = ++loopToken;
    UI.hidePrompt();
    S.events = [];
    SV.startGame(S);
    const evs = S.events.slice();
    S.events = [];
    persist();
    await playEvents(evs, true);
    if (token === loopToken) runLoop();
  }

  function resumeMatch() {
    const m = savedMatch();
    if (!m) return;
    stopLoop();
    OC.leaveRoom(true);
    try { S = SV.deserialize(m); } catch (e) { UI.toast('保存された対局を読み込めませんでした'); return; }
    human = 0;
    seatInfo = null;
    showTable(true);
    if (S.phase === 'over') showResults(++loopToken);
    else runLoop();
  }

  function persist() {
    if (!S || onlineRoom()) return;
    try { ss.match = SV.serialize(S); CM.save(); } catch (e) { /* 保存できなくても続行 */ }
  }

  function stopLoop() {
    loopToken++;
    cancelHuman();
    UI.closeDialog();
  }
  function cancelHuman() { if (humanCancel) { const c = humanCancel; humanCancel = null; c(); } }

  // ─────────────────────────────────────────────
  // 表示
  // ─────────────────────────────────────────────
  function showTable(reset) {
    CM.showScreen('scr-sevens');
    if (reset) {
      for (const el of handEls.values()) el.remove();
      handEls.clear();
      for (const k of Object.keys(seatEls)) { seatEls[k].remove(); delete seatEls[k]; }
      $('fx').innerHTML = '';
    }
    renderAll();
  }

  function renderAll() {
    if (!S) return;
    fit();
    renderHud();
    renderSeats();
    renderBoard();
    renderMe();
    renderHand();
    renderStatus();
  }

  /** 画面の広さから、場のマスと手札の大きさを決める */
  function fit() {
    const scr = $('scr-sevens');
    const W = scr.clientWidth, H = scr.clientHeight;
    if (!W || !H) return;
    const narrow = W / H < 1.05;
    // 手札
    let cw = narrow ? Math.min((W - 30) / 4.6, (H - 460) / 3.2) : Math.min((W - 40) / 7.2, (H - 440) / 1.6);
    cw = Math.max(50, Math.min(118, Math.floor(cw)));
    scr.style.setProperty('--cw', cw + 'px');
    // 場（13列×4段）。幅で決まるスマホでは、マスを縦長にして読みやすくする
    const table = $('sv-table');
    const gap = narrow ? 2 : 3;
    const tw = table.clientWidth - (narrow ? 8 : 16);
    const th = table.clientHeight - (narrow ? 150 : 140) - 36;
    let w = Math.floor((Math.min(tw, 900) - (narrow ? 12 + 14 : 20 + 18) - 12 * gap) / 13);
    let h = Math.floor(Math.min(w * (narrow ? 1.75 : 1.4), (th - 3 * 5) / 4));
    if (h < w * 1.15) w = Math.floor(h / 1.15);
    scr.style.setProperty('--svw', Math.max(18, w) + 'px');
    scr.style.setProperty('--svh', Math.max(26, h) + 'px');
    scr.style.setProperty('--svgap', gap + 'px');
  }

  function renderHud() {
    const sub = [];
    if (S.rated) sub.push('<span class="rated-tag">レート戦</span>');
    if (UI.roomCode && onlineRoom()) sub.push('部屋 ' + esc(UI.roomCode));
    $('sv-gameno').innerHTML = '第' + S.gameNo + (S.maxGames ? '<span class="of">/' + S.maxGames + '</span>' : '') + 'ゲーム' + (sub.length ? '<small>' + sub.join(' ') + '</small>' : '');
  }

  function passPips(P) {
    const limit = S.rules.passLimit;
    if (!limit) return P.passes ? '<span class="pips">パス' + P.passes + '</span>' : '';
    let h = '<span class="pips" title="パス ' + P.passes + '/' + limit + '">';
    for (let i = 0; i < limit; i++) h += '<i class="' + (i < P.passes ? 'used' : '') + '"></i>';
    return h + '</span>';
  }
  function scoreTag(seat) {
    if (!S.history.length) return '';
    const v = S.players[seat].score;
    return '<span class="sc ' + UI.ptsClass(v) + '">' + UI.fmtPts(v) + '</span>';
  }
  function placeOf(seat) {
    const i = S.finished.indexOf(seat);
    return i >= 0 ? i + 1 : 0;
  }

  function renderSeats() {
    const box = $('sv-seats');
    const alive = new Set();
    for (let i = 1; i < S.n; i++) {
      const seat = (human + i) % S.n;
      alive.add(String(seat));
      let el = seatEls[seat];
      if (!el) {
        el = document.createElement('div');
        el.className = 'sv-seat';
        el.innerHTML = '<div class="ava"><span class="face"></span><div class="think"><i></i><i></i><i></i></div></div>' +
          '<div class="plate"><span class="nmrow"><span class="name"></span><span class="scw"></span></span><span class="cnt"></span></div>';
        box.appendChild(el);
        seatEls[seat] = el;
      }
      const info = seatInfo && seatInfo[seat];
      const kind = info && info.type === 'human' ? 'human' : 'ai:' + (info ? info.robot : seat - 1);
      if (el.dataset.kind !== kind) {
        el.dataset.kind = kind;
        el.querySelector('.face').innerHTML = kind === 'human' ? A.personSVG(seat) : A.robotSVG(info ? info.robot : seat - 1);
      }
      el.classList.toggle('away', !!(info && info.type === 'human' && !info.connected));
      box.appendChild(el); // 並び順をそろえる
      const P = S.players[seat];
      el.querySelector('.name').textContent = P.name;
      el.querySelector('.scw').innerHTML = scoreTag(seat);
      el.querySelector('.cnt').innerHTML = P.out ? (P.elim ? '<span class="out-tag foul">失格</span>' : '<span class="out-tag">' + placeOf(seat) + '位</span>')
        : '<span class="mini" style="background-image:' + UI.backURI + '"></span>' + P.hand.length + passPips(P);
      el.classList.toggle('turn', S.phase === 'play' && S.turn === seat);
      el.classList.toggle('out', !!P.out);
    }
    for (const k of Object.keys(seatEls)) if (!alive.has(k)) { seatEls[k].remove(); delete seatEls[k]; }
  }

  function cellHTML(s, n) {
    const c = S.board[s][n];
    const tgt = jokerTargets && jokerTargets.some((sp) => sp.suit === s && sp.n === n);
    if (!c) return '<button type="button" class="svc empty' + (tgt ? ' target' : '') + '" data-s="' + s + '" data-n="' + n + '"' + (tgt ? '' : ' tabindex="-1"') +
      ' aria-label="' + C.SUIT_NAME[s] + 'の' + numLabel(n) + '（空き）"><span>' + numLabel(n) + '</span></button>';
    if (c.joker) return '<div class="svc joker" data-s="' + s + '" data-n="' + n + '" aria-label="ジョーカー"><b>J</b><i>★</i></div>';
    return '<div class="svc placed ' + SUIT_COLOR[s] + (c.elim ? ' elim' : '') + '" data-s="' + s + '" data-n="' + n + '"><b>' + numLabel(n) + '</b><i>' + C.SUIT_SYM[s] + '</i></div>';
  }

  function renderBoard() {
    const b = $('sv-board');
    let h = '';
    for (const s of SV.SUITS) {
      h += '<div class="sv-row" data-suit="' + s + '"><span class="sv-suit ' + SUIT_COLOR[s] + '">' + A.suitIcon(s, 14) + '</span>';
      for (let n = 1; n <= 13; n++) h += cellHTML(s, n);
      h += '</div>';
    }
    b.innerHTML = h;
    b.classList.toggle('picking', !!jokerTargets);
    b.querySelectorAll('.svc.target').forEach((el) => el.addEventListener('click', () => { if (onPickSpot) onPickSpot(el.dataset.s, +el.dataset.n); }));
  }
  let onPickSpot = null;

  function renderMe() {
    const P = S.players[human];
    let st = '';
    if (P.out) st = P.elim ? '<span class="yourturn">失格</span>' : '<span class="yourturn">' + placeOf(human) + '位で上がり</span>';
    $('sv-me-id').innerHTML = '<span class="ava">' + A.humanSVG() + '</span><span class="nm">' + esc(P.name) + '</span>' + scoreTag(human) + passPips(P) + st;
    $('sv-me').classList.toggle('turn', S.phase === 'play' && S.turn === human);
  }

  function renderStatus() {
    const out = [];
    if (S.joker) out.push('<span class="chip lock">★ ジョーカー：' + C.SUIT_SYM[S.joker.suit] + numLabel(S.joker.n) + ' の場所</span>');
    if (S.phase === 'play') out.push('<span class="chip turnchip">' + (S.turn === human ? 'あなたの番' : esc(S.players[S.turn].name) + 'の番') + '</span>');
    $('sv-status').innerHTML = out.join('');
  }

  /** 手札（大富豪と同じ並べ方：重ねて1段、多ければ2段） */
  function renderHand() {
    const box = $('sv-hand');
    const hand = SV.sortHand(S.players[human].hand);
    for (const [id, el] of handEls) if (!hand.includes(id)) { el.remove(); handEls.delete(id); }
    const W = box.clientWidth || 320;
    const cw = parseFloat(getComputedStyle($('scr-sevens')).getPropertyValue('--cw')) || 64;
    const ch = cw * 1.4;
    const n = hand.length;
    let rows = 1;
    let step = n > 1 ? Math.min(cw * 0.64, (W - cw) / (n - 1)) : 0;
    if (n > 1 && step < Math.max(20, cw * 0.34)) rows = 2;
    box.classList.toggle('two', rows === 2);
    const perRow = rows === 2 ? Math.ceil(n / 2) : n;
    if (rows === 2) step = perRow > 1 ? Math.min(cw * 0.64, (W - cw) / (perRow - 1)) : 0;
    const q = S.phase === 'play' && S.turn === human && humanCancel;
    const playable = q && CM.settings.showPlayable ? new Set(SV.legalMoves(S, human, true).map((a) => (a.type === 'joker' ? 'X1' : a.card))) : null;
    box.classList.toggle('locked', !q);
    hand.forEach((id, i) => {
      let el = handEls.get(id);
      if (!el) {
        el = UI.makeCardEl(id);
        el.setAttribute('role', 'button');
        el.tabIndex = 0;
        el.addEventListener('click', () => onCardTap(id));
        el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onCardTap(id); } });
        box.appendChild(el);
        handEls.set(id, el);
      }
      const row = rows === 2 && i >= perRow ? 1 : 0;
      const j = row ? i - perRow : i;
      const cnt = row ? n - perRow : perRow;
      const x = (W - (cw + (cnt - 1) * step)) / 2 + j * step;
      let y = row * ch * 0.55;
      if (sel === id) y -= 22;
      el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
      el.style.zIndex = String(i + 1);
      el.classList.toggle('sel', sel === id);
      el.setAttribute('aria-pressed', sel === id ? 'true' : 'false');
      el.classList.toggle('dim', !!(playable && !playable.has(id)));
    });
  }
  let onCardTap = () => {};

  // ─────────────────────────────────────────────
  // 演出（エンジンのイベントを順に見せる）
  // ─────────────────────────────────────────────
  const cellEl = (s, n) => $('sv-board').querySelector('.svc[data-s="' + s + '"][data-n="' + n + '"]');
  function seatRect(seat) {
    if (seat === human) {
      const r = $('sv-hand').getBoundingClientRect();
      return { left: r.left + r.width / 2 - 30, top: r.top + 10, width: 60, height: 84 };
    }
    const el = seatEls[seat] && seatEls[seat].querySelector('.ava');
    const r = el ? el.getBoundingClientRect() : { left: innerWidth / 2, top: 60, width: 0, height: 0 };
    return { left: r.left + r.width / 2 - 18, top: r.top + r.height / 2 - 25, width: 36, height: 50 };
  }
  function fromRect(seat, id) {
    const el = seat === human && handEls.get(id);
    return el ? el.getBoundingClientRect() : seatRect(seat);
  }
  async function flyToCell(seat, id, s, n, faceId) {
    const target = cellEl(s, n);
    if (!target) return;
    const to = target.getBoundingClientRect();
    const from = fromRect(seat, id);
    SND.play('card', 1);
    await UI.fly([{ id: faceId || id, from, to, r0: seat === human ? 0 : -10 }], 330);
  }
  function bubble(seat, text, alert, kind) {
    const host = seat === human ? $('sv-me-id') : seatEls[seat];
    UI.bubbleAt(host, text, alert, kind);
  }

  async function playEvents(evs, fromDeal) {
    for (const ev of evs) {
      switch (ev.t) {
        case 'deal': {
          if (fromDeal) SND.play('deal');
          renderAll();
          break;
        }
        case 'sevens': {
          await sleep(200 * UI.speed);
          for (const p of ev.placed) {
            bubble(p.seat, C.SUIT_SYM[p.card[0]] + '7', false);
          }
          SND.play('flow');
          await sleep(500 * UI.speed);
          break;
        }
        case 'start': {
          renderAll();
          UI.toast(nameOf(ev.leader) + ' から始めます（♦7）', 1600);
          break;
        }
        case 'play': {
          renderStatus();
          await flyToCell(ev.seat, ev.card, ev.card[0], SV.numOf(ev.card));
          renderAll();
          break;
        }
        case 'joker': {
          await flyToCell(ev.seat, 'X1', ev.suit, ev.n);
          renderAll();
          SND.play('special');
          await UI.banner('ジョーカー', 'cool', C.SUIT_SYM[ev.suit] + numLabel(ev.n) + ' を持っている人は、次の番で必ず出す', 1300);
          break;
        }
        case 'jokerBack': {
          await flyToCell(ev.seat, ev.card, ev.card[0], SV.numOf(ev.card));
          renderAll();
          bubble(ev.seat, 'ジョーカーを受け取った', true);
          SND.play('special');
          await sleep(500 * UI.speed);
          break;
        }
        case 'pass': {
          SND.play('pass');
          bubble(ev.seat, ev.limit ? 'パス ' + ev.passes + '/' + ev.limit : 'パス', ev.limit && ev.passes >= ev.limit);
          renderSeats(); renderMe();
          await sleep(300 * UI.speed);
          break;
        }
        case 'elim': {
          SND.play('foul');
          renderAll();
          await UI.banner('失格', 'foul', nameOf(ev.seat) + 'のカードを場に並べます', 1300);
          break;
        }
        case 'finish': {
          renderAll();
          SND.play(ev.seat === human && ev.place === 1 ? 'fanfare' : 'finish');
          await UI.banner(ev.seat === human ? (ev.place === 1 ? '一番上がり！' : ev.place + '位で上がり') : '上がり', ev.seat === human ? '' : 'small', nameOf(ev.seat) + '（' + ev.place + '位）', 1100);
          break;
        }
        case 'last':
        case 'over':
          renderAll();
          break;
        default:
          break;
      }
    }
    renderAll();
  }

  // ─────────────────────────────────────────────
  // 進行（ローカルのAI戦）
  // ─────────────────────────────────────────────
  function thinkTime(q) {
    const f = S.players[human].out ? 0.45 : 1;
    return (560 + Math.random() * 280) * UI.speed * f;
  }

  async function runLoop() {
    const token = ++loopToken;
    while (token === loopToken) {
      const q = SV.getRequest(S);
      if (!q) { if (S.phase === 'over') await showResults(token); return; }
      const P = S.players[q.seat];
      let action;
      if (P.human) {
        action = await humanTurn(q);
        if (token !== loopToken || !action) return;
      } else {
        setThinking(q.seat, true);
        const t0 = performance.now();
        // つよいAIは決まった回数だけ試す（端末の速さで強さが変わらないように）。3秒はとても遅い端末での上限
        try { action = await AI.decide(S, q, P.level, 3000); } catch (e) { console.error(e); action = SV.legalMoves(S, q.seat)[0]; }
        const wait = thinkTime(q) - (performance.now() - t0);
        if (wait > 0) await sleep(wait);
        setThinking(q.seat, false);
        if (token !== loopToken) return;
      }
      let evs;
      try { evs = SV.apply(S, action); } catch (err) {
        if (P.human) { UI.toast(err.message); SND.play('error'); continue; }
        console.error(err);
        evs = SV.apply(S, SV.legalMoves(S, q.seat)[0]);
      }
      if (S.matchOver && CM.applyRatedLocal(S)) persist();
      await playEvents(evs);
      persist();
    }
  }
  function setThinking(seat, on) { const el = seatEls[seat]; if (el) el.classList.toggle('thinking', !!on); }

  /** 自分の番：カードを選んで「出す」／ジョーカーは場所を選ぶ／パス */
  function humanTurn(q) {
    return new Promise((resolve) => {
      let done = false;
      let autoTimer = 0;
      const finish = (a) => {
        if (done) return;
        done = true;
        humanCancel = null;
        sel = null;
        jokerTargets = null;
        onPickSpot = null;
        onCardTap = () => {};
        $('sv-play').onclick = $('sv-pass').onclick = $('sv-hint').onclick = null;
