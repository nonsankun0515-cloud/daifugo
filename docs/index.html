<script>
/* 大富豪 — AIロボット（やさしい / ふつう / つよい） */
(function () {
  'use strict';
  const D = (globalThis.DFG = globalThis.DFG || {});
  const E = D.Engine, C = D.Cards;
  const { CARDS, strength } = C;

  // ─────────────────────────────────────────────
  // 見えている情報：自分以外の誰かが持っている（まだ出ていない）カード
  // ─────────────────────────────────────────────
  function unknownInfo(S, seat) {
    const seen = new Set(S.players[seat].hand);
    for (const id of S.discard) seen.add(id);
    for (const e of S.pile) for (const id of e.shown) seen.add(id);
    const cards = C.makeDeck(S.rules.jokers).filter((id) => !seen.has(id));
    const byRank = new Array(17).fill(0);
    let jokers = 0;
    for (const id of cards) { if (C.isJoker(id)) jokers++; else byRank[C.rankOf(id)]++; }
    return { cards, byRank, jokers };
  }

  function makeCtx(S, seat) {
    let oppMin = 99;
    for (const p of S.players) if (p.seat !== seat && !p.out) oppMin = Math.min(oppMin, p.hand.length);
    return { R: S.rules, rev: S.revolution, unk: unknownInfo(S, seat), oppMin, seat };
  }

  // ─────────────────────────────────────────────
  // 手札の評価（大きいほど良い）
  //   ・コントロール札（流せる/勝てる組）は「親を取り返せる」ので価値が高い
  //   ・それ以外の組の数と弱さが少ないほど良い
  // ─────────────────────────────────────────────
  function isControlSet(r, k, ctx) {
    const R = ctx.R;
    if (R.eightCut && r === 8) return true;
    if (R.sandstorm && r === 3 && k === 3) return true;
    if (R.rokurokubi && r === 6 && k === 2) return true;
    if (R.kyukyusha && r === 9 && k === 2) return true;
    if (k >= 4) return true;
    const unk = ctx.unk;
    const s = strength(r, ctx.rev);
    for (let r2 = 3; r2 <= 15; r2++) {
      if (strength(r2, ctx.rev) > s && unk.byRank[r2] >= 1 && unk.byRank[r2] + unk.jokers >= k) return false;
    }
    if (k === 1 && unk.jokers > 0) return false;
    if (k === 2 && unk.jokers >= 2) return false;
    return true;
  }

  function forbiddenRank(r, ctx) {
    const R = ctx.R;
    return (R.forbidTwo && r === (ctx.rev ? 3 : 15)) || (R.forbidEight && r === 8);
  }

  function findRuns(hand) {
    const bySuit = { S: [], H: [], D: [], C: [] };
    for (const id of hand) { const c = CARDS[id]; if (!c.joker) bySuit[c.suit].push(c.rank); }
    const runs = [];
    for (const s of C.SUITS) {
      const rs = bySuit[s].sort((a, b) => a - b);
      let i = 0;
      while (i < rs.length) {
        let j = i;
        while (j + 1 < rs.length && rs[j + 1] === rs[j] + 1) j++;
        const L = j - i + 1;
        if (L >= 3) {
          const lo = rs[i], hi = rs[j];
          if (L <= 6) {
            for (let a = lo; a <= hi - 2; a++) for (let b = a + 2; b <= hi; b++) runs.push({ suit: s, low: a, high: b });
          } else runs.push({ suit: s, low: lo, high: hi });
        }
        i = j + 1;
      }
    }
    return runs;
  }

  function scoreGroups(cnt, runs, J, handSize, ctx) {
    let nonControl = 0, controls = 0, weak = 0, allForbidden = true;
    for (let r = 3; r <= 15; r++) {
      const k = cnt[r];
      if (!k) continue;
      const st = (strength(r, ctx.rev) - 3) / 12;
      if (isControlSet(r, k, ctx)) controls++;
      else { nonControl++; weak += 1 - st; }
      if (!forbiddenRank(r, ctx)) allForbidden = false;
    }
    for (const run of runs) {
      const L = run.high - run.low + 1;
      const st = Math.min(1, (Math.min(strength(run.low, ctx.rev), strength(run.high, ctx.rev)) - 3) / 12 + 0.25);
      if (L >= 4 || st > 0.8) controls++;
      else { nonControl++; weak += 1 - st; }
      const R = ctx.R;
      const bad = (R.forbidTwo && run.low <= (ctx.rev ? 3 : 15) && (ctx.rev ? 3 : 15) <= run.high) || (R.forbidEight && run.low <= 8 && 8 <= run.high);
      if (!bad) allForbidden = false;
    }
    if (J) { controls += J; if (!ctx.R.forbidJoker) allForbidden = false; }
    const cw = 0.8 + 0.03 * handSize;
    let v = -1.0 * nonControl - 0.45 * weak + cw * controls - 0.05 * handSize;
    if (nonControl === 0) v += 1.0;
    else if (nonControl === 1) v += 0.6;
    if (allForbidden && handSize > 0) v -= 2.2;
    return { v, nonControl, controls };
  }

  function analyze(hand, ctx) {
    if (!hand.length) return { v: 100, nonControl: 0, controls: 0 };
    const cnt = new Array(16).fill(0);
    let J = 0;
    for (const id of hand) { const c = CARDS[id]; if (c.joker) J++; else cnt[c.rank]++; }
    let best = scoreGroups(cnt, [], J, hand.length, ctx);
    if (ctx.R.sequence) {
      const runs = findRuns(hand).slice(0, 12);
      const bySuitRank = new Set(hand.filter((id) => !C.isJoker(id)));
      const tryRuns = (list) => {
        const c2 = cnt.slice();
        const used = new Set();
        for (const run of list) {
          for (let r = run.low; r <= run.high; r++) {
            const id = run.suit + r;
            if (used.has(id) || !bySuitRank.has(id)) return;
            used.add(id);
            c2[r]--;
          }
        }
        const sc = scoreGroups(c2, list, J, hand.length, ctx);
        if (sc.v > best.v) best = sc;
      };
      for (let i = 0; i < runs.length; i++) {
        tryRuns([runs[i]]);
        for (let j = i + 1; j < runs.length; j++) tryRuns([runs[i], runs[j]]);
      }
    }
    return best;
  }
  const evaluate = (hand, ctx) => analyze(hand, ctx).v;

  function minus(hand, cards) {
    const out = hand.slice();
    for (const id of cards) { const i = out.indexOf(id); if (i >= 0) out.splice(i, 1); }
    return out;
  }

  /** 価値の低いカードを k 枚選ぶ（渡す・捨てる用） */
  function worstCards(hand, k, ctx) {
    let cur = hand.slice();
    const picked = [];
    for (let t = 0; t < k && cur.length; t++) {
      let best = null, bestV = -Infinity;
      for (const id of cur) {
        const v = evaluate(minus(cur, [id]), ctx) - (C.isJoker(id) ? 3 : 0);
        if (v > bestV) { bestV = v; best = id; }
      }
      picked.push(best);
      cur = minus(cur, [best]);
    }
    return picked;
  }

  // 12ボンバー：自分の手札にある数字から、自分に得で相手に損なものを選ぶ（得がなければ指名しない）
  function chooseBomb(S, seat, count, hand, ctx) {
    const base = evaluate(hand, ctx);
    const scored = [];
    for (const r of E.bombableRanks(hand)) {
      const mine = hand.filter((id) => !C.isJoker(id) && C.rankOf(id) === r);
      const myDelta = evaluate(minus(hand, mine), ctx) - base;
      const st = (strength(r, ctx.rev) - 3) / 12;
      const opp = ctx.unk.byRank[r];
      const oppGain = opp * (0.35 - 0.6 * st);
      scored.push({ r, s: myDelta - 0.7 * oppGain });
    }
    scored.sort((a, b) => b.s - a.s);
    return scored.filter((x) => x.s > 0).slice(0, count).map((x) => x.r);
  }

  // ─────────────────────────────────────────────
  // 自分の番：出す／パス
  // ─────────────────────────────────────────────
  function beatableAfter(S, p, ctx, revAfterTrick) {
    const unk = ctx.unk;
    if (p.type === 'seq') return p.n < 5;
    if (p.wild) return ctx.R.spade3 && unk.cards.includes('S3') && p.n === 1;
    const s = strength(p.rank, revAfterTrick);
    for (let r = 3; r <= 15; r++) {
      if (strength(r, revAfterTrick) > s && unk.byRank[r] >= 1 && unk.byRank[r] + unk.jokers >= p.n) return true;
    }
    if (p.n === 1 && unk.jokers > 0) return true;
    return false;
  }

  function scorePlay(S, seat, p, ctx) {
    const R = S.rules;
    const P = S.players[seat];
    const fx = E.effectsOf(p, S);
    const revNow = E.effRev(S);
    let after = minus(P.hand, p.cards);
    const ctx2 = Object.assign({}, ctx, { rev: fx.revolution ? !S.revolution : S.revolution });
    if (!after.length) return E.isForbiddenFinish(p, R, revNow) ? -40 : 1000;
    let bonus = 0;
    if (fx.give) after = minus(after, worstCards(after, Math.min(fx.give, after.length), ctx2));
    if (fx.back) after = minus(after, worstCards(after, Math.min(fx.back, after.length), ctx2));
    if (fx.discard) after = minus(after, worstCards(after, Math.min(fx.discard, after.length), ctx2));
    if (fx.bomb) {
      const ranks = chooseBomb(S, seat, fx.bomb, after, ctx2);
      after = after.filter((id) => C.isJoker(id) || !ranks.includes(C.rankOf(id)));
      for (const r of ranks) bonus += ctx.unk.byRank[r] * (0.6 * (strength(r, ctx2.rev) - 3) / 12 - 0.2);
    }
    if (!after.length) return E.isForbiddenFinish(p, R, revNow) ? -40 : 900;
    const an = analyze(after, ctx2);
    let v = an.v + bonus;
    const jAfter = fx.jToggles % 2 === 1 ? !S.jback : S.jback;
    const trickRev = ctx2.rev !== jAfter;
    const top = E.topPlay(S);
    const takesLead = fx.sand || !!fx.flow || fx.greatRev ||
      (top && top.wild && p.cards[0] === 'S3' && R.spade3) || !beatableAfter(S, p, ctx, trickRev);
    if (takesLead) v += 0.8 + (an.nonControl <= 1 ? 1.2 : 0);
    v += 0.12 * fx.skip;
    // 相手が上がりそうなとき
    if (!top && ctx.oppMin === 1 && p.n === 1 && !takesLead) v -= 1.6;
    if (!top && ctx.oppMin === 2 && p.n === 2 && !takesLead) v -= 0.6;
    // 革命：自分の手が強い時は起こしたくない（評価に反映済み）が、相手の枚数が少ない時は慎重に
    return v;
  }

  function passScore(S, seat, ctx) {
    const P = S.players[seat];
    let v = evaluate(P.hand, ctx);
    const winner = S.lastSeat;
    if (winner !== null && winner !== seat) {
      const wl = S.players[winner].hand.length;
      if (!S.players[winner].out && wl <= 2) v -= 1.6;
      else if (ctx.oppMin <= 2) v -= 0.5;
    }
    return v;
  }

  /** 終盤の定石：コントロール札を先に出し、最後の1組で上がる */
  function endgamePlay(S, seat, plays, ctx) {
    const P = S.players[seat];
    if (E.topPlay(S)) return null;
    const an = analyze(P.hand, ctx);
    if (an.nonControl > 1 || an.controls < 1) return null;
    let best = null, bestKey = -Infinity;
    for (const p of plays) {
      const after = minus(P.hand, p.cards);
      if (!after.length) continue;
      const a2 = analyze(after, ctx);
      if (a2.nonControl > 1) continue;
      if (beatableAfter(S, p, ctx, E.effRev(S)) && !E.effectsOf(p, S).flow) continue;
      const forbiddenLast = E.isForbiddenFinish(p, S.rules, E.effRev(S)) ? 1 : 0;
      const key = forbiddenLast * 10 + p.n - a2.nonControl;
      if (key > bestKey) { bestKey = key; best = p; }
    }
    return best;
  }

  function chooseTurnHeuristic(S, seat, noise) {
    const ctx = makeCtx(S, seat);
    const plays = E.legalPlays(S, seat);
    const canPass = !!E.topPlay(S);
    const scored = [];
    for (const p of plays) {
      const after = S.players[seat].hand.length - p.cards.length;
      if (after === 0 && !E.isForbiddenFinish(p, S.rules, E.effRev(S))) return { action: { type: 'play', seat, play: p }, scored: [] };
    }
    const eg = endgamePlay(S, seat, plays, ctx);
    if (eg) return { action: { type: 'play', seat, play: eg }, scored: [] };
    if (canPass) scored.push({ a: { type: 'pass', seat }, s: passScore(S, seat, ctx) });
    for (const p of plays) scored.push({ a: { type: 'play', seat, play: p }, s: scorePlay(S, seat, p, ctx) + (noise ? (Math.random() - 0.5) * noise : 0) });
    scored.sort((a, b) => b.s - a.s);
    return { action: scored[0].a, scored };
  }

  // ─────────────────────────────────────────────
  // ロールアウト用の速い方針（つよいAIのシミュレーション）
  // ─────────────────────────────────────────────
  function fastTurn(S, seat) {
    const P = S.players[seat];
    const plays = E.legalPlays(S, seat);
    const top = E.topPlay(S);
    const rev = E.effRev(S);
    if (!plays.length) return { type: 'pass', seat };
    const cnt = {};
    for (const id of P.hand) { const c = CARDS[id]; if (!c.joker) cnt[c.rank] = (cnt[c.rank] || 0) + 1; }
    let best = null, bestS = -Infinity;
    for (const p of plays) {
      if (p.cards.length === P.hand.length && !E.isForbiddenFinish(p, S.rules, rev)) return { type: 'play', seat, play: p };
      let s;
      if (p.wild) s = -8;
      else if (p.type === 'seq') s = -(Math.min(strength(p.low, rev), strength(p.high, rev))) + p.n * 0.8;
      else {
        s = -strength(p.rank, rev) + p.n * 0.6;
        if (cnt[p.rank] && cnt[p.rank] > p.n) s -= 3;
        if (p.jokers) s -= 4;
      }
      if (s > bestS) { bestS = s; best = p; }
    }
    if (top) {
      let near = false;
      for (const q of S.players) if (q.seat !== seat && !q.out && q.hand.length <= 2) near = true;
      const strong = best.wild || (best.type !== 'seq' && strength(best.rank, rev) >= 14);
      if (!near && strong && P.hand.length > 4 && Math.random() < 0.7) return { type: 'pass', seat };
      if (!near && Math.random() < 0.12) return { type: 'pass', seat };
    }
    return { type: 'play', seat, play: best };
  }

  function weakest(hand, k, rev) {
    return C.sortHand(hand.filter((id) => !C.isJoker(id)), rev).slice(0, k);
  }

  function fastAction(S, q) {
    const seat = q.seat;
    const hand = S.players[seat].hand;
    const rev = S.revolution;
    switch (q.kind) {
      case 'turn': return fastTurn(S, seat);
      case 'stop': return { type: 'stop', seat, kind: E.stopOptions(S, seat)[0].kind };
      case 'give': case 'discard': return { type: q.kind, seat, cards: weakest(hand, q.count, rev) };
      case 'pickup': return { type: 'pickup', seat, cards: [] };
      case 'bomb': {
        // 手札で一番弱い数字を捨てる
        let best = null, bs = Infinity;
        for (const r of q.ranks) { const s = strength(r, rev); if (s < bs) { bs = s; best = r; } }
        return { type: 'bomb', seat, ranks: best === null ? [] : [best] };
      }
      case 'exchange': return { type: 'exchange', seat, cards: weakest(hand, q.count, false).concat(hand.filter(C.isJoker)).slice(0, q.count) };
      case 'tenpen': return { type: 'tenpen', seat, accept: true };
    }
    throw new Error('unknown request');
  }

  let ROLLOUT = 'normal';
  function rolloutPlace(T, seat) {
    let guard = 0;
    let q;
    const smart = ROLLOUT === 'normal';
    while ((q = E.getRequest(T)) && guard++ < 800) E.apply(T, smart ? decideSync(T, q, 'normal') : fastAction(T, q));
    if (T.phase !== 'over') return 0.5;
    const place = T.prevRanking.indexOf(seat);
    return 1 - place / (T.n - 1);
  }

  function determinize(T, seat, unk) {
    const pool = C.shuffle(unk.cards.slice());
    for (const p of T.players) {
      if (p.seat === seat || p.out) continue;
      const k = p.hand.length;
      p.hand = C.sortHand(pool.splice(0, k), false);
    }
  }

  const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
  // 考えている間も画面が止まらないように、ときどき処理を譲る（タイマーより間引かれにくい MessageChannel を使う）
  const yieldUI = (() => {
    if (typeof MessageChannel === 'undefined') return () => new Promise((r) => setTimeout(r, 0));
    const ch = new MessageChannel();
    const waiting = [];
    ch.port1.onmessage = () => { const r = waiting.shift(); if (r) r(); };
    return () => new Promise((r) => { waiting.push(r); ch.port2.postMessage(0); });
  })();

  async function chooseTurnMC(S, seat, budgetMs) {
    const h = chooseTurnHeuristic(S, seat, 0);
    if (!h.scored.length) return h.action;
    const seen = new Set();
    const cands = [];
    for (const x of h.scored) {
      const key = x.a.type === 'pass' ? 'pass' : x.a.play.type + x.a.play.n + ':' + (x.a.play.rank || x.a.play.low) + ':' + x.a.play.jokers;
      if (seen.has(key)) continue;
      seen.add(key);
      cands.push(x);
      if (cands.length >= 5) break;
    }
    if (cands.length === 1) return cands[0].a;
    const unk = unknownInfo(S, seat);
    const stats = cands.map(() => ({ sum: 0, n: 0 }));
    const t0 = now();
    let it = 0;
    while (now() - t0 < budgetMs && it < 1500) {
      const ci = it % cands.length;
      const T = E.clone(S);
      determinize(T, seat, unk);
      try {
        E.apply(T, cands[ci].a);
        stats[ci].sum += rolloutPlace(T, seat);
        stats[ci].n++;
      } catch (e) { stats[ci].n++; }
      it++;
      if (it % 8 === 0) await yieldUI();
    }
    let best = 0, bestV = -Infinity;
    cands.forEach((c, i) => {
      const mean = stats[i].n ? stats[i].sum / stats[i].n : 0;
      const v = mean + (i === 0 ? 0.02 : 0);
      if (v > bestV) { bestV = v; best = i; }
    });
    return cands[best].a;
  }

  // ─────────────────────────────────────────────
  // 公開API
  // ─────────────────────────────────────────────
  function decideSync(S, q, level) {
    const seat = q.seat;
    const P = S.players[seat];
    const ctx = makeCtx(S, seat);
    const easy = level === 'easy';
    const rnd = Math.random;
    switch (q.kind) {
      case 'turn': {
        if (easy && rnd() < 0.35) {
          const plays = E.legalPlays(S, seat);
          if (E.topPlay(S) && (!plays.length || rnd() < 0.3)) return { type: 'pass', seat };
          if (plays.length) return { type: 'play', seat, play: plays[Math.floor(rnd() * plays.length)] };
        }
        return chooseTurnHeuristic(S, seat, easy ? 1.2 : 0.08).action;
      }
      case 'stop': {
        const opts = E.stopOptions(S, seat);
        if (easy) return rnd() < 0.55 ? { type: 'stop', seat, kind: opts[0].kind } : { type: 'nostop', seat };
        // 止めた後の手札＋親を取れる価値 と 止めない場合（相手が親のまま）を比べる
        const trig = q.trigger;
        const trigLeft = S.players[trig.seat].hand.length;
        let bestV = evaluate(P.hand, ctx) - (trig.flow ? (trigLeft <= 3 ? 1.4 : 0.35) : 0.15);
        let best = null;
        for (const o of opts) {
          const after = minus(P.hand, o.play.cards);
          let v;
          if (!after.length) v = E.isForbiddenFinish(o.play, S.rules, E.effRev(S)) ? -40 : 1000;
          else {
            const an = analyze(after, ctx);
            v = an.v + 0.8 + (an.nonControl <= 1 ? 1.2 : 0);
          }
          if (v > bestV) { bestV = v; best = o; }
        }
        return best ? { type: 'stop', seat, kind: best.kind } : { type: 'nostop', seat };
      }
      case 'give': case 'discard': {
        if (easy) return { type: q.kind, seat, cards: C.shuffle(P.hand.slice()).slice(0, q.count) };
        return { type: q.kind, seat, cards: worstCards(P.hand, q.count, ctx) };
      }
      case 'pickup': {
        if (easy) return { type: 'pickup', seat, cards: [] };
        let take = [];
        let base = evaluate(P.hand, ctx);
        for (const id of q.cards) {
          const v = evaluate(P.hand.concat(take, [id]), ctx);
          if (v > base + 0.15) { take.push(id); base = v; }
        }
        return { type: 'pickup', seat, cards: take };
      }
      case 'bomb': {
        if (easy) return { type: 'bomb', seat, ranks: [q.ranks[Math.floor(rnd() * q.ranks.length)]] };
        return { type: 'bomb', seat, ranks: chooseBomb(S, seat, q.count, P.hand, ctx) };
      }
      case 'exchange': {
        const ctxN = Object.assign({}, ctx, { rev: false });
        return { type: 'exchange', seat, cards: worstCards(P.hand, q.count, ctxN) };
      }
      case 'tenpen': return { type: 'tenpen', seat, accept: true };
    }
    throw new Error('unknown request ' + q.kind);
  }

  async function decide(S, q, level, budgetMs) {
    if (q.kind === 'turn' && level === 'hard') return chooseTurnMC(S, q.seat, budgetMs || 450);
    return decideSync(S, q, level);
  }

  /** 人間向けヒント（ふつうのAIの考え） */
  function suggest(S, seat) {
    return chooseTurnHeuristic(S, seat, 0).action;
  }

  D.AI = {
    decide, decideSync, suggest, evaluate, analyze, unknownInfo, makeCtx, worstCards, chooseBomb, fastAction,
    setRollout(p) { ROLLOUT = p; },
  };
})();

</script>
<script>
/* 大富豪 — カードの絵柄・ロボットのアバター・アイコン（すべてSVGで描画） */
(function () {
  'use strict';
  const D = (globalThis.DFG = globalThis.DFG || {});
  const C = D.Cards;

  const INK = { red: '#b3141f', black: '#16171b' };
  const GOLD = '#c9a032', GOLD_DARK = '#7a5a14', GOLD_LIGHT = '#e9c46a';
  const COURT_BLUE = '#1d3f8f';

  // 100×100 の枠に描いたマーク
  const SUIT_SHAPE = {
    H: '<path d="M50 92C44 84 8 60 8 33 8 17 20 7 33 7c9 0 15 6 17 13 2-7 8-13 17-13 13 0 25 10 25 26 0 27-36 51-42 59z"/>',
    D: '<path d="M50 4c8 16 22 34 38 46-16 12-30 30-38 46-8-16-22-34-38-46C28 38 42 20 50 4z"/>',
    S: '<path d="M50 5S10 38 10 60c0 15 12 23 24 23 7 0 12-3 14-7-1 8-5 15-12 19h28c-7-4-11-11-12-19 2 4 7 7 14 7 12 0 24-8 24-23C90 38 50 5 50 5z"/>',
    C: '<circle cx="50" cy="29" r="19"/><circle cx="28.5" cy="58" r="19"/><circle cx="71.5" cy="58" r="19"/><circle cx="50" cy="52" r="11"/><path d="M46 58c0 18-4 29-12 37h32c-8-8-12-19-12-37z"/>',
  };

  const inkOf = (suit) => (C.RED[suit] ? INK.red : INK.black);

  function pip(suit, cx, cy, size, flip) {
    const s = size / 100;
    const t = (flip ? 'rotate(180 ' + cx + ' ' + cy + ') ' : '') + 'translate(' + (cx - size / 2) + ' ' + (cy - size / 2) + ') scale(' + s + ')';
    return '<g transform="' + t + '">' + SUIT_SHAPE[suit] + '</g>';
  }

  function suitIcon(suit, size, color) {
    const col = color || inkOf(suit);
    return '<svg class="suit-ic" viewBox="0 0 100 100" width="' + size + '" height="' + size + '" fill="' + col + '" aria-hidden="true">' + SUIT_SHAPE[suit] + '</svg>';
  }

  // 共有の定義（グラデーション・模様）。ドキュメントに1回だけ置く
  const SHARED_DEFS =
    '<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>' +
    '<linearGradient id="dfg-face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#f3eee1"/></linearGradient>' +
    '<linearGradient id="dfg-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d77e"/><stop offset=".55" stop-color="#d4a53a"/><stop offset="1" stop-color="#a47a1c"/></linearGradient>' +
    '<pattern id="dfg-hatch-r" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 4h8" stroke="#b3141f" stroke-opacity=".09" stroke-width="3"/></pattern>' +
    '<pattern id="dfg-hatch-b" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 4h8" stroke="#1d3f8f" stroke-opacity=".09" stroke-width="3"/></pattern>' +
    '</defs></svg>';

  const FONT_IDX = "'Playfair Display','Libre Baskerville',Georgia,'Times New Roman',serif";

  function corners(c, col) {
    const lab = C.RANK_LABEL[c.rank];
    const ten = lab === '10';
    const one =
      '<text x="' + (ten ? 22 : 21) + '" y="44" text-anchor="middle" font-family="' + FONT_IDX + '" font-weight="700" font-size="' +
      (ten ? 31 : 37) + '" letter-spacing="' + (ten ? -3 : 0) + '">' + lab + '</text>' + pip(c.suit, 21, 63, 21);
    return '<g>' + one + '</g><g transform="rotate(180 100 140)">' + one + '</g>';
  }

  const PIPS = (() => {
    const L = 64, M = 100, R = 136;
    const four = [[L, 52], [R, 52], [L, 111], [R, 111], [L, 169], [R, 169], [L, 228], [R, 228]];
    return {
      2: [[M, 52], [M, 228]],
      3: [[M, 52], [M, 140], [M, 228]],
      4: [[L, 52], [R, 52], [L, 228], [R, 228]],
      5: [[L, 52], [R, 52], [M, 140], [L, 228], [R, 228]],
      6: [[L, 52], [R, 52], [L, 140], [R, 140], [L, 228], [R, 228]],
      7: [[L, 52], [R, 52], [M, 96], [L, 140], [R, 140], [L, 228], [R, 228]],
      8: [[L, 52], [R, 52], [M, 96], [L, 140], [R, 140], [M, 184], [L, 228], [R, 228]],
      9: four.concat([[M, 140]]),
      10: four.concat([[M, 81], [M, 199]]),
    };
  })();

  function pips(c) {
    const n = c.rank === 15 ? 2 : c.rank;
    return PIPS[n].map(([x, y]) => pip(c.suit, x, y, 34, y > 140)).join('');
  }

  function ace(c) {
    if (c.suit === 'S') {
      return '<circle cx="100" cy="140" r="64" fill="none" stroke="' + GOLD + '" stroke-width="1.6"/>' +
        '<circle cx="100" cy="140" r="58" fill="none" stroke="' + GOLD + '" stroke-opacity=".55" stroke-width=".8"/>' +
        pip('S', 100, 138, 92) +
        '<path d="M40 140h8M152 140h8M100 72v6M100 202v6" stroke="' + GOLD + '" stroke-width="1.6"/>';
    }

  }

  function crown(rank) {
    const g = 'fill="url(#dfg-gold)" stroke="' + GOLD_DARK + '" stroke-width=".9" stroke-linejoin="round"';

      return '<path ' + g + ' d="M74 78V56l10 10 8-17 8 13 8-13 8 17 10-10v22z"/>' +
        '<rect ' + g + ' x="72" y="76" width="56" height="7" rx="1.5"/>' +
        '<circle cx="74" cy="55" r="3" fill="' + INK.red + '"/><circle cx="92" cy="48" r="3" fill="' + COURT_BLUE + '"/>' +
        '<circle cx="108" cy="48" r="3" fill="' + COURT_BLUE + '"/><circle cx="126" cy="55" r="3" fill="' + INK.red + '"/>' +
        '<circle cx="100" cy="61" r="3.4" fill="' + INK.red + '"/>';

        '<path ' + g + ' d="M82 72l-2-12 8 6zM118 72l2-12-8 6zM100 67l-6-16h12z"/>' +
        '<circle cx="80" cy="58" r="3.4" ' + g + '/><circle cx="120" cy="58" r="3.4" ' + g + '/>' +

    }
    return '<path fill="' + COURT_BLUE + '" stroke="' + GOLD_DARK + '" stroke-width=".9" d="M72 80c1-13 12-21 28-21 15 0 25 7 28 19z"/>' +
      '<path fill="url(#dfg-gold)" stroke="' + GOLD_DARK + '" stroke-width=".8" d="M72 80h56l-1 5H73z"/>' +
      '<path fill="' + INK.red + '" stroke="' + GOLD_DARK + '" stroke-width=".8" d="M116 62c6-10 14-16 24-18-6 6-11 13-14 22-4-2-7-3-10-4z"/>' +

  function court(c, col) {
    const letter = C.RANK_LABEL[c.rank];

  // ロボットのアバター（AIごとに色と形が違う）
  const ROBOTS = [
    { name: 'ロボ太', body: '#c8793a', dark: '#6f3a14', glow: '#ffd29a' },
    { name: 'メカ子', body: '#2a9d8f', dark: '#134b44', glow: '#9ff3e6' },
    { name: 'ギア丸', body: '#7b5ea7', dark: '#3b2a5c', glow: '#dac8ff' },
    { name: 'ボルト', body: '#4f79a8', dark: '#223a57', glow: '#bfe0ff' },
    { name: 'ネジ美', body: '#c0506a', dark: '#5f1f31', glow: '#ffc4d3' },

  function robotSVG(i) {
    const r = ROBOTS[i % ROBOTS.length];

    let antenna, eyes, extra = '';
    if (k === 0) {
      antenna = '<path d="M32 16V8" stroke="' + r.dark + '" stroke-width="2.5"/><circle cx="32" cy="7" r="3.6" fill="' + r.glow + '" stroke="' + r.dark + '" stroke-width="1.5"/>';
      eyes = '<circle cx="25" cy="33" r="4.2" fill="' + r.glow + '"/><circle cx="39" cy="33" r="4.2" fill="' + r.glow + '"/>';
    } else if (k === 1) {

      eyes = '<path d="M21 35q4-6 8 0M35 35q4-6 8 0" stroke="' + r.glow + '" stroke-width="3" fill="none" stroke-linecap="round"/>';
    } else if (k === 2) {

      eyes = '<rect x="20" y="29" width="9" height="7" rx="1.5" fill="' + r.glow + '"/><rect x="35" y="29" width="9" height="7" rx="1.5" fill="' + r.glow + '"/>';
    } else if (k === 3) {

      eyes = '<rect x="20" y="31" width="10" height="4" rx="2" fill="' + r.glow + '"/><rect x="34" y="31" width="10" height="4" rx="2" fill="' + r.glow + '"/>';
    } else {

      eyes = '<circle cx="25" cy="32" r="3.8" fill="' + r.glow + '"/><circle cx="39" cy="32" r="3.8" fill="' + r.glow + '"/>';
      extra = '<circle cx="20" cy="40" r="2.6" fill="#ff8fab" opacity=".85"/><circle cx="44" cy="40" r="2.6" fill="#ff8fab" opacity=".85"/>';
    }
    return '<svg viewBox="0 0 64 64" class="robot" aria-hidden="true">' + antenna +
      '<rect x="6" y="26" width="6" height="14" rx="2" fill="' + r.dark + '"/><rect x="52" y="26" width="6" height="14" rx="2" fill="' + r.dark + '"/>' +
      '<rect x="10" y="16" width="44" height="38" rx="11" fill="' + r.body + '" stroke="' + r.dark + '" stroke-width="2"/>' +
      '<rect x="15" y="23" width="34" height="21" rx="7" fill="' + r.dark + '"/>' + eyes + extra +
      '<rect x="24" y="47" width="16" height="3.4" rx="1.7" fill="' + r.dark + '" opacity=".75"/>' +
      '<path d="M16 19q6-3 12-1" stroke="#fff" stroke-opacity=".35" stroke-width="2" fill="none" stroke-linecap="round"/>' +
      '</svg>';
  }

  function humanSVG() {
    return '<svg viewBox="0 0 64 64" class="human" aria-hidden="true">' +
      '<circle cx="32" cy="32" r="30" fill="#1b2a22"/>' +
      '<circle cx="32" cy="25" r="10" fill="#e9c46a"/>' +

  // アイコン（線画）
  const ICON_PATHS = {
    menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
    back: '<path d="M15 5l-7 7 7 7"/>',

    soundOff: '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/>',
    log: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
    hint: '<path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/>',
    rules: '<path d="M5 4h11l3 3v13H5z"/><path d="M9 10h7M9 14h7M9 18h4"/>',
    cw: '<path d="M20 12a8 8 0 11-2.3-5.7"/><path d="M20 4v5h-5"/>',
    ccw: '<path d="M4 12a8 8 0 102.3-5.7"/><path d="M4 4v5h5"/>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
    crown: '<path d="M3 18h18l-2-10-5 4-2-6-2 6-5-4z"/>',
    play: '<path d="M7 5l12 7-12 7z"/>',
    restart: '<path d="M4 12a8 8 0 108-8"/><path d="M4 4v5h5"/>',
    home: '<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/>',
    check: '<path d="M5 12l5 5 9-10"/>',
  };
  function icon(name, size) {
    const s = size || 20;
    return '<svg class="ic" viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +

<script>
/* 大富豪 — テーブルの素材（フェルト・木・革）をキャンバスで作る */
(function () {
  'use strict';
  const D = (globalThis.DFG = globalThis.DFG || {});

  function canvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return c;
  }

  // 同じ乱数列にして、毎回同じ見た目にする
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /** フェルトの毛羽（透明の上に明暗の点と短い繊維）。どの色のフェルトにも重ねられる */
  function felt() {
    const S = 256;
    const c = canvas(S, S);
    const g = c.getContext('2d');
    const r = rng(11);
    const img = g.createImageData(S, S);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = r();
      if (v < 0.5) { img.data[i] = img.data[i + 1] = img.data[i + 2] = 0; img.data[i + 3] = Math.floor((0.5 - v) * 70); }
      else { img.data[i] = img.data[i + 1] = img.data[i + 2] = 255; img.data[i + 3] = Math.floor((v - 0.5) * 34); }
    }
    g.putImageData(img, 0, 0);
    g.lineCap = 'round';
    for (let i = 0; i < 2600; i++) {
      const x = r() * S, y = r() * S, len = 1.5 + r() * 5, a = r() * Math.PI;
      const light = r() < 0.45;
      g.strokeStyle = light ? 'rgba(255,255,255,' + (0.05 + r() * 0.08) + ')' : 'rgba(0,0,0,' + (0.06 + r() * 0.1) + ')';
      g.lineWidth = 0.5 + r() * 0.7;
      for (const [ox, oy] of [[0, 0], [-S, 0], [S, 0], [0, -S], [0, S]]) {
        g.beginPath();
        g.moveTo(x + ox, y + oy);
        g.lineTo(x + ox + Math.cos(a) * len, y + oy + Math.sin(a) * len);
        g.stroke();
      }
    }
    return c.toDataURL('image/png');
  }

  /** くるみ材の木目（横にも縦にもつながる） */
  function wood() {
    const W = 512, H = 128;
    const c = canvas(W, H);
    const g = c.getContext('2d');
    const r = rng(29);
    const grd = g.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, '#5b331b');
    grd.addColorStop(0.5, '#4b2914');
    grd.addColorStop(1, '#5a311a');
    g.fillStyle = grd;
    g.fillRect(0, 0, W, H);
    for (let i = 0; i < 110; i++) {
      const y0 = r() * H;
      const k1 = 1 + Math.floor(r() * 3), k2 = 3 + Math.floor(r() * 5);
      const a1 = 1 + r() * 5, a2 = r() * 1.6;
      const p1 = r() * 6.283, p2 = r() * 6.283;
      const dark = r() < 0.6;
      g.strokeStyle = dark ? 'rgba(24,9,2,' + (0.12 + r() * 0.3) + ')' : 'rgba(160,96,50,' + (0.05 + r() * 0.12) + ')';
      g.lineWidth = 0.5 + r() * 2.2;
      for (const oy of [0, -H, H]) {
        g.beginPath();
        for (let x = 0; x <= W; x += 4) {
          const t = (x / W) * 6.283;
          const y = y0 + oy + Math.sin(t * k1 + p1) * a1 + Math.sin(t * k2 + p2) * a2;
          if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
        }
        g.stroke();
      }
    }
    const img = g.getImageData(0, 0, W, H);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = (r() - 0.5) * 16;
      img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n;
    }
    g.putImageData(img, 0, 0);
    return c.toDataURL('image/jpeg', 0.9);
  }

  /** 革のしぼ（細かいシワ） */
  function leather() {
    const S = 192;
    const c = canvas(S, S);
    const g = c.getContext('2d');
    const r = rng(47);
    for (let i = 0; i < 900; i++) {
      const x = r() * S, y = r() * S, rad = 1 + r() * 3.5;
      g.fillStyle = r() < 0.5 ? 'rgba(0,0,0,' + (0.1 + r() * 0.16) + ')' : 'rgba(255,230,200,' + (0.025 + r() * 0.04) + ')';
      for (const [ox, oy] of [[0, 0], [-S, 0], [S, 0], [0, -S], [0, S]]) {
        g.beginPath();
        g.ellipse(x + ox, y + oy, rad, rad * (0.5 + r() * 0.6), r() * Math.PI, 0, 6.283);
        g.fill();
      }
    }
    return c.toDataURL('image/png');
  }

  function apply() {
    try {
      const root = document.documentElement.style;
      root.setProperty('--tex-felt', 'url(' + felt() + ')');
      root.setProperty('--tex-wood', 'url(' + wood() + ')');
      root.setProperty('--tex-leather', 'url(' + leather() + ')');
    } catch (e) { /* 素材が作れなくても単色で表示できる */ }
  }

  D.Textures = { apply };
})();

</script>

/* 大富豪 — 効果音（Web Audio で合成。音源ファイルなし） */
(function () {
  'use strict';
  const D = (globalThis.DFG = globalThis.DFG || {});

  let ctx = null, master = null, enabled = true, noiseBuf = null;

  function ensure() {
    if (!enabled) return null;

      const AC = globalThis.AudioContext || globalThis.webkitAudioContext;
      if (!AC) return null;
      try {
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.55;
        master.connect(ctx.destination);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.6, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { ctx = null; return null; }
    }

  }

  function noise(t, dur, freq, q, gain, sweepTo) {
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(freq, t);
    if (sweepTo) bp.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    bp.Q.value = q;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t, Math.random() * 0.3);
    src.stop(t + dur + 0.02);
  }

  function tone(t, freq, dur, type, gain, glideTo) {
    const o = ctx.createOscillator();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t);
    o.stop(t + dur + 0.05);
  }

  const SOUNDS = {
    card(n) {
      const t = ctx.currentTime;
      const k = Math.min(n || 1, 4);
      for (let i = 0; i < k; i++) noise(t + i * 0.035, 0.09, 2600 + Math.random() * 600, 1.4, 0.55);
      noise(t + 0.01, 0.05, 900, 0.8, 0.25);
    },
    deal() { const t = ctx.currentTime; noise(t, 0.05, 3200, 1.6, 0.22); },
    pass() { const t = ctx.currentTime; tone(t, 330, 0.12, 'triangle', 0.08, 260); },
    flow() { const t = ctx.currentTime; noise(t, 0.45, 800, 0.9, 0.35, 5200); },
    turn() { const t = ctx.currentTime; tone(t, 880, 0.18, 'sine', 0.07); tone(t + 0.09, 1320, 0.22, 'sine', 0.05); },
    special() {
      const t = ctx.currentTime;
      [659, 988, 1319].forEach((f, i) => tone(t + i * 0.06, f, 0.5, 'triangle', 0.09));
    },
    cut() {
      const t = ctx.currentTime;
      noise(t, 0.28, 1400, 1.2, 0.5, 7000);
      tone(t + 0.04, 1568, 0.3, 'triangle', 0.08);
    },
    revolution() {
      const t = ctx.currentTime;
      tone(t, 70, 0.9, 'sine', 0.5, 40);
      noise(t, 0.6, 300, 0.7, 0.4, 120);
      [392, 494, 587, 784].forEach((f, i) => tone(t + 0.25 + i * 0.08, f, 0.7, 'sawtooth', 0.035));
    },
    bomb() {
      const t = ctx.currentTime;
      tone(t, 110, 0.6, 'sine', 0.45, 35);
      noise(t, 0.7, 500, 0.6, 0.6, 90);
    },
    finish() {
      const t = ctx.currentTime;
      [523, 659, 784, 1047].forEach((f, i) => tone(t + i * 0.09, f, 0.45, 'triangle', 0.09));
    },
    foul() {
      const t = ctx.currentTime;
      tone(t, 196, 0.35, 'square', 0.05, 150);
      tone(t + 0.18, 147, 0.45, 'square', 0.05, 110);
    },
    fanfare() {
      const t = ctx.currentTime;
      [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(t + i * 0.12, f, 0.35, 'triangle', 0.1));
    },
    select() { const t = ctx.currentTime; noise(t, 0.03, 4200, 2, 0.12); },
    error() { const t = ctx.currentTime; tone(t, 220, 0.14, 'triangle', 0.08, 180); },
  };

  function play(name, arg) {
    if (!enabled) return;
    if (!ensure()) return;
    try { SOUNDS[name] && SOUNDS[name](arg); } catch (e) { /* 音が出なくても続行 */ }
  }

  D.Sound = {
    play,
    unlock() { ensure(); },
    setEnabled(v) { enabled = !!v; if (enabled) ensure(); },
    get enabled() { return enabled; },
  };
})();

</script>
<script>
/* 大富豪 — テーブルの描画と演出（エンジンのイベントを順番に再生する） */
(function () {
  'use strict';
  const D = (globalThis.DFG = globalThis.DFG || {});
  const E = D.Engine, C = D.Cards, A = D.Art, SND = D.Sound;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const TITLE_CLASS = { 大富豪: 't-0', 富豪: 't-1', 平民: 't-2', 貧民: 't-3', 大貧民: 't-4' };

  const UI = {
    S: null,
    human: 0,
    vm: null,
    speed: 1,
    backURI: '',
    showPlayable: true,
    sel: new Set(),
    selectable: false,
    selMax: 0,
    dimSet: null,
    hintSet: null,
    onSelChange: null,
    handEls: new Map(),
    seatEls: {},
    logLines: [],
  };

  // ─────────────────────────────────────────────
  // ビューモデル（アニメーション中に少しずつ更新し、最後にエンジンの状態と合わせる）
  // ─────────────────────────────────────────────
  function vmFromState(S) {
    return {
      pile: S.pile.map((e) => ({ seat: e.seat, cards: e.shown.slice(), stop: e.stop, key: e.seat + ':' + e.play.cards.join('') })),
      hands: S.players.map((p) => p.hand.slice()),
      out: S.players.map((p) => p.out),
      foul: S.players.map((p) => p.foul),
      places: placesOf(S),
      rev: S.revolution,
      jback: S.jback,
      lock: { suits: S.lock.suits && S.lock.suits.slice(), partial: S.lock.partial && S.lock.partial.slice(), number: S.lock.number },
      constraint: S.constraint && Object.assign({}, S.constraint),
      dir: S.dir,
      turn: S.phase === 'play' && !S.pending ? S.turn : null,
    };
  }
  function placesOf(S) {
    const pl = S.players.map(() => null);
    S.finished.forEach((s, i) => { pl[s] = i + 1; });
    return pl;
  }
  function syncVM() { UI.vm = vmFromState(UI.S); }

  // ─────────────────────────────────────────────
  // 部品
  // ─────────────────────────────────────────────
  function makeCardEl(id, extra) {
    const el = document.createElement('div');
    el.className = 'card' + (extra ? ' ' + extra : '');
    el.dataset.id = id;
    el.innerHTML = A.faceSVG(id);
    el.setAttribute('aria-label', C.cardLabel(id));
    return el;
  }
  function makeBackEl(extra) {
    const el = document.createElement('div');
    el.className = 'card back' + (extra ? ' ' + extra : '');
    el.style.backgroundImage = UI.backURI;
    return el;
  }
  let probe = null;
  function cardSize(kind) {
    if (!probe) {
      probe = document.createElement('div');
      probe.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;left:-999px;top:0';
      probe.innerHTML = '<div class="card" style="position:static"></div><div class="pile-entry"><div class="card" style="position:static"></div></div>';
      document.body.appendChild(probe);
    }
    const el = kind === 'pile' ? probe.children[1].firstChild : probe.firstChild;
    return { w: el.offsetWidth || 60, h: el.offsetHeight || 84 };
  }
  function titleIdx(seat) {
    const S = UI.S;
    if (!S.prevRanking || S.gameNo < 2 && S.phase !== 'over') return -1;
    return S.prevRanking.indexOf(seat);
  }
  function titleOfSeat(seat) {
    const S = UI.S;
    // 対局中は前のゲームの身分、終了後は今回の身分
    const i = titleIdx(seat);
    return i < 0 ? '' : E.titleOf(S.n, i);
  }
  function titleChip(seat) {
    const t = titleOfSeat(seat);
    return t ? '<span class="title-chip ' + TITLE_CLASS[t] + '">' + t + '</span>' : '';
  }
  const nameOf = (seat) => (seat === UI.human ? 'あなた' : UI.S.players[seat].name);

  // ─────────────────────────────────────────────
  // 席の配置
  // ─────────────────────────────────────────────
  /** 相手の席の位置（テーブル内のpx）。上のボタン列と重ならず、場のカードとも重ならないようにする */
  function seatPositions(n, w, h, half, ph) {
    const k = n - 1;
    const narrow = w / h < 1.05;
    const top = 54 + half;
    const pos = [];
    for (let i = 0; i < k; i++) {
      if (narrow) {
        const fx = k === 1 ? 0.5 : 0.13 + (0.74 * i) / (k - 1);
        const edge = Math.abs(fx - 0.5) / 0.37;
        pos.push([fx * w, top + edge * Math.min(30, h * 0.06)]);
      } else {
        const th = Math.PI - (Math.PI * (i + 0.5)) / k;
        const cy = Math.max(top + 40, h * 0.6);
        const ry = cy - top;
        pos.push([w / 2 + w * 0.41 * Math.cos(th), cy - ry * Math.sin(th)]);
      }
    }
    const pileY = Math.max(top + half + 10 + (ph + 30) / 2, h * (narrow ? 0.6 : 0.58));
    return { pos, narrow, pileY };
  }

  // フェルトに印刷する金文字：有効なローカルルール（カジノのテーブルの注意書きのように）
  const PRINT_RULES = ['revolution', 'eightCut', 'sandstorm', 'spade3', 'queenBomber', 'jBack', 'sevenPass', 'tenDiscard', 'fiveSkip', 'kingSkip',
    'rokurokubi', 'fourStop', 'threeStop', 'sixNine', 'aceTake', 'gekiLock', 'suitLock', 'numberLock', 'miyakoOchi', 'gekokujo', 'tenpen',
    'kyukyusha', 'coup', 'omen', 'greatRevolution', 'nineReverse', 'nineBack', 'twoBack', 'luckySeven', 'downNumber', 'partialLock'];
  let printKey = '';

  function ellipsePerimeter(a, b) { return Math.PI * (3 * (a + b) - Math.sqrt((3 * a + b) * (a + 3 * b))); }

  function renderFeltPrint(w, h, cy, pw, ph, narrow) {
    const host = $('felt-print');
    const S = UI.S;
    if (!host || !S) return;
    const key = [w, h, cy, pw, narrow, RULE_KEYS.map((k) => S.rules[k]).join('')].map((v) => (typeof v === 'number' ? Math.round(v) : v)).join('|');
    if (key === printKey) return;
    printKey = key;
    const cx = w / 2;
    const fs = Math.max(10, Math.min(17, w / 58));
    const ry = Math.min(Math.max(ph * 0.95, Math.min(h * 0.27, 190)), Math.max(ph * 0.62, h - cy - 6));
    const rx = Math.min(w * (narrow ? 0.44 : 0.34), Math.max(ry * 1.9, pw * 2.6));
    const f = (v) => v.toFixed(1);
    let s = '<svg width="' + f(w) + '" height="' + f(h) + '" viewBox="0 0 ' + f(w) + ' ' + f(h) + '" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">' +
      '<defs><linearGradient id="dfg-foil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7e4a6"/><stop offset="1" stop-color="#b78a30"/></linearGradient></defs>';
    // 二重の楕円
    s += '<ellipse cx="' + f(cx) + '" cy="' + f(cy) + '" rx="' + f(rx) + '" ry="' + f(ry) + '" fill="none" stroke="rgba(228,188,98,.34)" stroke-width="1.6"/>';
    s += '<ellipse cx="' + f(cx) + '" cy="' + f(cy) + '" rx="' + f(rx - 7) + '" ry="' + f(ry - 7) + '" fill="none" stroke="rgba(228,188,98,.17)" stroke-width="1"/>';
    // カード置き場
    const sw = pw * 1.14, sh = ph * 1.1;
    s += '<rect x="' + f(cx - sw / 2) + '" y="' + f(cy - sh / 2) + '" width="' + f(sw) + '" height="' + f(sh) + '" rx="' + f(pw * 0.1) + '" fill="rgba(0,0,0,.1)" stroke="rgba(228,188,98,.38)" stroke-width="1.3"/>';
    s += '<rect x="' + f(cx - sw / 2 + 4) + '" y="' + f(cy - sh / 2 + 4) + '" width="' + f(sw - 8) + '" height="' + f(sh - 8) + '" rx="' + f(pw * 0.08) + '" fill="none" stroke="rgba(228,188,98,.2)" stroke-width="1"/>';
    // 楕円の左右にマーク
    const mk = fs * 1.05;
    s += '<g fill="url(#dfg-foil)" opacity=".5">' +
      A.pip('S', cx - rx, cy - mk * 0.62, mk) + A.pip('H', cx - rx, cy + mk * 0.62, mk) +
      A.pip('D', cx + rx, cy - mk * 0.62, mk) + A.pip('C', cx + rx, cy + mk * 0.62, mk) + '</g>';
    // 有効なローカルルール名を金文字で印刷（席の下に隠れない場所に）
    const names = PRINT_RULES.filter((k) => S.rules[k]).map((k) => D.Rules.BY_KEY[k].label);
    const font = 'font-family="\'Shippori Mincho B1\',\'Hiragino Mincho ProN\',\'Yu Mincho\',serif" font-weight="700"';
    const charW = fs * 1.08;
    const lobeW = rx - sw / 2 - fs * 2.2;
    let bottomUsed = cy + ry;
    if (names.length && lobeW >= 110) {
      // 楕円の左右のふくらみに、中央ぞろえの数行
      const perLine = Math.max(3, Math.floor(lobeW / charW));
      const lines = [];
      let cur = '';
      for (const nm of names) {
        const next = cur ? cur + '・' + nm : nm;
        if (next.length > perLine && cur) { lines.push(cur); cur = nm; } else cur = next;
        if (lines.length >= 6) break;
      }
      if (cur && lines.length < 6) lines.push(cur);
      const half = Math.ceil(lines.length / 2);
      const maxLines = Math.max(1, Math.floor(ry / (fs * 1.6)));
      [lines.slice(0, Math.min(half, maxLines)), lines.slice(half, half + maxLines)].forEach((group, side) => {
        if (!group.length) return;
        const lx = cx + (side ? 1 : -1) * (sw / 2 + fs * 1.1 + lobeW / 2);
        const y0 = cy - ((group.length - 1) * fs * 1.6) / 2 + fs * 0.35;
        group.forEach((ln, i) => {
          s += '<text x="' + f(lx) + '" y="' + f(y0 + i * fs * 1.6) + '" text-anchor="middle" ' + font + ' font-size="' + f(fs) + '" letter-spacing="' + f(fs * 0.08) +
            '" fill="url(#dfg-foil)" opacity=".5">' + esc(ln) + '</text>';
        });
      });
    } else if (names.length) {
      // 狭い画面：楕円の下の弧に沿って
      const ax = rx + fs * 0.9, ay = ry + fs * 1.3;
      if (cy + ay + fs * 0.4 < h - 2) {
        const t1 = (208 * Math.PI) / 180, t2 = (332 * Math.PI) / 180;
        const arcLen = ellipsePerimeter(ax, ay) * (124 / 360);
        let text = '';
        for (const nm of names) {
          const next = text ? text + ' ◆ ' + nm : nm;
          if (next.length * charW > arcLen * 0.95) break;
          text = next;
        }
        s += '<path id="dfg-arc" d="M' + f(cx + ax * Math.cos(t1)) + ' ' + f(cy - ay * Math.sin(t1)) + ' A' + f(ax) + ' ' + f(ay) + ' 0 0 0 ' +
          f(cx + ax * Math.cos(t2)) + ' ' + f(cy - ay * Math.sin(t2)) + '" fill="none"/>' +
          '<text ' + font + ' font-size="' + f(fs) + '" letter-spacing="' + f(fs * 0.08) + '" fill="url(#dfg-foil)" opacity=".5">' +
          '<textPath href="#dfg-arc" xlink:href="#dfg-arc" startOffset="50%" text-anchor="middle">' + esc(text) + '</textPath></text>';
        bottomUsed = cy + ay + fs * 0.4;
      }
    }
    // 下にロゴ
    const lf = fs * 1.9;
    const ly = bottomUsed + lf * 1.3;
    if (ly + 4 < h) {
      s += '<text x="' + f(cx + lf * 0.45) + '" y="' + f(ly) + '" text-anchor="middle" font-family="\'Shippori Mincho B1\',\'Hiragino Mincho ProN\',\'Yu Mincho\',serif" font-weight="800" font-size="' +
        f(lf) + '" letter-spacing="' + f(lf * 0.9) + '" fill="url(#dfg-foil)" opacity=".36">大富豪</text>';
    }
    host.innerHTML = s + '</svg>';
  }
  const RULE_KEYS = D.Rules.RULES.map((r) => r.key);

  function renderSeats() {
    const S = UI.S, vm = UI.vm;
    const box = $('seats');
    const rect = $('table').getBoundingClientRect();
    const w = rect.width || 1, h = rect.height || 1;
    const alive = new Set();
    const order = [];
    for (let i = 1; i < S.n; i++) {
      const seat = (UI.human + i) % S.n;
      alive.add(String(seat));
      let el = UI.seatEls[seat];
      if (!el) {
        el = document.createElement('div');
        el.className = 'seat';
        el.dataset.seat = seat;
        el.innerHTML = '<div class="ava">' + A.robotSVG(seat - 1) + '<div class="think"><i></i><i></i><i></i></div></div>' +
          '<div class="info"><div class="plate"><span class="name"></span><span class="cnt"></span></div><div class="fan"></div></div>';
        box.appendChild(el);
        UI.seatEls[seat] = el;
      }
      order.push(el);
      const P = S.players[seat];
      const count = vm.hands[seat].length;
      el.querySelector('.name').textContent = P.name;
      const cnt = el.querySelector('.cnt');
      const tc = titleChip(seat);
      cnt.innerHTML = (vm.out[seat] ? '' : '<span class="mini" style="background-image:' + UI.backURI + '"></span>' + count) + (tc ? ' ' + tc : '');
      const fan = el.querySelector('.fan');
      const show = vm.out[seat] ? 0 : Math.min(count, 9);
      if (fan.childElementCount !== show || fan.dataset.back !== UI.backURI.length + '') {
        fan.dataset.back = UI.backURI.length + '';
        let html = '';
        for (let j = 0; j < show; j++) {
          const t = j - (show - 1) / 2;
          html += '<i style="background-image:' + UI.backURI + ';transform:translateX(calc(-50% + ' + (t * 5) + 'px)) rotate(' + (t * 8) + 'deg)"></i>';
        }
        fan.innerHTML = html;
      }
      el.classList.toggle('turn', vm.turn === seat);
      el.classList.toggle('out', !!vm.out[seat]);
      let medal = el.querySelector('.medal');
      const place = vm.places[seat];
      if (vm.out[seat]) {
        if (!medal) { medal = document.createElement('div'); el.querySelector('.ava').appendChild(medal); }
        medal.className = 'medal' + (vm.foul[seat] ? ' foul' : '');
        medal.textContent = vm.foul[seat] ? '反則' : place ? place : '落';
      } else if (medal) medal.remove();
    }
    for (const k of Object.keys(UI.seatEls)) {
      if (!alive.has(k)) { UI.seatEls[k].remove(); delete UI.seatEls[k]; }
    }
    // 席の大きさを測ってから配置する
    const half = order.length ? order[0].offsetHeight / 2 : 45;
    const { w: pw, h: ph } = cardSize('pile');
    const { pos, narrow, pileY } = seatPositions(S.n, w, h, half, ph);
    const spacing = narrow && order.length > 1 ? (0.74 * w) / (order.length - 1) : Infinity;
    order.forEach((el, i) => {
      el.style.left = Math.round(pos[i][0]) + 'px';
      el.style.top = Math.round(pos[i][1]) + 'px';
      el.style.width = spacing < 80 ? Math.floor(spacing - 2) + 'px' : '';
    });
    $('table').style.setProperty('--pile-y', Math.round(pileY) + 'px');
    renderFeltPrint(w, h, pileY, pw, ph, narrow);
  }

  function seatAnchor(seat) {
    if (seat === UI.human) {
      const r = $('hand').getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }
    const el = UI.seatEls[seat];
    if (!el) return { x: innerWidth / 2, y: 60 };
    const r = el.querySelector('.ava').getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }
  function rectAt(pt, w, h) { return { left: pt.x - w / 2, top: pt.y - h / 2, width: w, height: h }; }

  // ─────────────────────────────────────────────
  // 自分の情報・手札
  // ─────────────────────────────────────────────
  function renderMe() {
    const S = UI.S, vm = UI.vm;
    const me = $('me');
    const myTurn = vm.turn === UI.human;
    me.classList.toggle('turn', myTurn);
    const tc = titleChip(UI.human);
    const status = vm.out[UI.human]
      ? (vm.foul[UI.human] ? '<span class="yourturn">反則上がり</span>'
        : '<span class="yourturn">' + (vm.places[UI.human] || '') + (vm.places[UI.human] === S.n ? '位' : '位で上がり') + '</span>')
      : '';
    $('me-id').innerHTML = '<span class="ava">' + A.humanSVG() + '</span><span class="nm">' + esc(S.players[UI.human].name) + '</span>' + tc + status;
  }

  function renderHand() {
    const box = $('hand');
    const hand = UI.vm.hands[UI.human];
    const sorted = C.sortHand(hand, UI.vm.rev);
    for (const [id, el] of UI.handEls) {
      if (!hand.includes(id)) { el.remove(); UI.handEls.delete(id); UI.sel.delete(id); }
    }
    const W = box.clientWidth || 320;
    const { w: cw, h: ch } = cardSize('hand');
    const n = sorted.length;
    let rows = 1;
    let step = n > 1 ? Math.min(cw * 0.64, (W - cw) / (n - 1)) : 0;
    if (n > 1 && step < Math.max(20, cw * 0.34)) rows = 2;
    box.classList.toggle('two', rows === 2);
    const perRow = rows === 2 ? Math.ceil(n / 2) : n;
    if (rows === 2) step = perRow > 1 ? Math.min(cw * 0.64, (W - cw) / (perRow - 1)) : 0;
    const fan = rows === 1 && W >= 640;
    box.classList.toggle('locked', !UI.selectable);
    sorted.forEach((id, i) => {
      let el = UI.handEls.get(id);
      if (!el) {
        el = makeCardEl(id);
        el.setAttribute('role', 'button');
        el.tabIndex = 0;
        el.addEventListener('click', onCardTap);
        el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onCardTap(e); } });
        box.appendChild(el);
        UI.handEls.set(id, el);
      }
      const row = rows === 2 && i >= perRow ? 1 : 0;
      const j = row ? i - perRow : i;
      const cnt = row ? n - perRow : perRow;
      const rowW = cw + (cnt - 1) * step;
      const x = (W - rowW) / 2 + j * step;
      let y = row * ch * 0.55;
      let rot = 0;
      if (fan) {
        const t = j - (cnt - 1) / 2;
        rot = t * 1.15;
        y += t * t * 0.32;
      }
      const selected = UI.sel.has(id);
      if (selected) y -= 22;
      el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(' + rot.toFixed(2) + 'deg)';
      el.style.zIndex = String(i + 1);
      el.classList.toggle('sel', selected);
      el.setAttribute('aria-pressed', selected ? 'true' : 'false');
      el.classList.toggle('dim', !!(UI.dimSet && !UI.dimSet.has(id)));
      el.classList.toggle('hint', !!(UI.hintSet && UI.hintSet.has(id)));
    });
  }

  function onCardTap(e) {
    const id = e.currentTarget.dataset.id;
    if (!UI.selectable) return;
    UI.hintSet = null;
    if (UI.sel.has(id)) UI.sel.delete(id);
    else {
      if (UI.selMax && UI.sel.size >= UI.selMax) {
        if (UI.selMax === 1) UI.sel.clear();
        else { toast(UI.selMax + '枚までえらべます'); SND.play('error'); return; }
      }
      UI.sel.add(id);
    }
    SND.play('select');
    renderHand();
    if (UI.onSelChange) UI.onSelChange();
  }

  // ─────────────────────────────────────────────
  // 場
  // ─────────────────────────────────────────────
  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  function renderPile(hideTop) {
    const box = $('pile');
    box.innerHTML = '';
    const entries = UI.vm.pile.slice(-3);
    if (!entries.length) { box.innerHTML = '<div class="pile-empty"></div>'; return; }
    const { w: pw, h: ph } = cardSize('pile');
    entries.forEach((e, idx) => {
      const depth = entries.length - 1 - idx;
      const g = document.createElement('div');
      g.className = 'pile-entry' + (depth ? ' old' : ' top');
      const n = e.cards.length;
      const step = pw * (n > 5 ? 0.3 : n > 3 ? 0.38 : 0.46);
      const width = pw + Math.max(0, n - 1) * step;
      const hsh = hashStr(e.key || e.cards.join(''));
      const rot = depth ? ((hsh % 9) - 4) * 2.2 : 0;
      const dx = depth ? (((hsh >> 4) % 13) - 6) * 3 : 0;
      g.style.width = width + 'px';
      g.style.height = ph + 'px';
      g.style.transform = 'translate(calc(-50% + ' + (dx - depth * 10) + 'px), calc(-50% - ' + depth * 9 + 'px)) rotate(' + rot + 'deg) scale(' + (1 - depth * 0.06) + ')';
      g.style.zIndex = String(idx + 1);
      e.cards.forEach((id, j) => {
        const c = makeCardEl(id);
        c.style.left = j * step + 'px';
        g.appendChild(c);
      });
      if (hideTop && depth === 0) g.style.visibility = 'hidden';
      box.appendChild(g);
    });
  }

  function chip(html, cls) { return '<span class="chip ' + (cls || '') + '">' + html + '</span>'; }
  function suitsHTML(suits) { return suits.map((s) => A.suitIcon(s, 12)).join(''); }

  function renderStatus() {
    const vm = UI.vm, S = UI.S;
    const out = [];
    if (vm.rev) out.push(chip(A.icon('crown', 13) + '革命中', 'revo'));
    if (vm.jback) out.push(chip('Jバック中', 'jback'));
    if (vm.lock.suits && vm.lock.number) out.push(chip(A.icon('lock', 12) + suitsHTML(vm.lock.suits) + ' 激縛り', 'lock'));
    else {
      if (vm.lock.suits) out.push(chip(A.icon('lock', 12) + suitsHTML(vm.lock.suits) + ' 縛り', 'lock'));
      if (vm.lock.number) out.push(chip(A.icon('lock', 12) + '階段縛り', 'lock'));
    }
    if (vm.lock.partial) out.push(chip(A.icon('lock', 12) + suitsHTML(vm.lock.partial) + ' 片縛り', 'lock'));
    if (vm.constraint) out.push(chip('次は ' + C.rankLabel(vm.constraint.rank) + ' だけ', 'lock'));
    if (S.rules.nineReverse || vm.dir !== 1) out.push(chip(A.icon(vm.dir === 1 ? 'cw' : 'ccw', 14), 'dir'));
    if (vm.turn !== null && vm.turn !== undefined && S.phase === 'play') {
      out.push(chip(vm.turn === UI.human ? 'あなたの番' : esc(S.players[vm.turn].name) + 'の番', 'turnchip'));
    }
    $('status').innerHTML = out.join('');
    document.querySelector('.game').classList.toggle('is-revo', !!vm.rev);
  }

  function renderHud() {
    $('g-gameno').textContent = '第' + UI.S.gameNo + 'ゲーム';
  }

  /** 画面の広さに合わせて、手札と場のカードをできるだけ大きくする */
  function fitCards() {
    const g = $('scr-game');
    if (!g || g.hidden) return;
    const cs = getComputedStyle(g);
    const W = g.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const H = g.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    if (W <= 0 || H <= 0) return;
    const wideSeats = matchMedia('(min-width: 900px) and (min-height: 560px)').matches;
    const narrow = W / H < 1.05;
    const handW = W - 16;
    let cw;
    if (narrow) {
      // 縦長：手札は2段。自分の欄 ≒ 2.17cw+122、テーブル ≒ 1.4cw+260
      cw = Math.min(handW / 4.1, (H - 382) / 3.57);
    } else {
      // 横長：手札は1段。席の高さ（横並びなら低い）＋場のカード＋状態表示
      const seatH = wideSeats ? 76 : 96;
      const fixed = 126 + 8 + seatH + 10 + 30 + 36 + 26;
      cw = Math.min(handW / 6.4, (H - fixed) / (1.4 + 1.4 * 0.9));
    }
    cw = Math.max(52, Math.min(150, Math.floor(cw)));
    const pw = Math.max(48, narrow ? cw : Math.floor(cw * 0.9));
    const root = document.documentElement.style;
    if (root.getPropertyValue('--cw') !== cw + 'px') root.setProperty('--cw', cw + 'px');
    if (root.getPropertyValue('--pw') !== pw + 'px') root.setProperty('--pw', pw + 'px');
  }

  function renderAll() {
    fitCards();
    renderHud();
    renderSeats();
    renderPile(false);
    renderStatus();
    renderMe();
    renderHand();
  }

  // ─────────────────────────────────────────────
  // 演出
  // ─────────────────────────────────────────────
  function fly(items, dur) {
    const fx = $('fx');
    const d = Math.max(60, dur * UI.speed);
    return Promise.all(items.map((it) => {
      const el = document.createElement('div');
      el.className = it.back ? 'fly back' : 'fly';
      if (it.back) el.style.backgroundImage = UI.backURI;
      else el.innerHTML = A.faceSVG(it.id);
      el.style.width = it.to.width + 'px';
      el.style.height = it.to.height + 'px';
      el.style.transformOrigin = '50% 50%';
      fx.appendChild(el);
      const s0 = it.from.width / it.to.width;
      const c0x = it.from.left + it.from.width / 2 - it.to.width / 2, c0y = it.from.top + it.from.height / 2 - it.to.height / 2;
      const k0 = 'translate(' + c0x + 'px,' + c0y + 'px) rotate(' + (it.r0 || 0) + 'deg) scale(' + s0 + ')';
      const k1 = 'translate(' + it.to.left + 'px,' + it.to.top + 'px) rotate(' + (it.r1 || 0) + 'deg) scale(' + (it.s1 || 1) + ')';
      const a = el.animate([{ transform: k0, opacity: it.o0 == null ? 1 : it.o0 }, { transform: k1, opacity: it.o1 == null ? 1 : it.o1 }],
        { duration: d, delay: (it.delay || 0) * UI.speed, easing: 'cubic-bezier(.2,.75,.25,1)', fill: 'both' });
      return a.finished.catch(() => {}).then(() => el.remove());
    }));
  }

  function banner(text, variant, sub, hold) {
    const b = document.createElement('div');
    b.className = 'banner ' + (variant || '');
    b.innerHTML = '<div class="big">' + esc(text) + '</div>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '');
    $('fx').appendChild(b);
    const a = b.animate([
      { opacity: 0, transform: 'translate(-50%,-50%) scale(1.45)' },
      { opacity: 1, transform: 'translate(-50%,-50%) scale(1)', offset: 0.16 },
      { opacity: 1, transform: 'translate(-50%,-50%) scale(1)', offset: 0.82 },
      { opacity: 0, transform: 'translate(-50%,-50%) scale(0.97)' },
    ], { duration: (hold || 1150) * UI.speed, easing: 'ease-out', fill: 'both' });
    return a.finished.catch(() => {}).then(() => b.remove());
  }

  function flash(color, dur) {
    const f = document.createElement('div');
    f.className = 'flash';
    f.style.background = color;
    $('fx').appendChild(f);
    return f.animate([{ opacity: 0.85 }, { opacity: 0 }], { duration: (dur || 600) * UI.speed, easing: 'ease-out', fill: 'both' })
      .finished.catch(() => {}).then(() => f.remove());
  }

  function shake() {
    const g = $('scr-game');
    g.classList.remove('shake');
    void g.offsetWidth;
    g.classList.add('shake');
    setTimeout(() => g.classList.remove('shake'), 600);
  }

  function sandstorm() {
    const fx = $('fx');
    const n = 46;
    const jobs = [];
    for (let i = 0; i < n; i++) {
      const g = document.createElement('div');
      g.className = 'sand-grain';
      const y = Math.random() * innerHeight;
      const s = 2 + Math.random() * 4;
      g.style.width = g.style.height = s + 'px';
      fx.appendChild(g);
      const a = g.animate([
        { transform: 'translate(-20px,' + y + 'px)', opacity: 0 },
        { opacity: 0.9, offset: 0.2 },
        { transform: 'translate(' + (innerWidth + 20) + 'px,' + (y + (Math.random() - 0.5) * 120) + 'px)', opacity: 0 },
      ], { duration: (700 + Math.random() * 600) * UI.speed, delay: Math.random() * 350 * UI.speed, easing: 'ease-in', fill: 'both' });
      jobs.push(a.finished.catch(() => {}).then(() => g.remove()));
    }
    return Promise.all(jobs);
  }

  function bubble(seat, text, alert) {
    const host = seat === UI.human ? $('me-id') : UI.seatEls[seat];
    if (!host) return;
    const b = document.createElement('div');
    b.className = 'bubble' + (alert ? ' alert' : '');
    b.textContent = text;
    if (seat === UI.human) { b.style.left = '40px'; b.style.top = '-6px'; }
    host.appendChild(b);
    setTimeout(() => b.remove(), 1400 * UI.speed + 100);
  }

  let toastTimer = 0;
  function toast(text, ms) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms || 2200);
  }

  function setThinking(seat, on) {
    const el = UI.seatEls[seat];
    if (el) el.classList.toggle('thinking', !!on);
  }

  // ─────────────────────────────────────────────
  // イベントの再生
  // ─────────────────────────────────────────────
  function removeFrom(arr, cards) {
    for (const id of cards) { const i = arr.indexOf(id); if (i >= 0) arr.splice(i, 1); }
  }

  function handRects(cards) {
    return cards.map((id) => { const el = UI.handEls.get(id); return el ? el.getBoundingClientRect() : null; });
  }

  function seatRects(seat, k, w, h) {
    const p = seatAnchor(seat);
    return Array.from({ length: k }, () => rectAt(p, w * 0.45, h * 0.45));
  }

  async function animPlay(seat, cards, extra) {
    const vm = UI.vm;
    const { w: pw, h: ph } = cardSize('pile');
    const from = seat === UI.human ? handRects(cards) : seatRects(seat, cards.length, pw, ph);
    removeFrom(vm.hands[seat], cards);
    vm.pile.push(Object.assign({ seat, cards: cards.slice(), key: seat + ':' + cards.join('') + ':' + vm.pile.length }, extra || {}));
    renderHand();
    renderSeats();
    renderPile(true);
    const tops = Array.from(document.querySelectorAll('#pile .pile-entry.top .card')).map((e) => e.getBoundingClientRect());
    SND.play('card', cards.length);
    const fallback = rectAt(seatAnchor(seat), pw * 0.45, ph * 0.45);
    await fly(cards.map((id, i) => ({ id, from: from[i] || fallback, to: tops[i], delay: i * 45, r0: seat === UI.human ? 0 : -14 })), 400);
    renderPile(false);
  }

  async function animFlow() {
    const els = Array.from(document.querySelectorAll('#pile .pile-entry'));
    if (els.length) {
      SND.play('flow');
      await Promise.all(els.map((el) => el.animate(
        [{ opacity: 1, transform: el.style.transform }, { opacity: 0, transform: el.style.transform + ' translateX(34vw) rotate(24deg)' }],
        { duration: 420 * UI.speed, easing: 'cubic-bezier(.5,0,.8,.4)', fill: 'forwards' }).finished.catch(() => {})));
    }
    const vm = UI.vm;
    vm.pile = [];
    vm.lock = { suits: null, partial: null, number: false };
    vm.constraint = null;
    vm.jback = false;
    renderPile(false);
    renderStatus();
  }

  async function animTransfer(from, to, cards, faceUp) {
    const { w, h } = cardSize('pile');
    const vm = UI.vm;
    const src = from === UI.human ? handRects(cards) : seatRects(from, cards.length, w, h);
    removeFrom(vm.hands[from], cards);
    renderHand(); renderSeats();
    const dst = rectAt(seatAnchor(to), w * 0.6, h * 0.6);
    if (cards.length) {
      await fly(cards.map((id, i) => ({ id, back: !faceUp, from: src[i] || rectAt(seatAnchor(from), w * 0.45, h * 0.45), to: dst, delay: i * 70, o1: 0.9 })), 520);
    }
    vm.hands[to] = vm.hands[to].concat(cards);
    renderHand(); renderSeats();
  }

  async function animDiscard(seat, cards) {
    const { w, h } = cardSize('pile');
    const vm = UI.vm;
    const src = seat === UI.human ? handRects(cards) : seatRects(seat, cards.length, w, h);
    removeFrom(vm.hands[seat], cards);
    renderHand(); renderSeats();
    const c = $('pile').getBoundingClientRect();
    const dst = { left: c.right - w * 0.4, top: c.top + c.height / 2 - h / 2, width: w, height: h };
    await fly(cards.map((id, i) => ({ id, from: src[i] || rectAt(seatAnchor(seat), w * 0.45, h * 0.45), to: dst, delay: i * 60, o1: 0, r1: 20 })), 560);
  }

  const FLOW_NAMES = { '8': '8切り', '66': 'ろくろ首', '99': '救急車' };
  const STOP_NAMES = { four: '4止め', three: '3止め', sand: '砂嵐' };
  const LOCK_NAMES = { suit: '縛り', partial: '片縛り', number: '階段縛り', geki: '激縛り' };
  const REVO_NAMES = { normal: '革命', seq: '階段革命', coup: 'クーデター', omen: 'オーメン', great: '大革命' };

  function logLine(text, cls) {
    UI.logLines.push({ text, cls: cls || '' });
    if (UI.logLines.length > 400) UI.logLines.splice(0, UI.logLines.length - 400);
    const ol = $('log-list');
    if (ol && !$('log').hidden) {
      const li = document.createElement('li');
      li.className = cls || '';
      li.textContent = text;
      ol.appendChild(li);
      ol.scrollTop = ol.scrollHeight;
    }
  }
  function renderLog() {
    const ol = $('log-list');
    ol.innerHTML = UI.logLines.map((l) => '<li class="' + l.cls + '">' + esc(l.text) + '</li>').join('');
    ol.scrollTop = ol.scrollHeight;
  }

  /** 状態に合わせたうえで、同じ束の後ろにあるカード交換を巻き戻す（交換アニメーションで二重に動かさないため） */
  function syncBefore(evs, i) {
    syncVM();
    const vm = UI.vm;
    for (let j = evs.length - 1; j > i; j--) {
      const e = evs[j];
      if (e.t === 'exchange') {
        removeFrom(vm.hands[e.to], e.cards);
        vm.hands[e.from] = vm.hands[e.from].concat(e.cards);
      }
    }
    vm.turn = null;
  }

  async function playEvents(evs) {
    const S = UI.S;
    let vm = UI.vm;
    for (let i = 0; i < evs.length; i++) {
      const ev = evs[i];
      switch (ev.t) {
        case 'deal': {
          syncBefore(evs, i);
          vm = UI.vm;
          logLine('第' + S.gameNo + 'ゲーム', 'game');
          renderAll();
          await animDeal();
          break;
        }
        case 'start': {
          vm.turn = ev.leader;
          logLine(nameOf(ev.leader) + ' から始めます', 'sys');
          renderAll();
          break;
        }
        case 'play': {
          vm.constraint = null;
          vm.turn = null;
          renderStatus();
          await animPlay(ev.seat, ev.play.cards);
          logLine(nameOf(ev.seat) + '：' + E.describePlay(ev.play));
          break;
        }
        case 'pass': {
          SND.play('pass');
          bubble(ev.seat, 'パス');
          logLine(nameOf(ev.seat) + '：パス');
          await sleep(260 * UI.speed);
          break;
        }
        case 'flow': {
          await animFlow();
          logLine('— 場が流れた —', 'flow');
          vm.turn = ev.leader;
          renderStatus();
          renderSeats();
          renderMe();
          break;
        }
        case 'revolution': {
          vm.rev = ev.on;
          SND.play('revolution');
          shake();
          flash('radial-gradient(circle, rgba(255,120,140,.75), rgba(120,0,20,0) 70%)', 900);
          renderStatus();
          const nm = REVO_NAMES[ev.kind] || '革命';
          await banner(ev.on ? nm : nm === '革命' ? '革命返し' : nm, 'revo', ev.on ? '強さが逆転！' : '強さが元に戻った', 1400);
          logLine('★ ' + nameOf(ev.seat) + ' の' + (ev.on ? nm : '革命返し'), 'sys');
          renderHand();
          break;
        }
        case 'jback': {
          vm.jback = ev.on;
          SND.play('special');
          renderStatus();
          await banner(ev.by === 'J' ? 'Jバック' : '2バック', 'cool', ev.on ? '場が流れるまで強さが逆転' : '強さが元に戻った');
          logLine('★ ' + (ev.by === 'J' ? 'Jバック' : '2バック'), 'sys');
          break;
        }
        case 'cut': {
          SND.play('cut');
          await banner(FLOW_NAMES[ev.kind], '', '場が流れる', 950);
          logLine('★ ' + FLOW_NAMES[ev.kind], 'sys');
          break;
        }
        case 'sand': {
          SND.play('cut');
          sandstorm();
          await banner('砂嵐', '', '最強の役！場が流れる', 1200);
          logLine('★ 砂嵐', 'sys');
          break;
        }
        case 'spade3': {
          SND.play('cut');
          await banner('スペ3返し', '', 'ジョーカーを破った！', 1100);
          logLine('★ スペ3返し', 'sys');
          break;
        }
        case 'stop': {
          SND.play('special');
          await animPlay(ev.seat, ev.play.cards, { stop: ev.kind });
          if (ev.kind === 'sand') sandstorm();
          await banner(STOP_NAMES[ev.kind], ev.kind === 'sand' ? '' : 'cool', nameOf(ev.seat) + 'が止めた！', 1150);
          logLine('★ ' + nameOf(ev.seat) + ' の' + STOP_NAMES[ev.kind] + '（' + nameOf(ev.against) + 'の効果を止めた）', 'sys');
          break;
        }
        case 'skip': {
          SND.play('special');
          for (const s of ev.seats) bubble(s, 'スキップ', true);
          await banner('スキップ', 'cool', ev.seats.map(nameOf).join('・') + ' を飛ばす', 950);
          logLine('★ スキップ：' + ev.seats.map(nameOf).join('・'), 'sys');
          break;
        }
        case 'give': {
          const involved = ev.from === UI.human || ev.to === UI.human;
          if (ev.cards.length) {
            banner(ev.label, 'cool', nameOf(ev.from) + ' → ' + nameOf(ev.to) + '（' + ev.cards.length + '枚）', 1000);
            await animTransfer(ev.from, ev.to, ev.cards, involved);
            if (ev.to === UI.human) toast(ev.label + 'で受け取った：' + ev.cards.map(C.cardLabel).join(' '));
          }
          logLine(nameOf(ev.from) + '：' + ev.label + ' ' + ev.cards.length + '枚' + (involved && ev.cards.length ? '（' + ev.cards.map(C.cardLabel).join(' ') + '）' : ''), 'sys');
          break;
        }
        case 'discard': {
          if (ev.cards.length) {
            banner('10捨て', 'cool', nameOf(ev.seat) + 'が' + ev.cards.length + '枚捨てた', 1000);
            await animDiscard(ev.seat, ev.cards);
          }
          logLine(nameOf(ev.seat) + '：10捨て ' + ev.cards.map(C.cardLabel).join(' '), 'sys');
          break;
        }
        case 'bomb': {
          if (!ev.ranks.length) {
            logLine('★ 12ボンバー：' + nameOf(ev.seat) + (ev.none ? 'の手札に指名できる数字がない' : 'は指名しなかった'), 'sys');
            break;
          }
          SND.play('bomb');
          flash('radial-gradient(circle, rgba(255,240,200,.9), rgba(255,160,60,0) 70%)', 700);
          shake();
          await banner('12ボンバー', '', ev.ranks.map((r) => C.rankLabel(r)).join('・') + ' を全員捨てる', 1200);
          const jobs = [];
          for (const s of Object.keys(ev.removed)) jobs.push(animDiscard(+s, ev.removed[s]));
          await Promise.all(jobs);
          logLine('★ 12ボンバー：' + ev.ranks.map((r) => C.rankLabel(r)).join('・') + '（' +
            (Object.keys(ev.removed).map((s) => nameOf(+s) + ev.removed[s].length + '枚').join('、') || 'だれも持っていなかった') + '）', 'sys');
          break;
        }
        case 'pickup': {
          if (ev.cards.length) {
            const idx = vm.pile.length - 2;
            const { w, h } = cardSize('pile');
            const entryEl = document.querySelectorAll('#pile .pile-entry')[Math.max(0, document.querySelectorAll('#pile .pile-entry').length - 2)];
            const src = entryEl ? entryEl.getBoundingClientRect() : $('pile').getBoundingClientRect();
            if (idx >= 0) vm.pile[idx].cards = vm.pile[idx].cards.filter((id) => !ev.cards.includes(id));
            renderPile(false);
            banner('A拾い', 'cool', nameOf(ev.seat) + 'が' + ev.cards.length + '枚拾った', 1000);
            await fly(ev.cards.map((id, i) => ({ id, from: { left: src.left, top: src.top, width: w, height: h }, to: rectAt(seatAnchor(ev.seat), w * 0.6, h * 0.6), delay: i * 70, o1: 0.8 })), 520);
            vm.hands[ev.seat] = vm.hands[ev.seat].concat(ev.cards);
            renderHand(); renderSeats();
          }
          logLine(nameOf(ev.seat) + '：A拾い ' + (ev.cards.length ? ev.cards.map(C.cardLabel).join(' ') : 'なし'), 'sys');
          break;
        }
        case 'reverse': {
          vm.dir = ev.dir;
          SND.play('special');
          renderStatus();
          await banner('リバース', 'cool', '順番が逆回りに', 900);
          logLine('★ 9リバース', 'sys');
          break;
        }
        case 'lock': {
          vm.lock = ev.lock;
          SND.play('special');
          renderStatus();
          const suits = ev.lock.suits || ev.lock.partial || [];
          const sym = suits.map((s) => C.SUIT_SYM[s]).join('');
          const sub = ev.kind === 'number' ? '次も1つ上の数字だけ' : ev.kind === 'geki' ? sym + ' の1つ上の数字だけ' : ev.kind === 'partial' ? sym + ' を含めて出す' : sym + ' しか出せない';
          await banner(LOCK_NAMES[ev.kind], 'small', sub, 900);
          logLine('★ ' + LOCK_NAMES[ev.kind] + '（' + sub + '）', 'sys');
          break;
        }
        case 'constraint': {
          vm.constraint = { rank: ev.rank, from: ev.from };
          renderStatus();
          bubble(S.lastSeat == null ? UI.human : S.lastSeat, '次は' + C.rankLabel(ev.rank) + 'だけ', true);
          logLine('★ ' + C.rankLabel(ev.from) + '→' + C.rankLabel(ev.rank) + '：次は ' + C.rankLabel(ev.rank) + ' だけ', 'sys');
          break;
        }
        case 'finish': {
          vm.out[ev.seat] = true;
          vm.places[ev.seat] = ev.place;
          vm.hands[ev.seat] = [];
          renderSeats(); renderMe();
          SND.play(ev.seat === UI.human && ev.place === 1 ? 'fanfare' : 'finish');
          await banner(ev.seat === UI.human ? (ev.place === 1 ? '一番上がり！' : ev.place + '位で上がり') : '上がり',
            ev.seat === UI.human ? '' : 'small', nameOf(ev.seat) + '（' + ev.place + '位）', 1100);
          logLine('◆ ' + nameOf(ev.seat) + ' 上がり（' + ev.place + '位）', 'sys');
          break;
        }
        case 'foul': {
          vm.out[ev.seat] = true;
          vm.foul[ev.seat] = true;
          vm.hands[ev.seat] = [];
          renderSeats(); renderMe();
          SND.play('foul');
          await banner('反則上がり', 'foul', nameOf(ev.seat) + 'は最下位', 1300);
          logLine('◆ ' + nameOf(ev.seat) + ' 反則上がり（最下位）', 'sys');
          break;
        }
        case 'miyako': {
          vm.out[ev.seat] = true;
          vm.hands[ev.seat] = [];
          renderSeats(); renderMe();
          SND.play('foul');
          await banner('都落ち', 'foul', nameOf(ev.seat) + 'は大貧民に', 1400);
          logLine('◆ 都落ち：' + nameOf(ev.seat) + ' は大貧民', 'sys');
          break;
        }
        case 'gekokujo': {
          SND.play('revolution');
          shake();
          await banner('下剋上', 'revo', nameOf(ev.seat) + 'が一番上がり！身分が全部ひっくり返る', 1700);
          logLine('◆ 下剋上！', 'sys');
          break;
        }
        case 'tenpen': {
          SND.play('revolution');
          await banner('天変地異', 'revo', nameOf(ev.seat) + 'と' + nameOf(ev.with) + 'の手札が入れ替わる', 1600);
          syncBefore(evs, i);
          vm = UI.vm;
          renderAll();
          logLine('◆ 天変地異：' + nameOf(ev.seat) + ' ⇔ ' + nameOf(ev.with), 'sys');
          break;
        }
        case 'greatRevolution': {
          vm.hands[ev.seat] = [];
          SND.play('fanfare');
          await banner('大革命', 'revo', nameOf(ev.seat) + 'はそのまま上がり', 1500);
          logLine('◆ 大革命：' + nameOf(ev.seat), 'sys');
          break;
        }
        case 'lucky': {
          vm.hands[ev.seat] = [];
          SND.play('fanfare');
          await banner('ラッキーセブン', '', nameOf(ev.seat) + 'はそのまま上がり', 1400);
          logLine('◆ ラッキーセブン：' + nameOf(ev.seat), 'sys');
          break;
        }
        case 'exchange': {
          const faceUp = ev.from === UI.human || ev.to === UI.human;
          await animTransfer(ev.from, ev.to, ev.cards, faceUp);
          const what = faceUp ? '（' + ev.cards.map(C.cardLabel).join(' ') + '）' : '';
          logLine('交換：' + nameOf(ev.from) + ' → ' + nameOf(ev.to) + ' ' + ev.cards.length + '枚' + what);
          break;
        }
        case 'last': {
          vm.out[ev.seat] = true;
          vm.places[ev.seat] = S.finished.indexOf(ev.seat) + 1;
          renderSeats(); renderMe();
          logLine('◆ ' + nameOf(ev.seat) + ' が最後', 'sys');
          break;
        }
        case 'over': {
          logLine('— 第' + S.gameNo + 'ゲーム終了 —', 'flow');
          break;
        }
        default:
          break;
      }
    }
    syncVM();
    renderAll();
  }

  async function animDeal() {
    SND.play('deal');
    const { w, h } = cardSize('pile');
    const c = $('pile').getBoundingClientRect();
    const center = { x: c.left + c.width / 2, y: c.top + c.height / 2 };
    const items = [];
    const S = UI.S;
    for (let r = 0; r < 4; r++) {
      for (let i = 0; i < S.n; i++) {
        const seat = (UI.human + i) % S.n;
        items.push({ back: true, from: rectAt(center, w, h), to: rectAt(seatAnchor(seat), w * 0.5, h * 0.5), delay: (r * S.n + i) * 38, o1: 0.2 });
      }
    }
    const hand = $('hand');
    hand.style.opacity = '0';
    await fly(items, 320);
    hand.style.transition = 'opacity .3s';
    hand.style.opacity = '1';
    setTimeout(() => { hand.style.transition = ''; }, 350);
  }

  // ─────────────────────────────────────────────
  // 操作
  // ─────────────────────────────────────────────
  function setSelectable(on, max) {
    UI.selectable = !!on;
    UI.selMax = max || 0;
    if (!on) UI.sel.clear();
    renderHand();
  }
  function clearSelection() { UI.sel.clear(); UI.hintSet = null; renderHand(); }
  function setDim(set) { UI.dimSet = set; renderHand(); }
  function setHint(ids) { UI.sel = new Set(ids); UI.hintSet = new Set(ids); renderHand(); }

  function showPrompt(html, buttons) {
    $('prompt-text').innerHTML = html;
    const box = $('prompt-btns');
    box.innerHTML = '';
    for (const b of buttons) {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'btn ' + (b.primary ? 'btn-gold' : 'btn-ghost') + ' btn-sm';
      el.textContent = b.label;
      if (b.id) el.id = b.id;
      el.addEventListener('click', b.onClick);
      box.appendChild(el);
    }
    $('prompt').hidden = false;
    requestAnimationFrame(renderHand);
  }
  function hidePrompt() { $('prompt').hidden = true; requestAnimationFrame(renderHand); }

  function openDialog(html, opts) {
    const ov = $('overlay');
    ov.innerHTML = '<div class="dialog" role="dialog" aria-modal="true">' + html + '</div>';
    ov.hidden = false;
    ov.onclick = (e) => { if (e.target === ov && opts && opts.onBackdrop) opts.onBackdrop(); };
    const first = ov.querySelector('button');
    if (first) setTimeout(() => first.focus({ preventScroll: true }), 30);
    return ov.firstChild;
  }
  function closeDialog() { const ov = $('overlay'); ov.hidden = true; ov.innerHTML = ''; ov.onclick = null; }

  function miniCards(ids) {
