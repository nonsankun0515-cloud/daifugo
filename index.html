<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#062d1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="大富豪">
<title>大富豪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap&text=0123456789AJKQORE">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <section id="scr-title" class="screen title">
    <div class="room" aria-hidden="true"></div>
    <div class="tbl" aria-hidden="true">
      <div class="tbl-leather"></div>
      <div class="tbl-stitch"></div>
      <div class="tbl-wood"></div>
      <div class="tbl-felt"><div class="felt-light"></div></div>
    </div>
    <div class="title-inner">
      <div class="title-fan" id="title-fan"></div>
      <h1 class="logo"><span class="logo-kanji">大富豪</span><span class="logo-sub">DAIFUGŌ</span></h1>
      <p class="title-rule" id="title-rule"></p>
      <div class="title-actions">
        <button class="btn btn-gold btn-lg" id="btn-start" type="button">対戦する</button>
        <button class="btn btn-ghost btn-lg" id="btn-resume" type="button" hidden>つづきから</button>
        <button class="btn btn-ghost btn-lg" id="btn-online" type="button" hidden>オンライン対戦</button>
        <button class="btn btn-ghost" id="btn-rules" type="button">ルールと設定</button>
      </div>
      <p class="title-foot" id="title-foot"></p>
    </div>
  </section>

  <section id="scr-rules" class="screen rules" hidden>
    <header class="bar">
      <button class="icon-btn" id="rules-back" type="button" aria-label="戻る"></button>
      <h2>ルールと設定</h2>
      <span></span>
    </header>
    <div class="rules-scroll" id="rules-scroll">
      <div class="rules-wrap" id="rules-wrap"></div>
    </div>
    <footer class="rules-foot">
      <button class="btn btn-gold btn-lg" id="rules-start" type="button">この設定で対戦する</button>
    </footer>
  </section>

  <section id="scr-online" class="screen rules online" hidden>
    <header class="bar">
      <button class="icon-btn" id="online-back" type="button" aria-label="戻る"></button>
      <h2>オンライン対戦</h2>
      <span class="conn" id="online-conn" aria-live="polite"></span>
    </header>
    <div class="rules-scroll">
      <div class="rules-wrap" id="online-wrap"></div>
    </div>
  </section>

  <section id="scr-game" class="screen game" hidden>
    <div class="room" aria-hidden="true"></div>
    <div class="tbl" aria-hidden="true">
      <div class="tbl-leather"></div>
      <div class="tbl-stitch"></div>
      <div class="tbl-wood"></div>
      <div class="tbl-felt"><div class="felt-revo"></div><div class="felt-light"></div></div>
    </div>
    <div class="table" id="table">
      <div class="felt-print" id="felt-print" aria-hidden="true"></div>
      <header class="hud">
        <div class="hud-left">
          <button class="icon-btn" id="g-menu" type="button" aria-label="メニュー"></button>
          <div class="hud-center" id="g-gameno"></div>
        </div>
        <div class="hud-right">
          <button class="icon-btn chat-btn" id="g-chat" type="button" aria-label="チャット" hidden><span class="ic-slot"></span><span class="badge" id="g-chat-badge" hidden></span></button>
          <button class="icon-btn" id="g-log" type="button" aria-label="履歴"></button>
          <button class="icon-btn" id="g-sound" type="button" aria-label="効果音"></button>
        </div>
      </header>
      <div id="seats"></div>
      <div class="center" id="center">
        <div class="pile" id="pile"></div>
        <div class="status" id="status"></div>
      </div>
      <aside class="log" id="log" hidden>
        <header><h3>履歴</h3><button class="icon-btn" id="log-close" type="button" aria-label="履歴を閉じる"></button></header>
        <ol id="log-list"></ol>
      </aside>
    </div>
    <div class="me" id="me">
      <div class="prompt" id="prompt" hidden>
        <div class="prompt-text" id="prompt-text"></div>
        <div class="prompt-btns" id="prompt-btns"></div>
      </div>
      <div class="me-top">
        <div class="me-id" id="me-id"></div>
        <div class="sel-info" id="sel-info" aria-live="polite"></div>
      </div>
      <div class="hand" id="hand" role="group" aria-label="あなたの手札"></div>
      <div class="actions" id="actions">
        <button class="btn btn-ghost btn-sm" id="b-hint" type="button">ヒント</button>
        <button class="btn btn-ghost" id="b-pass" type="button">パス</button>
        <button class="btn btn-gold" id="b-play" type="button">出す</button>
      </div>
    </div>
  </section>

  <aside class="chat" id="chat" hidden aria-label="チャット">
    <header>
      <h3>チャット</h3>
      <span class="chat-note">この部屋の人だけに届きます</span>
      <button class="icon-btn" id="chat-close" type="button" aria-label="チャットを閉じる"></button>
    </header>
    <ol class="chat-list" id="chat-list" aria-live="polite"></ol>
    <div class="chat-presets" id="chat-presets"></div>
    <form class="chat-form" id="chat-form" autocomplete="off">
      <input id="chat-input" type="text" maxlength="60" placeholder="メッセージ（60文字まで）" enterkeyhint="send" aria-label="メッセージ">
      <button class="btn btn-gold btn-sm" id="chat-send" type="submit">送信</button>
    </form>
  </aside>

  <div id="fx" aria-hidden="true"></div>
  <div id="overlay" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script src="js/cards.js"></script>
<script src="js/rules.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/art.js"></script>
<script src="js/textures.js"></script>
<script src="js/sound.js"></script>
<script src="js/ui.js"></script>
<script src="js/net.js"></script>
<script src="js/app.js"></script>
</body>
</html>
