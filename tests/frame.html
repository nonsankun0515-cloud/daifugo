<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>画面サイズ確認</title>
<style>
  html, body { margin: 0; height: 100%; background: #222; overflow: hidden; }
  #wrap { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  iframe { border: 0; display: block; background: #000; }
</style>
</head>
<body>
<div id="wrap"><iframe id="f"></iframe></div>
<script>
  // ?w=1366&h=768&src=../index.html … 指定サイズの画面をペインに収まるよう縮小して表示
  const qs = new URLSearchParams(location.search);
  const w = +(qs.get('w') || 1366), h = +(qs.get('h') || 768);
  const f = document.getElementById('f');
  f.width = w;
  f.height = h;
  f.src = qs.get('src') || '../index.html';
  function fit() {
    const s = Math.min(innerWidth / w, innerHeight / h);
    document.getElementById('wrap').style.transform = 'scale(' + s + ')';
  }
  addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
